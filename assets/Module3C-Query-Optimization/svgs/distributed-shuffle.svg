<svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="distributed-shuffle-t distributed-shuffle-d">
  <title id="distributed-shuffle-t">Distributed shuffle: rows starting on multiple nodes are hashed on the join key and sent over the network so all rows with the same key land on the same target node, ready for local join</title>
  <desc id="distributed-shuffle-d">Distributed shuffle: rows starting on multiple nodes are hashed on the join key and sent over the network so all rows with the same key land on the same target node, ready for local join. This is data movement across machines, not a disk or RAM story. Color key: mint follows one key (user_id 42) from every source node, over the network, onto its single colocated node; grey is the other keys and the node structure.</desc>
    <defs>
        <marker id="ar-sh" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#6B7280"/></marker>
        <marker id="ar-sh-hi" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#6EE7B7"/></marker>
    </defs>
    <text x="500" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">Distributed Shuffle: hash partitioning over the network</text>
    <text x="500" y="56" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">same h(key), but the destination is another machine, not a local file</text>
    <g data-step="1">
    <text x="500" y="92" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Before shuffle: rows scattered across 3 nodes</text>
    <rect x="50" y="110" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="170" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Node A</text>
    <rect x="70" y="144" width="200" height="22" fill="#E1F4EC" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="170" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0E0E10">user_id 42 · row</text>
    <rect x="70" y="170" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="170" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 7 · row</text>
    <rect x="70" y="196" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="170" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 13 · row</text>
    <rect x="380" y="110" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="500" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Node B</text>
    <rect x="400" y="144" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="500" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 7 · row</text>
    <rect x="400" y="170" width="200" height="22" fill="#E1F4EC" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="500" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0E0E10">user_id 42 · row</text>
    <rect x="400" y="196" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="500" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 13 · row</text>
    <rect x="710" y="110" width="240" height="130" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="830" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Node C</text>
    <rect x="730" y="144" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="830" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 13 · row</text>
    <rect x="730" y="170" width="200" height="22" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="830" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">user_id 7 · row</text>
    <rect x="730" y="196" width="200" height="22" fill="#E1F4EC" stroke="#6EE7B7" stroke-width="1.5"/>
    <text x="830" y="212" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0E0E10">user_id 42 · row</text>
    </g>
    <g data-step="2">
    <text x="500" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0E0E10">↓  shuffle: send each row to h(user_id) % 3 over the network  ↓</text>
    <line x1="170" y1="290" x2="170" y2="320" stroke="#6EE7B7" stroke-width="3.5" marker-end="url(#ar-sh-hi)"/>
    <line x1="180" y1="290" x2="500" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    <line x1="160" y1="290" x2="830" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    <line x1="490" y1="290" x2="170" y2="320" stroke="#6EE7B7" stroke-width="3.5" marker-end="url(#ar-sh-hi)"/>
    <line x1="500" y1="290" x2="500" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    <line x1="510" y1="290" x2="830" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    <line x1="820" y1="290" x2="170" y2="320" stroke="#6EE7B7" stroke-width="3.5" marker-end="url(#ar-sh-hi)"/>
    <line x1="830" y1="290" x2="500" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    <line x1="840" y1="290" x2="830" y2="320" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar-sh)"/>
    </g>
    <g data-step="3">
    <text x="500" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">After shuffle: same key on the same node, ready for local join</text>
    <rect x="50" y="370" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="50" y="370" width="240" height="6" rx="8" fill="#6EE7B7"/>
    <text x="170" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Node A · all user_id 42</text>
    <text x="170" y="414" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#0E0E10">42 · 42 · 42</text>
    <text x="170" y="431" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#0E0E10">→ local join</text>
    <rect x="380" y="370" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="500" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Node B · all user_id 7</text>
    <text x="500" y="414" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">7 · 7 · 7</text>
    <text x="500" y="431" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">→ local join</text>
    <rect x="710" y="370" width="240" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="830" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Node C · all user_id 13</text>
    <text x="830" y="414" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">13 · 13 · 13</text>
    <text x="830" y="431" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">→ local join</text>
    </g>
    <text x="500" y="474" text-anchor="middle" font-family="Inter, sans-serif" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#6EE7B7" font-weight="700">mint</tspan><tspan fill="#3F3F46"> = one key (user_id 42) traced from every node onto its colocated node&#160;&#160;&#183;&#160;&#160;grey = the other keys and structure</tspan></text>
</svg>
