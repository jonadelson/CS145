<svg viewBox="0 0 1080 420" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="hst-t hst-d">
  <title id="hst-t">Equi-width vs height-balanced histograms on skewed data</title>
  <desc id="hst-d">Two panels over the same right-skewed column. Left,
  equi-width: every bucket spans an equal value range, so on skewed data the
  row counts per bucket vary wildly and one bucket swallows almost all the
  rows, making its selectivity estimate useless. Right, height-balanced, the
  focal panel: every bucket holds the same number of rows (here 25 percent
  each), so bucket ranges shrink where the data is dense and widen where it is
  sparse, keeping estimates accurate under skew. Color key: mint is the
  height-balanced histogram that survives skew; grey is the
  equi-width baseline.</desc>

  <text x="540" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Two ways to bucket a skewed column</text>
  <text x="540" y="58" text-anchor="middle" font-size="16" fill="#3F3F46">Equal value ranges, or equal row counts. Skew breaks the first.</text>

  <!-- Left: equi-width (grey baseline) -->
  <g data-step="1">
  <rect x="30" y="84" width="490" height="280" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="30" y="84" width="490" height="6" rx="3" fill="#6B7280"/>
  <text x="275" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">Equi-width: equal value ranges</text>
  <line x1="70" y1="280" x2="490" y2="280" stroke="#6B7280" stroke-width="1.5"/>
  <!-- 4 equal-width buckets, counts vary wildly (skew) -->
  <rect x="70" y="266" width="100" height="14" fill="#E7EAEE" stroke="#6B7280"/>
  <rect x="172" y="258" width="100" height="22" fill="#E7EAEE" stroke="#6B7280"/>
  <rect x="274" y="240" width="100" height="40" fill="#E7EAEE" stroke="#6B7280"/>
  <rect x="376" y="150" width="100" height="130" fill="#E7EAEE" stroke="#6B7280"/>
  <text x="120" y="298" text-anchor="middle" font-size="14" fill="#6B7280">0–25</text>
  <text x="222" y="298" text-anchor="middle" font-size="14" fill="#6B7280">25–50</text>
  <text x="324" y="298" text-anchor="middle" font-size="14" fill="#6B7280">50–75</text>
  <text x="426" y="298" text-anchor="middle" font-size="14" fill="#6B7280">75–100</text>
  <text x="426" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">~85% of rows</text>
  <text x="275" y="332" text-anchor="middle" font-size="14" fill="#3F3F46">One bucket swallows almost everything;</text>
  <text x="275" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">its estimate is useless on skew</text>
  </g>

  <!-- Right: height-balanced (mint) -->
  <g data-step="2">
  <rect x="560" y="84" width="490" height="280" rx="8" fill="#E1F4EC" stroke="#6EE7B7" stroke-width="2"/>
  <rect x="560" y="84" width="490" height="6" rx="3" fill="#6EE7B7"/>
  <text x="805" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">Height-balanced: equal row counts</text>
  <line x1="600" y1="280" x2="1020" y2="280" stroke="#6B7280" stroke-width="1.5"/>
  <!-- 4 buckets, each = 25% of rows, equal bar height, widths shrink where dense -->
  <rect x="600" y="200" width="210" height="80" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="810" y="200" width="110" height="80" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="920" y="200" width="60" height="80" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="980" y="200" width="40" height="80" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="705" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">25%</text>
  <text x="865" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">25%</text>
  <text x="950" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">25%</text>
  <text x="1000" y="246" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">25%</text>
  <text x="600" y="298" text-anchor="start" font-size="14" fill="#6B7280">0–60</text>
  <text x="1020" y="298" text-anchor="end" font-size="14" fill="#6B7280">…93–100</text>
  <text x="805" y="332" text-anchor="middle" font-size="14" fill="#3F3F46">Ranges shrink where data is dense;</text>
  <text x="805" y="352" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">every bucket carries 1/B of the rows</text>
  </g>

  <text x="540" y="396" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#6EE7B7" font-weight="700">mint</tspan><tspan fill="#3F3F46"> = height-balanced, survives skew&#160;&#160;&#183;&#160;&#160;grey = equi-width baseline</tspan></text>
</svg>
