<svg viewBox="0 0 1100 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="link-t link-d" font-family="Inter, sans-serif">
  <title id="link-t">The linkage attack: joining anonymized Netflix data to public IMDB reviews re-identifies a user</title>
  <desc id="link-d">Two grey datasets sit side by side. The Netflix release is anonymized: user A7X9B2 rated Shrek and Matrix on specific dates. Public IMDB reviews carry the same rare movie, rating, and date pairs under the real name Alice Smith. Joining the two on those shared pairs yields a red result: A7X9B2 equals Alice Smith, exposing her whole history. Color key: grey is the two datasets, red is the re-identification.</desc>
  <defs>
    <marker id="link-ar" markerWidth="11" markerHeight="8" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="550" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Anonymous is not private: the linkage attack</text>
  <text x="550" y="58" text-anchor="middle" font-size="15" fill="#3F3F46">Netflix Prize, 2006: 100M ratings from 500K "anonymous" users. Re-identified in 2007.</text>

  <!-- Netflix anonymized -->
  <g data-step="1">
    <rect x="40" y="86" width="420" height="150" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="40" y="86" width="420" height="20" rx="8" fill="#E7EAEE"/>
    <text x="250" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Netflix release, "anonymized"</text>
    <g font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">
      <text x="60" y="134">user:    A7X9B2</text>
      <text x="60" y="162">Shrek    rated 4   on 2006-01-15</text>
      <text x="60" y="186">Matrix   rated 5   on 2006-01-20</text>
      <text x="60" y="210">Titanic  rated 2   on 2006-02-03</text>
    </g>
  </g>

  <!-- IMDB public -->
  <g data-step="2">
    <rect x="640" y="86" width="420" height="150" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="640" y="86" width="420" height="20" rx="8" fill="#E7EAEE"/>
    <text x="850" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">IMDB, public reviews</text>
    <g font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">
      <text x="660" y="134">user:    Alice Smith</text>
      <text x="660" y="162">Shrek    rated 4   on 2006-01-15</text>
      <text x="660" y="186">Matrix   rated 5   on 2006-01-20</text>
    </g>
  </g>

  <!-- join + breach result -->
  <g data-step="3">
    <line x1="460" y1="170" x2="548" y2="170" stroke="#6B7280" stroke-width="2"/>
    <line x1="640" y1="170" x2="552" y2="170" stroke="#6B7280" stroke-width="2"/>
    <text x="550" y="166" text-anchor="middle" font-size="20" font-weight="700" fill="#6B7280">&#8904;</text>
    <text x="550" y="200" text-anchor="middle" font-size="12" fill="#6B7280">join on (movie, rating, date)</text>
    <line x1="550" y1="236" x2="550" y2="276" stroke="#6B7280" stroke-width="2" marker-end="url(#link-ar)"/>
    <rect x="300" y="280" width="500" height="78" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <rect x="300" y="280" width="500" height="6" rx="3" fill="#DC2626"/>
    <text x="550" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#DC2626">A7X9B2 = Alice Smith</text>
    <text x="550" y="338" text-anchor="middle" font-size="14" fill="#3F3F46">her entire viewing history is now de-anonymized</text>
  </g>

  <text x="550" y="398" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">A few rare ratings with dates are a fingerprint: about 8 are enough to be ~99% unique.</text>
  <text x="550" y="430" text-anchor="middle" font-size="13"><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the two datasets, each "safe" alone&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = the re-identification the join exposes</tspan></text>
</svg>
