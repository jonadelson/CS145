<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sct-t sct-d" font-family="Inter, sans-serif">
  <title id="sct-t">Same SQL shape, new data types: SELECT/FROM/WHERE stays, only the function changes</title>
  <desc id="sct-d">A central cyan box holds the unchanging query shape: SELECT, FROM, WHERE, ORDER BY. Four grey domain chips hang below it, each keeping that same shape and only dropping in a domain-specific function: geographic (ST_DWITHIN), genomic (EDIT_DISTANCE), semi-structured (JSONB and arrays), and generative AI (AI.GENERATE). Color key: cyan is the query shape that never changes, grey is the domain function you swap into a clause.</desc>
  <defs>
    <marker id="sct-ar" markerWidth="11" markerHeight="8" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Same SQL shape, new data types</text>
  <text x="550" y="60" text-anchor="middle" font-size="16" fill="#3F3F46">SELECT / FROM / WHERE / ORDER BY stays; only the function in the clause changes</text>

  <!-- core query shape -->
  <g data-step="1">
    <rect x="350" y="88" width="400" height="118" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="350" y="88" width="400" height="6" rx="3" fill="#0891B2"/>
    <text x="550" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#0891B2">The query shape, unchanged</text>
    <g font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">
      <text x="372" y="140">SELECT   columns / expressions</text>
      <text x="372" y="160">FROM     tables</text>
      <text x="372" y="180">WHERE    conditions</text>
      <text x="372" y="198">ORDER BY sort</text>
    </g>
  </g>

  <!-- four domain chips -->
  <g stroke="#6B7280" stroke-width="1.5">
    <line x1="450" y1="206" x2="150" y2="272" marker-end="url(#sct-ar)"/>
    <line x1="510" y1="206" x2="420" y2="272" marker-end="url(#sct-ar)"/>
    <line x1="590" y1="206" x2="685" y2="272" marker-end="url(#sct-ar)"/>
    <line x1="650" y1="206" x2="955" y2="272" marker-end="url(#sct-ar)"/>
  </g>

  <g data-step="2">
    <rect x="30" y="274" width="245" height="138" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="30" y="274" width="245" height="20" rx="8" fill="#E7EAEE"/>
    <text x="152" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Geographic</text>
    <text x="152" y="324" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0E0E10">ST_DWITHIN(loc, pt, 5000)</text>
    <text x="152" y="356" text-anchor="middle" font-size="14" fill="#3F3F46">users within 5 km of</text>
    <text x="152" y="374" text-anchor="middle" font-size="14" fill="#3F3F46">a point, in WHERE</text>
  </g>

  <g data-step="3">
    <rect x="295" y="274" width="245" height="138" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="295" y="274" width="245" height="20" rx="8" fill="#E7EAEE"/>
    <text x="417" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Genomic</text>
    <text x="417" y="324" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0E0E10">EDIT_DISTANCE(a, b) &lt; 3</text>
    <text x="417" y="356" text-anchor="middle" font-size="14" fill="#3F3F46">DNA strings within</text>
    <text x="417" y="374" text-anchor="middle" font-size="14" fill="#3F3F46">a few mutations</text>
  </g>

  <g data-step="4">
    <rect x="560" y="274" width="245" height="138" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="560" y="274" width="245" height="20" rx="8" fill="#E7EAEE"/>
    <text x="682" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Semi-structured</text>
    <text x="682" y="324" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0E0E10">items -&gt;&gt; 'sku'</text>
    <text x="682" y="356" text-anchor="middle" font-size="14" fill="#3F3F46">JSONB and arrays</text>
    <text x="682" y="374" text-anchor="middle" font-size="14" fill="#3F3F46">inside one column</text>
  </g>

  <g data-step="5">
    <rect x="825" y="274" width="245" height="138" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="825" y="274" width="245" height="20" rx="8" fill="#E7EAEE"/>
    <text x="947" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Generative AI</text>
    <text x="947" y="324" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#0E0E10">AI.GENERATE(prompt, col)</text>
    <text x="947" y="356" text-anchor="middle" font-size="14" fill="#3F3F46">an LLM applied to</text>
    <text x="947" y="374" text-anchor="middle" font-size="14" fill="#3F3F46">every row</text>
  </g>

  <text x="550" y="444" text-anchor="middle" font-size="13"><tspan fill="#0891B2" font-weight="700">cyan</tspan><tspan fill="#3F3F46"> = the query shape that never changes&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the domain function you drop into a clause</tspan></text>
</svg>
