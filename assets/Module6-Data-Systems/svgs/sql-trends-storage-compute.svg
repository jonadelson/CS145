<svg viewBox="0 0 1080 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scs-t scs-d" font-family="Inter, sans-serif">
  <title id="scs-t">Coupled versus decoupled storage and compute: pay for an idle 24/7 cluster, or pay per query</title>
  <desc id="scs-d">Two panels. Left, the coupled legacy architecture (grey): one always-on cluster holds 100 TB with its CPU and RAM bolted together, billed 24/7 even though the data is queried about once a week, so you pay a premium for idle hardware. Right, the decoupled architecture (cyan): raw data sits in dirt-cheap object storage like S3 or GCS that scales to infinity for pennies, and an ephemeral compute engine spins up only for the few minutes a query runs, then shuts off. Splitting them lets you scale storage and compute independently, the foundation of data lakes and Apache Iceberg. Color key: grey is the coupled always-on cluster that pays for idle capacity, cyan is the decoupled storage-plus-ephemeral-compute model.</desc>
  <defs>
    <marker id="scs-ar" markerWidth="11" markerHeight="8" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="540" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Split storage from compute</text>
  <text x="540" y="60" text-anchor="middle" font-size="16" fill="#3F3F46">Stop paying for a 24/7 cluster just to hold files you query once a week</text>

  <!-- Coupled / legacy -->
  <g data-step="1">
    <rect x="30" y="88" width="490" height="300" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="30" y="88" width="490" height="6" rx="3" fill="#6B7280"/>
    <text x="275" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#6B7280">Coupled — one always-on cluster</text>
    <rect x="70" y="146" width="410" height="150" rx="6" fill="#E7EAEE" stroke="#D4D7DC"/>
    <text x="275" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Always-on server cluster</text>
    <rect x="92" y="188" width="366" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="275" y="214" text-anchor="middle" font-size="14" fill="#3F3F46">100 TB storage bolted to CPU + RAM</text>
    <rect x="92" y="240" width="366" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="275" y="266" text-anchor="middle" font-size="14" fill="#3F3F46">CPU + RAM billed 24/7, even when idle</text>
    <text x="275" y="336" text-anchor="middle" font-size="22" font-weight="800" fill="#6B7280">queried ~1× / week</text>
    <text x="275" y="360" text-anchor="middle" font-size="14" fill="#6B7280">but paid for every hour</text>
  </g>

  <!-- Decoupled / modern -->
  <g data-step="2">
    <rect x="560" y="88" width="490" height="300" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="560" y="88" width="490" height="6" rx="3" fill="#0891B2"/>
    <text x="805" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#0891B2">Decoupled — storage + ephemeral compute</text>
    <rect x="596" y="146" width="196" height="150" rx="6" fill="#FFFFFF" stroke="#0891B2"/>
    <text x="694" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0891B2">Object storage</text>
    <text x="694" y="196" text-anchor="middle" font-size="14" fill="#3F3F46">S3 / GCS, raw data</text>
    <text x="694" y="218" text-anchor="middle" font-size="14" fill="#3F3F46">pennies per TB</text>
    <text x="694" y="240" text-anchor="middle" font-size="14" fill="#3F3F46">scales to infinity</text>
    <text x="694" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0891B2">always on, cheap</text>
    <rect x="818" y="146" width="196" height="150" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-dasharray="5 4"/>
    <text x="916" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0891B2">Compute engine</text>
    <text x="916" y="196" text-anchor="middle" font-size="14" fill="#3F3F46">spins up per query</text>
    <text x="916" y="218" text-anchor="middle" font-size="14" fill="#3F3F46">runs ~5 min</text>
    <text x="916" y="240" text-anchor="middle" font-size="14" fill="#3F3F46">then shuts off</text>
    <text x="916" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#0891B2">pay per query</text>
    <line x1="792" y1="221" x2="816" y2="221" stroke="#6B7280" marker-end="url(#scs-ar)"/>
    <text x="805" y="336" text-anchor="middle" font-size="22" font-weight="800" fill="#0891B2">scale each independently</text>
    <text x="805" y="360" text-anchor="middle" font-size="14" fill="#6B7280">data lakes · Apache Iceberg</text>
  </g>

  <text x="30" y="414" font-size="13" fill="#6B7280">Grey: coupled always-on cluster, pays for idle.   Cyan: decoupled storage + ephemeral compute, pay per query.</text>
</svg>
