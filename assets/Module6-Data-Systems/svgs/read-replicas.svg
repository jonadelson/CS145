<svg viewBox="0 0 1000 430" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="rr-t rr-d"
     style="width:100%;height:auto;" font-family="Inter, sans-serif">
  <title id="rr-t">Read replicas: one primary for writes, many copies for reads</title>
  <desc id="rr-d">The application sends all writes to a single primary database and
  sends reads to a pool of read replicas. The primary streams its changes to the
  replicas asynchronously, so a replica can briefly trail the primary. Color key:
  blue = the primary, which takes every write; violet = the read replicas, the
  scaled-out copies that serve reads; dashed = asynchronous replication, the source
  of replica lag.</desc>

  <defs>
    <marker id="rr-ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
      orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="500" y="40" font-size="24" font-weight="700" fill="#0E0E10"
        text-anchor="middle">Read replicas</text>
  <text x="500" y="66" font-size="16" fill="#3F3F46" text-anchor="middle">Split the read load off the write path</text>

  <!-- STEP 1: app + write path to the primary -->
  <g data-step="1">
    <rect x="410" y="84" width="180" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="500" y="118" font-size="18" font-weight="700" fill="#0E0E10" text-anchor="middle">Application</text>
    <text x="500" y="142" font-size="14" fill="#6B7280" text-anchor="middle">clients</text>
    <path d="M 452 162 L 250 268" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#rr-ah)"/>
    <text x="312" y="205" font-size="15" font-weight="700" fill="#2563EB" text-anchor="middle">writes</text>
    <path d="M 120 288 L 120 392 A 90 14 0 0 0 300 392 L 300 288 A 90 14 0 0 1 120 288 Z"
          fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/>
    <ellipse cx="210" cy="288" rx="90" ry="14" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/>
    <text x="210" y="338" font-size="18" font-weight="700" fill="#0E0E10" text-anchor="middle">Primary</text>
    <text x="210" y="362" font-size="14" fill="#3F3F46" text-anchor="middle">all writes</text>
  </g>

  <!-- STEP 2: read path to the replica pool -->
  <g data-step="2">
    <path d="M 548 162 L 750 268" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#rr-ah)"/>
    <text x="688" y="205" font-size="15" font-weight="700" fill="#7C3AED" text-anchor="middle">reads</text>
    <path d="M 712 274 L 712 378 A 90 14 0 0 0 892 378 L 892 274 A 90 14 0 0 1 712 274 Z"
          fill="#EFE8FB" stroke="#7C3AED" stroke-width="2" opacity="0.55"/>
    <path d="M 700 288 L 700 392 A 90 14 0 0 0 880 392 L 880 288 A 90 14 0 0 1 700 288 Z"
          fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="790" cy="288" rx="90" ry="14" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <text x="790" y="338" font-size="18" font-weight="700" fill="#0E0E10" text-anchor="middle">Read replicas</text>
    <text x="790" y="362" font-size="14" fill="#3F3F46" text-anchor="middle">reads, &#215;N copies</text>
  </g>

  <!-- STEP 3: async replication + lag -->
  <g data-step="3">
    <path d="M 300 340 L 700 340" stroke="#6B7280" stroke-width="2" fill="none"
          stroke-dasharray="5,4" opacity="0.7" marker-end="url(#rr-ah)"/>
    <text x="500" y="332" font-size="14" fill="#6B7280" text-anchor="middle">async replication &#183; replica lag</text>
  </g>

  <text x="500" y="418" font-size="14" text-anchor="middle" fill="#6B7280">Color key&#160;&#160;<tspan fill="#2563EB">primary = all writes</tspan>&#160;·&#160;<tspan fill="#7C3AED">replicas = scaled-out reads</tspan>&#160;· dashed = async replication, the lag</text>
</svg>
