<svg viewBox="0 0 1000 506" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hash-index-layout-t hash-index-layout-d">
  <title id="hash-index-layout-t">Hash index layout: on the right, three hash index pages hold (value, page#) entries, e.g. Alice points to Page 2</title>
  <desc id="hash-index-layout-d">Hash index layout: on the right, three hash index pages hold (value, page#) entries, e.g. Alice to Page 2, Dan to Pages 0, 1, 4. On the left, five data pages hold the actual rows. Arrows show that a lookup for Alice jumps from an index entry to data page 2. Dan's entry fans out to three different data pages because duplicate keys land on multiple pages. Color key: green is the index and data pages on disk (persistent), violet is the lookup path.</desc>
    <defs>
        <marker id="ar-hash" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#7C3AED"/>
        </marker>
        <marker id="ar-hash-dup" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
            <polygon points="0 0, 12 4, 0 8" fill="#7C3AED"/>
        </marker>
    </defs>

    <text x="500" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0E0E10">Hash Index: (value → page#) mapping</text>
    <text x="500" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">hash(value) picks the index page · entry picks the data page</text>

    <g data-step="1">
    <text x="200" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Data pages</text>
    <text x="200" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">hold the actual rows</text>

    <rect x="80" y="108" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="80" y="108" width="240" height="6" rx="6" fill="#059669"/>
    <text x="94" y="124" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Page 0</text>
    <text x="94" y="142" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Bob · Carol · Dan · Eve · Frank</text>

    <rect x="80" y="168" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="80" y="168" width="240" height="6" rx="6" fill="#059669"/>
    <text x="94" y="184" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Page 1</text>
    <text x="94" y="202" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Dan · Grace · Henry · Ian · Jack</text>

    <rect x="80" y="228" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="80" y="228" width="240" height="6" rx="6" fill="#059669"/>
    <text x="94" y="244" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Page 2</text>
    <text x="94" y="262" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Alice · Lisa · Mike · Nancy · Oscar</text>

    <rect x="80" y="288" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="80" y="288" width="240" height="6" rx="6" fill="#059669"/>
    <text x="94" y="304" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Page 3</text>
    <text x="94" y="322" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Paul · Quinn · Rose · Steve · Tom</text>

    <rect x="80" y="348" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="80" y="348" width="240" height="6" rx="6" fill="#059669"/>
    <text x="94" y="364" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Page 4</text>
    <text x="94" y="382" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Dan · Uma · Victor · Wendy · Xavier</text>
    </g>

    <g data-step="2">
    <text x="800" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#059669">Hash index pages</text>
    <text x="800" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">hold (value, page#) pointers</text>

    <rect x="680" y="108" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="680" y="108" width="240" height="6" rx="6" fill="#059669"/>
    <text x="694" y="124" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Index page 0</text>
    <text x="694" y="142" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Alice → Page 2</text>
    <text x="694" y="158" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Bob   → Page 0</text>
    <text x="694" y="174" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Carol → Page 0</text>

    <rect x="680" y="198" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="680" y="198" width="240" height="6" rx="6" fill="#059669"/>
    <text x="694" y="214" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Index page 1</text>
    <text x="694" y="232" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700" fill="#7C3AED">Dan   → Pages 0, 1, 4</text>
    <text x="694" y="248" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Eve   → Page 0</text>
    <text x="694" y="264" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Frank → Page 0</text>

    <rect x="680" y="288" width="240" height="76" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <rect x="680" y="288" width="240" height="6" rx="6" fill="#059669"/>
    <text x="694" y="304" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Index page 2</text>
    <text x="694" y="322" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Grace → Page 1</text>
    <text x="694" y="338" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Henry → Page 1</text>
    <text x="694" y="354" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">Ian   → Page 1</text>

    <text x="800" y="390" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">… more index pages</text>
    </g>

    <g data-step="3">
    <line x1="678" y1="137" x2="325" y2="253" stroke="#7C3AED" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#ar-hash)"/>
    <text x="500" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#7C3AED">Alice → Page 2</text>
    </g>

    <g data-step="4">
    <line x1="678" y1="228" x2="325" y2="133" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="3,2" marker-end="url(#ar-hash-dup)"/>
    <line x1="678" y1="228" x2="325" y2="193" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="3,2" marker-end="url(#ar-hash-dup)"/>
    <line x1="678" y1="228" x2="325" y2="373" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="3,2" marker-end="url(#ar-hash-dup)"/>
    <text x="500" y="235" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#7C3AED">Dan → three pages</text>
    <text x="500" y="249" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#7C3AED">(duplicate keys fan out)</text>
    </g>

    <g data-step="5">
    <text x="500" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Lookup(x): hash(x) → index page → find entry → read data page</text>
    <text x="500" y="458" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">O(1) IOs regardless of table size</text>
    </g>

    <text x="500" y="492" text-anchor="middle" font-family="Inter, sans-serif" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = index and data pages on disk, persistent&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = the lookup path</tspan></text>
</svg>
