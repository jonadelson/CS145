<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="inverted-index-t inverted-index-d">
  <title id="inverted-index-t">Inverted index</title>
  <desc id="inverted-index-d">Inverted index. On the left, a small B+Tree serves as the term dictionary, with every unique word in the Songs table as a leaf entry. Crazy and Heart are the highlighted terms, shown in violet. On the right, each term points at its postings list, a packed array of song IDs. A bitwise AND intersection in RAM between the Crazy and Heart postings returns the two song IDs that contain both words, 12 and 108. Color key: green is the dictionary and postings on disk (persistent), red strip is the bitwise AND in RAM (volatile), violet is the traced terms and IDs.</desc>
    <defs>
        <marker id="ar-ii" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
        </marker>
        <marker id="ar-ii-purple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
        </marker>
    </defs>

    <text x="600" y="28" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#0E0E10">Inverted index: term dictionary and postings lists</text>
    <text x="600" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">B+Tree of unique words on the left · packed arrays of song IDs on the right</text>

    <g data-step="1">
    <text x="215" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Term dictionary (B+Tree) · disk</text>
    <text x="215" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">every unique word in the Songs table</text>

    <rect x="170" y="112" width="90" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
    <text x="215" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Root</text>

    <rect x="80" y="180" width="80" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="120" y="203" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Internal</text>

    <rect x="280" y="180" width="80" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="320" y="203" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#059669">Internal</text>

    <line x1="195" y1="148" x2="120" y2="180" stroke="#6B7280" stroke-width="1.5"/>
    <line x1="235" y1="148" x2="320" y2="180" stroke="#6B7280" stroke-width="1.5"/>

    <rect x="60" y="250" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="60" y="250" width="120" height="6" rx="5" fill="#7C3AED"/>
    <text x="120" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">Crazy</text>

    <rect x="60" y="290" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="120" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">Music</text>

    <rect x="60" y="330" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="120" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">Hello</text>

    <rect x="260" y="250" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="260" y="250" width="120" height="6" rx="5" fill="#7C3AED"/>
    <text x="320" y="270" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">Heart</text>

    <rect x="260" y="290" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="320" y="310" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">Love</text>

    <rect x="260" y="330" width="120" height="32" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="320" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">Yesterday</text>

    <text x="215" y="392" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">… 100 million more terms</text>

    <line x1="100" y1="216" x2="90" y2="250" stroke="#6B7280" stroke-width="1"/>
    <line x1="140" y1="216" x2="150" y2="250" stroke="#6B7280" stroke-width="1"/>
    <line x1="300" y1="216" x2="290" y2="250" stroke="#6B7280" stroke-width="1"/>
    <line x1="340" y1="216" x2="350" y2="250" stroke="#6B7280" stroke-width="1"/>
    </g>

    <g data-step="2">
    <text x="830" y="82" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Postings lists (contiguous arrays) · disk</text>
    <text x="830" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">each term points at the song IDs that contain it</text>

    <text x="500" y="130" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#059669">Postings for "Crazy"</text>
    <rect x="500" y="142" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="530" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">12</text>

    <rect x="570" y="142" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="600" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">45</text>

    <rect x="640" y="142" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="670" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">108</text>

    <rect x="710" y="142" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="740" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">145</text>

    <rect x="780" y="142" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="810" y="165" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">201</text>

    <text x="860" y="165" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">…</text>

    <text x="500" y="215" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#059669">Postings for "Heart"</text>
    <rect x="500" y="227" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="530" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">8</text>

    <rect x="570" y="227" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="600" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">12</text>

    <rect x="640" y="227" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="670" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">88</text>

    <rect x="710" y="227" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="740" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">108</text>

    <rect x="780" y="227" width="60" height="36" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="810" y="250" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">180</text>

    <text x="860" y="250" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">…</text>
    <path d="M 180 266 C 320 266, 400 160, 495 160" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,3" fill="none" marker-end="url(#ar-ii-purple)"/>
    <path d="M 380 266 C 430 266, 440 245, 495 245" stroke="#6B7280" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#ar-ii-purple)"/>
    </g>

    <g data-step="3">
    <rect x="490" y="305" width="680" height="150" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="490" y="305" width="680" height="6" rx="8" fill="#DC2626"/>
    <text x="830" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626">Bitwise AND intersection (in RAM)</text>
    <text x="830" y="350" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">walk both sorted lists in lockstep, keep only IDs appearing in both</text>

    <text x="520" y="388" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#3F3F46">Crazy:</text>
    <rect x="580" y="372" width="46" height="28" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="603" y="391" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">12</text>
    <text x="640" y="391" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">45</text>
    <rect x="675" y="372" width="52" height="28" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="701" y="391" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">108</text>
    <text x="740" y="391" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">145  201</text>

    <text x="520" y="432" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#3F3F46">Heart:</text>
    <text x="580" y="432" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">8</text>
    <rect x="604" y="416" width="46" height="28" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="627" y="435" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">12</text>
    <text x="660" y="432" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">88</text>
    <rect x="693" y="416" width="52" height="28" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="719" y="435" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#7C3AED">108</text>
    <text x="760" y="432" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">180</text>

    <text x="880" y="412" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#3F3F46">∩</text>
    <text x="880" y="432" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">intersect</text>

    <line x1="920" y1="418" x2="990" y2="418" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ar-ii-purple)"/>

    <rect x="1000" y="370" width="150" height="96" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2.5"/>
    <text x="1075" y="394" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">Result</text>
    <rect x="1014" y="408" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="1039" y="434" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#7C3AED">12</text>
    <rect x="1082" y="408" width="54" height="40" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="1109" y="434" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#7C3AED">108</text>
    </g>

    <g data-step="4">
    <text x="600" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Query "Crazy Heart": 2 term lookups + 2 postings reads + 1 intersection + 2 data-page reads ≈ 10 IOs</text>
    <text x="600" y="534" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">vs. 100,000,000 IOs for a full-table scan of the 100-million-song Songs table</text>
    <text x="600" y="568" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">~10,000,000× fewer reads for the same answer</text>
    </g>

    <text x="600" y="600" text-anchor="middle" font-family="Inter, sans-serif" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = dictionary and postings on disk&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red strip</tspan><tspan fill="#3F3F46"> = the AND in RAM&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = traced terms and IDs</tspan></text>
</svg>
