<svg viewBox="0 0 1200 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="btree-layout-t btree-layout-d">
  <title id="btree-layout-t">B+Tree layout on Songs.release_date_since_1970</title>
  <desc id="btree-layout-d">B+Tree layout on Songs.release_date_since_1970. Data pages on the left hold the rows. The tree on the right has a root node, three internal nodes, and a row of leaf nodes. Leaves store (key, data-page pointer) pairs in sorted order; neighbouring leaves are linked left-to-right so a range scan can walk across them without returning to the root. Color key: green is the index and data pages on disk (persistent), violet is the lookup trace for key 12890.</desc>
