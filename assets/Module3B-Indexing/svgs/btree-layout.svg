        <marker id="ar-bt" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#6B7280"/>
        </marker>
        <marker id="ar-bt-data" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
            <polygon points="0 0, 10 3, 0 6" fill="#7C3AED"/>
        </marker>
    </defs>

