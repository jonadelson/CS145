<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="jcb-t jcb-d">
  <title id="jcb-t">Join IO cost versus buffer size, log scale</title>
  <desc id="jcb-d">A log-scale line chart of IO cost against buffer size B for
  the same join, Songs3 100 GB by Listens3 1 TB, at C_r = C_w = 1. Buffer grows
  left to right: 10, 100, 1000, 10000 pages. BNLJ, the solid ink line, starts
  highest at 2.6M IOs and drops steeply to 18K as the buffer grows. SMJ-best,
  the dashed line, falls gently from 159K to 54K. HPJ-best, the dotted line, is
  flat at about 54K. A green crossover divider marks where the cheapest
  algorithm switches: HPJ is cheapest at small buffers, BNLJ at large buffers.
  Numbers are verified from the Module 3 NanoDB colab. Color key: green is the
  crossover and the winning regions; ink and grey are the cost lines
  and axes.</desc>
  <defs><marker id="ah-jcb" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10"
        text-anchor="middle">Which join wins depends on the buffer, not the data</text>
  <text x="550" y="64" font-size="16" fill="#3F3F46" text-anchor="middle">
    Songs3 100 GB ⋈ Listens3 1 TB, C_r = C_w = 1, log scale. Verified from the M3 colab.</text>

  <!-- y gridlines + labels: log10 4=10K (y360), 5=100K (y264), 6=1M (y168) -->
  <line x1="140" y1="360" x2="980" y2="360" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="140" y1="264" x2="980" y2="264" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="140" y1="168" x2="980" y2="168" stroke="#D4D7DC" stroke-width="1"/>
  <text x="128" y="364" font-size="14" fill="#6B7280" text-anchor="end">10K</text>
  <text x="128" y="268" font-size="14" fill="#6B7280" text-anchor="end">100K</text>
  <text x="128" y="172" font-size="14" fill="#6B7280" text-anchor="end">1M</text>
  <text x="60" y="240" font-size="14" fill="#3F3F46" text-anchor="middle"
        transform="rotate(-90 60 240)">IO cost (log)</text>

  <!-- axes -->
  <line x1="140" y1="110" x2="140" y2="360" stroke="#6B7280" stroke-width="2"/>
  <line x1="140" y1="360" x2="990" y2="360" stroke="#6B7280" stroke-width="2"
        marker-end="url(#ah-jcb)"/>
  <text x="200" y="384" font-size="14" fill="#6B7280" text-anchor="middle">B=10</text>
  <text x="460" y="384" font-size="14" fill="#6B7280" text-anchor="middle">B=100</text>
  <text x="720" y="384" font-size="14" fill="#6B7280" text-anchor="middle">B=1,000</text>
  <text x="940" y="384" font-size="14" fill="#6B7280" text-anchor="middle">B=10,000</text>
  <text x="565" y="408" font-size="14" fill="#3F3F46" text-anchor="middle">buffer size B (pages)</text>

  <!-- crossover divider + winning regions (green) -->
  <line x1="590" y1="110" x2="590" y2="360" stroke="#059669" stroke-width="2"
        stroke-dasharray="5,4"/>
  <text x="360" y="128" font-size="15" font-weight="700" fill="#059669"
        text-anchor="middle">HPJ cheapest</text>
  <text x="800" y="128" font-size="15" font-weight="700" fill="#059669"
        text-anchor="middle">BNLJ cheapest</text>

  <!-- BNLJ: solid ink -->
  <polyline points="200,128 460,223 720,309 940,335" fill="none"
            stroke="#3F3F46" stroke-width="3"/>
  <circle cx="200" cy="128" r="4" fill="#3F3F46"/>
  <circle cx="460" cy="223" r="4" fill="#3F3F46"/>
  <circle cx="720" cy="309" r="4" fill="#3F3F46"/>
  <circle cx="940" cy="335" r="4" fill="#3F3F46"/>
  <text x="220" y="120" font-size="14" font-weight="700" fill="#3F3F46">BNLJ 2.6M</text>
  <text x="948" y="332" font-size="14" font-weight="700" fill="#3F3F46">BNLJ 18K</text>

  <!-- SMJ-best: dashed ink -->
  <polyline points="200,245 460,266 720,276 940,283" fill="none"
            stroke="#6B7280" stroke-width="3" stroke-dasharray="9,5"/>
  <circle cx="200" cy="245" r="4" fill="#6B7280"/>
  <circle cx="460" cy="266" r="4" fill="#6B7280"/>
  <circle cx="720" cy="276" r="4" fill="#6B7280"/>
  <circle cx="940" cy="283" r="4" fill="#6B7280"/>
  <text x="948" y="278" font-size="14" font-weight="700" fill="#6B7280">SMJ-best 54K</text>

  <!-- HPJ-best: dotted ink, flat -->
  <polyline points="200,290 460,290 720,290 940,290" fill="none"
            stroke="#0E0E10" stroke-width="3" stroke-dasharray="2,5"
            stroke-linecap="round"/>
  <circle cx="200" cy="290" r="4" fill="#0E0E10"/>
  <circle cx="940" cy="290" r="4" fill="#0E0E10"/>
  <text x="210" y="308" font-size="14" font-weight="700" fill="#0E0E10">HPJ-best 54K (flat)</text>

  <text x="550" y="450" font-size="14" fill="#6B7280" text-anchor="middle">
    Color key  <tspan fill="#059669" font-weight="700">green = crossover and winning regions</tspan>
    · <tspan fill="#3F3F46" font-weight="700">solid BNLJ</tspan>
    · <tspan fill="#6B7280" font-weight="700">dashed SMJ</tspan>
    · <tspan fill="#0E0E10" font-weight="700">dotted HPJ</tspan></text>
</svg>
