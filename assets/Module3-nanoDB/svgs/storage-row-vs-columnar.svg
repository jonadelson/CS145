<svg viewBox="0 0 980 614" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="storage-row-vs-columnar-t storage-row-vs-columnar-d">
  <title id="storage-row-vs-columnar-t">The same logical Listens table stored two ways on disk: row-oriented packs whole rows together into pages; columnar puts each column in its own file</title>
  <desc id="storage-row-vs-columnar-d">The same logical Listens table stored two ways on disk: row-oriented packs whole rows together into pages; columnar puts each column in its own file. Both layouts live on disk, shown by green frames. The rating column is the highlight, shown in violet: a query for AVG(rating) reads only that one file in columnar, but every row page in row-oriented. Color key: green is the on-disk file layouts, violet is the focal rating column.</desc>
    <defs>
        <marker id="ar-sl" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#6B7280"/></marker>
    </defs>
    <text x="490" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">Same logical table, two physical storage layouts</text>

    <g data-step="1">
