    <text x="640" y="130" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">listen_time</text>
    <line x1="285" y1="138" x2="695" y2="138" stroke="#D4D7DC"/>
