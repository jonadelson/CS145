<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="bq-t bq-d">
  <title id="bq-t">BigQuery: columnar storage scanned by thousands of on-demand workers on a tree</title>
  <desc id="bq-d">BigQuery stores each column in its own file, so a query for average rating per genre reads only the rating and genre columns (green) and skips user_id, song_id, and listen_time (grey). Thousands of leaf workers, spun up only while the query runs, each scan a slice of those columns; their partial results bubble up a tree to a root that aggregates the answer. Color key: green is the columns read and the worker tree, grey is the skipped columns.</desc>
  <defs><marker id="agq" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker></defs>
  <text x="500" y="38" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#0E0E10;">BigQuery: read only the columns you touch, on thousands of workers</text>
  <text x="500" y="64" text-anchor="middle" style="font-size:15px;fill:#3F3F46;">Columnar storage skips untouched columns; a tree of on-demand workers scans the rest in parallel.</text>

  <g data-step="1">
  <rect x="170" y="360" width="96" height="96" rx="6" fill="#E7EAEE" stroke="#D4D7DC" stroke-width="1.5"/><rect x="170" y="360" width="96" height="6" rx="3" fill="#D4D7DC"/><text x="218" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">user_id</text><text x="218" y="446" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">skipped</text>
  <rect x="290" y="360" width="96" height="96" rx="6" fill="#E7EAEE" stroke="#D4D7DC" stroke-width="1.5"/><rect x="290" y="360" width="96" height="6" rx="3" fill="#D4D7DC"/><text x="338" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">song_id</text><text x="338" y="446" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">skipped</text>
  <rect x="410" y="360" width="96" height="96" rx="6" fill="#E1F4EC" stroke="#059669" stroke-width="2"/><rect x="410" y="360" width="96" height="6" rx="3" fill="#059669"/><text x="458" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">rating</text><text x="458" y="446" text-anchor="middle" font-size="11" font-style="italic" fill="#059669">read</text>
  <rect x="530" y="360" width="96" height="96" rx="6" fill="#E1F4EC" stroke="#059669" stroke-width="2"/><rect x="530" y="360" width="96" height="6" rx="3" fill="#059669"/><text x="578" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#059669">genre</text><text x="578" y="446" text-anchor="middle" font-size="11" font-style="italic" fill="#059669">read</text>
  <rect x="650" y="360" width="96" height="96" rx="6" fill="#E7EAEE" stroke="#D4D7DC" stroke-width="1.5"/><rect x="650" y="360" width="96" height="6" rx="3" fill="#D4D7DC"/><text x="698" y="386" text-anchor="middle" font-size="13" font-weight="700" fill="#6B7280">listen_time</text><text x="698" y="446" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">skipped</text>
  <text x="770" y="412" font-size="13" fill="#6B7280">columnar:</text><text x="770" y="430" font-size="13" fill="#6B7280">one file</text><text x="770" y="448" font-size="13" fill="#6B7280">per column</text>
  </g>

  <g data-step="2">
  <rect x="210" y="232" width="84" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="210" y="232" width="84" height="5" rx="3" fill="#059669"/><text x="252" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3F3F46">worker</text>
  <rect x="330" y="232" width="84" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="330" y="232" width="84" height="5" rx="3" fill="#059669"/><text x="372" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3F3F46">worker</text>
  <rect x="450" y="232" width="84" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="450" y="232" width="84" height="5" rx="3" fill="#059669"/><text x="492" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3F3F46">worker</text>
  <rect x="570" y="232" width="84" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="570" y="232" width="84" height="5" rx="3" fill="#059669"/><text x="612" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3F3F46">worker</text>
  <rect x="690" y="232" width="84" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="690" y="232" width="84" height="5" rx="3" fill="#059669"/><text x="732" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#3F3F46">worker</text>
  <text x="800" y="256" font-size="13" font-weight="700" fill="#6B7280">× thousands,</text><text x="800" y="273" font-size="12" fill="#6B7280">on demand</text>
  <line x1="458" y1="356" x2="458" y2="278" stroke="#6B7280" stroke-width="1.5" marker-end="url(#agq)"/>
  <line x1="578" y1="356" x2="578" y2="278" stroke="#6B7280" stroke-width="1.5" marker-end="url(#agq)"/>
  </g>

  <g data-step="3">
    <rect x="380" y="110" width="240" height="52" rx="8" fill="#E1F4EC" stroke="#059669" stroke-width="2"/>
  <rect x="380" y="110" width="240" height="6" rx="3" fill="#059669"/>
  <text x="500" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#059669">Root: AVG(rating) per genre</text>
  <text x="500" y="153" text-anchor="middle" font-size="12" fill="#3F3F46">results bubble up the tree</text>
  <line x1="252" y1="228" x2="500" y2="166" stroke="#6B7280" stroke-width="1.2" marker-end="url(#agq)"/>
  <line x1="372" y1="228" x2="500" y2="166" stroke="#6B7280" stroke-width="1.2" marker-end="url(#agq)"/>
  <line x1="492" y1="228" x2="500" y2="166" stroke="#6B7280" stroke-width="1.2" marker-end="url(#agq)"/>
  <line x1="612" y1="228" x2="500" y2="166" stroke="#6B7280" stroke-width="1.2" marker-end="url(#agq)"/>
  <line x1="732" y1="228" x2="500" y2="166" stroke="#6B7280" stroke-width="1.2" marker-end="url(#agq)"/>
  </g>

  <text x="500" y="486" text-anchor="middle" font-size="13"><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = columns read + the worker tree&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = skipped columns</tspan></text>
</svg>