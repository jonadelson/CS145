<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="ems-t ems-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="ems-t">External merge sort as a memory model</title>
  <desc id="ems-d">Pages stream from disk through a small four-page RAM box and back. Phase one reads four pages into RAM, quicksorts them, and writes a sorted run; repeat to get several runs. Phase two reads the head page of each run into RAM and emits the smallest value over and over, merging the runs into one sorted file. Each tile is a page shaded by its sort key, light for small and dark for large, so a sorted run reads as a smooth light-to-dark gradient. Color key: the green box is disk (persistent), the red box is RAM (volatile), the neutral tiles are pages shaded by sort key.</desc>
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">External Merge Sort: 4 Pages of RAM at a Time</text>
  <text x="550" y="66" text-anchor="middle" font-size="15" fill="#6B7280">Read a few pages, sort or merge them in memory, write them back. Never hold more than RAM.</text>
