<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bnlj-algorithm-t bnlj-algorithm-d">
  <title id="bnlj-algorithm-t">Block Nested Loop Join shown as DISK on the left and RAM on the right</title>
  <desc id="bnlj-algorithm-d">Block Nested Loop Join shown as DISK on the left and RAM on the right. R lives on disk as one page and is loaded into a RAM block of identical shape (one read). S lives on disk as four pages; one at a time, each is loaded into an S buffer slot in RAM and probed against the R block, producing joined rows (user_id, name, song_id). Color key: red strip is RAM (volatile and limited), green strip is disk (persistent).</desc>
    <defs>
        <marker id="ar-bnlj" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#6B7280"/></marker>
    </defs>
    <text x="500" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">Block Nested Loop Join: load R into RAM once, stream S past page-by-page</text>

    <g data-step="1">
    <rect x="20" y="60" width="420" height="400" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="20" y="60" width="420" height="6" rx="10" fill="#059669"/>
    <text x="230" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#059669">DISK</text>
    <text x="40" y="128" text-anchor="start" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#3F3F46">R (1 page)</text>
    <rect x="40" y="136" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="230" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7·Mickey  ·  13·Minnie  ·  42·Pluto  ·  99·Daffy</text>
    <text x="40" y="208" text-anchor="start" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#3F3F46">S (4 pages, read in order)</text>
    <rect x="40" y="216" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="58" y="240" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6B7280">P1</text>
    <text x="240" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42·100   ·   7·200</text>
    <rect x="40" y="266" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="58" y="290" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6B7280">P2</text>
    <text x="240" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">13·100   ·   42·300</text>
    <rect x="40" y="316" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="58" y="340" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6B7280">P3</text>
    <text x="240" y="340" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7·100   ·   13·200</text>
    <rect x="40" y="366" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="58" y="390" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6B7280">P4</text>
    <text x="240" y="390" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42·400   ·   99·500</text>
    </g>

    <g data-step="2">
    <line x1="445" y1="157" x2="555" y2="157" stroke="#6B7280" stroke-width="2" marker-end="url(#ar-bnlj)"/>
    <text x="500" y="148" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">load once</text>
    <line x1="445" y1="312" x2="555" y2="237" stroke="#6B7280" stroke-width="2" marker-end="url(#ar-bnlj)"/>
    <text x="510" y="278" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">stream</text>
    <text x="510" y="293" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">(1 page at a time)</text>
    <rect x="560" y="60" width="420" height="220" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="560" y="60" width="420" height="6" rx="10" fill="#DC2626"/>
    <text x="770" y="88" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="700" fill="#DC2626">RAM</text>
    <text x="580" y="128" text-anchor="start" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">R block (loaded once · stays for the whole join)</text>
    <rect x="580" y="136" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="770" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7·Mickey  ·  13·Minnie  ·  42·Pluto  ·  99·Daffy</text>
    <text x="580" y="208" text-anchor="start" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">S buffer (1-page slot · swapped each iteration)</text>
    <rect x="580" y="216" width="380" height="42" rx="5" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2" stroke-dasharray="5,3"/>
    </g>

    <g data-step="3">
    <rect x="560" y="300" width="420" height="170" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="770" y="324" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#3F3F46">Join output · R ⋈ S on user_id</text>
    <text x="580" y="350" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">P1 → (42, Pluto, 100) · (7, Mickey, 200)</text>
    <text x="580" y="370" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">P2 → (13, Minnie, 100) · (42, Pluto, 300)</text>
    <text x="580" y="390" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">P3 → (7, Mickey, 100) · (13, Minnie, 200)</text>
    <text x="580" y="410" text-anchor="start" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">P4 → (42, Pluto, 400) · (99, Daffy, 500)</text>
    <text x="770" y="446" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">= 8 joined rows</text>
    </g>

    <text x="500" y="492" text-anchor="middle" font-family="Inter, sans-serif" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red strip</tspan><tspan fill="#3F3F46"> = RAM, volatile and limited&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green strip</tspan><tspan fill="#3F3F46"> = disk, persistent</tspan></text>
</svg>
