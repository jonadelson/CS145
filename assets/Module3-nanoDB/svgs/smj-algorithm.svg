<svg viewBox="0 0 1040 466" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="smj-algorithm-t smj-algorithm-d">
  <title id="smj-algorithm-t">Sort-Merge Join: after Phase 1 BigSort, both R and S are sorted on disk on the join key</title>
  <desc id="smj-algorithm-d">Sort-Merge Join: after Phase 1 BigSort, both R and S are sorted on the join key and live on disk. Phase 2 walks both tables in one pass with two pointers in RAM, emitting matched groups as it goes. The dashed match lines connect each key's R row to its matching S rows: key 7 yields 2 outputs, key 13 yields 2, key 42 yields 3, key 99 yields 1. Total 8 output rows. Color key: green is the sorted tables on disk (persistent), red is the two-pointer merge in RAM (volatile).</desc>
    <defs>
        <marker id="ar-smj" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#6B7280"/></marker>
    </defs>
    <text x="520" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">Sort-Merge Join: walk both sorted tables in one pass</text>

    <!-- step 1: both tables, sorted on the join key -->
    <g data-step="1">
    <text x="270" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#059669">R sorted on user_id · disk</text>
    <rect x="180" y="120" width="180" height="30" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="180" y="120" width="180" height="6" rx="4" fill="#059669"/>
    <text x="225" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">user_id</text>
    <text x="315" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">name</text>
    <rect x="180" y="150" width="180" height="60" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="225" y="187" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#3F3F46">7</text>
    <text x="315" y="187" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">Mickey</text>
    <rect x="180" y="210" width="180" height="60" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="225" y="247" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#3F3F46">13</text>
    <text x="315" y="247" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">Minnie</text>
    <rect x="180" y="270" width="180" height="90" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="225" y="322" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#3F3F46">42</text>
    <text x="315" y="322" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">Pluto</text>
    <rect x="180" y="360" width="180" height="40" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="225" y="386" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="17" font-weight="700" fill="#3F3F46">99</text>
    <text x="315" y="386" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">Daffy</text>
    <text x="670" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#059669">S sorted on user_id · disk</text>
    <rect x="580" y="120" width="180" height="30" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="580" y="120" width="180" height="6" rx="4" fill="#059669"/>
    <text x="625" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">user_id</text>
    <text x="715" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#3F3F46">song_id</text>
    <rect x="580" y="150" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="170" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">7</text>
    <text x="715" y="170" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">100</text>
    <rect x="580" y="180" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">7</text>
    <text x="715" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">200</text>
    <rect x="580" y="210" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">13</text>
    <text x="715" y="230" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">100</text>
    <rect x="580" y="240" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">13</text>
    <text x="715" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">200</text>
    <rect x="580" y="270" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">42</text>
    <text x="715" y="290" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">100</text>
    <rect x="580" y="300" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">42</text>
    <text x="715" y="320" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">300</text>
    <rect x="580" y="330" width="180" height="30" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">42</text>
    <text x="715" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">400</text>
    <rect x="580" y="360" width="180" height="40" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="625" y="386" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">99</text>
    <text x="715" y="386" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">500</text>
    </g>

    <!-- step 2: matching key groups across the two runs -->
    <g data-step="2">
    <line x1="360" y1="180" x2="580" y2="180" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="360" y1="240" x2="580" y2="240" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="360" y1="315" x2="580" y2="315" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="360" y1="380" x2="580" y2="380" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="470" y="172" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">match</text>
    <text x="470" y="232" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">match</text>
    <text x="470" y="307" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">match</text>
    <text x="470" y="372" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">match</text>
    <text x="172" y="192" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">i ▸</text>
    <text x="572" y="176" text-anchor="end" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">j ▸</text>
    <path d="M 765 152 L 775 152 L 775 208 L 765 208" fill="none" stroke="#6B7280" stroke-width="2"/>
    <path d="M 765 212 L 775 212 L 775 268 L 765 268" fill="none" stroke="#6B7280" stroke-width="2"/>
    <path d="M 765 272 L 775 272 L 775 358 L 765 358" fill="none" stroke="#6B7280" stroke-width="2"/>
    <path d="M 765 362 L 775 362 L 775 398 L 765 398" fill="none" stroke="#6B7280" stroke-width="2"/>
    </g>

    <!-- step 3: two-pointer merge emits the cross-product, 8 output rows -->
    <g data-step="3">
    <line x1="780" y1="260" x2="828" y2="260" stroke="#6B7280" stroke-width="2" marker-end="url(#ar-smj)"/>
    <rect x="832" y="170" width="190" height="180" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="832" y="170" width="190" height="6" rx="8" fill="#DC2626"/>
    <text x="927" y="198" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#DC2626">Two-pointer merge</text>
    <text x="927" y="216" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">in RAM</text>
    <text x="927" y="246" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">advance the smaller</text>
    <text x="927" y="264" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">pointer, emit on</text>
    <text x="927" y="282" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">equal keys</text>
    <text x="927" y="312" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700" fill="#3F3F46">8 output rows</text>
    <text x="927" y="332" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-style="italic" fill="#6B7280">streamed to disk</text>
    </g>

    <text x="520" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = sorted tables on disk&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = two-pointer merge in RAM&#160;&#160;&#183;&#160;&#160;dashed lines connect each key's matching rows</tspan></text>
</svg>
