<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hpj-algorithm-t hpj-algorithm-d">
  <title id="hpj-algorithm-t">Hash Partition Join: in Phase 1 both R and S are hashed on the join key into matching partitions on disk; in Phase 2 each partition pair is joined in RAM</title>
  <desc id="hpj-algorithm-d">Hash Partition Join. Phase 1: both R and S are read from disk and hashed on the join key into matching partitions written back to disk, so the same key always lands in the same partition number. Phase 2: each partition pair is loaded into RAM and joined there. Color key: green is the tables and partitions on disk (persistent), red is the per-partition join in RAM (volatile); partitions are identified by their h to 0, 1, 2 labels.</desc>
    <defs>
        <marker id="ar-hpj" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto"><polygon points="0 0, 14 5, 0 10" fill="#6B7280"/></marker>
    </defs>
    <text x="500" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="#0E0E10">Hash Partition Join: R ⋈ S on user_id</text>

    <!-- step 1: Phase 1, hash R into partitions -->
    <g data-step="1">
    <text x="40" y="74" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#059669">Phase 1 · read from disk, hash into partitions on disk</text>
    <text x="80" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">R (Users) · disk</text>
    <rect x="20" y="110" width="120" height="124" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="20" y="110" width="120" height="6" rx="6" fill="#059669"/>
    <text x="50" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">user_id</text>
    <text x="105" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">name</text>
    <line x1="28" y1="138" x2="132" y2="138" stroke="#D4D7DC"/>
    <text x="50" y="157" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7</text>
    <text x="105" y="157" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">Mickey</text>
    <text x="50" y="179" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">13</text>
    <text x="105" y="179" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">Minnie</text>
    <text x="50" y="201" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42</text>
    <text x="105" y="201" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">Pluto</text>
    <text x="50" y="223" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">99</text>
    <text x="105" y="223" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">Daffy</text>
    <text x="200" y="160" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#6B7280">h(user_id)</text>
    <line x1="145" y1="172" x2="258" y2="172" stroke="#6B7280" stroke-width="2" marker-end="url(#ar-hpj)"/>
    <rect x="270" y="110" width="220" height="124" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="270" y="110" width="220" height="6" rx="6" fill="#059669"/>
    <text x="380" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">R₀ · disk  (h → 0)</text>
    <line x1="280" y1="140" x2="480" y2="140" stroke="#D4D7DC"/>
    <text x="380" y="172" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">42 · Pluto</text>
    <text x="380" y="202" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">99 · Daffy</text>
    <rect x="510" y="110" width="220" height="124" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="510" y="110" width="220" height="6" rx="6" fill="#059669"/>
    <text x="620" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">R₁ · disk  (h → 1)</text>
    <line x1="520" y1="140" x2="720" y2="140" stroke="#D4D7DC"/>
    <text x="620" y="182" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">7 · Mickey</text>
    <rect x="750" y="110" width="220" height="124" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="750" y="110" width="220" height="6" rx="6" fill="#059669"/>
    <text x="860" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">R₂ · disk  (h → 2)</text>
    <line x1="760" y1="140" x2="960" y2="140" stroke="#D4D7DC"/>
    <text x="860" y="182" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" fill="#3F3F46">13 · Minnie</text>
    </g>

    <!-- step 2: Phase 1, hash S into the same partitions -->
    <g data-step="2">
    <text x="80" y="263" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">S (Listens) · disk</text>
    <rect x="20" y="273" width="120" height="172" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="20" y="273" width="120" height="6" rx="6" fill="#059669"/>
    <text x="50" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">user_id</text>
    <text x="105" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6B7280">song_id</text>
    <line x1="28" y1="301" x2="132" y2="301" stroke="#D4D7DC"/>
    <text x="50" y="318" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">42</text>
    <text x="105" y="318" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">100</text>
    <text x="50" y="336" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">7</text>
    <text x="105" y="336" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">200</text>
    <text x="50" y="354" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">13</text>
    <text x="105" y="354" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">100</text>
    <text x="50" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">42</text>
    <text x="105" y="372" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">300</text>
    <text x="50" y="390" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">7</text>
    <text x="105" y="390" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">100</text>
    <text x="50" y="408" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">13</text>
    <text x="105" y="408" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">200</text>
    <text x="50" y="426" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">42</text>
    <text x="105" y="426" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#3F3F46">400</text>
    <text x="50" y="441" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#3F3F46">99 · 500</text>
    <text x="200" y="350" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#6B7280">h(user_id)</text>
    <text x="200" y="368" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-style="italic" fill="#6B7280">(same h)</text>
    <line x1="145" y1="362" x2="258" y2="362" stroke="#6B7280" stroke-width="2" marker-end="url(#ar-hpj)"/>
    <rect x="270" y="273" width="220" height="172" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="270" y="273" width="220" height="6" rx="6" fill="#059669"/>
    <text x="380" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">S₀ · disk  (h → 0)</text>
    <line x1="280" y1="303" x2="480" y2="303" stroke="#D4D7DC"/>
    <text x="380" y="326" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42 · 100</text>
    <text x="380" y="348" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42 · 300</text>
    <text x="380" y="370" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">42 · 400</text>
    <text x="380" y="392" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">99 · 500</text>
    <rect x="510" y="273" width="220" height="172" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="510" y="273" width="220" height="6" rx="6" fill="#059669"/>
    <text x="620" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">S₁ · disk  (h → 1)</text>
    <line x1="520" y1="303" x2="720" y2="303" stroke="#D4D7DC"/>
    <text x="620" y="335" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7 · 200</text>
    <text x="620" y="357" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">7 · 100</text>
    <rect x="750" y="273" width="220" height="172" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="750" y="273" width="220" height="6" rx="6" fill="#059669"/>
    <text x="860" y="295" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#059669">S₂ · disk  (h → 2)</text>
    <line x1="760" y1="303" x2="960" y2="303" stroke="#D4D7DC"/>
    <text x="860" y="335" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">13 · 100</text>
    <text x="860" y="357" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#3F3F46">13 · 200</text>
    </g>

    <!-- step 3: Phase 2, join each partition pair in RAM -->
    <g data-step="3">
    <line x1="20" y1="486" x2="980" y2="486" stroke="#D4D7DC" stroke-width="1"/>
    <text x="40" y="510" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#DC2626">Phase 2 · load each partition pair into RAM and join there</text>
    <rect x="20" y="528" width="305" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="20" y="528" width="305" height="6" rx="8" fill="#DC2626"/>
    <text x="172" y="556" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#DC2626">R₀ ⋈ S₀ · in RAM</text>
    <text x="172" y="582" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#3F3F46">build hash on R₀, probe with S₀</text>
    <text x="172" y="610" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#3F3F46">→ 4 output rows</text>
    <text x="172" y="634" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">user_id 42 → 3 matches · user_id 99 → 1 match</text>
    <rect x="345" y="528" width="305" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="345" y="528" width="305" height="6" rx="8" fill="#DC2626"/>
    <text x="497" y="556" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#DC2626">R₁ ⋈ S₁ · in RAM</text>
    <text x="497" y="582" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#3F3F46">build hash on R₁, probe with S₁</text>
    <text x="497" y="610" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#3F3F46">→ 2 output rows</text>
    <text x="497" y="634" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">user_id 7 → 2 matches</text>
    <rect x="670" y="528" width="305" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="670" y="528" width="305" height="6" rx="8" fill="#DC2626"/>
    <text x="822" y="556" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="700" fill="#DC2626">R₂ ⋈ S₂ · in RAM</text>
    <text x="822" y="582" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#3F3F46">build hash on R₂, probe with S₂</text>
    <text x="822" y="610" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700" fill="#3F3F46">→ 2 output rows</text>
    <text x="822" y="634" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#6B7280">user_id 13 → 2 matches</text>
    </g>

    <text x="500" y="684" text-anchor="middle" font-family="Inter, sans-serif" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = tables and partitions on disk&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = per-partition join in RAM&#160;&#160;&#183;&#160;&#160;same key always lands in the same partition (h → 0, 1, 2)</tspan></text>
</svg>
