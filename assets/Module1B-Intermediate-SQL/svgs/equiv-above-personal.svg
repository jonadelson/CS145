:space="preserve">JOIN</text><text x="739" y="226.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="794" y="226.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l</text><text x="629" y="243.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ON</text><text x="650" y="243.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">u.user_id</text><text x="718" y="243.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">=</text><text x="732" y="243.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l.user_id</text><text x="615" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">JOIN</text><text x="650" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">UserAvgs</text><text x="712" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">ua</text><text x="732" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ON</text><text x="753" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">ua.user_id</text><text x="829" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">=</text><text x="843" y="259.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">u.user_id</text><rect x="606.0" y="264.5" width="3.5" height="15.5" rx="1.5" fill="#DB2777"/><text x="615" y="276.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="656" y="276.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l