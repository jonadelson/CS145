<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="wp-t wp-d"><title id="wp-t">GROUP BY collapses; a window keeps the rows in a new table plus a column</title><desc id="wp-d">The nine Listens rows. GROUP BY collapses them to three rows of per-user average. A window function instead returns the same nine Listens rows in a new table, each with a user_avg column holding its user average.</desc><defs><marker id="wa" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#6B7280"/></marker><marker id="wg" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#16A34A"/></marker></defs><rect x="0" y="0" width="1180" height="560" fill="#FBFBFC"/><text x="590.0" y="38" font-size="20" font-weight="800" fill="#0E0E10" text-anchor="middle">GROUP BY collapses the rows; a window keeps them and adds a column</text><text x="590.0" y="63" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Same per-user average, two outputs. The window result is the Listens rows again, plus one column.</text><g data-step="1"><rect x="30" y="110" width="270" height="282" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="30" y="110" width="270" height="30" rx="9" fill="#F4F4F6"/><rect x="30" y="131" width="270" height="9" fill="#F4F4F6"/><line x1="30" y1="140" x2="300" y2="140" stroke="#D4D7DC" stroke-width="1.4"/><text x="42" y="98" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">Listens</text><text x="65" y="130" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="160" y="130" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">song_id</text><text x="248" y="130" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="30" y="140" width="5" height="28" fill="#2563EB"/><text x="65"