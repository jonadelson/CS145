<svg viewBox="0 0 1180 444" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="eb-t eb-d"><g><rect x="0" y="0" width="1180" height="444" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Where the look-alikes split</text><text x="590.0" y="64" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Equal on our nine rows. Change the data, or the schema, and they come apart.</text><rect x="50" y="90" width="540" height="330" rx="12" fill="#FDEBE0" stroke="#D4D7DC" stroke-width="1.5"/><rect x="50" y="90" width="540" height="6" rx="3" fill="#D97706"/><text x="74" y="124" font-size="16" font-weight="800" fill="#D97706" text-anchor="start">A tie breaks Example 3</text><text x="74" y="147" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">One user, four songs tied at 5.0:</text><rect x="74" y="162" width="404" height="130" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><rect x="74" y="162" width="404" height="26" rx="7" fill="#F4F4F6"/><rect x="74" y="181" width="404" height="7" fill="#F4F4F6"/><line x1="74" y1="188" x2="478" y2="188" stroke="#D4D7DC" stroke-width="1.2"/><text x="86" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><text x="150" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">row_number</text><text x="262" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start"># higher</text><text x="354" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">rn&lt;=3</text><text x="424" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">#h&lt;3</text><text x="86" y="205.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5.0</text><text x="150" y="205.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="262" y="205.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">0</text><text x="354" y="205.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="424" y="205.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><line x1="80" y1="214" x2="472" y2="214" stroke="#D4D7DC" stroke-width="0.4"/><text x="86" y="231.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5.0</text><text x="150" y="231.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="262" y="231.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">0</text><text x="354" y="231.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="424" y="231.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><line x1="80" y1="240" x2="472" y2="240" stroke="#D4D7DC" stroke-width="0.4"/><text x="86" y="257.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5.0</text><text x="150" y="257.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="262" y="257.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">0</text><text x="354" y="257.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="424" y="257.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><line x1="80" y1="266" x2="472" y2="266" stroke="#D4D7DC" stroke-width="0.4"/><text x="86" y="283.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5.0</text><text x="150" y="283.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4</text><text x="262" y="283.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">0</text><text x="354" y="283.0" font-size="11.5" font-weight="800" fill="#6B7280" text-anchor="start">✗</text><text x="424" y="283.0" font-size="11.5" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="74" y="322" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">ROW_NUMBER keeps 3   ·   COUNT(higher) keeps 4</text><rect x="610" y="90" width="540" height="330" rx="12" fill="#FDEBE0" stroke="#D4D7DC" stroke-width="1.5"/><rect x="610" y="90" width="540" height="6" rx="3" fill="#D97706"/><text x="634" y="124" font-size="16" font-weight="800" fill="#D97706" text-anchor="start">A NULL breaks NOT IN</text><text x="634" y="147" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">Exclude-list  = { 2, NULL }:</text><rect x="634" y="162" width="446" height="104" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><rect x="634" y="162" width="446" height="26" rx="7" fill="#F4F4F6"/><rect x="634" y="181" width="446" height="7" fill="#F4F4F6"/><line x1="634" y1="188" x2="1080" y2="188" stroke="#D4D7DC" stroke-width="1.2"/><text x="646" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="732" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">NOT IN (2, NULL)</text><text x="962" y="179" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">NOT EXISTS</text><text x="646" y="205.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="732" y="205.0" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">UNKNOWN → drop</text><text x="962" y="205.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">keep</text><line x1="640" y1="214" x2="1074" y2="214" stroke="#D4D7DC" stroke-width="0.4"/><text x="646" y="231.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="732" y="231.0" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">UNKNOWN → drop</text><text x="962" y="231.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">keep</text><line x1="640" y1="240" x2="1074" y2="240" stroke="#D4D7DC" stroke-width="0.4"/><text x="646" y="257.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4</text><text x="732" y="257.0" font-size="11.5" font-weight="700" fill="#D97706" text-anchor="start">UNKNOWN → drop</text><text x="962" y="257.0" font-size="11.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">keep</text><text x="634" y="296" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">NOT IN → nothing   ·   NOT EXISTS → 1, 3, 4</text></g><title id="eb-t">Where the look-alike queries split</title><desc id="eb-d">Two concrete divergences. With four songs tied at 5.0, ROW_NUMBER keeps 3 while COUNT of higher-rated keeps 4. With a NULL in the exclude-list, NOT IN returns nothing while NOT EXISTS returns the right rows; on this schema user_id is NOT NULL so it cannot happen here.</desc></svg>
