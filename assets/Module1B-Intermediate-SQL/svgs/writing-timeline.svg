<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="writing-timeline-t writing-timeline-d"><title id="writing-timeline-t">The Timeline pattern: running total with SUM OVER ORDER BY</title><desc id="writing-timeline-d">A line climbing over four days as the running total accumulates 3, 8, 10, 14, paired with SUM(hours) OVER (ORDER BY date).</desc><rect x="0" y="0" width="1180" height="400" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The Timeline: a running total over time</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">SUM over an ordered window. Add each day's hours; the line only climbs.</text><line x1="90" y1="330" x2="530" y2="330" stroke="#6B7280" stroke-width="1.5"/><line x1="90" y1="114" x2="90" y2="330" stroke="#6B7280" stroke-width="1.5"/><text x="82" y="108" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">cumulative hours</text><path d="M90,330 L90,291 L233,225 L377,199 L520,146 L520,330 Z" fill="#60A5FA" opacity="0.16"/><path d="M90,291 L233,225 L377,199 L520,146" fill="none" stroke="#2563EB" stroke-width="2.5"/><circle cx="90" cy="291" r="5.5" fill="#2563EB"/><text x="90.0" y="276.625" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">3</text><text x="90.0" y="354" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Mon</text><text x="90.0" y="372" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">+3</text><circle cx="233" cy="225" r="5.5" fill="#2563EB"/><text x="233.33333333333334" y="211.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">8</text><text x="233.33333333333334" y="354" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Tue</text><text x="233.33333333333334" y="372" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">+5</text><circle cx="377" cy="199" r="5.5" fill="#2563EB"/><text x="376.6666666666667" y="184.75" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">10</text><text x="376.6666666666667" y="354" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Wed</text><text x="376.6666666666667" y="372" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">+2</text><circle cx="520" cy="146" r="5.5" fill="#2563EB"/><text x="520.0" y="132.25" font-size="14" font-weight="800" fill="#2563EB" text-anchor="middle">14</text><text x="520.0" y="354" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Thu</text><text x="520.0" y="372" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">+4</text><rect x="620" y="145" width="510" height="150" rx="9" fill="#0D1117"/><text x="642" y="175" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="698" y="175" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">date,</text><text x="746" y="175" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">hours,</text><text x="658" y="196" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">SUM(hours)</text><text x="746" y="196" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="786" y="196" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="674" y="217" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ORDER</text><text x="722" y="217" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="746" y="217" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">date</text><text x="658" y="238" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">)</text><text x="674" y="238" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="698" y="238" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">cumulative</text><text x="642" y="259" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="682" y="259" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">daily_listening</text></svg>
