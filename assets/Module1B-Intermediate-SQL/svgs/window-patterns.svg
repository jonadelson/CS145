<svg viewBox="0 0 1180 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="window-patterns-t window-patterns-d"><title id="window-patterns-t">Five common window-function patterns</title><desc id="window-patterns-d">Ranking, running totals with SUM OVER ORDER BY, moving averages with a ROWS window, LAG and LEAD, and NTILE percentiles.</desc><rect x="0" y="0" width="1180" height="450" fill="#FBFBFC"/><text x="590.0" y="42" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Window functions go well beyond ranking</text><text x="590.0" y="67" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">The same OVER skeleton, five everyday shapes.</text><rect x="90" y="100" width="1000" height="320" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="90" y="100" width="5" height="64" fill="#2563EB"/><text x="116" y="128" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Ranking</text><text x="116" y="149" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">order rows within a group</text><text x="450" y="139" font-size="13.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">ROW_NUMBER() / RANK() / DENSE_RANK()</text><line x1="104" y1="164" x2="1076" y2="164" stroke="#D4D7DC" stroke-width="0.7"/><rect x="90" y="164" width="5" height="64" fill="#2563EB"/><text x="116" y="192" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Running total</text><text x="116" y="213" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">accumulate over time</text><text x="450" y="203" font-size="13.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">SUM(x) OVER (ORDER BY date)</text><line x1="104" y1="228" x2="1076" y2="228" stroke="#D4D7DC" stroke-width="0.7"/><rect x="90" y="228" width="5" height="64" fill="#2563EB"/><text x="116" y="256" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Moving average</text><text x="116" y="277" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">smooth a sliding window</text><text x="450" y="267" font-size="13.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">AVG(x) OVER (ROWS BETWEEN ...)</text><line x1="104" y1="292" x2="1076" y2="292" stroke="#D4D7DC" stroke-width="0.7"/><rect x="90" y="292" width="5" height="64" fill="#2563EB"/><text x="116" y="320" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Lead / Lag</text><text x="116" y="341" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">compare to the previous or next row</text><text x="450" y="331" font-size="13.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">LAG(x) / LEAD(x)</text><line x1="104" y1="356" x2="1076" y2="356" stroke="#D4D7DC" stroke-width="0.7"/><rect x="90" y="356" width="5" height="64" fill="#2563EB"/><text x="116" y="384" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Percentiles</text><text x="116" y="405" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">bucket rows into quantiles</text><text x="450" y="395" font-size="13.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">NTILE(4) / PERCENT_RANK()</text></svg>
