<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="openai-replicas-t openai-replicas-d"><g><rect x="0" y="0" width="1180" height="470" fill="#FBFBFC"/><defs><marker id="ab" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#2563EB"/></marker><marker id="ao" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#EA580C"/></marker><marker id="ag" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#6B7280"/></marker></defs><text x="590.0" y="46" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">One primary for the truth, replicas for the reads</text><text x="590.0" y="72" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Writes stay on a single primary; 50 read replicas absorb the query load.</text><rect x="60" y="150" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="150" width="180" height="5" rx="2.5" fill="#EA580C"/><text x="150.0" y="178.0" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="middle">Writes</text><text x="150.0" y="198.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">new messages</text><rect x="60" y="320" width="180" height="64" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="320" width="180" height="5" rx="2.5" fill="#2563EB"/><text x="150.0" y="348.0" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="middle">Reads</text><text x="150.0" y="368.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">history, sidebars</text><rect x="430" y="150" width="220" height="120" rx="12" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="540" y="194" font-size="17" font-weight="800" fill="#EA580C" text-anchor="middle">PRIMARY</text><text x="540" y="220" font-size="12" font-weight="400" fill="#3F3F46" text-anchor="middle">one writable copy</text><text x="540" y="242" font-size="12" font-weight="400" fill="#3F3F46" text-anchor="middle">holds the truth (ACID)</text><path d="M240,182 H424" fill="none" stroke="#EA580C" stroke-width="2.2" marker-end="url(#ao)"/><text x="335.0" y="172" font-size="11" font-weight="700" fill="#EA580C" text-anchor="middle">write</text><rect x="880" y="150" width="230" height="62" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="880" y="150" width="5" height="62" rx="2.5" fill="#2563EB"/><text x="900" y="187" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">read replica</text><path d="M650,210 C730,210 800,181 874,181" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/><rect x="880" y="230" width="230" height="62" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="880" y="230" width="5" height="62" rx="2.5" fill="#2563EB"/><text x="900" y="267" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">read replica</text><path d="M650,210 C730,210 800,261 874,261" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/><rect x="880" y="310" width="230" height="62" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="880" y="310" width="5" height="62" rx="2.5" fill="#2563EB"/><text x="900" y="347" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">read replica</text><path d="M650,210 C730,210 800,341 874,341" fill="none" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ag)"/><text x="995" y="396" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="middle">... 50 globally distributed replicas</text><path d="M240,352 C480,352 840,420 874,250" fill="none" stroke="#2563EB" stroke-width="2.2" marker-end="url(#ab)"/><text x="560" y="410" font-size="11.5" font-weight="700" fill="#2563EB" text-anchor="middle">reads fan out to the replicas</text><text x="765.0" y="168" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="middle">replicate</text></g><title id="openai-replicas-t">openai replicas</title><desc id="openai-replicas-d">Writes, orange, go to one writable primary that holds the truth with ACID; the primary replicates to about 50 read replicas, blue, and all read traffic fans out to them. Color key: orange = the single writable primary, blue = the read replicas.</desc></svg>
