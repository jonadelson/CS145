<svg viewBox="0 0 1200 430" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="norm-t norm-d">
  <title id="norm-t">Give each fact one home</title>
  <desc id="norm-d">Three tables. Users holds user_id, name, and email, with a note that Mickey's email lives here once. Songs holds song_id, title, artist, and genre, with a note that Taylor Swift lives here once. Listens at the bottom holds listen_id, user_id, song_id, and rating, and two arrows run from its user_id to Users and from its song_id to Songs, the foreign keys. Color key: green is the normalized design; the arrows are foreign keys that point at the one place each fact lives.</desc>
  <defs>
    <marker id="ah-norm" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#059669"/></marker>
  </defs>

  <text x="600" y="40" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">Give each fact one home</text>
  <text x="600" y="64" font-size="14" fill="#6B7280" text-anchor="middle">Each fact is stored once. Listens points to it by key.</text>

  <!-- Users table -->
  <rect x="80" y="92" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
  <rect x="80" y="92" width="300" height="5" rx="2.5" fill="#059669"/>
  <text x="100" y="120" font-size="15" font-weight="700" fill="#059669">Users</text>
  <text x="100" y="145" font-size="12.5" fill="#3F3F46"><tspan font-weight="700">user_id</tspan> (PK) &#183; name &#183; email</text>
  <text x="100" y="170" font-size="12" fill="#6B7280">1 Mickey mickey@ex.com</text>
  <text x="100" y="190" font-size="12" fill="#6B7280">3 Daffy daffy@ex.com</text>
  <text x="100" y="206" font-size="11" fill="#059669" font-style="italic">Mickey's email lives here once</text>

  <!-- Songs table -->
  <rect x="820" y="92" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
  <rect x="820" y="92" width="300" height="5" rx="2.5" fill="#059669"/>
  <text x="840" y="120" font-size="15" font-weight="700" fill="#059669">Songs</text>
  <text x="840" y="145" font-size="12.5" fill="#3F3F46"><tspan font-weight="700">song_id</tspan> (PK) &#183; title &#183; artist &#183; genre</text>
  <text x="840" y="170" font-size="12" fill="#6B7280">1 Evermore Taylor Swift</text>
  <text x="840" y="190" font-size="12" fill="#6B7280">2 Willow Taylor Swift</text>
  <text x="840" y="206" font-size="11" fill="#059669" font-style="italic">Taylor Swift lives here once</text>

  <!-- Listens table -->
  <rect x="430" y="280" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
  <rect x="430" y="280" width="340" height="5" rx="2.5" fill="#059669"/>
  <text x="450" y="308" font-size="15" font-weight="700" fill="#059669">Listens</text>
  <text x="450" y="333" font-size="12.5" fill="#3F3F46"><tspan font-weight="700">listen_id</tspan> (PK)</text>
  <text x="450" y="354" font-size="12.5" fill="#3F3F46"><tspan font-weight="700" fill="#059669">user_id</tspan> (FK) &#183; <tspan font-weight="700" fill="#059669">song_id</tspan> (FK) &#183; rating</text>
  <text x="450" y="378" font-size="11" fill="#6B7280" font-style="italic">just the events, pointing by key</text>

  <!-- FK arrows -->
  <path d="M 470 333 C 360 333, 230 280, 230 216" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-norm)"/>
  <path d="M 730 333 C 850 333, 970 280, 970 216" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ah-norm)"/>

  <text x="600" y="416" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = the normalized design &#183; arrows are foreign keys pointing at the one place each fact lives.</tspan></text>
</svg>
