<svg viewBox="0 0 1180 380" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="tr-t tr-d">
  <title id="tr-t">Three routes to one query</title>
  <desc id="tr-d">Three ways to resolve the forks, all reaching the same query.
  Push: you write every fork into an English spec. Pull: the model interviews
  you, one clarifying question per fork. Write SQL: you write the query
  directly, which is precise by construction because every fork is a syntactic
  choice. All three converge on one query, Query B, returning {Pluto}; the SQL
  route is the shortcut. Color key: blue is the SQL shortcut and the single
  destination query.</desc>

  <defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="590" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Three routes to one query</text>
  <text x="590" y="56" text-anchor="middle" font-size="16" fill="#3F3F46">Push, pull, or write the SQL. Same destination; SQL is the shortcut.</text>

  <!-- destination -->
  <rect x="940" y="150" width="210" height="100" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <text x="1045" y="186" text-anchor="middle" font-size="17" font-weight="700" fill="#0E0E10">One query</text>
  <text x="1045" y="212" text-anchor="middle" font-size="15" fill="#3F3F46">Query B</text>
  <text x="1045" y="234" text-anchor="middle" font-size="14" fill="#6B7280">result: {Pluto}</text>

  <!-- Push lane -->
  <rect x="40" y="102" width="72" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="76" y="124" text-anchor="middle" font-size="14" fill="#0E0E10">You</text>
  <line x1="116" y1="120" x2="166" y2="120" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="170" y="96" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="184" y="116" font-size="15" font-weight="700" fill="#0E0E10">Push</text>
  <text x="184" y="135" font-size="14" fill="#3F3F46">write every fork into an English spec</text>
  <line x1="490" y1="120" x2="936" y2="178" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Pull lane -->
  <rect x="40" y="182" width="72" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="76" y="204" text-anchor="middle" font-size="14" fill="#0E0E10">Model</text>
  <line x1="116" y1="200" x2="166" y2="200" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="170" y="176" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="184" y="196" font-size="15" font-weight="700" fill="#0E0E10">Pull</text>
  <text x="184" y="215" font-size="14" fill="#3F3F46">it interviews you, one question per fork</text>
  <line x1="490" y1="200" x2="936" y2="200" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Write SQL lane -->
  <rect x="40" y="262" width="72" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="76" y="284" text-anchor="middle" font-size="14" fill="#0E0E10">You</text>
  <line x1="116" y1="280" x2="166" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="170" y="256" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="170" y="256" width="320" height="4" rx="2" fill="#60A5FA"/>
  <text x="184" y="280" font-size="15" font-weight="700" fill="#60A5FA">Write SQL</text>
  <text x="184" y="297" font-size="14" fill="#3F3F46">every fork is a syntactic choice</text>
  <line x1="490" y1="280" x2="936" y2="222" stroke="#6B7280" stroke-width="2" marker-end="url(#ah)"/>

  <text x="590" y="340" text-anchor="middle" font-size="15" fill="#3F3F46">The English routes only reconstruct what the SQL states outright.</text>
  <text x="590" y="368" text-anchor="middle" font-size="14"><tspan fill="#60A5FA" font-weight="700">blue</tspan><tspan fill="#3F3F46" dx="5">= the SQL shortcut and the one query all three routes reach</tspan></text>
</svg>
