<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="wc-t wc-d"><title id="wc-t">Three reasons CTEs are first-class</title><desc id="wc-d">Readable named blocks, optimizer can reason about each block on its own, and recursion lets a CTE reference itself to walk hierarchies.</desc><rect x="0" y="0" width="1180" height="360" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Why databases made CTEs first-class</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Not just sugar for subqueries. Three real wins.</text><g data-step="1"><rect x="70" y="110" width="350" height="180" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="110" width="350" height="6" rx="3" fill="#2563EB"/><circle cx="108" cy="158" r="18" fill="#2563EB"/><text x="108" y="164" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="140" y="164" font-size="17" font-weight="800" fill="#2563EB" text-anchor="start">Readable</text><text x="94" y="202" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">Each step is a named block,</text><text x="94" y="226" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">read top to bottom, not</text><text x="94" y="250" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">inside-out.</text></g><g data-step="2"><rect x="450" y="110" width="350" height="180" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="450" y="110" width="350" height="6" rx="3" fill="#7C3AED"/><circle cx="488" cy="158" r="18" fill="#7C3AED"/><text x="488" y="164" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="520" y="164" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="start">Optimizer-friendly</text><text x="474" y="202" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">The engine can reason about</text><text x="474" y="226" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">and optimize each named</text><text x="474" y="250" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">block on its own.</text></g><g data-step="3"><rect x="830" y="110" width="350" height="180" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="830" y="110" width="350" height="6" rx="3" fill="#475569"/><circle cx="868" cy="158" r="18" fill="#475569"/><text x="868" y="164" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="900" y="164" font-size="17" font-weight="800" fill="#475569" text-anchor="start">Recursion</text><text x="854" y="202" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">A CTE can reference itself:</text><text x="854" y="226" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">walk org charts, trees, and</text><text x="854" y="250" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">dependency graphs.</text></g></svg>
