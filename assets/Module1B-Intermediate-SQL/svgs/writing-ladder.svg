<svg viewBox="0 0 1180 392" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="writing-ladder-t writing-ladder-d"><title id="writing-ladder-t">The Ladder pattern: top 3 songs per genre via ROW_NUMBER</title><desc id="writing-ladder-d">A ladder of Pop songs numbered by plays; ranks 1 to 3 kept on the top rungs, rank 4 cut below the line, paired with ROW_NUMBER() OVER (PARTITION BY genre ORDER BY plays DESC) &lt;= 3.</desc><rect x="0" y="0" width="1180" height="392" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The Ladder: top N within each group</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Number the rows per group; climb from rank 1, keep the top rungs.</text><line x1="70" y1="108" x2="70" y2="344" stroke="#9AA0AA" stroke-width="5" stroke-linecap="round"/><line x1="510" y1="108" x2="510" y2="344" stroke="#9AA0AA" stroke-width="5" stroke-linecap="round"/><rect x="66" y="120" width="448" height="42" rx="9" fill="#ECF1FE" stroke="#2563EB" stroke-width="1.6"/><circle cx="100" cy="141.0" r="15" fill="#2563EB"/><text x="100" y="146.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="146.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Levitating</text><text x="494" y="146.0" font-size="13" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="end">980</text><rect x="66" y="178" width="448" height="42" rx="9" fill="#ECF1FE" stroke="#2563EB" stroke-width="1.6"/><circle cx="100" cy="199.0" r="15" fill="#2563EB"/><text x="100" y="204.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="204.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Blinding Lights</text><text x="494" y="204.0" font-size="13" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="end">900</text><rect x="66" y="236" width="448" height="42" rx="9" fill="#ECF1FE" stroke="#2563EB" stroke-width="1.6"/><circle cx="100" cy="257.0" r="15" fill="#2563EB"/><text x="100" y="262.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="262.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Stay</text><text x="494" y="262.0" font-size="13" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="end">870</text><rect x="66" y="294" width="448" height="42" rx="9" fill="#FFFFFF" stroke="#9AA0AA" stroke-width="1.6"/><circle cx="100" cy="315.0" r="15" fill="#9AA0AA"/><text x="100" y="320.0" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="130" y="320.0" font-size="14" font-weight="600" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Peaches</text><text x="494" y="320.0" font-size="13" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-anchor="end">410</text><line x1="44" y1="286.0" x2="536" y2="286.0" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,4"/><text x="540" y="290.0" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start">keep rn ≤ 3</text><rect x="620" y="116" width="510" height="244" rx="9" fill="#0D1117"/><text x="642" y="146" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="698" y="146" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">*</text><text x="714" y="146" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="754" y="146" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="658" y="167" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="714" y="167" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song,</text><text x="762" y="167" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">genre,</text><text x="818" y="167" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">plays,</text><text x="674" y="188" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ROW_NUMBER()</text><text x="778" y="188" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="818" y="188" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="690" y="209" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">PARTITION</text><text x="770" y="209" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="794" y="209" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">genre</text><text x="690" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ORDER</text><text x="738" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="762" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">plays</text><text x="810" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">DESC)</text><text x="858" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="882" y="230" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rn</text><text x="658" y="251" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="698" y="251" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">songs)</text><text x="642" y="272" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="690" y="272" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rn</text><text x="714" y="272" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&lt;=</text><text x="738" y="272" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">3</text></svg>
