<svg viewBox="0 0 1180 436" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="debug-checklist-t debug-checklist-d"><title id="debug-checklist-t">A five-point query checklist</title><desc id="debug-checklist-d">Check JOIN row counts, NULL handling, group granularity, aggregate choice, and window partitions.</desc><rect x="0" y="0" width="1180" height="436" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Five things to check on every trace</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Run down the list; each one is a place real queries go wrong.</text><g data-step="1"><rect x="90" y="100" width="1000" height="54" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="90" y="100" width="5" height="54" rx="2.5" fill="#2563EB"/><text x="124" y="134" font-size="16" font-weight="800" fill="#16A34A">&#10003;</text><text x="154" y="134" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">JOINs</text><text x="300" y="134" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Expected row count? Not accidentally cartesian? INNER vs LEFT vs OUTER?</text></g><g data-step="2"><rect x="90" y="164" width="1000" height="54" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="90" y="164" width="5" height="54" rx="2.5" fill="#2563EB"/><text x="124" y="198" font-size="16" font-weight="800" fill="#16A34A">&#10003;</text><text x="154" y="198" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">NULLs</text><text x="300" y="198" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Handled correctly? IS NULL, not = NULL? NOT IN guarded against NULLs?</text></g><g data-step="3"><rect x="90" y="228" width="1000" height="54" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="90" y="228" width="5" height="54" rx="2.5" fill="#2563EB"/><text x="124" y="262" font-size="16" font-weight="800" fill="#16A34A">&#10003;</text><text x="154" y="262" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Groups</text><text x="300" y="262" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Right granularity? Grouped by user, or by user and genre?</text></g><g data-step="4"><rect x="90" y="292" width="1000" height="54" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="90" y="292" width="5" height="54" rx="2.5" fill="#2563EB"/><text x="124" y="326" font-size="16" font-weight="800" fill="#16A34A">&#10003;</text><text x="154" y="326" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Aggregates</text><text x="300" y="326" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Makes sense? COUNT(*) counts rows; COUNT(column) skips NULLs.</text></g><g data-step="5"><rect x="90" y="356" width="1000" height="54" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="90" y="356" width="5" height="54" rx="2.5" fill="#2563EB"/><text x="124" y="390" font-size="16" font-weight="800" fill="#16A34A">&#10003;</text><text x="154" y="390" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Windows</text><text x="300" y="390" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Partitions correct? RANK vs ROW_NUMBER vs DENSE_RANK on ties?</text></g></svg>
