<svg viewBox="0 0 1180 330" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="why-debug-t why-debug-d"><title id="why-debug-t">Why hand-trace a query</title><desc id="why-debug-d">LLMs miss semantics; interviews ask if a query is correct; a 5-minute trace beats a 30-minute re-prompt loop.</desc><rect x="0" y="0" width="1180" height="330" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Why hand-trace at all?</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">A syntax check passes a wrong query. A trace catches it.</text><g data-step="1"><rect x="70" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="110" width="350" height="6" rx="3" fill="#2563EB"/><text x="94" y="156" font-size="16" font-weight="800" fill="#2563EB" text-anchor="start">LLMs miss semantics</text><text x="94" y="190" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Syntax: 95%+ correct.</text><text x="94" y="214" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Semantics: 16-82% (BIRD).</text><text x="94" y="238" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">A query can parse and still</text><text x="94" y="262" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">be logically wrong.</text></g><g data-step="2"><rect x="450" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="450" y="110" width="350" height="6" rx="3" fill="#7C3AED"/><text x="474" y="156" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="start">Interviews and tests</text><text x="474" y="190" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">"Is this query correct?" is</text><text x="474" y="214" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">the classic question.</text><text x="474" y="238" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Reading the logic is what</text><text x="474" y="262" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">gets you hired.</text></g><g data-step="3"><rect x="830" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="830" y="110" width="350" height="6" rx="3" fill="#475569"/><text x="854" y="156" font-size="16" font-weight="800" fill="#475569" text-anchor="start">It is faster</text><text x="854" y="190" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Re-prompting an LLM: ~30 min.</text><text x="854" y="214" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Drawing one debug table: ~5.</text><text x="854" y="238" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">And you build real SQL</text><text x="854" y="262" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">intuition along the way.</text></g></svg>
