<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="wt-t wt-d"><title id="wt-t">ROW_NUMBER, RANK and DENSE_RANK on a tie</title><desc id="wt-d">Four rows sorted by rating with two tied 4.5s. ROW_NUMBER is 1,2,3,4. RANK is 1,1,3,4 (skips after the tie). DENSE_RANK is 1,1,2,3 (no gap).</desc><rect x="0" y="0" width="1180" height="400" fill="#FBFBFC"/><text x="590.0" y="40" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Three ways to rank, when there is a tie</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Mickey's listens by rating, plus a hypothetical second 4.5. The functions agree until the tie.</text><g><rect x="120" y="110" width="940" height="242" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="120" y="110" width="940" height="42" rx="11" fill="#F4F4F6"/><rect x="120" y="140" width="940" height="12" fill="#F4F4F6"/><line x1="120" y1="152" x2="1060" y2="152" stroke="#D4D7DC" stroke-width="1.5"/><rect x="120" y="152" width="6" height="200" fill="#2563EB"/><rect x="126" y="152" width="934" height="100" fill="#ECF1FE"/><line x1="132" y1="202" x2="1048" y2="202" stroke="#D4D7DC" stroke-width="0.6"/><line x1="132" y1="252" x2="1048" y2="252" stroke="#D4D7DC" stroke-width="0.6"/><line x1="132" y1="302" x2="1048" y2="302" stroke="#D4D7DC" stroke-width="0.6"/><text x="215" y="137" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">rating</text><text x="215" y="183.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">4.5</text><text x="215" y="233.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">4.5</text><text x="215" y="283.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">4.2</text><text x="215" y="333.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">3.9</text></g><g data-step="1"><text x="450" y="137" font-size="12" font-weight="700" fill="#6B7280" text-anchor="middle">ROW_NUMBER</text><text x="450" y="183.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">1</text><text x="450" y="233.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">2</text><text x="450" y="283.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">3</text><text x="450" y="333.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">4</text><text x="450" y="378" font-size="11.5" font-weight="600" fill="#6B7280" text-anchor="middle">never ties</text></g><g data-step="2"><text x="685" y="137" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">RANK</text><text x="685" y="183.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">1</text><text x="685" y="233.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">1</text><text x="685" y="283.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">3</text><text x="685" y="333.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">4</text><text x="685" y="378" font-size="11.5" font-weight="600" fill="#D97706" text-anchor="middle">shares 1, then SKIPS to 3 (a gap)</text></g><g data-step="3"><text x="920" y="137" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">DENSE_RANK</text><text x="920" y="183.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">1</text><text x="920" y="233.0" font-size="16" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">1</text><text x="920" y="283.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">2</text><text x="920" y="333.0" font-size="16" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">3</text><text x="920" y="378" font-size="11.5" font-weight="600" fill="#2563EB" text-anchor="middle">shares 1, stays PACKED at 2 (no gap)</text></g></svg>
