<svg viewBox="0 0 1180 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="openai-readwrite-t openai-readwrite-d"><g><rect x="0" y="0" width="1180" height="430" fill="#FBFBFC"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#6B7280"/></marker></defs><text x="590.0" y="46" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">One question: one write, then hundreds of reads</text><text x="590.0" y="72" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Every ChatGPT turn saves one message, then re-reads the whole conversation for context.</text><rect x="70" y="150" width="230" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="150" width="230" height="5" rx="2.5" fill="#EA580C"/><text x="185.0" y="191.0" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="middle">1 WRITE</text><text x="185.0" y="211.0" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">save the new message</text><path d="M310,195 h70" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#a)"/><text x="345" y="182" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">then</text><rect x="400" y="150" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="400" y="150" width="620" height="5" rx="2.5" fill="#2563EB"/><rect x="409" y="159" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="409" y="159" width="620" height="5" rx="2.5" fill="#2563EB"/><rect x="418" y="168" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="418" y="168" width="620" height="5" rx="2.5" fill="#2563EB"/><rect x="427" y="177" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="427" y="177" width="620" height="5" rx="2.5" fill="#2563EB"/><rect x="436" y="186" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="436" y="186" width="620" height="5" rx="2.5" fill="#2563EB"/><rect x="445" y="195" width="620" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="445" y="195" width="620" height="5" rx="2.5" fill="#2563EB"/><text x="755" y="200" font-size="16" font-weight="800" fill="#0E0E10" text-anchor="middle">HUNDREDS OF READS</text><text x="755" y="221" font-size="11.5" font-weight="400" fill="#6B7280" text-anchor="middle">fetch history, load the sidebar, build the LLM context</text><text x="590.0" y="360" font-size="14.5" font-weight="700" fill="#2563EB" text-anchor="middle">Reads are the bottleneck, not writes. So scale reads.</text></g><title id="openai-readwrite-t">openai readwrite</title><desc id="openai-readwrite-d">One ChatGPT question is one write, orange, to save the new message, then hundreds of reads, blue, to fetch the history and build context. Color key: orange = the single write, blue = the many reads, the bottleneck.</desc></svg>
