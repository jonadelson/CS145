<svg viewBox="0 0 1120 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="amb-t amb-d" style="width:100%;height:auto;">
  <title id="amb-t">One English question, two different answers</title>
  <desc id="amb-d">An LLM turns the plain-English request "find the users who don't listen to Taylor Swift" into SQL, but the words allow two readings. The strict reading, never played a Taylor song, returns just Pluto. The broad reading, doesn't listen to only Taylor, returns all four users (Mickey, Minnie, Daffy, Pluto). The model commits to one silently. The fix: pin it with a precise prompt or by writing the SQL yourself, then verify the rows. Color key: blue is the strict reading, orange is the broad reading.</desc>

  <g class="step">
    <text x="560" y="38" font-size="26" font-weight="700" fill="#0E0E10" text-anchor="middle">One English question. Two different answers.</text>
    <text x="560" y="64" font-size="15" fill="#6B7280" text-anchor="middle">An LLM turns your words into SQL, but the words do not say which query you meant.</text>
  </g>

  <!-- the prompt -->
  <g class="step">
    <rect x="300" y="86" width="520" height="54" rx="10" fill="#F4F4F6" stroke="#D4D7DC"/>
    <text x="560" y="118" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">"find the users who don't listen to Taylor Swift"</text>
  </g>

  <!-- split arrows (stroke-drawn) -->
  <path d="M 480 142 L 300 188" fill="none" stroke="#6B7280" stroke-width="1.6"/>
  <path d="M 640 142 L 820 188" fill="none" stroke="#6B7280" stroke-width="1.6"/>

  <!-- Strict reading (blue) -->
  <g class="step">
    <rect x="70" y="192" width="470" height="252" rx="12" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="70" y="192" width="470" height="6" rx="3" fill="#2563EB"/>
    <text x="94" y="232" font-size="13" font-weight="700" fill="#2563EB" font-family="JetBrains Mono, monospace">STRICT READING</text>
    <text x="94" y="262" font-size="20" font-weight="700" fill="#0E0E10">never played a Taylor song</text>
    <text x="94" y="296" font-size="14" fill="#6B7280">Returns the users with zero Taylor listens:</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="94" y="312" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#D4D7DC"/><text x="140" y="334" fill="#D4D7DC" text-decoration="line-through">Mickey</text>
      <rect x="196" y="312" width="86" height="34" rx="17" fill="#FFFFFF" stroke="#D4D7DC"/><text x="239" y="334" fill="#D4D7DC" text-decoration="line-through">Minnie</text>
      <rect x="292" y="312" width="80" height="34" rx="17" fill="#FFFFFF" stroke="#D4D7DC"/><text x="332" y="334" fill="#D4D7DC" text-decoration="line-through">Daffy</text>
      <rect x="382" y="312" width="78" height="34" rx="17" fill="#2563EB"/><text x="421" y="334" fill="#FFFFFF">Pluto</text>
    </g>
    <text x="94" y="402" font-size="28" font-weight="700" fill="#2563EB">just Pluto</text>
    <text x="94" y="426" font-size="14" fill="#6B7280">1 user</text>
  </g>

  <!-- Broad reading (orange) -->
  <g class="step">
    <rect x="580" y="192" width="470" height="252" rx="12" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="580" y="192" width="470" height="6" rx="3" fill="#EA580C"/>
    <text x="604" y="232" font-size="13" font-weight="700" fill="#EA580C" font-family="JetBrains Mono, monospace">BROAD READING</text>
    <text x="604" y="262" font-size="20" font-weight="700" fill="#0E0E10">doesn't listen to only Taylor</text>
    <text x="604" y="296" font-size="14" fill="#6B7280">Returns everyone who isn't a Taylor-only listener:</text>
    <g font-size="14" font-weight="600" text-anchor="middle">
      <rect x="604" y="312" width="92" height="34" rx="17" fill="#EA580C"/><text x="650" y="334" fill="#FFFFFF">Mickey</text>
      <rect x="706" y="312" width="86" height="34" rx="17" fill="#EA580C"/><text x="749" y="334" fill="#FFFFFF">Minnie</text>
      <rect x="802" y="312" width="80" height="34" rx="17" fill="#EA580C"/><text x="842" y="334" fill="#FFFFFF">Daffy</text>
      <rect x="892" y="312" width="78" height="34" rx="17" fill="#EA580C"/><text x="931" y="334" fill="#FFFFFF">Pluto</text>
    </g>
    <text x="604" y="402" font-size="28" font-weight="700" fill="#EA580C">all four users</text>
    <text x="604" y="426" font-size="14" fill="#6B7280">4 users</text>
  </g>

  <!-- resolution strip -->
  <g class="step">
    <rect x="70" y="468" width="980" height="58" rx="12" fill="#0E0E10"/>
    <text x="96" y="503" font-size="16" fill="#FFFFFF"><tspan font-weight="700">The model picks one, silently.</tspan>  Pin it with a precise prompt, or write the SQL yourself, then <tspan font-weight="700" fill="#34D399">verify the rows.</tspan></text>
  </g>

  <g class="step">
    <text x="560" y="548" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = the strict reading, just Pluto &#160;&#183;&#160; </tspan><tspan fill="#EA580C" font-weight="700">orange</tspan><tspan fill="#3F3F46"> = the broad reading, all four</tspan></text>
  </g>
</svg>
