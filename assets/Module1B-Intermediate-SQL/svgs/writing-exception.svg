<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="writing-exception-t writing-exception-d"><title id="writing-exception-t">The Exception pattern: flag the listen spike with LAG</title><desc id="writing-exception-d">A scatter of daily listens sitting near a normal band, with Thursday spiking to 310, a 138 percent jump, circled in red, paired with LAG(listens) and a percent-change &gt; 50 filter.</desc><rect x="0" y="0" width="1180" height="400" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The Exception: find the outlier</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">LAG the previous value, compute the jump, keep only the spikes.</text><line x1="90" y1="326" x2="530" y2="326" stroke="#6B7280" stroke-width="1.5"/><line x1="90" y1="110" x2="90" y2="326" stroke="#6B7280" stroke-width="1.5"/><text x="82" y="104" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">daily listens</text><line x1="90" y1="246" x2="520" y2="246" stroke="#9AA0AA" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/><text x="534" y="249.7058823529412" font-size="11" font-weight="400" fill="#6B7280" text-anchor="start">normal</text><circle cx="90" cy="264" r="5.5" fill="#9AA0AA"/><text x="90.0" y="350" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Mon</text><text x="90.0" y="368" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">100</text><circle cx="233" cy="252" r="5.5" fill="#9AA0AA"/><text x="233.33333333333334" y="237.88235294117646" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">+20%</text><text x="233.33333333333334" y="350" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Tue</text><text x="233.33333333333334" y="368" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">120</text><circle cx="377" cy="246" r="5.5" fill="#9AA0AA"/><text x="376.6666666666667" y="231.7058823529412" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">+8%</text><text x="376.6666666666667" y="350" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Wed</text><text x="376.6666666666667" y="368" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">130</text><circle cx="520" cy="135" r="12" fill="none" stroke="#DC2626" stroke-width="2.5"/><circle cx="520" cy="135" r="6.5" fill="#DC2626"/><text x="520.0" y="114.52941176470588" font-size="13" font-weight="800" fill="#DC2626" text-anchor="middle">+138% spike</text><text x="520.0" y="350" font-size="12" font-weight="400" fill="#6B7280" text-anchor="middle">Thu</text><text x="520.0" y="368" font-size="11" font-weight="600" fill="#3F3F46" text-anchor="middle">310</text><rect x="620" y="120" width="510" height="230" rx="9" fill="#0D1117"/><text x="642" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WITH</text><text x="682" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">changes</text><text x="746" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="770" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="658" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="714" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song_id,</text><text x="786" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">date,</text><text x="834" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listens,</text><text x="674" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">LAG(listens)</text><text x="778" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="818" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="690" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">PARTITION</text><text x="770" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="794" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song_id</text><text x="690" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ORDER</text><text x="738" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="762" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">date)</text><text x="810" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="834" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">prev</text><text x="658" y="255" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="698" y="255" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">daily_listens)</text><text x="642" y="276" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="698" y="276" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">*</text><text x="714" y="276" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="754" y="276" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">changes</text><text x="642" y="297" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="690" y="297" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(listens-prev)*100/prev</text><text x="882" y="297" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&gt;</text><text x="898" y="297" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">50</text></svg>
