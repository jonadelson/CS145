<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="writing-comparison-t writing-comparison-d"><title id="writing-comparison-t">The Comparison pattern: plays minus the genre average</title><desc id="writing-comparison-d">Bars for three Pop artists against a dashed genre-average line, two above and one below, paired with plays - AVG(plays) OVER (PARTITION BY genre).</desc><rect x="0" y="0" width="1180" height="360" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The Comparison: a row against its group average</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Subtract the group's AVG, computed over the partition, from each row.</text><rect x="70" y="167" width="96" height="133" rx="5" fill="#2563EB"/><text x="118.0" y="320" font-size="12" font-weight="600" fill="#0E0E10" text-anchor="middle">Dua Lipa</text><text x="118.0" y="158.66666666666669" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle">+700</text><rect x="208" y="192" width="96" height="108" rx="5" fill="#2563EB"/><text x="256.0" y="320" font-size="12" font-weight="600" fill="#0E0E10" text-anchor="middle">Doja Cat</text><text x="256.0" y="183.66666666666669" font-size="13" font-weight="800" fill="#16A34A" text-anchor="middle">+100</text><rect x="346" y="229" width="96" height="71" rx="5" fill="#9AA0AA"/><text x="394.0" y="320" font-size="12" font-weight="600" fill="#0E0E10" text-anchor="middle">Sia</text><text x="394.0" y="221.16666666666669" font-size="13" font-weight="800" fill="#DC2626" text-anchor="middle">-800</text><line x1="60" y1="196" x2="472" y2="196" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,4"/><text x="478" y="199.83333333333334" font-size="12" font-weight="700" fill="#6B7280" text-anchor="start">genre avg</text><rect x="620" y="120" width="510" height="170" rx="9" fill="#0D1117"/><text x="642" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="698" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">artist_name,</text><text x="802" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">genre,</text><text x="858" y="150" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">plays,</text><text x="658" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">plays</text><text x="706" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">-</text><text x="722" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">AVG(plays)</text><text x="810" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="850" y="171" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="674" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">PARTITION</text><text x="754" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="778" y="192" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">genre</text><text x="658" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">)</text><text x="674" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="698" y="213" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">vs_avg</text><text x="642" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="682" y="234" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">artist_stats</text></svg>
