<svg viewBox="0 0 1180 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="wo-t wo-d"><title id="wo-t">The OVER clause makes a function a window function</title><desc id="wo-d">AVG(rating) collapses like GROUP BY. AVG(rating) OVER (PARTITION BY user_id) is a window function: one value per row, all rows kept. Any aggregate plus LAG and LEAD work in a window.</desc><rect x="0" y="0" width="1180" height="380" fill="#FBFBFC"/><text x="590.0" y="42" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">What makes it a window? The OVER clause.</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">The same aggregate collapses without OVER, and keeps every row with it.</text><g data-step="1"><rect x="90" y="120" width="560" height="64" rx="9" fill="#0D1117"/><rect x="90" y="120" width="5" height="64" rx="2.5" fill="#9AA0AA"/><text x="116" y="158.0" font-size="17" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">AVG(rating)</text><text x="680" y="148" font-size="15" font-weight="800" fill="#9AA0AA" text-anchor="start">GROUP BY style</text><text x="680" y="170" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">collapses to one row per group</text></g><g data-step="2"><rect x="90" y="210" width="560" height="64" rx="9" fill="#0D1117"/><rect x="90" y="210" width="5" height="64" rx="2.5" fill="#16A34A"/><text x="116" y="248.0" font-size="17" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">AVG(rating)</text><text x="238.39999999999998" y="248.0" font-size="17" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="289.4" y="248.0" font-size="17" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">(PARTITION</text><text x="401.59999999999997" y="248.0" font-size="17" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="432.2" y="248.0" font-size="17" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id)</text><text x="680" y="238" font-size="15" font-weight="800" fill="#16A34A" text-anchor="start">window function</text><text x="680" y="260" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">one value per row, all rows kept</text><text x="590.0" y="322" font-size="13.5" font-weight="600" fill="#6B7280" text-anchor="middle">Any aggregate works in a window, plus LAG and LEAD to see the previous or next row.</text></g></svg>
