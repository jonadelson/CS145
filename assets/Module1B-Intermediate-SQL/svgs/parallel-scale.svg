<svg viewBox="0 0 1180 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="parallel-scale-t parallel-scale-d"><rect x="0" y="0" width="1180" height="430" fill="#FBFBFC"/><defs><marker id="sc" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#0E0E10"/></marker></defs><text x="590.0" y="44" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Same query, a billion times the data</text><text x="590.0" y="70" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Scale up by a factor of a billion without rewriting one line of SQL.</text><rect x="60" y="108" width="510" height="250" rx="12" fill="#F4F4F6" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="108" width="510" height="6" rx="3" fill="#6B7280"/><text x="86" y="148" font-size="17" font-weight="800" fill="#6B7280" text-anchor="start">SQLite, one machine</text><text x="86" y="174" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Single-threaded, a small table:</text><rect x="86" y="198" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="220" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">9 rows on your laptop</text><rect x="86" y="242" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="264" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">one core, start to finish</text><text x="86" y="340" font-size="12.5" font-weight="700" fill="#6B7280" text-anchor="start">Runs the whole query alone.</text><rect x="610" y="108" width="510" height="250" rx="12" fill="#ECF1FE" stroke="#D4D7DC" stroke-width="1.5"/><rect x="610" y="108" width="510" height="6" rx="3" fill="#2563EB"/><text x="636" y="148" font-size="17" font-weight="800" fill="#2563EB" text-anchor="start">BigQuery, ~100 machines</text><text x="636" y="174" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">The same SQL, distributed:</text><rect x="636" y="198" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="220" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5.5 TB across the cluster</text><rect x="636" y="242" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="264" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">each machine takes a slice</text><text x="636" y="340" font-size="12.5" font-weight="700" fill="#2563EB" text-anchor="start">Same answer, back in milliseconds.</text><path d="M575,233 h30" fill="none" stroke="#0E0E10" stroke-width="2" marker-end="url(#sc)"/><text x="590.0" y="392" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Same algorithm. Only the data layout changes.</text><title id="parallel-scale-t">parallel scale</title><desc id="parallel-scale-d">The same SQL query runs on one SQLite machine over a tiny table, or across about 100 BigQuery machines over 5.5 TB, returning the same answer in milliseconds.</desc></svg>
