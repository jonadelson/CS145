<svg viewBox="0 0 1180 450" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="window-mistakes-t window-mistakes-d"><title id="window-mistakes-t">Three common window-function mistakes</title><desc id="window-mistakes-d">Missing PARTITION BY ranks the whole table; wrong ORDER BY direction flips the ranking; NULL ordering varies by database.</desc><rect x="0" y="0" width="1180" height="450" fill="#FBFBFC"/><text x="590.0" y="42" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Three ways window queries go wrong</text><text x="590.0" y="67" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">All three are silent: the query runs, the answer is just wrong.</text><g data-step="1"><rect x="70" y="100" width="1040" height="92" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="100" width="5" height="92" rx="2.5" fill="#DC2626"/><circle cx="114" cy="146.0" r="20" fill="#DC2626"/><text x="114" y="153.0" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="152" y="140" font-size="17" font-weight="800" fill="#DC2626" text-anchor="start">Missing PARTITION BY</text><text x="152" y="168" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Leave it out and you rank across the WHOLE table, not per group. One global #1, not one per user.</text></g><g data-step="2"><rect x="70" y="210" width="1040" height="92" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="210" width="5" height="92" rx="2.5" fill="#DC2626"/><circle cx="114" cy="256.0" r="20" fill="#DC2626"/><text x="114" y="263.0" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="152" y="250" font-size="17" font-weight="800" fill="#DC2626" text-anchor="start">Wrong ORDER BY direction</text><text x="152" y="278" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">ASC vs DESC flips the ranking. Highest-first needs DESC, or your #1 is your worst row.</text></g><g data-step="3"><rect x="70" y="320" width="1040" height="92" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="320" width="5" height="92" rx="2.5" fill="#DC2626"/><circle cx="114" cy="366.0" r="20" fill="#DC2626"/><text x="114" y="373.0" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text><text x="152" y="360" font-size="17" font-weight="800" fill="#DC2626" text-anchor="start">Forgetting NULLs in ORDER BY</text><text x="152" y="388" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">NULLs sort first or last depending on the database (Postgres first, MySQL last). Be explicit.</text></g></svg>
