<svg viewBox="0 0 1180 432" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="vcl-t vcl-d">
  <title id="vcl-t">Verified blocks compose into a library</title>
  <desc id="vcl-d">Three columns of SQL blocks (blue), each marked verified with
  a green check. Base metrics on the left (active user, Taylor listener) feed
  composed queries in the middle (weekly actives, non-Taylor listeners), which
  feed a complex query on the right (weekly active non-Taylor listeners). Arrows
  run left to right showing composition: each query is built from blocks already
  checked, so a new query only adds its own layer to verify. Color key: blue is
  a SQL block in the library, the green check is verified once and then reused,
  arrows are composition.</desc>
  <defs><marker id="ah-vcl" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="590" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Verified blocks compose into a library</text>
  <text x="590" y="56" text-anchor="middle" font-size="16" fill="#3F3F46">Check each query once. Bigger queries build on blocks already verified.</text>

  <!-- Base metrics -->
  <g data-step="1">
    <text x="205" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0E0E10">Base metrics</text>
    <rect x="100" y="128" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="100" y="128" width="4" height="64" rx="2" fill="#60A5FA"/>
    <text x="124" y="166" font-size="16" font-weight="700" fill="#16A34A">&#10003;</text>
    <text x="146" y="166" font-size="16" font-weight="700" fill="#0E0E10">active user</text>
    <rect x="100" y="278" width="210" height="64" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="100" y="278" width="4" height="64" rx="2" fill="#60A5FA"/>
    <text x="124" y="316" font-size="16" font-weight="700" fill="#16A34A">&#10003;</text>
    <text x="146" y="316" font-size="16" font-weight="700" fill="#0E0E10">Taylor listener</text>
  </g>

  <!-- Composed -->
  <g data-step="2">
    <text x="555" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0E0E10">Composed</text>
    <rect x="450" y="128" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="450" y="128" width="4" height="64" rx="2" fill="#60A5FA"/>
    <text x="474" y="166" font-size="16" font-weight="700" fill="#16A34A">&#10003;</text>
    <text x="496" y="166" font-size="16" font-weight="700" fill="#0E0E10">weekly actives</text>
    <rect x="450" y="278" width="220" height="64" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="450" y="278" width="4" height="64" rx="2" fill="#60A5FA"/>
    <text x="474" y="316" font-size="16" font-weight="700" fill="#16A34A">&#10003;</text>
    <text x="496" y="316" font-size="16" font-weight="700" fill="#0E0E10">non-Taylor listeners</text>
    <line x1="310" y1="160" x2="448" y2="160" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-vcl)"/>
    <line x1="310" y1="310" x2="448" y2="310" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-vcl)"/>
  </g>

  <!-- Complex -->
  <g data-step="3">
    <text x="940" y="100" text-anchor="middle" font-size="17" font-weight="700" fill="#0E0E10">Complex query</text>
    <rect x="800" y="165" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="800" y="165" width="4" height="90" rx="2" fill="#60A5FA"/>
    <text x="824" y="203" font-size="16" font-weight="700" fill="#16A34A">&#10003;</text>
    <text x="846" y="203" font-size="16" font-weight="700" fill="#0E0E10">weekly active</text>
    <text x="846" y="225" font-size="16" font-weight="700" fill="#0E0E10">non-Taylor listeners</text>
    <line x1="670" y1="160" x2="798" y2="198" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-vcl)"/>
    <line x1="670" y1="310" x2="798" y2="224" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-vcl)"/>
  </g>

  <!-- Color key -->
  <text x="590" y="408" text-anchor="middle" font-size="14"><tspan fill="#60A5FA" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = a SQL block in the library&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#16A34A" font-weight="700">&#10003;</tspan><tspan fill="#3F3F46"> = verified once, then reused&#160;&#160;&#183;&#160;&#160;arrows = composition</tspan></text>
</svg>
