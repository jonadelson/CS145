 layers, read inside-out</title><desc id="reading-trace-2-d">Per-user metrics, then a percentile rank, then the top-half filter. The table transforms clause by clause; rows the final clause drops are greyed and struck through, survivors carry a green check. Color key: grey strike = a dropped row, green check = a surviving row.</desc></svg>
