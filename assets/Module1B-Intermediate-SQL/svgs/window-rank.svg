<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="wr-t wr-d"><title id="wr-t">RANK in three steps: partition, order, assign</title><desc id="wr-d">The RANK query, then three side-by-side tables: PARTITION BY makes three lanes, ORDER BY rating DESC sorts each lane with NULL last, and the rank column numbers each lane from one.</desc><defs><marker id="ra" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1180" height="560" fill="#FBFBFC"/><text x="590.0" y="40" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">RANK in three steps: partition, order, number</text><text x="590.0" y="65" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">The same query expansion, side by side. Each clause does one thing.</text><rect x="120" y="95" width="940" height="108" rx="9" fill="#0D1117"/><text x="142" y="123" font-size="13.5" font-family="ui-monospace, monospace" fill="#8B949E" font-style="italic" xml:space="preserve">-- Rank each user's listens by rating, highest first.</text><text x="142" y="144" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="198" y="144" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id,</text><text x="270" y="144" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song_id,</text><text x="342" y="144" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rating,</text><text x="142" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve"></text><text x="150" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve"></text><text x="158" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">RANK()</text><text x="214" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="254" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">(PARTITION</text><text x="342" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="366" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="430" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ORDER</text><text x="478" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="502" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rating</text><text x="558" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">DESC)</text><text x="606" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="630" y="165" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">rank</text><text x="142" y="186" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="182" y="186" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><g data-step="1"><text x="180.0" y="218" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle">Step 1: PARTITION BY user_id</text><rect x="40" y="230" width="280" height="266" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="40" y="230" width="280" height="32" rx="9" fill="#F4F4F6"/><rect x="40" y="253" width="280" height="9" fill="#F4F4F6"/><line x1="40" y1="262" x2="320" y2="262" stroke="#D4D