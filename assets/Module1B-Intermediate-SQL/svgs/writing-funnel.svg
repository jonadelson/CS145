<svg viewBox="0 0 1180 372" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="writing-funnel-t writing-funnel-d"><title id="writing-funnel-t">The Funnel pattern: keep listeners, subtract sharers</title><desc id="writing-funnel-d">A funnel narrowing from played 1000 to playlist 450 to shared 87, paired with a SELECT ... WHERE user_id IN (listens) AND user_id NOT IN (shares) query.</desc><rect x="0" y="0" width="1180" height="372" fill="#FBFBFC"/><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The Funnel: who did A but not B</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Each stage keeps fewer rows. The shape narrows.</text><polygon points="142,118 518,118 448,190 212,190" fill="#60A5FA" opacity="1.0" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="150.0" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Played</text><text x="50" y="170.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="start">1,000</text><text x="330" y="159.0" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1,000</text><polygon points="212,190 448,190 392,262 268,262" fill="#60A5FA" opacity="0.84" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="222.0" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Made a playlist</text><text x="50" y="242.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="start">450</text><text x="330" y="231.0" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">450</text><text x="466" y="230.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">dropped 550</text><polygon points="268,262 392,262 354,334 306,334" fill="#60A5FA" opacity="0.6799999999999999" stroke="#FFFFFF" stroke-width="2"/><text x="50" y="294.0" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Shared</text><text x="50" y="314.0" font-size="14" font-weight="800" fill="#2563EB" text-anchor="start">87</text><text x="330" y="303.0" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">87</text><text x="410" y="302.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">dropped 363</text><rect x="620" y="130" width="510" height="175" rx="9" fill="#0D1117"/><text x="642" y="160" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="698" y="160" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id,</text><text x="770" y="160" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">name</text><text x="642" y="181" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="682" y="181" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">users</text><text x="642" y="202" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="690" y="202" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="754" y="202" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">IN</text><text x="706" y="223" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">(SELECT</text><text x="770" y="223" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="834" y="223" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="874" y="223" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listens)</text><text x="658" y="244" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AND</text><text x="690" y="244" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="754" y="244" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NOT</text><text x="786" y="244" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">IN</text><text x="706" y="265" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">(SELECT</text><text x="770" y="265" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="834" y="265" font-size="13.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="874" y="265" font-size="13.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">shares)</text></svg>
