<svg viewBox="0 0 1180 432" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ec-t ec-d"><rect x="0" y="0" width="1180" height="432" fill="#FBFBFC"/><text x="590.0" y="42" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Two queries can agree today and disagree tomorrow</text><text x="590.0" y="67" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">That is the difference between output equivalence and real query equivalence.</text><g data-step="1"><rect x="60" y="110" width="510" height="300" rx="12" fill="#ECF1FE" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="110" width="510" height="6" rx="3" fill="#2563EB"/><text x="86" y="150" font-size="17" font-weight="800" fill="#2563EB" text-anchor="start">Query equivalence</text><text x="86" y="178" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Same result for ANY input.</text><rect x="86" y="206" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="228" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">WHERE x BETWEEN 1 AND 5</text><rect x="86" y="248" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="270" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">WHERE x &gt;= 1 AND x &lt;= 5</text><rect x="610" y="110" width="510" height="300" rx="12" fill="#FDEBE0" stroke="#D4D7DC" stroke-width="1.5"/><rect x="610" y="110" width="510" height="6" rx="3" fill="#D97706"/><text x="636" y="150" font-size="17" font-weight="800" fill="#D97706" text-anchor="start">Output equivalence</text><text x="636" y="178" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Same result for THIS data only.</text><rect x="636" y="206" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="228" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">WHERE rating &gt; 4.5</text><rect x="636" y="248" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="270" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">WHERE rating &gt;= 4.6</text></g><g data-step="2"><text x="636" y="330" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">Tomorrow a row rates 4.55:</text><text x="636" y="351" font-size="12.5" font-weight="700" fill="#0E0E10" text-anchor="start">&gt; 4.5 keeps it,  &gt;= 4.6 drops it.</text><text x="636" y="392" font-size="14" font-weight="800" fill="#D97706" text-anchor="start">They split. A coincidence.</text></g><g data-step="3"><text x="86" y="330" font-size="12.5" font-weight="400" fill="#3F3F46" text-anchor="start">Any x, any table: the two are identical.</text><text x="86" y="372" font-size="14" font-weight="800" fill="#2563EB" text-anchor="start">Always the same. A guarantee.</text></g><title id="ec-t">Query equivalence vs output equivalence</title><desc id="ec-d">Query equivalence holds for any input and is a guarantee; output equivalence holds only for the current data and is a coincidence that can break on a new row: WHERE rating greater than 4.5 and rating at least 4.6 agree until a row rates 4.55, then they split.</desc></svg>
