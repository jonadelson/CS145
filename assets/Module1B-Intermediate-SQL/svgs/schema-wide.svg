<svg viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="wide-t wide-d">
  <title id="wide-t">One big table repeats itself</title>
  <desc id="wide-d">Left: a single wide table holding listen_id, name, email, title, artist, and rating. Mickey's email is copied on all three of his rows (highlighted amber), and the artist Taylor Swift is copied on row after row (highlighted amber). Right: three red cards naming the anomalies this repetition causes. Update: Mickey changes his email, so you must fix every Mickey row and will miss one. Insert: a brand-new song nobody has played has no listen row to live on. Delete: removing Mickey's last listen deletes his email too. Color key: amber marks a fact copied many times; red marks the three anomalies that repetition causes.</desc>

  <text x="600" y="40" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">One big table repeats itself</text>
  <text x="600" y="64" font-size="14" fill="#6B7280" text-anchor="middle">Put every column in one table and the same facts appear over and over.</text>

  <!-- wide table -->
  <text x="40" y="100" font-size="13" font-weight="700" fill="#DC2626">Listens, one wide table</text>
  <!-- header -->
  <g font-size="12" font-weight="700" fill="#3F3F46">
    <rect x="40" y="110" width="600" height="28" fill="#F4F4F6" stroke="#D4D7DC"/>
    <text x="70"  y="129" text-anchor="middle">listen_id</text>
    <text x="165" y="129" text-anchor="middle">name</text>
    <text x="300" y="129" text-anchor="middle">email</text>
    <text x="430" y="129" text-anchor="middle">title</text>
    <text x="540" y="129" text-anchor="middle">artist</text>
    <text x="615" y="129" text-anchor="middle">rating</text>
  </g>
  <!-- vertical guides -->
  <g stroke="#D4D7DC" stroke-width="1">
    <line x1="100" y1="110" x2="100" y2="278"/><line x1="230" y1="110" x2="230" y2="278"/>
    <line x1="370" y1="110" x2="370" y2="278"/><line x1="490" y1="110" x2="490" y2="278"/><line x1="590" y1="110" x2="590" y2="278"/>
  </g>
  <!-- amber highlight columns: email (Mickey rows) + artist (Taylor Swift) -->
  <rect x="230" y="138" width="140" height="84" fill="#FDEBE0"/>
  <rect x="490" y="138" width="100" height="28" fill="#FDEBE0"/>
  <rect x="490" y="166" width="100" height="28" fill="#FDEBE0"/>
  <rect x="490" y="222" width="100" height="28" fill="#FDEBE0"/>
  <rect x="490" y="250" width="100" height="28" fill="#FDEBE0"/>
  <!-- rows -->
  <g font-size="12" fill="#3F3F46" text-anchor="middle">
    <text x="70" y="157">1</text><text x="165" y="157">Mickey</text><text x="300" y="157">mickey@ex.com</text><text x="430" y="157">Evermore</text><text x="540" y="157">Taylor Swift</text><text x="615" y="157">4.5</text>
    <text x="70" y="185">2</text><text x="165" y="185">Mickey</text><text x="300" y="185">mickey@ex.com</text><text x="430" y="185">Willow</text><text x="540" y="185">Taylor Swift</text><text x="615" y="185">4.2</text>
    <text x="70" y="213">3</text><text x="165" y="213">Mickey</text><text x="300" y="213">mickey@ex.com</text><text x="430" y="213">Yesterday</text><text x="540" y="213">Beatles</text><text x="615" y="213">3.9</text>
    <text x="70" y="241">7</text><text x="165" y="241">Daffy</text><text x="300" y="241">daffy@ex.com</text><text x="430" y="241">Evermore</text><text x="540" y="241">Taylor Swift</text><text x="615" y="241">2.9</text>
    <text x="70" y="269">8</text><text x="165" y="269">Daffy</text><text x="300" y="269">daffy@ex.com</text><text x="430" y="269">Willow</text><text x="540" y="269">Taylor Swift</text><text x="615" y="269">4.9</text>
  </g>
  <g stroke="#D4D7DC" stroke-width="1"><line x1="40" y1="166" x2="640" y2="166"/><line x1="40" y1="194" x2="640" y2="194"/><line x1="40" y1="222" x2="640" y2="222"/><line x1="40" y1="250" x2="640" y2="250"/></g>
  <rect x="40" y="138" width="600" height="140" fill="none" stroke="#D4D7DC"/>
  <!-- repetition callouts -->
  <text x="300" y="298" font-size="11.5" fill="#D97706" text-anchor="middle" font-weight="700">Mickey's email, copied on all 3 rows</text>
  <text x="540" y="298" font-size="11.5" fill="#D97706" text-anchor="middle" font-weight="700">one artist, copied again and again</text>

  <!-- anomaly cards -->
  <text x="680" y="100" font-size="13" font-weight="700" fill="#DC2626">What repetition costs you</text>
  <g>
    <rect x="680" y="110" width="480" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="680" y="110" width="5" height="50" rx="2.5" fill="#DC2626"/>
    <text x="700" y="132" font-size="13" font-weight="700" fill="#DC2626">Update</text>
    <text x="760" y="132" font-size="12.5" fill="#3F3F46">Mickey changes his email. Fix every Mickey row,</text>
    <text x="760" y="150" font-size="12.5" fill="#3F3F46">miss one, and now one person has two emails.</text>
  </g>
  <g>
    <rect x="680" y="172" width="480" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="680" y="172" width="5" height="50" rx="2.5" fill="#DC2626"/>
    <text x="700" y="194" font-size="13" font-weight="700" fill="#DC2626">Insert</text>
    <text x="760" y="194" font-size="12.5" fill="#3F3F46">Add a brand-new song nobody has played yet.</text>
    <text x="760" y="212" font-size="12.5" fill="#3F3F46">There is no listen row to hang it on.</text>
  </g>
  <g>
    <rect x="680" y="234" width="480" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="680" y="234" width="5" height="50" rx="2.5" fill="#DC2626"/>
    <text x="700" y="256" font-size="13" font-weight="700" fill="#DC2626">Delete</text>
    <text x="760" y="256" font-size="12.5" fill="#3F3F46">Delete Mickey's last listen and his email</text>
    <text x="760" y="274" font-size="12.5" fill="#3F3F46">disappears with it. The fact had nowhere else to live.</text>
  </g>

  <text x="600" y="330" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#D97706" font-weight="700">amber</tspan><tspan fill="#3F3F46"> = a fact copied many times &#183; </tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = the anomalies that repetition causes.</tspan></text>
</svg>
