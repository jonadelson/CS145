<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="parallel-abstraction-t parallel-abstraction-d"><rect x="0" y="0" width="1180" height="470" fill="#FBFBFC"/><defs><marker id="ab" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#6B7280"/></marker></defs><text x="590.0" y="44" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">One statement you write, a choreography that runs</text><text x="590.0" y="70" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">The abstraction holds because the algorithms are the same.</text><text x="70" y="150" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">What you write</text><rect x="70" y="165" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="165" width="5" height="70" rx="2.5" fill="#2563EB"/><text x="250.0" y="196.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">one SQL statement</text><text x="250.0" y="216.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">SELECT ... GROUP BY ... LIMIT 10</text><path d="M440,200 h253" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ab)"/><rect x="700" y="165" width="240" height="70" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="700" y="165" width="5" height="70" rx="2.5" fill="#16A34A"/><text x="820.0" y="196.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">one result</text><text x="820.0" y="216.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">top 10 songs</text><text x="70" y="312" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">What actually runs</text><rect x="70" y="328" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="328" width="5" height="78" rx="2.5" fill="#2563EB"/><text x="195.0" y="363.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">split the table</text><text x="195.0" y="383.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">by hash key</text><rect x="355" y="328" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="355" y="328" width="5" height="78" rx="2.5" fill="#16A34A"/><text x="480.0" y="363.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">100 shards</text><text x="480.0" y="383.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">run in parallel</text><path d="M320,367 h28" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ab)"/><rect x="640" y="328" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="640" y="328" width="5" height="78" rx="2.5" fill="#D97706"/><text x="765.0" y="363.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">shuffle + merge</text><text x="765.0" y="383.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">combine partials</text><path d="M605,367 h28" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ab)"/><rect x="925" y="328" width="250" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="925" y="328" width="5" height="78" rx="2.5" fill="#16A34A"/><text x="1050.0" y="363.0" font-size="13.5" font-weight="700" fill="#0E0E10" text-anchor="middle">result</text><text x="1050.0" y="383.0" font-size="11" font-weight="400" fill="#6B7280" text-anchor="middle">global top 10</text><path d="M890,367 h28" fill="none" stroke="#6B7280" stroke-width="1.8" marker-end="url(#ab)"/><title id="parallel-abstraction-t">parallel abstraction</title><desc id="parallel-abstraction-d">A developer writes one SQL statement and gets one result; underneath, the engine splits the table into shards, runs them in parallel, then shuffles and merges the partial results.</desc></svg>
