ospace, monospace" fill="#79c0ff" xml:space="preserve">IS</text><text x="264" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NOT</text><text x="292" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NULL</text><text x="326" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">)</text><text x="50" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="98" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">*</text><text x="112" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="147" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">ranked</text><text x="195" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="236" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rn</text><text x="257" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&lt;=</text><text x="278" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">3</text><text x="292" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#8B949E" font-style="italic" xml:space="preserve">--  top 3</text><text x="603.0" y="78" font-size="12.5" font-weight="800" fill="#7C3AED" text-anchor="start">Subquery: count how many rate higher</text><rect x="601.0" y="86" width="543.0" height="141" rx="9" fill="#0D1117"/><rect x="601.0" y="86" width="543.0" height="4" rx="2" fill="#7C3AED"/><text x="615" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="663" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">*</text><text x="677" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="712" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="767" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l</text><text x="615" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="656" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l.rating</text><text x="718" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">IS</text><text x="739" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NOT</text><text x="767" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NULL</text><text x="801" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AND</text><text x="829" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="629" y="149.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="677" y="149.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">COUNT(*)</text><text x="739" y="149.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="774" y="149.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="829" y="149.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l2</text><text x="629" y="165.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="670" y="165.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l2.user_id</text><text x="746" y="165.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">=</text><text x="760" y="165.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l.user_id</text><text x="643" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AND</text><text x="670" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l2.rating</text><text x="739" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&gt;</text><text x="753" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">l.rating</text><text x="815" y="182.0" font-size="11.5" font-family="ui-monospace, monospace" fill="#8B949E" font-style="italic" xml:space="preserve">--  count higher</text><text x="615" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">)</text><text x="629" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&lt;</text><text x="643" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">3</text><text x="656" y="198.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#8B949E" font-style="italic" xml:space="preserve">--  fewer than 3 rate higher</text></g><g data-step="2"><text x="590.0" y="265" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Mickey's songs by rating:</text><rect x="216.0" y="293" width="748" height="150" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="216.0" y="293" width="748" height="30" rx="9" fill="#F4F4F6"/><rect x="216.0" y="314" width="748" height="9" fill="#F4F4F6"/><line x1="216.0" y1="323" x2="964.0" y2="323" stroke="#D4D7DC" stroke-width="1.4"/><text x="232.0" y="313" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><text x="324.0" y="313" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">ROW_NUMBER</text><text x="472.0" y="313" font-size="10.5" font-weight="700" fill="#6B7280" text-anchor="start">songs rated higher</text><text x="668.0" y="313" font-size="10.5" font-weight="700" fill="#2563EB" text-anchor="start">A: rn &lt;= 3</text><text x="800.0" y="313" font-size="10.5" font-weight="700" fill="#7C3AED" text-anchor="start">B: # higher &lt; 3</text><text x="232.0" y="342.0" font-size="13" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><text x="324.0" y="342.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="472.0" y="342.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">0</text><text x="668.0" y="342.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="800.0" y="342.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><line x1="224.0" y1="353" x2="956.0" y2="353" stroke="#D4D7DC" stroke-width="0.4"/><text x="232.0" y="372.0" font-size="13" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><text x="324.0" y="372.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="472.0" y="372.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="668.0" y="372.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="800.0" y="372.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><line x1="224.0" y1="383" x2="956.0" y2="383" stroke="#D4D7DC" stroke-width="0.4"/><text x="232.0" y="402.0" font-size="13" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><text x="324.0" y="402.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="472.0" y="402.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="668.0" y="402.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="800.0" y="402.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="590.0" y="481" font-size="14" font-weight="700" fill="#16A34A" text-anchor="middle">On distinct ratings, both queries keep all three. They agree.</text></g><g data-step="3"><rect x="217.0" y="413" width="746" height="30" fill="#FBE3EE"/><line x1="224.0" y1="413" x2="956.0" y2="413" stroke="#D4D7DC" stroke-width="0.4"/><text x="232.0" y="432.0" font-size="13" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><text x="324.0" y="432.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4</text><text x="472.0" y="432.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="668.0" y="432.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">✗</text><text x="800.0" y="432.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="976.0" y="432.0" font-size="11.5" font-weight="700" fill="#DB2777" text-anchor="start">← the extra tuple</text><text x="590.0" y="508" font-size="14.5" font-weight="800" fill="#0E0E10" text-anchor="middle">Add one more rated 3.9, tying for 3rd:   ROW_NUMBER &lt;= 3 keeps 3,   COUNT(higher) &lt; 3 keeps 4.</text><text x="590.0" y="531" font-size="12.5" font-weight="400" fill="#6B7280" text-anchor="middle">Rank 4 to ROW_NUMBER (dropped), but still only 2 rate higher (kept). The tie at the cutoff is where they split.</text></g><title id="equiv-top-songs-t">Top 3 per user: output-equivalent but not the same query</title><desc id="equiv-top-songs-d">Two queries for each user top 3 songs: ROW_NUMBER() less-equal 3, and a correlated subquery keeping songs with fewer than 3 rated higher. On distinct ratings both keep 3. Add one more song rated 3.9, tying for third: ROW_NUMBER assigns it rank 4 and drops it (3 rows), but only 2 songs rate higher than 3.9 so the subquery keeps it (4 rows). The tie at the cutoff is where they diverge.</desc></svg>
