<svg viewBox="0 0 1180 553" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="equiv-top-songs-t equiv-top-songs-d"><rect x="0" y="0" width="1180" height="553" fill="#FBFBFC"/><text x="590.0" y="38" font-size="20" font-weight="800" fill="#0E0E10" text-anchor="middle">Output-equivalent, not the same query: each user's top 3 songs</text><text x="590.0" y="62" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Both rank a song within its user. On distinct ratings they agree; one extra tied song splits them.</text><g data-step="1"><text x="38" y="78" font-size="12.5" font-weight="800" fill="#2563EB" text-anchor="start">Window: ROW_NUMBER() &lt;= 3</text><rect x="36" y="86" width="543.0" height="141" rx="9" fill="#0D1117"/><rect x="36" y="86" width="543.0" height="4" rx="2" fill="#2563EB"/><text x="50" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WITH</text><text x="84" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">ranked</text><text x="133" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="154" y="116" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="64" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="112" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">*,</text><text x="133" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">ROW_NUMBER()</text><text x="222" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OVER</text><text x="257" y="132.5" font-size="11.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="78" y="1