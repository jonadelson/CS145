<svg viewBox="0 0 1180 446" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="execution-catches-misses-t execution-catches-misses-d"><rect x="0" y="0" width="1180" height="446" fill="#FBFBFC"/><text x="590.0" y="44" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Execution catches the mechanics, never the meaning</text><text x="590.0" y="70" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">The engine checks what runs. It has no opinion about what you meant.</text><g data-step="1"><rect x="60" y="108" width="510" height="300" rx="12" fill="#E1F4EC" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="108" width="510" height="6" rx="3" fill="#16A34A"/><text x="86" y="148" font-size="17" font-weight="800" fill="#16A34A" text-anchor="start">Catches, for free</text><text x="86" y="174" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Mechanical errors, the instant it runs:</text><rect x="86" y="198" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="220" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">a column that does not exist</text><rect x="86" y="242" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="264" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">a type that does not match</text><rect x="86" y="286" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="100" y="308" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">a join that returns 0 rows</text><text x="86" y="390" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="start">The model reads the error and fixes it.</text></g><g data-step="2"><rect x="610" y="108" width="510" height="300" rx="12" fill="#FDEBE0" stroke="#D4D7DC" stroke-width="1.5"/><rect x="610" y="108" width="510" height="6" rx="3" fill="#D97706"/><text x="636" y="148" font-size="17" font-weight="800" fill="#D97706" text-anchor="start">Cannot catch</text><text x="636" y="174" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">A query that runs but means the wrong thing:</text><rect x="636" y="198" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="220" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">"active users" counts the wrong thing</text><rect x="636" y="242" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="264" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">a clean number, quietly guessed</text><rect x="636" y="286" width="458" height="34" rx="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/><text x="650" y="308" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">runs straight through</text><text x="636" y="390" font-size="12.5" font-weight="700" fill="#D97706" text-anchor="start">Runs is not the same as right. Verify next.</text></g><title id="execution-catches-misses-t">execution catches misses</title><desc id="execution-catches-misses-d">Execution catches mechanical errors (missing column, type mismatch, empty join) for free, but cannot catch a query that runs cleanly and counts the wrong thing.</desc></svg>
