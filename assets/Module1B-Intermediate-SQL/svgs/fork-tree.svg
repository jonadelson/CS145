<svg viewBox="0 0 1180 410" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="ft-t ft-d">
  <title id="ft-t">Every fork multiplies the queries</title>
  <desc id="ft-d">One ambiguous question splits at three independent forks:
  inner versus LEFT JOIN, whether a NULL counts, and rows versus DISTINCT. A
  binary fork doubles the queries, so three binary forks make eight that all run.
  A fork with more than two options, like a join that can be inner, left, right,
  or full, makes even more, so the count is at least 2 to the k. The spec traces
  one blue path down to the single query you meant, returning {Pluto}; the other
  seven leaves stay grey. Color key: blue is the one path the spec picks, grey is
  the queries you did not mean.</desc>

  <text x="590" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Every fork multiplies the queries</text>
  <text x="590" y="56" text-anchor="middle" font-size="16" fill="#3F3F46">One question, three independent choices, eight queries that all run</text>

  <!-- root -->
  <rect x="580" y="78" width="320" height="40" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <text x="740" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Users who don't listen to Taylor</text>

  <!-- grey edges -->
  <g stroke="#D4D7DC" stroke-width="1.5" fill="none">
    <path d="M740 148 L958 200"/>
    <path d="M524 200 L415 255"/>
    <path d="M958 200 L849 255"/>
    <path d="M958 200 L1066 255"/>
    <path d="M415 255 L360 300"/>
    <path d="M415 255 L469 300"/>
    <path d="M632 255 L577 300"/>
    <path d="M849 255 L794 300"/>
    <path d="M849 255 L903 300"/>
    <path d="M1066 255 L1011 300"/>
    <path d="M1066 255 L1120 300"/>
  </g>

  <!-- blue path -->
  <g stroke="#60A5FA" stroke-width="2.5" fill="none">
    <path d="M740 118 L740 148"/>
    <path d="M740 148 L524 200"/>
    <path d="M524 200 L632 255"/>
    <path d="M632 255 L686 300"/>
  </g>

  <!-- fork level labels -->
  <text x="24" y="180" font-size="14"><tspan font-weight="700" fill="#0E0E10">Fork 1</tspan><tspan dx="12" fill="#3F3F46">inner vs LEFT JOIN</tspan></text>
  <text x="24" y="234" font-size="14"><tspan font-weight="700" fill="#0E0E10">Fork 2</tspan><tspan dx="12" fill="#3F3F46">does a NULL count?</tspan></text>
  <text x="24" y="288" font-size="14"><tspan font-weight="700" fill="#0E0E10">Fork 3</tspan><tspan dx="12" fill="#3F3F46">rows vs DISTINCT?</tspan></text>

  <!-- 7 grey leaves -->
  <g fill="#F4F4F6" stroke="#D4D7DC" stroke-width="1">
    <rect x="314" y="300" width="92" height="30" rx="6"/>
    <rect x="423" y="300" width="92" height="30" rx="6"/>
    <rect x="531" y="300" width="92" height="30" rx="6"/>
    <rect x="748" y="300" width="92" height="30" rx="6"/>
    <rect x="857" y="300" width="92" height="30" rx="6"/>
    <rect x="965" y="300" width="92" height="30" rx="6"/>
    <rect x="1074" y="300" width="92" height="30" rx="6"/>
  </g>

  <!-- blue chosen leaf -->
  <rect x="640" y="300" width="92" height="30" rx="6" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <text x="686" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">{Pluto}</text>

  <text x="590" y="362" text-anchor="middle" font-size="15" fill="#3F3F46">Three binary forks make eight queries. k forks make at least 2^k, and they all run.</text>
  <text x="590" y="392" text-anchor="middle" font-size="14"><tspan fill="#60A5FA" font-weight="700">blue</tspan><tspan fill="#3F3F46" dx="5">= the one path the spec picks   ·</tspan><tspan fill="#6B7280" font-weight="700" dx="8">grey</tspan><tspan fill="#3F3F46" dx="5">= the queries you did not mean</tspan></text>
</svg>
