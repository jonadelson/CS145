<svg viewBox="0 0 1180 448" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="et-t et-d"><g><rect x="0" y="0" width="1180" height="448" fill="#FBFBFC"/><text x="590.0" y="52" font-size="23" font-weight="800" fill="#0E0E10" text-anchor="middle">Same answer today is not the same query</text><text x="590.0" y="82" font-size="14.5" font-weight="400" fill="#6B7280" text-anchor="middle">Real equivalence holds for every future input, not just the rows you can see today.</text><rect x="150" y="132" width="880" height="84" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="150" y="132" width="6" height="84" rx="3" fill="#2563EB"/><circle cx="196" cy="174.0" r="18" fill="#ECF1FE"/><text x="196" y="180.0" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle">1</text><text x="234" y="166" font-size="16" font-weight="800" fill="#0E0E10" text-anchor="start">Holds for ANY input</text><text x="234" y="192" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Equivalent means they agree on every possible table, not only the one in front of you.</text><rect x="150" y="234" width="880" height="84" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="150" y="234" width="6" height="84" rx="3" fill="#2563EB"/><circle cx="196" cy="276.0" r="18" fill="#ECF1FE"/><text x="196" y="282.0" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle">2</text><text x="234" y="268" font-size="16" font-weight="800" fill="#0E0E10" text-anchor="start">Edges are where they split</text><text x="234" y="294" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">NULLs, ties, and boundary values are exactly where look-alike queries quietly diverge.</text><rect x="150" y="336" width="880" height="84" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="150" y="336" width="6" height="84" rx="3" fill="#2563EB"/><circle cx="196" cy="378.0" r="18" fill="#ECF1FE"/><text x="196" y="384.0" font-size="18" font-weight="800" fill="#2563EB" text-anchor="middle">3</text><text x="234" y="370" font-size="16" font-weight="800" fill="#0E0E10" text-anchor="start">Read first, trust the optimizer</text><text x="234" y="396" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">When the logic matches, pick the clearest shape and let the optimizer make it fast.</text></g><title id="et-t">Same answer today is not the same query</title><desc id="et-d">Real query equivalence holds for any input: equivalent queries agree on every possible table; NULLs, ties, and edge values are where look-alike queries diverge; when the logic matches, pick the clearest shape and trust the optimizer.</desc></svg>
