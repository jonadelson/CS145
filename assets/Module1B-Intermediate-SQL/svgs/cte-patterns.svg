<svg viewBox="0 0 1180 360" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="cp-t cp-d"><title id="cp-t">CTE common patterns and performance notes</title><desc id="cp-d">A CTE names a result you can reference several times instead of repeating a subquery; index the base-table columns its result joins on; and whether the engine computes the CTE once (MATERIALIZED, a reused temp result) or inlines it into the query and may re-run it depends on the database.</desc><rect x="0" y="0" width="1180" height="360" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Common patterns and performance notes</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">A CTE names a result. Whether the engine computes it once or re-runs it depends on the engine.</text><g data-step="1"><rect x="70" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="110" width="350" height="6" rx="3" fill="#2563EB"/><text x="94" y="158" font-size="16" font-weight="800" fill="#2563EB" text-anchor="start">A reusable named step</text><text x="94" y="196" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">WITH gives a result a name. Reference</text><text x="94" y="220" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">it several times in one query, instead</text><text x="94" y="244" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">of repeating the same subquery.</text></g><g data-step="2"><rect x="450" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="450" y="110" width="350" height="6" rx="3" fill="#7C3AED"/><text x="474" y="158" font-size="16" font-weight="800" fill="#7C3AED" text-anchor="start">Index the join keys</text><text x="474" y="196" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">A CTE result joins back on source</text><text x="474" y="220" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">columns, so index those base-table</text><text x="474" y="244" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">columns to keep the join fast.</text></g><g data-step="3"><rect x="830" y="110" width="350" height="190" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="830" y="110" width="350" height="6" rx="3" fill="#475569"/><text x="854" y="158" font-size="16" font-weight="800" fill="#475569" text-anchor="start">Materialized or inlined</text><text x="854" y="196" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">Computed once, or re-run? It depends.</text><text x="854" y="220" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">MATERIALIZED keeps it as a reused</text><text x="854" y="244" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">temp result. Without that, engines</text><text x="854" y="268" font-size="13.5" font-weight="400" fill="#3F3F46" text-anchor="start">may inline the CTE and push filters in.</text></g></svg>
