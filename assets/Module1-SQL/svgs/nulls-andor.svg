<svg viewBox="0 0 1180 575" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="nulls-andor-t nulls-andor-d"><title id="nulls-andor-t">One NULL row: TRUE AND UNKNOWN drops it, TRUE OR UNKNOWN keeps it</title><desc id="nulls-andor-d">One NULL row: TRUE AND UNKNOWN drops it, TRUE OR UNKNOWN keeps it Color key: green TRUE, red FALSE, grey NULL/UNKNOWN.</desc><rect x="0" y="0" width="1180" height="575" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Same row, two operators, two fates</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Daffy's row, run through AND on the left and OR on the right. The operator decides whether the NULL survives.</text><rect x="60" y="105" width="500" height="430" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="105" width="500" height="6" rx="3" fill="#DC2626"/><text x="84" y="142" font-size="20" font-weight="800" fill="#DC2626" text-anchor="start">AND</text><rect x="84" y="158" width="452" height="104" rx="8" fill="#0D1117"/><text x="102" y="186" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="161" y="186" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">name</text><text x="102" y="208" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="144" y="208" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="102" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="152" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="220" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">=</text><text x="236" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">3</text><text x="152" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AND</text><text x="186" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rating</text><text x="245" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&gt;</text><text x="262" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">4</text><rect x="620" y="105" width="500" height="430" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="620" y="105" width="500" height="6" rx="3" fill="#16A34A"/><text x="644" y="142" font-size="20" font-weight="800" fill="#16A34A" text-anchor="start">OR</text><rect x="644" y="158" width="452" height="104" rx="8" fill="#0D1117"/><text x="662" y="186" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="721" y="186" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">name</text><text x="662" y="208" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="704" y="208" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="662" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">WHERE</text><text x="712" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="780" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">=</text><text x="796" y="230" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">3</text><text x="712" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">OR</text><text x="738" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rating</text><text x="796" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">&gt;</text><text x="813" y="252" font-size="14" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">4</text><g data-step="1"><text x="88" y="300" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">user_id = 3 ?</text><text x="225" y="300" font-size="13" font-weight="800" fill="#16A34A" text-anchor="start">TRUE</text><text x="88" y="326" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">rating &gt; 4 ?</text><text x="225" y="326" font-size="13" font-weight="800" fill="#6B7280" text-anchor="start">UNKNOWN</text><text x="648" y="300" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">user_id = 3 ?</text><text x="785" y="300" font-size="13" font-weight="800" fill="#16A34A" text-anchor="start">TRUE</text><text x="648" y="326" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">rating &gt; 4 ?</text><text x="785" y="326" font-size="13" font-weight="800" fill="#6B7280" text-anchor="start">UNKNOWN</text></g><g data-step="2"><text x="88" y="372" font-size="15" font-weight="700" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#16A34A">TRUE</tspan><tspan fill="#0E0E10"> AND </tspan><tspan fill="#6B7280">UNKNOWN</tspan><tspan fill="#0E0E10"> = </tspan><tspan fill="#DC2626" font-weight="800">UNKNOWN</tspan></text><rect x="84" y="398" width="452" height="44" rx="8" fill="#FAFAFA" stroke="#D4D7DC" stroke-width="1.2"/><rect x="84" y="398" width="5" height="44" rx="2.5" fill="#DC2626"/><text x="104" y="425.0" font-size="13" font-weight="400" fill="#6B7280" font-family="ui-monospace, monospace" text-decoration="line-through" text-anchor="start">Daffy   user_id = 3   rating = NULL</text><text x="520" y="425.0" font-size="12" font-weight="800" fill="#DC2626" text-anchor="end">row dropped</text></g><g data-step="3"><text x="648" y="372" font-size="15" font-weight="700" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#16A34A">TRUE</tspan><tspan fill="#0E0E10"> OR </tspan><tspan fill="#6B7280">UNKNOWN</tspan><tspan fill="#0E0E10"> = </tspan><tspan fill="#16A34A" font-weight="800">TRUE</tspan></text><rect x="644" y="398" width="452" height="44" rx="8" fill="#ECFDF5" stroke="#D4D7DC" stroke-width="1.2"/><rect x="644" y="398" width="5" height="44" rx="2.5" fill="#16A34A"/><text x="664" y="425.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">Daffy   user_id = 3   rating = NULL</text><text x="1080" y="425.0" font-size="12" font-weight="800" fill="#16A34A" text-anchor="end">row kept</text></g></svg>
