<svg viewBox="0 0 1180 461" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="dd-t dd-d"><title id="dd-t">Reading SQL DDL: how the Listens table is defined</title><desc id="dd-d">The CREATE TABLE listens statement, annotated. Each column names a type: INT for the integer ids, DECIMAL(2,1) for a rating like 4.5, TIMESTAMP for the time. PRIMARY KEY marks listen_id as the unique row id; NOT NULL marks a column required, and rating and listen_time omit it so they may be NULL. Two FOREIGN KEY ... REFERENCES clauses tie user_id to a real Users row and song_id to a real Songs row, so the database rejects a listen that points at a user or song that does not exist. Blue annotations in the margin label the type, the primary key, and the foreign keys.</desc><text x="590.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Reading the DDL: how the Listens table is defined</text><text x="590.0" y="72" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">DDL, the Data Definition Language: CREATE TABLE names each column, types it, and states its rules.</text><g data-step="1"><rect x="70" y="116" width="660" height="265" rx="9" fill="#0D1117"/><text x="86.0" y="146" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">CREATE</text><text x="146.9" y="146" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">TABLE</text><text x="199.1" y="146" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listens</text><text x="268.7" y="146" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(</text><text x="103.4" y="171" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listen_id</text><text x="216.5" y="171" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">INT</text><text x="329.6" y="171" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">PRIMARY</text><text x="399.2" y="171" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">KEY,</text><text x="103.4" y="196" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><text x="216.5" y="196" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">INT</text><text x="329.6" y="196" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NOT</text><text x="364.4" y="196" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NULL,</text><text x="103.4" y="221" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song_id</text><text x="216.5" y="221" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">INT</text><text x="329.6" y="221" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NOT</text><text x="364.4" y="221" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">NULL,</text><text x="103.4" y="246" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">rating</text><text x="216.5" y="246" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">DECIMAL(2,1),</text><text x="103.4" y="271" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listen_time</text><text x="216.5" y="271" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">TIMESTAMP,</text><text x="103.4" y="296" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FOREIGN</text><text x="173.0" y="296" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">KEY</text><text x="207.8" y="296" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(user_id)</text><text x="294.8" y="296" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">REFERENCES</text><text x="390.5" y="296" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">users(user_id),</text><text x="103.4" y="321" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FOREIGN</text><text x="173.0" y="321" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">KEY</text><text x="207.8" y="321" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">(song_id)</text><text x="294.8" y="321" font-size="14.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">REFERENCES</text><text x="390.5" y="321" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">songs(song_id)</text><text x="86.0" y="346" font-size="14.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">);</text></g><g data-step="2"><rect x="75" y="154" width="4" height="21" rx="2" fill="#2563EB"/><path d="M730,166 H756" fill="none" stroke="#2563EB" stroke-width="1.4"/><circle cx="730" cy="166" r="3" fill="#2563EB"/><rect x="756" y="148" width="4" height="18" fill="#2563EB"/><text x="770" y="162" font-size="13" font-weight="800" fill="#2563EB" text-anchor="start">PRIMARY KEY</text><text x="770" y="182" font-size="12" font-weight="400" fill="#0E0E10" text-anchor="start">listen_id is the unique id for the row.</text><text x="770" y="199" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">NOT NULL = required; rating / listen_time</text><text x="770" y="216" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">omit it, so those may be NULL.</text></g><g data-step="3"><rect x="75" y="179" width="4" height="96" rx="2" fill="#2563EB"/><path d="M730,241 H756" fill="none" stroke="#2563EB" stroke-width="1.4"/><circle cx="730" cy="241" r="3" fill="#2563EB"/><rect x="756" y="223" width="4" height="18" fill="#2563EB"/><text x="770" y="237" font-size="13" font-weight="800" fill="#2563EB" text-anchor="start">the column's type</text><text x="770" y="257" font-size="12" font-weight="400" fill="#0E0E10" text-anchor="start">DECIMAL(2,1) holds a rating like 4.5.</text><text x="770" y="274" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">INT, TIMESTAMP - every column names one.</text></g><g data-step="4"><rect x="75" y="279" width="4" height="46" rx="2" fill="#2563EB"/><path d="M730,291 H756" fill="none" stroke="#2563EB" stroke-width="1.4"/><circle cx="730" cy="291" r="3" fill="#2563EB"/><rect x="756" y="273" width="4" height="18" fill="#2563EB"/><text x="770" y="287" font-size="13" font-weight="800" fill="#2563EB" text-anchor="start">FOREIGN KEY ... REFERENCES</text><text x="770" y="307" font-size="12" font-weight="400" fill="#0E0E10" text-anchor="start">every user_id must be a real Users row,</text><text x="770" y="324" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">every song_id a real Songs row. The DB</text><text x="770" y="341" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">rejects a listen that points at nobody.</text><text x="590.0" y="431" font-size="13.5" font-weight="600" fill="#6B7280" text-anchor="middle">Users and Songs are defined the same way, just without the foreign keys.</text></g></svg>
