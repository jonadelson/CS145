<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="gm-t gm-d"><title id="gm-t">Multi-column GROUP BY splits one bucket into finer buckets</title><desc id="gm-d">By user_id, Mickey is one bucket of three rows with COUNT three. Adding song_id splits it into three buckets of one row each, COUNT one.</desc><rect x="0" y="0" width="1180" height="470" fill="#FBFBFC"/><defs><marker id="mk" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#0E0E10"/></marker></defs><text x="590.0" y="40" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">More columns, finer buckets</text><text x="590.0" y="66" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Mickey's three listens: one bucket by user_id; add song_id and the bucket splits into three.</text><g data-step="1"><text x="70" y="134" font-size="14" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">GROUP BY user_id</text><rect x="70" y="150" width="360" height="216" rx="11" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="150" width="360" height="6" rx="3" fill="#3b82f6"/><text x="92" y="182" font-size="15" font-weight="800" fill="#3b82f6" text-anchor="start">Mickey</text><text x="190" y="182" font-size="13" font-weight="400" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">user_id = 1</text><line x1="70" y1="194" x2="430" y2="194" stroke="#D4D7DC" stroke-width="1"/><text x="92" y="216" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">song_id</text><text x="210" y="216" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><text x="92" y="242" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="210" y="242" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><line x1="80" y1="262" x2="420" y2="262" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="276" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="210" y="276" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><line x1="80" y1="296" x2="420" y2="296" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="310" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">6</text><text x="210" y="310" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><line x1="70" y1="332" x2="430" y2="332" stroke="#D4D7DC" stroke-width="1"/><text x="92" y="356" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">1 bucket</text><text x="408" y="356" font-size="14" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">COUNT(*) = 3</text></g><g data-step="2"><line x1="460" y1="258.0" x2="550" y2="258.0" stroke="#0E0E10" stroke-width="1.8" marker-end="url(#mk)"/><text x="508" y="244.0" font-size="13" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="middle">+ song_id</text><text x="590" y="134" font-size="14" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">GROUP BY user_id, song_id</text><rect x="590" y="150" width="230" height="70" rx="10" fill="#EFF5FF" stroke="#3b82f6" stroke-width="1.3"/><text x="608" y="178" font-size="15" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="start">(1, 1)</text><text x="608" y="200" font-size="12" font-weight="400" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">rating 4.5</text><text x="804" y="192" font-size="12" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">COUNT(*) = 1</text><rect x="590" y="238" width="230" height="70" rx="10" fill="#EFF5FF" stroke="#3b82f6" stroke-width="1.3"/><text x="608" y="266" font-size="15" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="start">(1, 2)</text><text x="608" y="288" font-size="12" font-weight="400" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">rating 4.2</text><text x="804" y="280" font-size="12" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">COUNT(*) = 1</text><rect x="590" y="326" width="230" height="70" rx="10" fill="#EFF5FF" stroke="#3b82f6" stroke-width="1.3"/><text x="608" y="354" font-size="15" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="start">(1, 6)</text><text x="608" y="376" font-size="12" font-weight="400" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">rating 3.9</text><text x="804" y="368" font-size="12" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">COUNT(*) = 1</text><text x="844" y="277.0" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">3 buckets</text></g></svg>
