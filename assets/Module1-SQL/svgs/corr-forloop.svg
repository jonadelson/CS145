<svg viewBox="0 0 1180 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="fl-t fl-d"><title id="fl-t">A correlated subquery is a double for-loop linking inner and outer</title><desc id="fl-d">Pseudocode of a double for-loop: the outer loop runs once per user u; the inner SELECT AVG runs each pass over Listens l2 WHERE l2.user_id = u.user_id. An arrow links the inner reference u.user_id back to the outer loop variable u: that cross-reference is the correlation. Two scopes: u is the outer scope (current user), l2 is the inner scope (this query's Listens). The inner re-runs once per outer user: Mickey 4.2, Minnie 4.4, Daffy 3.9.</desc><defs><marker id="fl-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#DB2777"/></marker></defs><rect x="0" y="0" width="1180" height="470" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">A correlated subquery is a double for-loop</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">The correlation is the inner query reading a variable scoped to the outer loop.</text><g data-step="1"><rect x="250" y="104" width="600" height="185" rx="8" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="268.0" y="134" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#79c0ff" font-weight="700">for</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">u</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#79c0ff" font-weight="700">in</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">Users</tspan><tspan fill="#E6EDF3">:</tspan></text><text x="301.6" y="157" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#E6EDF3">u_avg</tspan><tspan fill="#E6EDF3"> = (        </tspan><tspan fill="#8B96A6" font-style="italic"># u's own average</tspan></text><text x="335.2" y="180" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#79c0ff" font-weight="700">AVG</tspan><tspan fill="#E6EDF3">(</tspan><tspan fill="#E6EDF3">rating</tspan><tspan fill="#E6EDF3">)</tspan></text><text x="335.2" y="203" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">Listens</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">l2</tspan><tspan fill="#E6EDF3"></tspan></text><text x="335.2" y="226" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">l2</tspan><tspan fill="#E6EDF3">.</tspan><tspan fill="#E6EDF3">user_id</tspan><tspan fill="#E6EDF3"> = </tspan><tspan fill="#E6EDF3">u</tspan><tspan fill="#E6EDF3">.</tspan><tspan fill="#E6EDF3">user_id</tspan><tspan fill="#E6EDF3"></tspan></text><text x="301.6" y="249" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3">)</tspan></text><text x="301.6" y="272" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3"></tspan><tspan fill="#79c0ff" font-weight="700">keep</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">u</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">when</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">u</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">has</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">a</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">rating</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">above</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#E6EDF3">u_avg</tspan><tspan fill="#E6EDF3"></tspan></text></g><g data-step="2"><rect x="297.6" y="119" width="16.4" height="21" rx="4" fill="none" stroke="#DB2777" stroke-width="1.8"/><rect x="490.79999999999995" y="211" width="83.60000000000001" height="21" rx="4" fill="none" stroke="#DB2777" stroke-width="1.8"/><path d="M244,221 C180,221 180,129 244,129" fill="none" stroke="#DB2777" stroke-width="2.4" marker-end="url(#fl-link)"/><text x="172" y="164.0" font-size="12" font-weight="700" fill="#DB2777" text-anchor="end">the inner reads</text><text x="172" y="182.0" font-size="12" font-weight="700" fill="#DB2777" text-anchor="end">the outer's u:</text><text x="172" y="202.0" font-size="12" font-weight="800" fill="#DB2777" text-anchor="end">the correlation</text><text x="900" y="122" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Two scopes, cross-referenced</text><rect x="900" y="138" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#DB2777" stroke-width="1.6"/><text x="911" y="154" font-size="14" font-weight="800" fill="#DB2777" font-family="ui-monospace, monospace" text-anchor="middle">u</text><text x="934" y="148" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">outer scope:</text><text x="934" y="166" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">the current user (outer loop)</text><rect x="900" y="182" width="22" height="22" rx="5" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.6"/><text x="911" y="198" font-size="12" font-weight="800" fill="#0891B2" font-family="ui-monospace, monospace" text-anchor="middle">l2</text><text x="934" y="192" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">inner scope:</text><text x="934" y="210" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">this query's own Listens</text><text x="900" y="246" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="start">The inner WHERE reaches OUT to u,</text><text x="900" y="264" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="start">the outer loop's variable. That</text><text x="900" y="282" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="start">cross-reference is the correlation.</text></g><g data-step="3"><text x="590.0" y="323" font-size="14" font-weight="600" fill="#6B7280" text-anchor="middle">So the inner query re-runs once per outer user, each on their own rows:</text><rect x="104.0" y="345" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="104.0" y="345" width="6" height="52" rx="3" fill="#3b82f6"/><text x="126.0" y="377" font-size="15" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">u = Mickey</text><text x="384.0" y="377" font-size="15" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">AVG = 4.2</text><rect x="440.0" y="345" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="440.0" y="345" width="6" height="52" rx="3" fill="#f97316"/><text x="462.0" y="377" font-size="15" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">u = Minnie</text><text x="720.0" y="377" font-size="15" font-weight="800" fill="#f97316" font-family="ui-monospace, monospace" text-anchor="end">AVG = 4.4</text><rect x="776.0" y="345" width="300" height="52" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="776.0" y="345" width="6" height="52" rx="3" fill="#8b5cf6"/><text x="798.0" y="377" font-size="15" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">u = Daffy</text><text x="1056.0" y="377" font-size="15" font-weight="800" fill="#8b5cf6" font-family="ui-monospace, monospace" text-anchor="end">AVG = 3.9</text></g></svg>
