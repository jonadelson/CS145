<svg viewBox="0 0 1140 486" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ss-t ss-d"><title id="ss-t">A scalar subquery returns one value that the outer query reuses for every row</title><desc id="ss-d">The inner subquery runs once: AVG(rating) over all Listens, skipping the one NULL, gives 4.2 (blue, the single value). The outer query reuses 4.2 to keep every listen rated above it: Mickey 4.5, Minnie 4.7 and 4.6, Daffy 4.9 are kept; Mickey 4.2 is not strictly greater and Daffy's NULL is UNKNOWN, both struck out, leaving 4 rows. Color key: blue = the one scalar value; the per-user bars are identity; grey strike = a dropped row.</desc><defs><marker id="scA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1140" height="486" fill="#FBFBFC"/><text x="570.0" y="44" font-size="23" font-weight="800" fill="#0E0E10" text-anchor="middle">Scalar subquery: one value, reused for every row</text><g data-step="1"><rect x="300" y="70" width="560" height="150" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="318.0" y="98" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> u.name, l.rating</tspan></text><text x="318.0" y="119" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Users u</tspan></text><text x="318.0" y="140" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">JOIN</tspan><tspan fill="#E6EDF3"> Listens l </tspan><tspan fill="#79c0ff" font-weight="700">ON</tspan><tspan fill="#E6EDF3"> u.user_id = l.user_id</tspan></text><text x="318.0" y="161" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> l.rating &gt; (</tspan></text><rect x="345.6" y="167" width="272.40000000000003" height="22" rx="4" fill="#11233F"/><text x="351.6" y="182" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#79c0ff" font-weight="700">AVG</tspan><tspan fill="#E6EDF3">(rating) </tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="318.0" y="203" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3">)</tspan></text></g><g data-step="2"><rect x="70" y="252" width="430" height="196" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="70" y="252" width="430" height="5" rx="2.5" fill="#2563EB"/><text x="92" y="286" font-size="17" font-weight="800" fill="#2563EB" text-anchor="start">Inner subquery, runs once</text><text x="92" y="312" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">AVG(rating) over all Listens</text><text x="92" y="334" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">the one NULL rating is skipped (8 ratings)</text><rect x="188" y="356" width="194" height="56" rx="10" fill="#ECF1FE" stroke="#2563EB" stroke-width="1.6"/><text x="285.0" y="392" font-size="26" font-weight="800" fill="#2563EB" font-family="ui-monospace, monospace" text-anchor="middle">= 4.2</text><path d="M506,350.0 h44" stroke="#6B7280" stroke-width="2.5" marker-end="url(#scA)"/><text x="528" y="338.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">one value,</text><text x="528" y="378.0" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">every row</text></g><g data-step="3"><text x="622" y="240" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Outer query: keep l.rating &gt; 4.2</text><rect x="622" y="250" width="448" height="192" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M631,250 h430 a9,9 0 0 1 9,9 v21 h-448 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="622" y1="280" x2="1070" y2="280" stroke="#D4D7DC" stroke-width="1.5"/><text x="644" y="270" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><text x="772" y="270" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><text x="872" y="270" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">&gt; 4.2 ?</text><rect x="623" y="280" width="5" height="27" fill="#3b82f6"/><text x="644" y="297.5" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Mickey</text><text x="772" y="297.5" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><text x="872" y="297.5" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><rect x="623" y="307" width="5" height="27" fill="#3b82f6"/><line x1="631" y1="307" x2="1061" y2="307" stroke="#D4D7DC" stroke-width="0.6"/><text x="644" y="324.5" font-size="14" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Mickey</text><text x="772" y="324.5" font-size="14" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-decoration="line-through" text-anchor="start">4.2</text><text x="872" y="324.5" font-size="14" font-weight="800" fill="#9AA0AA" text-anchor="start">✗</text><rect x="623" y="334" width="5" height="27" fill="#f97316"/><line x1="631" y1="334" x2="1061" y2="334" stroke="#D4D7DC" stroke-width="0.6"/><text x="644" y="351.5" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="772" y="351.5" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.7</text><text x="872" y="351.5" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><rect x="623" y="361" width="5" height="27" fill="#f97316"/><line x1="631" y1="361" x2="1061" y2="361" stroke="#D4D7DC" stroke-width="0.6"/><text x="644" y="378.5" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="772" y="378.5" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.6</text><text x="872" y="378.5" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><rect x="623" y="388" width="5" height="27" fill="#8b5cf6"/><line x1="631" y1="388" x2="1061" y2="388" stroke="#D4D7DC" stroke-width="0.6"/><text x="644" y="405.5" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Daffy</text><text x="772" y="405.5" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.9</text><text x="872" y="405.5" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><rect x="623" y="415" width="5" height="27" fill="#8b5cf6"/><line x1="631" y1="415" x2="1061" y2="415" stroke="#D4D7DC" stroke-width="0.6"/><text x="644" y="432.5" font-size="14" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Daffy</text><text x="772" y="432.5" font-size="14" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-decoration="line-through" text-anchor="start">NULL</text><text x="872" y="432.5" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">?  UNKNOWN</text><text x="1070" y="468" font-size="20" font-weight="800" fill="#0E0E10" text-anchor="end">4 rows kept</text></g></svg>
