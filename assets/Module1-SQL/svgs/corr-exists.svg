 x2="460" y2="522.0" stroke="#9AA0AA" stroke-width="1.8"/></g><g data-step="4"><text x="150" y="569" font-size="13" font-weight="600" fill="#6B7280" text-anchor="start">The survivors split the users into two complementary sets:</text><text x="150" y="583" font-size="13" font-weight="800" fill="#0E0E10" text-anchor="start">EXISTS keeps  (has a survivor)</text><rect x="150" y="591" width="320" height="84" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><path d="M158,591 h304 a8,8 0 0 1 8,8 v20 h-320 v-20 a8,8 0 0 1 8,-8 z" fill="#F4F5F7"/><line x1="150" y1="619" x2="470" y2="619" stroke="#D4D7DC" stroke-width="1.3"/><text x="182" y="610" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="151" y="619" width="6" height="28" fill="#f97316"/><text x="182" y="638.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text><rect x="151" y="647" width="6" height="28" fill="#8b5cf6"/><line x1="158" y1="647" x2="462" y2="647" stroke="#D4D7DC" stroke-width="0.6"/><text x="182" y="666.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Daffy</text><text x="390" y="583" font-size="13" font-weight="800" fill="#0E0E10" text-anchor="start">NOT EXISTS keeps  (has none)</text><rect x="390" y="591" width="320" height="84" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><path d="M398,591 h304 a8,8 0 0 1 8,8 v20 h-320 v-20 a8,8 0 0 1 8,-8 z" fill="#F4F5F7"/><line x1="390" y1="619" x2="710" y2="619" stroke="#D4D7DC" stroke-width="1.3"/><text x="422" y="610" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="391" y="619" width="6" height="28" fill="#3b82f6"/><text x="422" y="638.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="391" y="647" width="6" height="28" fill="#0891B2"/><line x1="398" y1="647" x2="702" y2="647" stroke="#D4D7DC" stroke-width="0.6"/><text x="422" y="666.0" font-size="14" font-weight="600"