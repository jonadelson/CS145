<svg viewBox="0 0 1180 699" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="corr-exists-t corr-exists-d"><title id="corr-exists-t">EXISTS / NOT EXISTS: any rating above 4.5?</title><desc id="corr-exists-d">EXISTS / NOT EXISTS: any rating above 4.5?. One row per rating, grouped by user. The inner query runs once per user (the correlation). Rows that fail the comparison are struck out; the survivors give the output.</desc><rect x="0" y="0" width="1180" height="699" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">EXISTS / NOT EXISTS: any rating above 4.5?</text><g data-step="1"><rect x="270" y="66" width="640" height="129" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="288.0" y="94" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> u.name </tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Users u</tspan></text><text x="288.0" y="115" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#79c0ff" font-weight="700">NOT EXISTS</tspan><tspan fill="#E6EDF3"> (</tspan></text><text x="321.6" y="136" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> 1 </tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens l</tspan></text><rect x="274" y="141" width="632" height="22" rx="4" fill="#10301F"/><text x="321.6" y="157" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve" fill="#7EE787" font-weight="700">WHERE l.user_id = u.user_id AND l.rating &gt; 4.5</text><text x="288.0" y="178" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><ts