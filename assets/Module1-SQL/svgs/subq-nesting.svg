<svg viewBox="0 0 1120 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="sn-t sn-d"><title id="sn-t">A subquery nests queries inside queries, read inside-out</title><desc id="sn-d">Three concentric boxes. The innermost finds Taylor Swift songs (1, 2, 9); the middle finds the users who played them (1, 2, 3); the outer looks up their names (Mickey, Minnie, Daffy). Beside them, the three flavors of subquery, IN/NOT IN, EXISTS and Scalar, shown as equal peers.</desc><rect x="0" y="0" width="1120" height="470" fill="#FBFBFC"/><text x="560.0" y="46" font-size="24" font-weight="800" fill="#0E0E10" text-anchor="middle">Subqueries: queries inside queries</text><text x="560.0" y="74" font-size="14" font-weight="400" fill="#52525B" text-anchor="middle">Read inside-out: the innermost query runs first and feeds the next, layer by layer.</text><g data-step="3"><rect x="70" y="110" width="600" height="330" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2"/><circle cx="98" cy="138" r="13" fill="#475569"/><text x="98" y="143" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="120" y="143" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Look up their names</text><text x="650" y="143" font-size="16" font-weight="800" fill="#475569" font-family="ui-monospace, monospace" text-anchor="end">Mickey, Minnie, Daffy</text></g><g data-step="2"><rect x="120" y="178" width="500" height="194" rx="16" fill="#F5F3FF" stroke="#8b5cf6" stroke-width="2"/><circle cx="148" cy="206" r="13" fill="#8b5cf6"/><text x="148" y="211" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="170" y="211" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Find users who played them</text><text x="600" y="211" font-size="16" font-weight="800" fill="#8b5cf6" font-family="ui-monospace, monospace" text-anchor="end">{1, 2, 3}</text></g><g data-step="1"><rect x="170" y="246" width="400" height="90" rx="16" fill="#EFF6FF" stroke="#3b82f6" stroke-width="2"/><circle cx="198" cy="274" r="13" fill="#3b82f6"/><text x="198" y="279" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="220" y="279" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Find Taylor Swift songs</text><text x="550" y="279" font-size="16" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="end">{1, 2, 9}</text></g><g data-step="4"><text x="915" y="132" font-size="15" font-weight="700" fill="#52525B" text-anchor="middle">Three flavors</text><rect x="740" y="150" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="740" y="150" width="6" height="78" rx="3" fill="#475569"/><text x="762" y="182" font-size="17" font-weight="700" fill="#0E0E10" text-anchor="start">IN / NOT IN</text><text x="762" y="206" font-size="13" font-weight="400" fill="#52525B" text-anchor="start">is a value in the inner list?</text><rect x="740" y="246" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="740" y="246" width="6" height="78" rx="3" fill="#475569"/><text x="762" y="278" font-size="17" font-weight="700" fill="#0E0E10" text-anchor="start">EXISTS</text><text x="762" y="302" font-size="13" font-weight="400" fill="#52525B" text-anchor="start">does the inner query return any row?</text><rect x="740" y="342" width="350" height="78" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="740" y="342" width="6" height="78" rx="3" fill="#475569"/><text x="762" y="374" font-size="17" font-weight="700" fill="#0E0E10" text-anchor="start">Scalar</text><text x="762" y="398" font-size="13" font-weight="400" fill="#52525B" text-anchor="start">compare against one inner value</text></g></svg>
