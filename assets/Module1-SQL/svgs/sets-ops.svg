<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="so-t so-d"><title id="so-t">The four set operations as row tables</title><desc id="so-d">Two query results: A is Mickey and Minnie, B is Mickey and Daffy; Mickey (teal) is in both, Minnie (blue) only in A, Daffy (violet) only in B. UNION returns the three distinct users; UNION ALL keeps the duplicate Mickey for four rows; INTERSECT returns only Mickey (in both); EXCEPT (A minus B) returns only Minnie. Color key: teal in both, blue only A, violet only B, amber the kept duplicate.</desc><rect x="0" y="0" width="1200" height="520" fill="#FBFBFC"/><text x="600.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Four set operations on two query results</text><text x="600.0" y="70" font-size="13" font-weight="400" fill="#6B7280" text-anchor="middle">Combine A and B four ways. Color = membership: teal both, blue only A, violet only B.</text><g data-step="1"><text x="386" y="92" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">Query A</text><text x="386" y="108" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">users who like Pop</text><rect x="386" y="116" width="200" height="86" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M395,116 h182 a9,9 0 0 1 9,9 v21 h-200 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="386" y1="146" x2="586" y2="146" stroke="#D4D7DC" stroke-width="1.5"/><text x="420" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="387" y="146" width="6" height="28" fill="#0891B2"/><text x="420" y="165.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="387" y="174" width="6" height="28" fill="#2563EB"/><line x1="395" y1="174" x2="577" y2="174" stroke="#D4D7DC" stroke-width="0.6"/><text x="420" y="193.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text><text x="622" y="92" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">Query B</text><text x="622" y="108" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">users who like Rock</text><rect x="622" y="116" width="200" height="86" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M631,116 h182 a9,9 0 0 1 9,9 v21 h-200 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="622" y1="146" x2="822" y2="146" stroke="#D4D7DC" stroke-width="1.5"/><text x="656" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="623" y="146" width="6" height="28" fill="#0891B2"/><text x="656" y="165.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="623" y="174" width="6" height="28" fill="#7C3AED"/><line x1="631" y1="174" x2="813" y2="174" stroke="#D4D7DC" stroke-width="0.6"/><text x="656" y="193.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Daffy</text><text x="600.0" y="216" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="middle">combine the two results four ways:</text></g><g data-step="2"><text x="40" y="272" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">UNION</text><text x="40" y="288" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">either side, deduped</text><rect x="40" y="296" width="250" height="114" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M49,296 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="40" y1="326" x2="290" y2="326" stroke="#D4D7DC" stroke-width="1.5"/><text x="74" y="316" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="41" y="326" width="6" height="28" fill="#0891B2"/><text x="74" y="345.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="41" y="354" width="6" height="28" fill="#2563EB"/><line x1="49" y1="354" x2="281" y2="354" stroke="#D4D7DC" stroke-width="0.6"/><text x="74" y="373.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text><rect x="41" y="382" width="6" height="28" fill="#7C3AED"/><line x1="49" y1="382" x2="281" y2="382" stroke="#D4D7DC" stroke-width="0.6"/><text x="74" y="401.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Daffy</text><text x="316" y="272" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">UNION ALL</text><text x="316" y="288" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">either side, keep dups</text><rect x="316" y="296" width="250" height="142" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M325,296 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="316" y1="326" x2="566" y2="326" stroke="#D4D7DC" stroke-width="1.5"/><text x="350" y="316" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="317" y="326" width="6" height="28" fill="#0891B2"/><text x="350" y="345.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="317" y="354" width="6" height="28" fill="#2563EB"/><line x1="325" y1="354" x2="557" y2="354" stroke="#D4D7DC" stroke-width="0.6"/><text x="350" y="373.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text><rect x="317" y="382" width="6" height="28" fill="#D97706"/><line x1="325" y1="382" x2="557" y2="382" stroke="#D4D7DC" stroke-width="0.6"/><text x="350" y="401.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="317" y="410" width="6" height="28" fill="#7C3AED"/><line x1="325" y1="410" x2="557" y2="410" stroke="#D4D7DC" stroke-width="0.6"/><text x="350" y="429.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Daffy</text><text x="316" y="456" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">Mickey appears twice</text></g><g data-step="3"><text x="632" y="272" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">INTERSECT</text><text x="632" y="288" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">in BOTH A and B</text><rect x="632" y="296" width="250" height="58" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M641,296 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="632" y1="326" x2="882" y2="326" stroke="#D4D7DC" stroke-width="1.5"/><text x="666" y="316" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="633" y="326" width="6" height="28" fill="#0891B2"/><text x="666" y="345.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text></g><g data-step="4"><text x="908" y="272" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="start">EXCEPT</text><text x="908" y="288" font-size="11" font-weight="600" fill="#6B7280" text-anchor="start">in A, not in B</text><rect x="908" y="296" width="250" height="58" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M917,296 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="908" y1="326" x2="1158" y2="326" stroke="#D4D7DC" stroke-width="1.5"/><text x="942" y="316" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><rect x="909" y="326" width="6" height="28" fill="#2563EB"/><text x="942" y="345.0" font-size="13" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text></g></svg>
