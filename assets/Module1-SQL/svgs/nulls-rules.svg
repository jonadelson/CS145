<svg viewBox="0 0 1180 372" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="nulls-rules-t nulls-rules-d"><title id="nulls-rules-t">NULL's rules in two groups: operators vs comparisons</title><desc id="nulls-rules-d">NULL's rules in two groups: operators vs comparisons Color key: green TRUE, red FALSE, grey NULL/UNKNOWN.</desc><rect x="0" y="0" width="1180" height="372" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">NULL's rules, in two groups</text><text x="590.0" y="68" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Operators have a dominant value; comparisons all go UNKNOWN; only IS NULL escapes.</text><g data-step="1"><text x="40" y="120" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Operators: a value dominates</text><rect x="40" y="130" width="340" height="202" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M49,130 h322 a9,9 0 0 1 9,9 v23 h-340 v-23 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="40" y1="162" x2="380" y2="162" stroke="#D4D7DC" stroke-width="1.5"/><text x="60" y="151" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">expression</text><text x="230" y="151" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">result</text><text x="60" y="184.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">FALSE AND NULL</text><text x="230" y="184.0" font-size="14" font-weight="800" fill="#DC2626" text-anchor="start">FALSE</text><line x1="388" y1="180.0" x2="398" y2="180.0" stroke="#6B7280" stroke-width="1"/><text x="404" y="184.0" font-size="12" font-style="italic" fill="#6B7280" font-family="Inter, sans-serif">false wins</text><line x1="49" y1="196" x2="371" y2="196" stroke="#D4D7DC" stroke-width="0.6"/><text x="60" y="218.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">TRUE AND NULL</text><text x="230" y="218.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><line x1="49" y1="230" x2="371" y2="230" stroke="#D4D7DC" stroke-width="0.6"/><text x="60" y="252.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">TRUE OR NULL</text><text x="230" y="252.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">TRUE</text><line x1="388" y1="248.0" x2="398" y2="248.0" stroke="#6B7280" stroke-width="1"/><text x="404" y="252.0" font-size="12" font-style="italic" fill="#6B7280" font-family="Inter, sans-serif">true wins</text><line x1="49" y1="264" x2="371" y2="264" stroke="#D4D7DC" stroke-width="0.6"/><text x="60" y="286.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">FALSE OR NULL</text><text x="230" y="286.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><line x1="49" y1="298" x2="371" y2="298" stroke="#D4D7DC" stroke-width="0.6"/><text x="60" y="320.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">NOT NULL</text><text x="230" y="320.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><line x1="388" y1="316.0" x2="398" y2="316.0" stroke="#6B7280" stroke-width="1"/><text x="404" y="320.0" font-size="12" font-style="italic" fill="#6B7280" font-family="Inter, sans-serif">NULL stays</text></g><g data-step="2"><text x="640" y="120" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Comparisons go UNKNOWN; IS NULL is the escape</text><rect x="640" y="130" width="340" height="168" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M649,130 h322 a9,9 0 0 1 9,9 v23 h-340 v-23 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="640" y1="162" x2="980" y2="162" stroke="#D4D7DC" stroke-width="1.5"/><text x="660" y="151" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">expression</text><text x="830" y="151" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">result</text><text x="660" y="184.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5 &gt; NULL</text><text x="830" y="184.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><line x1="988" y1="180.0" x2="998" y2="180.0" stroke="#6B7280" stroke-width="1"/><text x="1004" y="184.0" font-size="12" font-style="italic" fill="#6B7280" font-family="Inter, sans-serif">NULL wins</text><line x1="649" y1="196" x2="971" y2="196" stroke="#D4D7DC" stroke-width="0.6"/><text x="660" y="218.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4 = NULL</text><text x="830" y="218.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><line x1="649" y1="230" x2="971" y2="230" stroke="#D4D7DC" stroke-width="0.6"/><text x="660" y="252.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">NULL = NULL</text><text x="830" y="252.0" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">NULL</text><rect x="642" y="264" width="336" height="34" fill="#ECFDF5"/><line x1="649" y1="264" x2="971" y2="264" stroke="#D4D7DC" stroke-width="0.6"/><text x="660" y="286.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">rating IS NULL</text><text x="830" y="286.0" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">TRUE / FALSE</text><line x1="988" y1="282.0" x2="998" y2="282.0" stroke="#6B7280" stroke-width="1"/><text x="1004" y="286.0" font-size="12" font-style="italic" fill="#6B7280" font-family="Inter, sans-serif">the real test</text></g></svg>
