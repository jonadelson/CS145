<svg viewBox="0 0 1140 496" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="nt-t nt-d"><title id="nt-t">A NULL inside NOT IN silently returns zero rows; the IS NOT NULL guard fixes it</title><desc id="nt-d">Two columns. Left (red, the failure): the unsafe query rating NOT IN (Daffy's ratings) expands to 4.5 != 2.9 AND 4.5 != 4.9 AND 4.5 != NULL; the first two are TRUE but the comparison against NULL is UNKNOWN (grey, marked ?), so the whole AND is UNKNOWN and WHERE drops every row: 0 rows. Right (green, the fix): adding AND rating IS NOT NULL removes the NULL from the list, both comparisons are TRUE, and 6 rows come back. Color key: red = the silent failure, green = the guarded query, grey with ? = the UNKNOWN NULL comparison.</desc><rect x="0" y="0" width="1140" height="496" fill="#FBFBFC"/><text x="570.0" y="44" font-size="23" font-weight="800" fill="#0E0E10" text-anchor="middle">NOT IN with a NULL: guard it, or lose every row</text><line x1="570.0" y1="86" x2="570.0" y2="466" stroke="#D4D7DC" stroke-width="1.5" stroke-dasharray="6,5"/><g data-step="1"><rect x="44" y="78" width="500" height="396" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="44" y="78" width="500" height="5" rx="2.5" fill="#475569"/><text x="66" y="112" font-size="18" font-weight="800" fill="#475569" text-anchor="start">Run this query</text><text x="66" y="134" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">what does it return?</text><rect x="66" y="148" width="456" height="150" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="84.0" y="176" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> listen_id, rating</tspan></text><text x="84.0" y="197" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="84.0" y="218" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> rating </tspan><tspan fill="#79c0ff" font-weight="700">NOT IN</tspan><tspan fill="#E6EDF3"> (</tspan></text><text x="117.6" y="239" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> rating </tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="117.6" y="260" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> user_id = 3</tspan></text><text x="84.0" y="281" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3">)</tspan></text></g><g data-step="2"><text x="66" y="322" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="start">Daffy's ratings: 2.9, 4.9, and a NULL</text><text x="74" y="350" font-size="14" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="start">4.5 != 2.9</text><text x="206" y="350" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="226" y="350" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">TRUE</text><text x="74" y="374" font-size="14" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="start">4.5 != 4.9</text><text x="206" y="374" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="226" y="374" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">TRUE</text><text x="74" y="398" font-size="14" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="start">4.5 != NULL</text><text x="206" y="398" font-size="14" font-weight="800" fill="#6B7280" text-anchor="start">?</text><text x="226" y="398" font-size="13" font-weight="700" fill="#6B7280" text-anchor="start">UNKNOWN</text><text x="66" y="426" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">TRUE AND TRUE AND UNKNOWN = UNKNOWN</text><text x="66" y="458" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">WHERE drops every row</text><text x="522" y="452" font-size="26" font-weight="800" fill="#DC2626" text-anchor="end">0 rows</text><text x="406" y="452" font-size="22" font-weight="800" fill="#DC2626" text-anchor="end">✗</text></g><g data-step="3"><rect x="596" y="78" width="500" height="396" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="596" y="78" width="500" height="5" rx="2.5" fill="#16A34A"/><text x="618" y="112" font-size="18" font-weight="800" fill="#16A34A" text-anchor="start">The fix</text><text x="618" y="134" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">add AND rating IS NOT NULL</text><rect x="618" y="148" width="456" height="171" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="636.0" y="176" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> listen_id, rating</tspan></text><text x="636.0" y="197" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="636.0" y="218" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> rating </tspan><tspan fill="#79c0ff" font-weight="700">NOT IN</tspan><tspan fill="#E6EDF3"> (</tspan></text><text x="669.6" y="239" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> rating </tspan><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="669.6" y="260" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> user_id = 3</tspan></text><rect x="622" y="265" width="448" height="22" rx="4" fill="#10301F"/><text x="669.6" y="281" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve" fill="#7EE787" font-weight="700">AND rating IS NOT NULL</text><text x="636.0" y="302" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#E6EDF3">)</tspan></text><text x="618" y="343" font-size="13" font-weight="600" fill="#3F3F46" text-anchor="start">The NULL never enters the list: (2.9, 4.9)</text><text x="626" y="371" font-size="14" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="start">4.5 != 2.9</text><text x="758" y="371" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="778" y="371" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">TRUE</text><text x="626" y="395" font-size="14" font-weight="400" fill="#3F3F46" font-family="ui-monospace, monospace" text-anchor="start">4.5 != 4.9</text><text x="758" y="395" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="778" y="395" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">TRUE</text><text x="618" y="426" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">TRUE AND TRUE = TRUE</text><text x="618" y="458" font-size="13" font-weight="400" fill="#6B7280" text-anchor="start">every matching row is kept</text><text x="1074" y="452" font-size="26" font-weight="800" fill="#16A34A" text-anchor="end">6 rows</text><text x="958" y="452" font-size="22" font-weight="800" fill="#16A34A" text-anchor="end">✓</text></g></svg>
