<svg viewBox="0 0 1120 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="iw-t iw-d"><title id="iw-t">Walking an IN subquery inside-out across three steps</title><desc id="iw-d">Step 1 filters Songs to Taylor Swift, leaving song_ids 1, 2, 9. Step 2 finds the listens on those songs and takes the distinct users 1, 2, 3. Step 3 looks those users up in Users, giving Mickey, Minnie, Daffy.</desc><defs><marker id="iwA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#52525B"/></marker></defs><rect x="0" y="0" width="1120" height="470" fill="#FBFBFC"/><text x="560.0" y="40" font-size="20" font-weight="800" fill="#0E0E10" text-anchor="middle">IN subquery: walk the data inside-out</text><g data-step="1"><text x="50" y="98" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">1. Songs WHERE artist = 'Taylor Swift'</text><text x="350" y="98" font-size="11" font-weight="600" fill="#52525B" text-anchor="end">10 → 3</text><rect x="50" y="110" width="300" height="300" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M59,110 h282 a9,9 0 0 1 9,9 v21 h-300 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="50" y1="140" x2="350" y2="140" stroke="#D4D7DC" stroke-width="1.5"/><text x="62" y="130" font-size="10" font-weight="700" fill="#52525B" text-anchor="start">song_id</text><text x="145" y="130" font-size="10" font-weight="700" fill="#52525B" text-anchor="start">artist</text><text x="62" y="157.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">1</text><text x="145" y="157.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">Taylor Swift</text><line x1="59" y1="167" x2="341" y2="167" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="184.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">2</text><text x="145" y="184.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">Taylor Swift</text><line x1="59" y1="194" x2="341" y2="194" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="211.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">3</text><text x="145" y="211.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Ed Sheeran</text><line x1="59" y1="221" x2="341" y2="221" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="238.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">4</text><text x="145" y="238.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Ed Sheeran</text><line x1="59" y1="248" x2="341" y2="248" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="265.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">5</text><text x="145" y="265.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Ed Sheeran</text><line x1="59" y1="275" x2="341" y2="275" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="292.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">6</text><text x="145" y="292.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Beatles</text><line x1="59" y1="302" x2="341" y2="302" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="319.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">7</text><text x="145" y="319.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">Beatles</text><line x1="59" y1="329" x2="341" y2="329" stroke="#D4D7DC" stroke-width="0.6"/><text x="62" y="346.5" font-size="13" font-weight="400" fill="#9AA0AA" text-decoration="line-through" text-anchor="start">8</text><text x="145" y="346.5" font-size="13" 