e="13" font-weight="700" fill="#0E0E10" text-anchor="start">3. Users for {1, 2, 3}</text><text x="970" y="98" font-size="11" font-weight="600" fill="#52525B" text-anchor="end">3 rows</text><rect x="720" y="110" width="250" height="111" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M729,110 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="720" y1="140" x2="970" y2="140" stroke="#D4D7DC" stroke-width="1.5"/><text x="732" y="130" font-size="10" font-weight="700" fill="#52525B" text-anchor="start">name</text><text x="850" y="130" font-size="10" font-weight="700" fill="#52525B" text-anchor="start">user_id</text><rect x="721" y="140" width="5" height="27" fill="#3b82f6"/><text x="732" y="157.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">Mickey</text><text x="850" y="157.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">1</text><rect x="721" y="167" width="5" height="27" fill="#f97316"/><line x1="729" y1="167" x2="961" y2="167" stroke="#D4D7DC" stroke-width="0.6"/><text x="732" y="184.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="850" y="184.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">2</text><rect x="721" y="194" width="5" height="27" fill="#8b5cf6"/><line x1="729" y1="194" x2="961" y2="194" stroke="#D4D7DC" stroke-width="0.6"/><text x="732" y="211.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">Daffy</text><text x="850" y="211.5" font-size="13" font-weight="400" fill="#0E0E10" text-anchor="start">3</text><text x="720" y="259" font-size="14" font-weight="800" fill="#059669" text-anchor="start">Result: Mickey, Minnie, Daffy</text></g></svg>
