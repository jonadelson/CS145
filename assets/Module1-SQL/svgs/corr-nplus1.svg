<svg viewBox="0 0 1200 476" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="np-t np-d"><title id="np-t">The N plus one problem and the single-JOIN rewrite</title><desc id="np-d">Left, the naive correlated form: one outer query over Users, then the inner query re-runs once per user, so 1 outer plus N inner equals N+1 queries, 10,001 for 10,000 users. Right, the optimizer rewrite: a single JOIN with a window function (covered later in the module), one pass over the data, just 1 query. Color key: red top-strip is the costly N+1 form, green is the one-query rewrite.</desc><rect x="0" y="0" width="1200" height="476" fill="#FBFBFC"/><text x="600.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">The N+1 problem: one inner query per row adds up</text><text x="600.0" y="70" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Running the inner query once per outer row scales linearly; a single JOIN does not.</text><g data-step="1"><rect x="56" y="92" width="540" height="356" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="56" y="92" width="540" height="5" rx="2.5" fill="#DC2626"/><text x="78" y="122" font-size="16" font-weight="800" fill="#DC2626" text-anchor="start">Naive: one inner query per row</text><rect x="86" y="142" width="480" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><rect x="86" y="142" width="5" height="50" rx="2.5" fill="#475569"/><text x="104" y="165" font-size="13.5" font-weight="700" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1   SELECT name FROM Users</text><text x="104" y="184" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">the outer query runs once, returns 10,000 users</text></g><g data-step="2"><text x="86" y="218" font-size="12" font-weight="600" fill="#3F3F46" text-anchor="start">then the inner query re-runs once per user:</text><rect x="112" y="230" width="424" height="28" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><text x="126" y="249" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">AVG  WHERE user_id = 1</text><rect x="112" y="261" width="424" height="28" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><text x="126" y="280" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">AVG  WHERE user_id = 2</text><rect x="112" y="292" width="424" height="28" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><text x="126" y="311" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">AVG  WHERE user_id = 3</text><rect x="112" y="323" width="424" height="28" rx="6" fill="#FBFBFC" stroke="#D4D7DC" stroke-width="1.2"/><text x="126" y="342" font-size="12.5" font-weight="400" fill="#0E0E10" text-anchor="start">⋮   one per user</text><rect x="112" y="354" width="424" height="28" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/><text x="126" y="373" font-size="12.5" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">AVG  WHERE user_id = 10000</text><path d="M100,228 q-9,0 -9,9 v59 q0,9 -9,9 q9,0 9,9 v59 q0,9 9,9" fill="none" stroke="#DC2626" stroke-width="1.6"/><text x="542" y="301" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start">N = 10,000</text><rect x="86" y="392" width="480" height="50" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="86" y="392" width="480" height="4" rx="2" fill="#DC2626"/><text x="104" y="415" font-size="18" font-weight="800" fill="#DC2626" text-anchor="start">= 10,001 queries</text><text x="550" y="415" font-size="18" font-weight="800" fill="#DC2626" text-anchor="end">✗</text><text x="104" y="433" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">1 outer + N inner; grows with N</text></g><g data-step="3"><rect x="632" y="92" width="512" height="356" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="632" y="92" width="512" height="5" rx="2.5" fill="#16A34A"/><text x="654" y="122" font-size="16" font-weight="800" fill="#16A34A" text-anchor="start">Rewritten: one pass</text><text x="662" y="158" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">The optimizer rewrites the N+1 form into</text><text x="662" y="180" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">a single JOIN with a window function.</text><rect x="662" y="204" width="452" height="44" rx="8" fill="#F4F5F7" stroke="#D4D7DC" stroke-width="1.2"/><text x="678" y="224" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start">Window functions are covered later</text><text x="678" y="240" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start">in this module.</text><text x="662" y="290" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">Postgres, MySQL, and SQL Server all</text><text x="662" y="310" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">recognize the pattern and apply it.</text><rect x="662" y="392" width="452" height="50" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="662" y="392" width="452" height="4" rx="2" fill="#16A34A"/><text x="680" y="415" font-size="18" font-weight="800" fill="#16A34A" text-anchor="start">= 1 query</text><text x="1098" y="415" font-size="18" font-weight="800" fill="#16A34A" text-anchor="end">✓</text><text x="680" y="433" font-size="12" font-weight="600" fill="#6B7280" text-anchor="start">same answer, one pass over the data</text></g></svg>
