<svg viewBox="0 0 1240 596" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="jc-t jc-d"><title id="jc-t">Users joined to Listens on user_id</title><desc id="jc-d">A Users table and a Listens table are matched on user_id. Mickey, Minnie and Daffy each pair with three listens, giving nine inner-join rows. Pluto has no listens, so the inner join drops him.</desc><defs><marker id="jArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1240" height="596" fill="#FBFBFC"/><g data-step="1"><rect x="330" y="36" width="580" height="100" rx="9" fill="#0D1117"/><text x="346" y="62" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> u.name, l.song_id, l.rating</tspan></text><text x="346" y="82" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Users u</tspan></text><text x="346" y="102" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">JOIN</tspan><tspan fill="#E6EDF3"> Listens l </tspan><tspan fill="#79c0ff" font-weight="700">ON</tspan><tspan fill="#E6EDF3"> u.user_id = l.user_id</tspan></text><text x="346" y="122" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">ORDER BY</tspan><tspan fill="#E6EDF3"> u.user_id</tspan></text></g><g data-step="1"><text x="44" y="159" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Users</text><text x="258" y="159" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">4 rows</text><rect x="44" y="172" width="214" height="202" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M54,172 h194 a10,10 0 0 1 10,10 v24 