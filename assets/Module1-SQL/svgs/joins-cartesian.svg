<svg viewBox="0 0 940 456" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="cx-t cx-d"><title id="cx-t">Forgetting the ON clause makes a cartesian product</title><desc id="cx-d">A 4 by 9 grid pairs every one of four users with every one of nine listens, giving 36 rows. Only nine cells, where the user matches the listen owner, are real matches; the other 27 are meaningless. Adding ON user_id keeps only the nine.</desc><rect x="0" y="0" width="940" height="456" fill="#FBFBFC"/><g data-step="1"><text x="66" y="44" font-size="16" font-weight="700" fill="#0E0E10" text-anchor="start">Forget the ON clause:  every row paired with every row</text><text x="182" y="122" font-size="11" font-weight="700" fill="#6B7280" text-anchor="end">Users</text><text x="46" y="70" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">Listens are coloured by who played them</text><rect x="46" y="165.0" width="5" height="26" rx="2" fill="#2563EB"/><text x="182" y="183.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="end">Mickey</text><rect x="46" y="221.0" width="5" height="26" rx="2" fill="#EA580C"/><text x="182" y="239.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="end">Minnie</text><rect x="46" y="277.0" width="5" height="26" rx="2" fill="#7C3AED"/><text x="182" y="295.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="end">Daffy</text><rect x="46" y="333.0" width="5" height="26" rx="2" fill="#0891B2"/><text x="182" y="351.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="end">Pluto</text><rect x="204" y="106" width="42" height="5" rx="2" fill="#2563EB"/><text x="225.0" y="122" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">L1</text><rect x="262" y="106" width="42" height="5" rx="2" fill="#2563EB"/><text x="283.0" y="122" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">L2</text><rect x="320" y="106" width="42" height="5" rx="2" fil