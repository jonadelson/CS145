<svg viewBox="0 0 1200 516" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="al-t al-d"><title id="al-t">An alias renames the output column, but WHERE cannot use it</title><desc id="al-d">AS renames a column in the result: rating * 2 AS double_rating. But execution order is FROM then WHERE then SELECT, so the alias double_rating is created last, in SELECT. WHERE runs second, before the alias exists, so WHERE double_rating > 8 fails; WHERE rating * 2 > 8 works because the expression already exists. Color key: green is the alias / the working query, red is the failing reference.</desc><defs><marker id="al-a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7280"/></marker><marker id="al-g" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#16A34A"/></marker><marker id="al-r" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#DC2626"/></marker></defs><rect x="0" y="0" width="1200" height="516" fill="#FBFBFC"/><text x="600.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">Aliases (AS): rename a column, but WHERE can't use the new name</text><g data-step="1"><text x="64" y="106" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">AS renames the output column</text><rect x="64" y="116" width="330" height="114" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M73,116 h312 a9,9 0 0 1 9,9 v21 h-330 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="64" y1="146" x2="394" y2="146" stroke="#D4D7DC" stroke-width="1.5"/><text x="84" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><text x="214" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating * 2</text><text x="214" y="148" font-size="9" font-weight="600" fill="#16A34A" text-anchor="start">( = double_rating )</text><text x="84" y="165.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><text x="214" y="165.0" font-size="14" font-weight="700" fill="#16A34A" font-family="ui-monospace, monospace" text-anchor="start">9.0</text><line x1="73" y1="174" x2="385" y2="174" stroke="#D4D7DC" stroke-width="0.6"/><text x="84" y="193.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><text x="214" y="193.0" font-size="14" font-weight="700" fill="#16A34A" font-family="ui-monospace, monospace" text-anchor="start">8.4</text><line x1="73" y1="202" x2="385" y2="202" stroke="#D4D7DC" stroke-width="0.6"/><text x="84" y="221.0" font-size="14" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><text x="214" y="221.0" font-size="14" font-weight="700" fill="#16A34A" font-family="ui-monospace, monospace" text-anchor="start">7.8</text></g><g data-step="2"><text x="470" y="106" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Execution order: the alias is created last</text><rect x="470" y="116" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="470" y="116" width="6" height="60" rx="3" fill="#475569"/><circle cx="500" cy="146" r="13" fill="#475569"/><text x="500" y="151" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="520" y="151" font-size="12.5" font-weight="700" fill="#0E0E10" text-anchor="start">FROM Listens</text><path d="M682,146 h20" stroke="#6B7280" stroke-width="2" marker-end="url(#al-a)"/><rect x="704" y="116" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="704" y="116" width="6" height="60" rx="3" fill="#DC2626"/><circle cx="734" cy="146" r="13" fill="#DC2626"/><text x="734" y="151" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="754" y="151" font-size="12.5" font-weight="700" fill="#0E0E10" text-anchor="start">WHERE …</text><path d="M916,146 h20" stroke="#6B7280" stroke-width="2" marker-end="url(#al-a)"/><rect x="938" y="116" width="210" height="60" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="938" y="116" width="6" height="60" rx="3" fill="#16A34A"/><circle cx="968" cy="146" r="13" fill="#16A34A"/><text x="968" y="151" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="988" y="151" font-size="12.5" font-weight="700" fill="#0E0E10" text-anchor="start">SELECT … AS double_rating</text><path d="M1028,178 v22" stroke="#16A34A" stroke-width="2" marker-end="url(#al-g)"/><text x="1038" y="216" font-size="12" font-weight="700" fill="#16A34A" text-anchor="start">double_rating is born HERE (3rd)</text><path d="M794,178 v44" stroke="#DC2626" stroke-width="2" marker-end="url(#al-r)"/><text x="804" y="238" font-size="12" font-weight="700" fill="#DC2626" text-anchor="start">WHERE runs 2nd, before the alias exists</text></g><g data-step="3"><text x="64" y="292" font-size="14" font-weight="800" fill="#DC2626" text-anchor="start">Fails</text><rect x="64" y="300" width="540" height="87" rx="7" fill="#0D1117" stroke="#DC2626" stroke-width="1.6"/><text x="80.0" y="328" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> rating * 2 </tspan><tspan fill="#79c0ff" font-weight="700">AS</tspan><tspan fill="#E6EDF3"> double_rating</tspan></text><text x="80.0" y="349" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="80.0" y="370" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#DC2626" font-weight="700">double_rating</tspan><tspan fill="#E6EDF3"> &gt; 8</tspan></text><text x="70" y="409" font-size="13" font-weight="700" fill="#DC2626" text-anchor="start">✗  ERROR: no column named double_rating yet</text><text x="640" y="292" font-size="14" font-weight="800" fill="#16A34A" text-anchor="start">Works</text><rect x="640" y="300" width="500" height="87" rx="7" fill="#0D1117" stroke="#16A34A" stroke-width="1.6"/><text x="656.0" y="328" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> rating * 2 </tspan><tspan fill="#79c0ff" font-weight="700">AS</tspan><tspan fill="#E6EDF3"> double_rating</tspan></text><text x="656.0" y="349" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="656.0" y="370" font-size="14" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#16A34A" font-weight="700">rating * 2</tspan><tspan fill="#E6EDF3"> &gt; 8</tspan></text><text x="646" y="409" font-size="13" font-weight="700" fill="#16A34A" text-anchor="start">✓  WHERE uses the expression, which already exists</text></g></svg>
