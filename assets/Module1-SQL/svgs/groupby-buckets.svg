<svg viewBox="0 0 1180 496" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="groupby-buckets-t groupby-buckets-d"><title id="groupby-buckets-t">groupby buckets</title><desc id="groupby-buckets-d">GROUP BY user_id collapses nine Listens rows into three buckets, one per user, each with COUNT of three. Pluto has no listens, so Pluto gets no bucket and no output row. Color key: per-user identity bars (Mickey blue, Minnie orange, Daffy purple, Pluto cyan).</desc><defs><marker id="gm" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#6B7280"/></marker></defs><text x="590.0" y="40" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">GROUP BY user_id: same user_id falls in one bucket</text><text x="590.0" y="66" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">Nine listens collapse into three buckets, one row each.</text><rect x="330" y="92" width="520" height="72" rx="8" fill="#0D1117"/><text x="346" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="398" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id,</text><text x="466" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">COUNT(*)</text><text x="534" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">AS</text><text x="556" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">listen_count</text><text x="346" y="134" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="384" y="134" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="346" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">GROUP</text><text x="391" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="414" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><g data-step="1"><text x="60" y="198" font-size="13" font-weight="800" fill="#0E0E10" text-anchor="start">Listens  (9 rows, bucketed by user)</text><text x="60" y="214" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="start">the input</text><rect x="60" y="220" width="430" height="246" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="60" y="220" width="430" height="30" rx="9" fill="#F4F4F6"/><rect x="60" y="241" width="430" height="9" fill="#F4F4F6"/><line x1="60" y1="250" x2="490" y2="250" stroke="#D4D7DC" stroke-width="1.4"/><text x="74" y="240" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">listen_id</text><text x="170" y="240" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="280" y="240" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">song_id</text><text x="390" y="240" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="60" y="250" width="5" height="24" fill="#2563EB"/><text x="74" y="266.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="170" y="266.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="280" y="266.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="390" y="266.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><rect x="60" y="274" width="5" height="24" fill="#2563EB"/><line x1="68" y1="274" x2="482" y2="274" stroke="#