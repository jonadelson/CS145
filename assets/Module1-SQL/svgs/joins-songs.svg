<svg viewBox="0 0 1240 632" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="js-t js-d"><title id="js-t">Songs joined to Listens on song_id; RIGHT JOIN keeps the five unplayed songs</title><desc id="js-d">A Songs table and a Listens table are matched on song_id. Five songs (Shape of You, Photograph, Shivers, Bad Blood, DJ Mix) were never played. INNER JOIN returns the nine played-song rows; RIGHT JOIN keeps all ten songs, adding the five unplayed ones NULL-filled, for fourteen rows.</desc><defs><marker id="jsArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1240" height="632" fill="#FBFBFC"/><g data-step="1"><rect x="330" y="40" width="580" height="80" rx="9" fill="#0D1117"/><text x="346" y="66" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> s.title, l.rating</tspan></text><text x="346" y="86" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Songs s</tspan></text><text x="346" y="106" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">RIGHT JOIN</tspan><tspan fill="#E6EDF3"> Listens l </tspan><tspan fill="#79c0ff" font-weight="700">ON</tspan><tspan fill="#E6EDF3"> s.song_id = l.song_id</tspan></text><text x="44" y="177" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Songs</text><text x="356" y="177" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">10 rows</text><rect x="44" y="190" width="312" height="314" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M54,190 h292 a10,10 0 0 1 10,10 v24 h-312 v-24 a10,10 0 0 1 10,-10 z" fill="#F4F4F6"/><line x1="44" y1="224" x2="356" y2="224" st