<svg viewBox="0 0 1120 452" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="nl-t nl-d"><title id="nl-t">NULL adds a third truth value, UNKNOWN</title><desc id="nl-d">Binary logic: 4.5 > 4.0 is TRUE, 4.5 > 5.0 is FALSE. But any comparison with NULL (4.5 > NULL, NULL = NULL, rating = NULL) is UNKNOWN, the third truth value, shown grey with a question mark. WHERE keeps only TRUE rows, so UNKNOWN and NULL drop silently; rating IS NULL is the only test that returns a real TRUE or FALSE and finds NULL rows. Color key: green TRUE, red FALSE, grey question mark UNKNOWN.</desc><rect x="0" y="0" width="1120" height="452" fill="#FBFBFC"/><text x="560.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">NULL adds a third truth value: UNKNOWN</text><text x="560.0" y="70" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">NULL is not zero and not empty. It means unknown, and it spreads.</text><g data-step="1"><rect x="230" y="116" width="560" height="224" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M240,116 h540 a10,10 0 0 1 10,10 v24 h-560 v-24 a10,10 0 0 1 10,-10 z" fill="#F4F5F7"/><line x1="230" y1="150" x2="790" y2="150" stroke="#D4D7DC" stroke-width="1.5"/><text x="260" y="138" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">expression</text><text x="570" y="138" font-size="11" font-weight="700" fill="#6B7280" text-anchor="start">result</text><text x="230" y="102" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Binary logic: every test is TRUE or FALSE</text><text x="260" y="174.0" font-size="15" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5 &gt; 4.0</text><text x="570" y="174.0" font-size="15" font-weight="800" fill="#16A34A" text-anchor="start">✓</text><text x="594" y="174.0" font-size="14" font-weight="700" fill="#16A34A" text-anchor="start">TRUE</text><line x1="240" y1="188" x2="780" y2="188" stroke="#D4D7DC" stroke-width="0.6"/><text x="260" y="212.0" font-size="15" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5 &gt; 5.0</text><text x="570" y="212.0" font-size="15" font-weight="800" fill="#DC2626" text-anchor="start">✗</text><text x="594" y="212.0" font-size="14" font-weight="700" fill="#DC2626" text-anchor="start">FALSE</text></g><g data-step="2"><text x="230" y="368" font-size="14" font-weight="600" fill="#3F3F46" text-anchor="start">Add NULL, a missing value: every comparison with it is UNKNOWN, a third truth value.</text><line x1="240" y1="226" x2="780" y2="226" stroke="#D4D7DC" stroke-width="0.6"/><text x="260" y="250.0" font-size="15" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5 &gt; NULL</text><text x="570" y="250.0" font-size="15" font-weight="800" fill="#6B7280" text-anchor="start">?</text><text x="594" y="250.0" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">UNKNOWN</text><line x1="240" y1="264" x2="780" y2="264" stroke="#D4D7DC" stroke-width="0.6"/><text x="260" y="288.0" font-size="15" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">NULL = NULL</text><text x="570" y="288.0" font-size="15" font-weight="800" fill="#6B7280" text-anchor="start">?</text><text x="594" y="288.0" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">UNKNOWN</text><line x1="240" y1="302" x2="780" y2="302" stroke="#D4D7DC" stroke-width="0.6"/><text x="260" y="326.0" font-size="15" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">rating = NULL</text><text x="570" y="326.0" font-size="15" font-weight="800" fill="#6B7280" text-anchor="start">?</text><text x="594" y="326.0" font-size="14" font-weight="700" fill="#6B7280" text-anchor="start">UNKNOWN</text></g><g data-step="3"><rect x="230" y="384" width="560" height="68" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="230" y="384" width="5" height="68" rx="2.5" fill="#0E0E10"/><text x="250" y="410" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">WHERE keeps only TRUE rows, so UNKNOWN (and NULL) drop silently.</text><text x="250" y="434" font-size="13" font-weight="400" fill="#3F3F46" text-anchor="start">rating IS NULL is the only test that gives a real TRUE/FALSE and finds them.</text></g></svg>
