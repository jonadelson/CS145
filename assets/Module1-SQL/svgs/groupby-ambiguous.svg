<svg viewBox="0 0 1180 402" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="groupby-ambiguous-t groupby-ambiguous-d"><title id="groupby-ambiguous-t">groupby ambiguous</title><desc id="groupby-ambiguous-d">GROUP BY user_id collapses each user's listens to a single row. The query also asks for song_id, which was not grouped, so it shows a grey question mark: Mickey's row collapsed songs 1, 2 and 6, and the database cannot pick one. Margin notes list the candidate songs. Color key: grey question mark marks the unresolved column, per-user identity bars color the rows.</desc><defs><marker id="gm" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 9 4, 0 8" fill="#6B7280"/></marker></defs><text x="590.0" y="40" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">Ask for a column you did not group by, and the row cannot answer</text><text x="590.0" y="66" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="middle">GROUP BY user_id makes one row per user. But song_id had three values in that group.</text><rect x="330" y="92" width="520" height="72" rx="8" fill="#0D1117"/><text x="346" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">SELECT</text><text x="398" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id,</text><text x="466" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">song_id,</text><text x="534" y="116" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">COUNT(*)</text><text x="346" y="134" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">FROM</text><text x="384" y="134" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">Listens</text><text x="346" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">GROUP</text><text x="391" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#79c0ff" xml:space="preserve">BY</text><text x="414" y="152" font-size="12.5" font-family="ui-monospace, monospace" fill="#E6EDF3" xml:space="preserve">user_id</text><g data-step="1"><text x="180" y="202" font-size="13" font-weight="800" fill="#0E0E10" text-anchor="start">After GROUP BY user_id: one row per user</text><rect x="180" y="224" width="360" height="108" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="180" y="224" width="360" height="30" rx="9" fill="#F4F4F6"/><rect x="180" y="245" width="360" height="9" fill="#F4F4F6"/><line x1="180" y1="254" x2="540" y2="254" stroke="#D4D7DC" stroke-width="1.4"/><text x="194" y="244" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="290" y="244" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">COUNT(*)</text><rect x="180" y="254" width="5" height="26" fill="#2563EB"/><text x="194" y="271.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="290" y="271.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><rect x="180" y="280" width="5" height="26" fill="#EA580C"/><line x1="188" y1="280" x2="532" y2="280" stroke="#D4D7DC" stroke-width="0.4"/><text x="194" y="297.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="290" y="297.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><rect x="180" y="306" width="5" height="26" fill="#7C3AED"/><line x1="188" y1="306" x2="532" y2="306" stroke="#D4D7DC" stroke-width="0.4"/><text x="194" y="323.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="290" y="323.0" font-size="12" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text></g><g data-step="2"><text x="410" y="244" font-size="9.5" font-weight="700" fill="#6B7280" text-anchor="start">song_id</text><text x="410" y="271.0" font-size="14" font-weight="800" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">?</text><line x1="540" y1="267.0" x2="552" y2="267.0" stroke="#D4D7DC" stroke-width="1"/><text x="556" y="271.0" font-size="11.5" font-style="italic" fill="#6B7280">collapsed songs 1, 2, 6  -  which one?</text><text x="410" y="297.0" font-size="14" font-weight="800" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">?</text><line x1="540" y1="293.0" x2="552" y2="293.0" stroke="#D4D7DC" stroke-width="1"/><text x="556" y="297.0" font-size="11.5" font-style="italic" fill="#6B7280">collapsed songs 2, 7, 8  -  which one?</text><text x="410" y="323.0" font-size="14" font-weight="800" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="start">?</text><line x1="540" y1="319.0" x2="552" y2="319.0" stroke="#D4D7DC" stroke-width="1"/><text x="556" y="323.0" font-size="11.5" font-style="italic" fill="#6B7280">collapsed songs 1, 2, 6  -  which one?</text><text x="410" y="218" font-size="10.5" font-weight="600" fill="#6B7280" text-anchor="start">song_id was never grouped, so it has no single value</text><text x="590.0" y="378" font-size="14" font-weight="800" fill="#0E0E10" text-anchor="middle">Every column you SELECT must be grouped or aggregated.</text></g></svg>
