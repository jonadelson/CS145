<svg viewBox="0 0 1160 506" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="fk-t fk-d"><title id="fk-t">A foreign key turns one outer join into an inner join</title><desc id="fk-d">Listens.user_id is a foreign key referencing Users, so every listen has a real user; only Pluto, a user with no listen, is unmatched. Two statements follow: for Users JOIN Listens, RIGHT JOIN equals INNER JOIN (only LEFT JOIN adds Pluto); for Listens JOIN Users, LEFT JOIN equals INNER JOIN (only RIGHT JOIN adds Pluto). The rule: keeping the Listens side equals the inner join, keeping the Users side surfaces the orphan Pluto. Songs and song_id behave the same way.</desc><rect x="0" y="0" width="1160" height="506" fill="#FBFBFC"/><defs><marker id="fkA" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#6B7280"/></marker></defs><text x="580.0" y="44" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">A foreign key turns one outer join into a plain INNER join</text><text x="580.0" y="70" font-size="13.5" font-weight="500" fill="#6B7280" text-anchor="middle">Reason it through from one fact about the key.</text><g data-step="1"><rect x="372" y="100" width="176" height="46" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/><rect x="372" y="100" width="176" height="6" rx="3" fill="#16A34A"/><text x="460.0" y="131" font-size="16" font-weight="700" fill="#0E0E10" text-anchor="middle">Listens</text><rect x="612" y="100" width="176" height="46" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><rect x="612" y="100" width="176" height="6" rx="3" fill="#2563EB"/><text x="700.0" y="131" font-size="16" font-weight="700" fill="#0E0E10" text-anchor="middle">Users</text><path d="M552,123 H606" fill="none" stroke="#6B7280" stroke-width="2.5" marker-end="url(#fkA)"/><text x="580" y="114" font-size="12" font-weight="700" fill="#6B7280" font-family="ui-monospace, monospace" text-anchor="middle">user_id</text><text x="580.0" y="182" font-size="15" font-weight="700" fill="#16A34A" text-anchor="middle">Listens.user_id is a foreign key: every listen has a real user.</text><text x="580.0" y="204" font-size="13.5" font-weight="500" fill="#6B7280" text-anchor="middle">The only unmatched row is Pluto, a user with no listen.</text></g><g data-step="2"><rect x="48" y="232" width="524" height="168" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="48" y="232" width="524" height="7" rx="3.5" fill="#2563EB"/><text x="74" y="278" font-size="18" font-weight="700" font-family="ui-monospace, monospace" fill="#0E0E10">Users JOIN Listens</text><text x="74" y="326" font-size="22" font-weight="800" xml:space="preserve"><tspan fill="#2563EB">RIGHT JOIN</tspan><tspan fill="#6B7280" font-weight="600">  =  </tspan><tspan fill="#16A34A">INNER JOIN</tspan></text><text x="74" y="358" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">every listen has a user, so keeping all</text><text x="74" y="377" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">the listens adds nothing new.</text><text x="546" y="377" font-size="13" font-weight="700" fill="#0891B2" text-anchor="end">only LEFT JOIN adds Pluto</text></g><g data-step="3"><rect x="588" y="232" width="524" height="168" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><rect x="588" y="232" width="524" height="7" rx="3.5" fill="#2563EB"/><text x="614" y="278" font-size="18" font-weight="700" font-family="ui-monospace, monospace" fill="#0E0E10">Listens JOIN Users</text><text x="614" y="326" font-size="22" font-weight="800" xml:space="preserve"><tspan fill="#2563EB">LEFT JOIN</tspan><tspan fill="#6B7280" font-weight="600">  =  </tspan><tspan fill="#16A34A">INNER JOIN</tspan></text><text x="614" y="358" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">every listen has a user, so keeping all</text><text x="614" y="377" font-size="13.5" font-weight="400" fill="#6B7280" text-anchor="start">the listens adds nothing new.</text><text x="1086" y="377" font-size="13" font-weight="700" fill="#0891B2" text-anchor="end">only RIGHT JOIN adds Pluto</text></g><g data-step="4"><rect x="48" y="426" width="1064" height="64" rx="12" fill="#E1F4EC" stroke="#16A34A" stroke-width="1.5"/><text x="76" y="453" font-size="15.5" font-weight="700" fill="#0E0E10" text-anchor="start">Keep the Listens side  →  the outer join is just INNER.</text><text x="76" y="476" font-size="13.5" font-weight="500" fill="#6B7280" text-anchor="start">Keep the Users side  →  Pluto, the orphan, appears. (Songs and song_id work exactly the same way.)</text></g></svg>
