<svg viewBox="0 0 1180 413" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="nulls-queries-t nulls-queries-d"><title id="nulls-queries-t">The same NULL row across three WHERE filters</title><desc id="nulls-queries-d">The same NULL row across three WHERE filters Color key: green TRUE, red FALSE, grey UNKNOWN/NULL.</desc><rect x="0" y="0" width="1180" height="413" fill="#FBFBFC"/><text x="590.0" y="42" font-size="21" font-weight="800" fill="#0E0E10" text-anchor="middle">The NULL row: kept only by IS NULL, dropped by every comparison</text><g data-step="1"><text x="40" y="78" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Query 1</text><rect x="40" y="88" width="360" height="75" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.1"/><text x="54" y="112" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> listen_id, rating</tspan></text><text x="54" y="131" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="54" y="150" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> rating </tspan><tspan fill="#79c0ff" font-weight="700">IS NULL</tspan></text><rect x="40" y="191" width="360" height="54" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><path d="M48,191 h344 a8,8 0 0 1 8,8 v20 h-360 v-20 a8,8 0 0 1 8,-8 z" fill="#F4F5F7"/><line x1="40" y1="219" x2="400" y2="219" stroke="#D4D7DC" stroke-width="1.4"/><text x="68" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">listen_id</text><text x="160" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="41" y="219" width="5" height="26" fill="#8b5cf6"/><rect x="46" y="219" width="348" height="26" fill="#FEF3C7"/><text x="68" y="236.0" font-size="13" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-anchor="start">9</text><text x="160" y="236.0" font-size="13" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-anchor="start">NULL</text><text x="40" y="265" font-size="12" font-weight="700" fill="#0E0E10" text-anchor="start">1 row: IS NULL keeps it</text></g><g data-step="2"><text x="410" y="78" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Query 2</text><rect x="410" y="88" width="360" height="75" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.1"/><text x="424" y="112" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> listen_id, rating</tspan></text><text x="424" y="131" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="424" y="150" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> rating &gt; 4.0</tspan></text><rect x="410" y="191" width="360" height="158" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><path d="M418,191 h344 a8,8 0 0 1 8,8 v20 h-360 v-20 a8,8 0 0 1 8,-8 z" fill="#F4F5F7"/><line x1="410" y1="219" x2="770" y2="219" stroke="#D4D7DC" stroke-width="1.4"/><text x="438" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">listen_id</text><text x="530" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="411" y="219" width="5" height="26" fill="#3b82f6"/><text x="438" y="236.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="530" y="236.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><rect x="411" y="245" width="5" height="26" fill="#3b82f6"/><line x1="418" y1="245" x2="762" y2="245" stroke="#D4D7DC" stroke-width="0.6"/><text x="438" y="262.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="530" y="262.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><rect x="411" y="271" width="5" height="26" fill="#f97316"/><line x1="418" y1="271" x2="762" y2="271" stroke="#D4D7DC" stroke-width="0.6"/><text x="438" y="288.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4</text><text x="530" y="288.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.7</text><rect x="411" y="297" width="5" height="26" fill="#f97316"/><line x1="418" y1="297" x2="762" y2="297" stroke="#D4D7DC" stroke-width="0.6"/><text x="438" y="314.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">5</text><text x="530" y="314.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.6</text><rect x="411" y="323" width="5" height="26" fill="#8b5cf6"/><line x1="418" y1="323" x2="762" y2="323" stroke="#D4D7DC" stroke-width="0.6"/><text x="438" y="340.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">8</text><text x="530" y="340.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.9</text><text x="410" y="369" font-size="12" font-weight="700" fill="#0E0E10" text-anchor="start">5 rows: NULL dropped</text></g><g data-step="3"><text x="780" y="78" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Query 3</text><rect x="780" y="88" width="360" height="75" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.1"/><text x="794" y="112" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> listen_id, rating</tspan></text><text x="794" y="131" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="794" y="150" font-size="12.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> rating &lt;= 4.0</tspan></text><rect x="780" y="191" width="360" height="106" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.4"/><path d="M788,191 h344 a8,8 0 0 1 8,8 v20 h-360 v-20 a8,8 0 0 1 8,-8 z" fill="#F4F5F7"/><line x1="780" y1="219" x2="1140" y2="219" stroke="#D4D7DC" stroke-width="1.4"/><text x="808" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">listen_id</text><text x="900" y="210" font-size="9" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="781" y="219" width="5" height="26" fill="#3b82f6"/><text x="808" y="236.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="900" y="236.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><rect x="781" y="245" width="5" height="26" fill="#f97316"/><line x1="788" y1="245" x2="1132" y2="245" stroke="#D4D7DC" stroke-width="0.6"/><text x="808" y="262.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">6</text><text x="900" y="262.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><rect x="781" y="271" width="5" height="26" fill="#8b5cf6"/><line x1="788" y1="271" x2="1132" y2="271" stroke="#D4D7DC" stroke-width="0.6"/><text x="808" y="288.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">7</text><text x="900" y="288.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2.9</text><text x="780" y="317" font-size="12" font-weight="700" fill="#0E0E10" text-anchor="start">3 rows: NULL dropped again</text></g><text x="590.0" y="393" font-size="13" font-weight="600" fill="#6B7280" text-anchor="middle">Row 9 is NULL. Only IS NULL (rule 5) returns TRUE; &gt; and &lt;= return UNKNOWN, which WHERE drops.</text></svg>
