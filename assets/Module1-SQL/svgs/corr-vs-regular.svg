<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ci-t ci-d"><title id="ci-t">Regular gives one global average; correlated gives each user their own</title><desc id="ci-d">A Listens table grouped by user (Mickey blue, Minnie orange, Daffy purple) feeds two aggregations. A regular subquery sends all rows to one global average, 4.2, used for everyone. A correlated subquery sends each user's rows, along a colored arrow, to that user's own average: Mickey 4.2, Minnie 4.4, Daffy 3.9. The colored arrow is the correlation, WHERE user_id = u.user_id. Color key: blue Mickey, orange Minnie, purple Daffy; grey is the global path.</desc><defs><marker id="ci-grey" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker><marker id="ci-blue" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#3b82f6"/></marker><marker id="ci-orange" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f97316"/></marker><marker id="ci-purple" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#8b5cf6"/></marker></defs><rect x="0" y="0" width="1200" height="520" fill="#FBFBFC"/><text x="600.0" y="42" font-size="23" font-weight="800" fill="#0E0E10" text-anchor="middle">Regular: one global average. Correlated: each user's own.</text><text x="600.0" y="70" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Same data, two aggregations. The colored arrow links each user to their own average.</text><g data-step="1"><text x="56" y="120" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Listens</text><text x="356" y="120" font-size="12" font-weight="600" fill="#6B7280" text-anchor="end">9 rows</text><rect x="56" y="132" width="300" height="264" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M65,132 h282 a9,9 0 0 1 9,9 v21 h-300 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="56" y1="162" x2="356" y2="162" stroke="#D4D7DC" stroke-width="1.5"/><text x="92" y="152" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">name</text><text x="236" y="152" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="57" y="162" width="6" height="26" fill="#3b82f6"/><text x="92" y="179.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Mickey</text><text x="236" y="179.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">4.5</text><rect x="57" y="188" width="6" height="26" fill="#3b82f6"/><line x1="65" y1="188" x2="347" y2="188" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="205.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Mickey</text><text x="236" y="205.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">4.2</text><rect x="57" y="214" width="6" height="26" fill="#3b82f6"/><line x1="65" y1="214" x2="347" y2="214" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="231.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Mickey</text><text x="236" y="231.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">3.9</text><rect x="57" y="240" width="6" height="26" fill="#f97316"/><line x1="65" y1="240" x2="347" y2="240" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="257.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="236" y="257.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">4.7</text><rect x="57" y="266" width="6" height="26" fill="#f97316"/><line x1="65" y1="266" x2="347" y2="266" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="283.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="236" y="283.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">4.6</text><rect x="57" y="292" width="6" height="26" fill="#f97316"/><line x1="65" y1="292" x2="347" y2="292" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="309.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Minnie</text><text x="236" y="309.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">3.9</text><rect x="57" y="318" width="6" height="26" fill="#8b5cf6"/><line x1="65" y1="318" x2="347" y2="318" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="335.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Daffy</text><text x="236" y="335.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">2.9</text><rect x="57" y="344" width="6" height="26" fill="#8b5cf6"/><line x1="65" y1="344" x2="347" y2="344" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="361.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Daffy</text><text x="236" y="361.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">4.9</text><rect x="57" y="370" width="6" height="26" fill="#8b5cf6"/><line x1="65" y1="370" x2="347" y2="370" stroke="#D4D7DC" stroke-width="0.6"/><text x="92" y="387.0" font-size="14" font-weight="400" fill="#0E0E10" text-anchor="start">Daffy</text><text x="236" y="387.0" font-size="14" font-weight="600" fill="#9AA0AA" text-anchor="start">NULL</text></g><g data-step="2"><rect x="720" y="120" width="430" height="86" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/><rect x="720" y="120" width="430" height="5" rx="2.5" fill="#475569"/><text x="740" y="152" font-size="15" font-weight="700" fill="#475569" text-anchor="start">Regular subquery: one global average</text><text x="740" y="180" font-size="14" font-weight="400" fill="#3F3F46" text-anchor="start">AVG over all ratings</text><rect x="1030" y="158" width="96" height="34" rx="8" fill="#EEF0F2" stroke="#475569" stroke-width="1.3"/><text x="1078" y="181" font-size="18" font-weight="800" fill="#475569" font-family="ui-monospace, monospace" text-anchor="middle">4.2</text><text x="740" y="224" font-size="12" font-weight="400" fill="#6B7280" text-anchor="start">every user is compared to the same 4.2</text><path d="M364,162 C426,160 650,160 712,160" fill="none" stroke="#6B7280" stroke-width="2" marker-end="url(#ci-grey)"/></g><g data-step="3"><text x="720" y="258" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="start">Correlated subquery: each user's own average</text><rect x="720" y="270" width="430" height="164" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M729,270 h412 a9,9 0 0 1 9,9 v23 h-430 v-23 a9,9 0 0 1 9,-9 z" fill="#F4F5F7"/><line x1="720" y1="302" x2="1150" y2="302" stroke="#D4D7DC" stroke-width="1.5"/><text x="760" y="291" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">user</text><text x="900" y="291" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">AVG of THEIR ratings</text><rect x="721" y="302" width="6" height="44" fill="#3b82f6"/><text x="760" y="329.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Mickey</text><rect x="970" y="307.0" width="70" height="34" rx="8" fill="#FFFFFF" stroke="#3b82f6" stroke-width="1.5"/><text x="1005" y="330.0" font-size="17" font-weight="800" fill="#3b82f6" font-family="ui-monospace, monospace" text-anchor="middle">4.2</text><path d="M364,201.0 C436,201.0 640,324.0 712,324.0" fill="none" stroke="#3b82f6" stroke-width="2.4" marker-end="url(#ci-blue)"/><rect x="721" y="346" width="6" height="44" fill="#f97316"/><line x1="729" y1="346" x2="1141" y2="346" stroke="#D4D7DC" stroke-width="0.6"/><text x="760" y="373.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Minnie</text><rect x="970" y="351.0" width="70" height="34" rx="8" fill="#FFFFFF" stroke="#f97316" stroke-width="1.5"/><text x="1005" y="374.0" font-size="17" font-weight="800" fill="#f97316" font-family="ui-monospace, monospace" text-anchor="middle">4.4</text><path d="M364,279.0 C436,279.0 640,368.0 712,368.0" fill="none" stroke="#f97316" stroke-width="2.4" marker-end="url(#ci-orange)"/><rect x="721" y="390" width="6" height="44" fill="#8b5cf6"/><line x1="729" y1="390" x2="1141" y2="390" stroke="#D4D7DC" stroke-width="0.6"/><text x="760" y="417.0" font-size="14" font-weight="600" fill="#0E0E10" text-anchor="start">Daffy</text><rect x="970" y="395.0" width="70" height="34" rx="8" fill="#FFFFFF" stroke="#8b5cf6" stroke-width="1.5"/><text x="1005" y="418.0" font-size="17" font-weight="800" fill="#8b5cf6" font-family="ui-monospace, monospace" text-anchor="middle">3.9</text><path d="M364,357.0 C436,357.0 640,412.0 712,412.0" fill="none" stroke="#8b5cf6" stroke-width="2.4" marker-end="url(#ci-purple)"/><text x="600.0" y="462" font-size="12" font-weight="600" fill="#6B7280" text-anchor="middle">each colored arrow is the correlation: WHERE user_id = u.user_id keeps only that user's rows</text></g></svg>
