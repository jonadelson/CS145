<svg viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="sf-t sf-d"><title id="sf-t">SELECT-FROM-WHERE keeps some rows, then some columns</title><desc id="sf-d">FROM Listens loads nine rows with columns listen_id, user_id, song_id, rating, colored by user. WHERE rating greater than 4.0 strikes the four failing rows (3.9, 3.9, 2.9, and the NULL which is UNKNOWN). SELECT user_id, song_id, rating projects the five survivors to three columns, dropping listen_id. Color key: Mickey blue, Minnie orange, Daffy purple; struck rows fail WHERE.</desc><defs><marker id="sfwA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1200" height="470" fill="#FBFBFC"/><text x="600.0" y="44" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">SELECT-FROM-WHERE: keep some rows, then some columns</text><text x="600.0" y="70" font-size="14" font-weight="400" fill="#6B7280" text-anchor="middle">Execution order: FROM loads rows, WHERE filters rows, SELECT picks columns.</text><g data-step="1"><text x="50" y="105" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">FROM Listens</text><text x="410" y="105" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">9 rows</text><rect x="50" y="116" width="360" height="273" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M59,116 h342 a9,9 0 0 1 9,9 v21 h-360 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="50" y1="146" x2="410" y2="146" stroke="#D4D7DC" stroke-width="1.5"/><text x="64" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">listen_id</text><text x="150" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="240" y="136" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">song_id</text><text x="330" y="136" font-size="10" 