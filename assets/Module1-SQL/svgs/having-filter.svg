<svg viewBox="0 0 1180 386" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="having-filter-t having-filter-d"><title id="having-filter-t">An average rating filter on groups: HAVING tests each group's AVG(rati</title><desc id="having-filter-d">An average rating filter on groups: HAVING tests each group's AVG(rating); Mickey 4.2 and Minnie 4.4 pass, Daffy 3.9 is below 4.0 and the whole group drops. Color key: Mickey blue, Minnie orange, Daffy purple; struck rows/groups are filtered out.</desc><defs><marker id="hpA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker></defs><rect x="0" y="0" width="1180" height="386" fill="#FBFBFC"/><text x="590.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">HAVING filters GROUPS (after GROUP BY)</text><g data-step="1"><rect x="290" y="70" width="600" height="100" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="306" y="96" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> user_id, </tspan><tspan fill="#79c0ff" font-weight="700">COUNT</tspan><tspan fill="#E6EDF3">(*), </tspan><tspan fill="#79c0ff" font-weight="700">AVG</tspan><tspan fill="#E6EDF3">(rating)</tspan></text><text x="306" y="116" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="306" y="136" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">GROUP BY</tspan><tspan fill="#E6EDF3"> user_id</tspan></text><text x="306" y="156" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">HAVING</tspan><tspan fill="#E6EDF3"> </tspan><tspan fill="#79c0ff" font-weight="700">AVG</tspan><tspan fill="#E6EDF3">(rating) &gt; 4.0</tspan></text></g><g data-step="2"><rect x="295" y="121" width="4" height="18" rx="2" fill="#2563EB"/><text x="150" y="206" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="start">GROUP BY user_id  -&gt;  one row per user</text><text x="590" y="206" font-size="11" font-weight="600" fill="#6B7280" text-anchor="end">3 groups</text><rect x="150" y="216" width="440" height="114" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M159,216 h422 a9,9 0 0 1 9,9 v21 h-440 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="150" y1="246" x2="590" y2="246" stroke="#D4D7DC" stroke-width="1.5"/><text x="184" y="236" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="300" y="236" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">COUNT(*)</text><text x="440" y="236" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">AVG(rating)</text><rect x="151" y="246" width="6" height="28" fill="#2563EB"/><text x="184" y="264.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="300" y="264.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="440" y="264.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><rect x="151" y="274" width="6" height="28" fill="#EA580C"/><line x1="159" y1="274" x2="581" y2="274" stroke="#D4D7DC" stroke-width="0.6"/><text x="184" y="292.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">2</text><text x="300" y="292.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="440" y="292.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.4</text><rect x="151" y="302" width="6" height="28" fill="#7C3AED"/><line x1="159" y1="302" x2="581" y2="302" stroke="#D4D7DC" stroke-width="0.6"/><text x="184" y="320.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="300" y="320.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3</text><text x="440" y="320.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">3.9</text></g><g data-step="3"><rect x="295" y="141" width="4" height="18" rx="2" fill="#2563EB"/><line x1="590" y1="260.0" x2="602" y2="260.0" stroke="#D4D7DC" stroke-width="1"/><text x="606" y="264.0" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="start">4.2 &gt; 4.0  keep</text><line x1="590" y1="288.0" x2="602" y2="288.0" stroke="#D4D7DC" stroke-width="1"/><text x="606" y="292.0" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="start">4.4 &gt; 4.0  keep</text><line x1="590" y1="316.0" x2="602" y2="316.0" stroke="#D4D7DC" stroke-width="1"/><text x="606" y="320.0" font-size="12" font-style="italic" fill="#6B7280">3.9 &gt; 4.0  fails</text><line x1="164" y1="316.0" x2="576" y2="316.0" stroke="#9AA0AA" stroke-width="1.8"/><text x="150" y="360" font-size="15" font-weight="800" fill="#0E0E10" text-anchor="start">Output:  Mickey, Minnie   (Daffy's 3.9 is below 4.0)</text></g></svg>
