<svg viewBox="0 0 1200 494" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ao-t ao-d"><title id="ao-t">AND keeps a row only when both conditions hold; OR when either does</title><desc id="ao-d">Two queries side by side on the same nine rows. Left: WHERE user_id = 1 AND rating > 4.0 keeps only rows where both are true, two rows (Mickey 4.5 and 4.2); the rest are struck out. Right: WHERE user_id = 1 OR rating > 4.0 keeps a row when either is true, six rows. The NULL rating makes rating > 4.0 UNKNOWN, so that row is dropped by both. Color key: Mickey blue, Minnie orange, Daffy purple; green check keeps, grey strike drops.</desc><rect x="0" y="0" width="1200" height="494" fill="#FBFBFC"/><text x="600.0" y="42" font-size="22" font-weight="800" fill="#0E0E10" text-anchor="middle">WHERE with AND and OR: same two conditions, opposite strictness</text><line x1="600.0" y1="62" x2="600.0" y2="464" stroke="#D4D7DC" stroke-width="1.4" stroke-dasharray="6,5"/><g data-step="1"><text x="44" y="66" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="start">Keep a row only when BOTH hold</text><rect x="44" y="76" width="540" height="80" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1.2"/><text x="60" y="102" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">SELECT</tspan><tspan fill="#E6EDF3"> user_id, song_id, rating</tspan></text><text x="60" y="122" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">FROM</tspan><tspan fill="#E6EDF3"> Listens</tspan></text><text x="60" y="142" font-size="13.5" font-family="ui-monospace, monospace" xml:space="preserve"><tspan fill="#79c0ff" font-weight="700">WHERE</tspan><tspan fill="#E6EDF3"> user_id = 1 </tspan><tspan fill="#79c0ff" font-weight="700">AND</tspan><tspan fill="#E6EDF3"> rating &gt; 4.0</tspan></text></g><g data-step="2"><rect x="44" y="186" width="250" height="264" rx="9" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/><path d="M53,186 h232 a9,9 0 0 1 9,9 v21 h-250 v-21 a9,9 0 0 1 9,-9 z" fill="#F4F4F6"/><line x1="44" y1="216" x2="294" y2="216" stroke="#D4D7DC" stroke-width="1.5"/><text x="78" y="206" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">user_id</text><text x="194" y="206" font-size="10" font-weight="700" fill="#6B7280" text-anchor="start">rating</text><rect x="45" y="216" width="6" height="26" fill="#2563EB"/><text x="78" y="233.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="194" y="233.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.5</text><line x1="294" y1="229.0" x2="306" y2="229.0" stroke="#D4D7DC" stroke-width="1"/><text x="310" y="233.0" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="start">✓ keep</text><rect x="45" y="242" width="6" height="26" fill="#2563EB"/><line x1="53" y1="242" x2="285" y2="242" stroke="#D4D7DC" stroke-width="0.6"/><text x="78" y="259.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="194" y="259.0" font-size="13" font-weight="400" fill="#0E0E10" font-family="ui-monospace, monospace" text-anchor="start">4.2</text><line x1="294" y1="255.0" x2="306" y2="255.0" stroke="#D4D7DC" stroke-width="1"/><text x="310" y="259.0" font-size="12.5" font-weight="700" fill="#16A34A" text-anchor="start">✓ keep</text><rect x="45" y="268" width="6" height="26" fill="#2563EB"/><line x1="53" y1="268" x2="285" y2="268" stroke="#D4D7DC" stroke-width="0.6"/><text x="78" y="285.0" font-size="13" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-anchor="start">1</text><text x="194" y="285.0" font-size="13" font-weight="400" fill="#9AA0AA" font-family="ui-monospace, monospace" text-anchor="start">3.9</text><line 