<svg viewBox="0 0 1140 360" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="ns-t ns-d">
  <title id="ns-t">Run them one at a time: every wait is wasted</title>
  <desc id="ns-d">A timeline of one server running transactions serially, left to right. Violet blocks
  are transactions actually computing; wide grey blocks are the server sitting idle while a transaction
  waits on a disk read. Because only one transaction runs at a time, every grey gap is wasted: no other
  transaction may use it. A long-running transaction, T2, stretches its idle span so the transactions
  queued behind it, T3 and T4, wait far longer than their own work needs. Color key: violet is a
  transaction running, grey is the server idle on disk while everyone else is blocked.</desc>

  <text x="570" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Run them one at a time: every wait is wasted</text>
  <text x="570" y="60" text-anchor="middle" font-size="16" fill="#3F3F46">One server, one transaction start to finish. While it waits on disk, the whole queue waits too.</text>

  <!-- axis / lane -->
  <g data-step="1">
    <text x="60" y="120" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.5">SERVER</text>
    <line x1="60" y1="235" x2="1090" y2="235" stroke="#6B7280" stroke-width="1.5"/>
    <text x="60" y="258" font-size="13" fill="#6B7280">time &#8594;</text>
  </g>

  <!-- T1 run + idle -->
  <g data-step="2">
    <rect x="60" y="140" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="60" y="140" width="5" height="80" rx="2.5" fill="#7C3AED"/>
    <text x="124" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">T1</text>
    <text x="124" y="196" text-anchor="middle" font-size="13" fill="#6B7280">run</text>
    <rect x="180" y="140" width="150" height="80" rx="6" fill="#E7EAEE" stroke="#D4D7DC" stroke-width="1"/>
    <text x="255" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6B7280">idle</text>
    <text x="255" y="196" text-anchor="middle" font-size="12.5" fill="#6B7280">disk read</text>
  </g>

  <!-- T2 run + long idle -->
  <g data-step="3">
    <rect x="330" y="140" width="110" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="330" y="140" width="5" height="80" rx="2.5" fill="#7C3AED"/>
    <text x="385" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">T2</text>
    <text x="385" y="196" text-anchor="middle" font-size="13" fill="#6B7280">run</text>
    <rect x="440" y="140" width="350" height="80" rx="6" fill="#E7EAEE" stroke="#D4D7DC" stroke-width="1"/>
    <text x="615" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#6B7280">idle</text>
    <text x="615" y="196" text-anchor="middle" font-size="12.5" fill="#6B7280">long disk read, nobody else runs</text>
  </g>

  <!-- T3 run -->
  <g data-step="4">
    <rect x="790" y="140" width="120" height="80" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="790" y="140" width="5" height="80" rx="2.5" fill="#7C3AED"/>
    <text x="854" y="175" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">T3</text>
    <text x="854" y="196" text-anchor="middle" font-size="13" fill="#6B7280">run</text>
    <rect x="910" y="140" width="80" height="80" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="950" y="184" text-anchor="middle" font-size="13" fill="#6B7280">T4 &#8230;</text>
  </g>

  <!-- head-of-line bracket -->
  <g data-step="5">
    <path d="M 330 282 L 330 290 L 990 290 L 990 282" fill="none" stroke="#6B7280" stroke-width="1.5"/>
    <text x="660" y="312" text-anchor="middle" font-size="13.5" fill="#3F3F46">T3 and T4 sit blocked behind T2's wait, far longer than their own work needs.</text>
  </g>

  <!-- color key -->
  <text x="570" y="344" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = a transaction running&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the server idle on disk while everyone else is blocked</tspan></text>
</svg>
