<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:460px; display:block; margin:1rem auto;" role="img" aria-labelledby="correctness-hierarchy-t correctness-hierarchy-d">
  <title id="correctness-hierarchy-t">Nested hierarchy: every S2PL schedule is a 2PL schedule, every 2PL schedule is conflict-serializable, every conflict-serializable schedule is serializable</title>
  <desc id="correctness-hierarchy-d">Nested hierarchy: every S2PL schedule is a 2PL schedule, every 2PL schedule is conflict-serializable, every conflict-serializable schedule is serializable</desc>
    <g data-step="1">
    <ellipse cx="230" cy="160" rx="210" ry="140" fill="#FFFFFF" stroke="#9AA0AA" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#6B7280">Serializable schedules</text>
    </g>
    <g data-step="2">
    <ellipse cx="230" cy="180" rx="160" ry="105" fill="#ECF1FE" stroke="#2563EB" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#2563EB">Conflict-Serializable (CS)</text>
    </g>
    <g data-step="3">
    <rect x="135" y="140" width="190" height="120" rx="8" fill="#E1F4EC" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="160" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#16A34A">2PL</text>
    </g>
    <g data-step="4">
    <rect x="180" y="180" width="100" height="65" rx="6" fill="#E7EAEE" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="230" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">S2PL</text>
    <text x="230" y="310" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6B7280" font-style="italic">S2PL ⊂ 2PL ⊂ Conflict-Serializable ⊂ Serializable</text>
    </g>
</svg>
