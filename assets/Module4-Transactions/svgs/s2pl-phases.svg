<svg viewBox="0 -34 360 234" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:360px; display:block; margin:0.5rem auto;" role="img" aria-labelledby="s2pl-phases-t s2pl-phases-d">
  <title id="s2pl-phases-t">Strict 2PL (S2PL): locks held rise during the growing phase, plateau, then drop to zero in one step at COMMIT</title>
  <desc id="s2pl-phases-d">A lock-count curve over the life of one transaction under Strict 2PL. Locks held (violet) climb step by step, plateau while the transaction holds every lock, then drop to zero in a single step at commit. A dashed divider marks the commit, the only point where locks release. Color key: violet is the locks-held curve.</desc>
    <text x="185" y="-14" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0E0E10">Strict 2PL (S2PL)</text>
    <g data-step="1">
                <line x1="40" y1="160" x2="330" y2="160" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="40" y1="160" x2="40"  y2="30"  stroke="#D4D7DC" stroke-width="1.5"/>
                <text x="40"  y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">begin</text>
                <text x="280" y="180" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">commit</text>
                <text x="18" y="95" text-anchor="middle" transform="rotate(-90 18 95)" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#6B7280">Number of Locks</text>
                <text x="185" y="195" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">time →</text>
    </g>
    <g data-step="2">
                <polyline points="40,160 70,160 70,140 110,140 110,115 150,115 150,90 280,90" fill="none" stroke="var(--m4, #7C3AED)" stroke-width="2.5"/>
                <text x="160" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="var(--m4, #7C3AED)">growing → hold</text>
                <text x="160" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">acquire, then keep all locks</text>
    </g>
    <g data-step="3">
                <line x1="280" y1="30" x2="280" y2="160" stroke="#D4D7DC" stroke-width="1" stroke-dasharray="4,3"/>
                <text x="280" y="22" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">at commit</text>
                <polyline points="280,90 280,160 320,160" fill="none" stroke="var(--m4, #7C3AED)" stroke-width="2.5"/>
                <text x="305" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="var(--m4, #7C3AED)">release</text>
                <text x="305" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">all at once</text>
    </g>
</svg>
