<svg viewBox="0 0 280 140" xmlns="http://www.w3.org/2000/svg" style="width:100%; max-width:280px; display:block; margin:0 auto;" role="img" aria-labelledby="io-lag-t io-lag-d">
  <title id="io-lag-t">I/O lag: Read-start (Rs) at time 6 and Read-end (Re) at time 11 on resource B, with a ~5 unit gap of CPU idle time between them</title>
  <desc id="io-lag-d">A short time axis for one disk read on resource B. A violet marker at time 6 is the read-start (Rs); a second violet marker at time 11 is the read-end (Re). Between them a dashed span labels roughly five units of CPU idle time, the gap another transaction can use. Color key: violet marks the read-start and read-end events.</desc>
    <g data-step="1">
                <line x1="20" y1="115" x2="260" y2="115" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="39" y1="113" x2="39" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="74" y1="113" x2="74" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="109" y1="113" x2="109" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="144" y1="113" x2="144" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="179" y1="113" x2="179" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <line x1="214" y1="113" x2="214" y2="119" stroke="#D4D7DC" stroke-width="1.5"/>
                <text x="39" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">6</text>
                <text x="74" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">7</text>
                <text x="109" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">8</text>
                <text x="144" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">9</text>
                <text x="179" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">10</text>
                <text x="214" y="132" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#6B7280">11</text>
    </g>
    <g data-step="2">
                <rect x="30" y="20" width="9" height="40" fill="#7C3AED"/>
                <text x="44" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Rs</text>
                <text x="44" y="46" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">B</text>
    </g>
    <g data-step="3">
                <rect x="220" y="20" width="9" height="40" fill="#7C3AED"/>
                <text x="234" y="32" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0E0E10">Re</text>
                <text x="234" y="46" font-family="Inter, sans-serif" font-size="13" fill="#6B7280">B</text>
                <path d="M 39 75 L 220 75" stroke="#D4D7DC" stroke-width="1.5" stroke-dasharray="4,3"/>
                <path d="M 39 70 L 39 80" stroke="#D4D7DC" stroke-width="1.5"/>
                <path d="M 220 70 L 220 80" stroke="#D4D7DC" stroke-width="1.5"/>
                <text x="130" y="93" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-style="italic" fill="#6B7280">~5 units of CPU idle</text>
    </g>
</svg>
