<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="cs-t cs-d">
  <title id="cs-t">The concurrency full stack: one COMMIT, four layers down to one instruction</title>
  <desc id="cs-d">A four-layer call stack. Your Code runs COMMIT and sees one
  transaction. It delegates down to the Database, whose lock manager acquires an
  exclusive lock on the row. The lock manager delegates down to the Operating
  System, which takes a mutex on its thread. The OS delegates down to the
  Hardware, which executes one compare-and-swap, the single indivisible
  instruction every layer reduces to. The guarantee then returns back up the
  right side: swapped atomically, mutex held, row locked, transaction isolated.
  Color key: violet is the call delegating down; grey is the layers and the
  guarantee returning up.</desc>
  <defs>
    <marker id="ah-cs-d" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#7C3AED"/></marker>
    <marker id="ah-cs-u" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#6B7280"/></marker>
  </defs>

  <text x="480" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">The concurrency full stack</text>
  <text x="480" y="60" text-anchor="middle" font-size="14" fill="#6B7280">One COMMIT delegates down four layers, until it bottoms out at a single atomic instruction.</text>

  <!-- down-rail spine (static guide) -->
  <line x1="150" y1="96" x2="150" y2="444" stroke="#E7EAEE" stroke-width="2"/>

  <!-- Layer 1: Your Code -->
  <g data-step="1">
    <rect x="70" y="96" width="820" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="70" y="96" width="6" height="78" rx="3" fill="#7C3AED"/>
    <text x="170" y="126" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1">YOUR CODE</text>
    <text x="170" y="150" font-size="14" fill="#3F3F46">You see one transaction.</text>
    <rect x="430" y="114" width="440" height="42" rx="6" fill="#0D1117"/>
    <text x="448" y="141" font-family="JetBrains Mono, monospace" font-size="15" xml:space="preserve"><tspan fill="#79C0FF">BEGIN</tspan><tspan fill="#E6EDF3">; UPDATE Likes</tspan><tspan fill="#8B949E"> …</tspan><tspan fill="#E6EDF3">; </tspan><tspan fill="#79C0FF">COMMIT</tspan><tspan fill="#E6EDF3">;</tspan></text>
  </g>

  <!-- Layer 2: Database -->
  <g data-step="2">
    <line x1="150" y1="174" x2="150" y2="184" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-cs-d)"/>
    <rect x="70" y="186" width="820" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="70" y="186" width="6" height="78" rx="3" fill="#7C3AED"/>
    <text x="170" y="216" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1">DATABASE · LOCK MANAGER</text>
    <text x="170" y="240" font-size="14" fill="#3F3F46">Decides WHAT to lock.</text>
    <rect x="430" y="204" width="440" height="42" rx="6" fill="#0D1117"/>
    <text x="448" y="231" font-family="JetBrains Mono, monospace" font-size="15" xml:space="preserve"><tspan fill="#79C0FF">lockManager</tspan><tspan fill="#E6EDF3">.</tspan><tspan fill="#79C0FF">acquire</tspan><tspan fill="#E6EDF3">(likesRow, </tspan><tspan fill="#79C0FF">X</tspan><tspan fill="#E6EDF3">)</tspan></text>
  </g>

  <!-- Layer 3: Operating System -->
  <g data-step="3">
    <line x1="150" y1="264" x2="150" y2="274" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-cs-d)"/>
    <rect x="70" y="276" width="820" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="70" y="276" width="6" height="78" rx="3" fill="#7C3AED"/>
    <text x="170" y="306" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1">OPERATING SYSTEM</text>
    <text x="170" y="330" font-size="14" fill="#3F3F46">Knows HOW to lock.</text>
    <rect x="430" y="294" width="440" height="42" rx="6" fill="#0D1117"/>
    <text x="448" y="321" font-family="JetBrains Mono, monospace" font-size="15" xml:space="preserve"><tspan fill="#79C0FF">mutex_lock</tspan><tspan fill="#E6EDF3">(&amp;latch)</tspan><tspan fill="#8B949E">   // semaphore, spinlock</tspan></text>
  </g>

  <!-- Layer 4: Hardware -->
  <g data-step="4">
    <line x1="150" y1="354" x2="150" y2="364" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ah-cs-d)"/>
    <rect x="70" y="366" width="820" height="78" rx="8" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <rect x="70" y="366" width="6" height="78" rx="3" fill="#7C3AED"/>
    <text x="170" y="396" font-size="13" font-weight="700" fill="#7C3AED" letter-spacing="1">HARDWARE · THE BASE</text>
    <text x="170" y="420" font-size="14" fill="#3F3F46">One indivisible instruction.</text>
    <rect x="430" y="384" width="440" height="42" rx="6" fill="#0D1117"/>
    <text x="448" y="411" font-family="JetBrains Mono, monospace" font-size="15" xml:space="preserve"><tspan fill="#79C0FF">compare_and_swap</tspan><tspan fill="#E6EDF3">(p, old, new)</tspan></text>
  </g>

  <!-- the guarantee returns up the right side -->
  <g data-step="5">
    <line x1="908" y1="384" x2="908" y2="276" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-cs-u)"/>
    <line x1="908" y1="294" x2="908" y2="186" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-cs-u)"/>
    <line x1="908" y1="204" x2="908" y2="116" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-cs-u)"/>
    <text x="924" y="402" font-size="12.5" fill="#6B7280" transform="rotate(-90 924 402)" text-anchor="middle">guarantee returns up</text>
  </g>

  <text x="480" y="500" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = the call delegating down&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the layers and the guarantee returning up</tspan></text>
</svg>
