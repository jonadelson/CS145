    <text x="756" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">7</text>
    <path d="M537,473 Q460,485 386,473" fill="none" stroke="#2563EB" stroke-width="2"/>
        <polygon points="385.9,473.2 398.7,469.1 396.8,481.0" fill="#2563EB"/>
    <text x="460" y="505" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#2563EB">B-(#4,#7)</text>
    <text x="460" y="525" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#2563EB">B-(#5,#6)</text>
    <text x="460" y="545" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#2563EB">B-(#5,#7)</text>
    </g>
  <g data-step="4">
    <rect x="90" y="600" width="740" height="34" rx="8" fill="#ECF1FE" stroke="#16A34A"/>
    <rect x="90" y="600" width="4" height="34" rx="2" fill="#16A34A"/>
    <text x="108" y="622" font-size="15" font-weight="700" fill="#059669">Acyclic &#8594; conflict-serializable. Equivalent serial order: T2 &#8594; T1 &#8594; T3</text>
    <text x="90" y="648" font-size="14" font-weight="700" fill="#3F3F46">Equivalent Serial Schedule</text>
    <text x="155" y="670" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Transaction</text>
    <text x="284" y="670" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">Action</text>
