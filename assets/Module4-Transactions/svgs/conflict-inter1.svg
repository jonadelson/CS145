    <circle cx="573" cy="467" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="573" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#2563EB">T2</text>
    <circle cx="347" cy="467" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="347" y="473" text-anchor="middle" font-size="17" font-weight="700" fill="#2563EB">T3</text>
    </g>
  <g data-step="2">
