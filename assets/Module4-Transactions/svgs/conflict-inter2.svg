<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 710" role="img" aria-labelledby="cf-t cf-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="cf-t">Conflict analysis</title>
  <desc id="cf-d">Conflict-serializability analysis: a table of conflicting actions (Txn 1, Txn 2, Variable, and the step in each), then a conflict graph with one node per transaction and a directed edge per conflict, and a verdict. A cycle (its two edges in red and orange, each matching its source rows) means the schedule is not conflict-serializable; an acyclic graph is serializable and equivalent to the serial order shown.</desc>
  
  <text x="90" y="34" font-size="17" font-weight="700" fill="#0E0E10">Conflicting Actions</text>
  <text x="164" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Txn 1</text>
  <text x="312" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Txn 2</text>
  <text x="460" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Variable</text>
  <text x="608" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Step (Txn 1)</text>
  <text x="756" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Step (Txn 2)</text>
  <line x1="90" y1="72" x2="830" y2="72" stroke="#D4D7DC"/>
  <text x="90" y="290" font-size="17" font-weight="700" fill="#0E0E10">Conflict Graph</text>
  <g data-step="1">
    <text x="164" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="312" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">T1</text>
    <text x="460" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">A</text>
    <text x="608" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">2</text>
    <text x="756" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">3</text>
    <rect x="90" y="113" width="740" height="27" fill="#F7F8FA"/>
    <text x="164" y="132" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="312" y="132" text-anchor="middle" font-size="14" fill="#0E0E10">T3</text>
    <text x="460" y="132" text-anchor="middle" font-size="14" fill="#0E0E10">B</text>
    <text x="608" y="132" text-anchor="middle" font-size="14" fill="#0E0E10">4</text>
    <text x="756" y="132" text-anchor="middle" font-size="14" fill="#0E0E10">7</text>
    <text x="164" y="159" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="312" y="159" text-anchor="middle" font-size="14" fill="#0E0E10">T3</text>
    <text x="460" y="159" text-anchor="middle" font-size="14" fill="#0E0E10">B</text>
    <text x="608" y="159" text-anchor="middle" font-size="14" fill="#0E0E10">5</text>
    <text x="756" y="159" text-anchor="middle" font-size="14" fill="#0E0E10">6</text>
    <rect x="90" y="167" width="740" height="27" fill="#F7F8FA"/>
    <text x="164" y="186" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="312" y="186" text-anchor="middle" font-size="14" fill="#0E0E10">T3</text>
    <text x="460" y="186" text-anchor="middle" font-size="14" fill="#0E0E10">B</text>
    <text x="608" y="186" text-anchor="middle" font-size="14" fill="#0E0E10">5</text>
    <text x="756" y="186" text-anchor="middle" font-size="14" fill="#0E0E10">7</text>
    <text x="164" y="213" text-anchor="middle" font-size="14" fill="#0E0E10">T3</text>
    <text x="312" y="213" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="460" y="213" text-anchor="middle" font-size="14" fill="#0E0E10">B</text>
    <text x="608" y="213" text-anchor="middle" font-size="14" fill="#0E0E10">6</text>
    <text x="756" y="213" text-anchor="middle" font-size="14" fill="#0E0E10">9</text>
    <rect x="90" y="221" width="740" height="27" fill="#F7F8FA"/>
    <text x="164" y="240" text-anchor="middle" font-size="14" fill="#0E0E10">T3</text>
    <text x="312" y="240" text-anchor="middle" font-size="14" fill="#0E0E10">T2</text>
    <text x="460" y="240" text-anchor="middle" font-size="14" fill="#0E0E10">B</text>
