  <g data-step="5">
    <rect x="90" y="654" width="740" height="34" rx="8" fill="#FCEBEA" stroke="#DC2626"/>
    <rect x="90" y="654" width="4" height="34" rx="2" fill="#DC2626"/>
    <text x="108" y="676" font-size="15" font-weight="700" fill="#DC2626">Cycle T2 &#8594; T3 &#8594; T2.  So NOT conflict-serializable.</text>
    </g>
</svg>
