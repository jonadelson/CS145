    <text x="460" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">B</text>
    <text x="608" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">5</text>
    <text x="756" y="159" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">6</text>
    <rect x="90" y="167" width="740" height="27" fill="#FCEBEA"/>
    <rect x="90" y="167" width="4" height="27" fill="#DC2626"/>
    <text x="164" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">T2</text>
    <text x="312" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">T3</text>
    <text x="460" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">B</text>
    <text x="608" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">5</text>
    <text x="756" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">7</text>
    <path d="M540,506 Q460,469 383,505" fill="none" stroke="#DC2626" stroke-width="2.4"/>
        <polygon points="382.8,504.6 391.2,494.2 396.2,505.1" fill="#DC2626"/>
    <text x="460" y="409" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#DC2626">B-(#4,#7)</text>
    <text x="460" y="429" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#DC2626">B-(#5,#6)</text>
    <text x="460" y="449" text-anchor="middle" font-size="14" font-family="ui-monospace,monospace" fill="#DC2626">B-(#5,#7)</text>
    </g>
  <g data-step="4">
    <rect x="90" y="194" width="740" height="27" fill="#FCEBEA"/>
    <rect x="90" y="194" width="4" height="27" fill="#EA580C"/>
    <text x="164" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">T3</text>
    <text x="312" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">T2</text>
    <text x="460" y="213" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">B</text>
