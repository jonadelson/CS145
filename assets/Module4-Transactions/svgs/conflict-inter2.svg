    <text x="312" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">T1</text>
    <text x="460" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">A</text>
    <text x="608" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">2</text>
    <text x="756" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">3</text>
