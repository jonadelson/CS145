    <circle cx="460" cy="326" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="460" y="332" text-anchor="middle" font-size="17" font-weight="700" fill="#2563EB">T1</text>
    <circle cx="573" cy="521" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="573" y="527" text-anchor="middle" font-size="17" font-weight="700" fill="#2563EB">T2</text>
    <circle cx="347" cy="521" r="34" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <text x="347" y="527" text-anchor="middle" font-size="17" font-weight="700" fill="#2563EB">T3</text>
    </g>
  <g data-step="2">
    <rect x="90" y="86" width="740" height="27" fill="#ECF1FE"/>
    <rect x="90" y="86" width="4" height="27" fill="#2563EB"/>
