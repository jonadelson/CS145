<svg viewBox="0 0 1100 440" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="s2s-t s2s-d">
  <title id="s2s-t">Sliding an interleaved schedule into a serial one by swapping non-conflicting neighbours</title>
  <desc id="s2s-d">An interleaved schedule of four actions across two transactions. T1's two tiles
  (read A, write B), highlighted in violet, start split apart with a T2 action between them. The goal
  is to swap non-conflicting neighbours to gather T1's actions together, and then T2's, into contiguous
  blocks, which is a serial schedule. Markers between tiles show which pairs may swap (violet) and the
  one write-write conflict on B that may not (red). One free swap of the middle pair gathers T1 into one
  block and T2 into the next, giving the serial order T1 then T2. Color key: violet marks T1 and the free
  swaps, red marks the conflict that cannot move.</desc>

  <defs>
    <marker id="s2s-ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#7C3AED"/></marker>
  </defs>

  <text x="550" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#0E0E10">Can we swap this into a serial schedule?</text>
  <text x="550" y="58" text-anchor="middle" font-size="15" fill="#3F3F46">Gather each transaction's actions into one block by swapping free neighbours. Watch T1, in violet.</text>

  <!-- TOP: interleaved schedule -->
  <g data-step="1">
    <rect x="120" y="92" width="140" height="46" rx="6" fill="#EFE8FB" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="190" y="120" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#7C3AED">T1</tspan>  R(A)</text>
    <rect x="335" y="92" width="140" height="46" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="405" y="120" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">T2</tspan>  R(A)</text>
    <rect x="550" y="92" width="140" height="46" rx="6" fill="#EFE8FB" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="620" y="120" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#7C3AED">T1</tspan>  W(B)</text>
    <rect x="765" y="92" width="140" height="46" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="835" y="120" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">T2</tspan>  W(B)</text>
  </g>

  <!-- adjacency verdicts -->
  <g data-step="2">
    <text x="297" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#7C3AED">&#8644;</text>
    <text x="297" y="134" text-anchor="middle" font-size="14" fill="#6B7280" font-family="JetBrains Mono, monospace">R, R</text>
    <text x="512" y="116" text-anchor="middle" font-size="19" font-weight="700" fill="#7C3AED">&#8644;</text>
    <text x="512" y="134" text-anchor="middle" font-size="14" fill="#6B7280" font-family="JetBrains Mono, monospace">A &#8800; B</text>
    <text x="727" y="115" text-anchor="middle" font-size="17" font-weight="700" fill="#DC2626">&#10007;</text>
    <text x="727" y="134" text-anchor="middle" font-size="14" fill="#DC2626" font-family="JetBrains Mono, monospace">W, W on B</text>
  </g>

  <!-- the one free swap that sorts it -->
  <g data-step="3">
    <path d="M 405 150 L 405 156 L 620 156 L 620 150" fill="none" stroke="#7C3AED" stroke-width="1.5"/>
    <line x1="512" y1="156" x2="512" y2="236" stroke="#7C3AED" stroke-width="2" marker-end="url(#s2s-ah)"/>
    <text x="528" y="200" font-size="14" font-weight="500" fill="#7C3AED">one free swap</text>
  </g>

  <!-- BOTTOM: serial, each transaction one block -->
  <g data-step="4">
    <rect x="229" y="254" width="304" height="62" rx="9" fill="none" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="381" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">T1 block</text>
    <rect x="567" y="254" width="304" height="62" rx="9" fill="none" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="719" y="249" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">T2 block</text>

    <rect x="237" y="262" width="140" height="46" rx="6" fill="#EFE8FB" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="307" y="290" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#7C3AED">T1</tspan>  R(A)</text>
    <rect x="385" y="262" width="140" height="46" rx="6" fill="#EFE8FB" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="455" y="290" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#7C3AED">T1</tspan>  W(B)</text>
    <rect x="575" y="262" width="140" height="46" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="645" y="290" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">T2</tspan>  R(A)</text>
    <rect x="723" y="262" width="140" height="46" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <text x="793" y="290" text-anchor="middle" font-size="15" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">T2</tspan>  W(B)</text>

    <text x="550" y="338" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">serial: T1, then T2</text>
    <text x="550" y="360" text-anchor="middle" font-size="14" fill="#6B7280">the one conflict (W, W on B) is what fixed T1 before T2</text>
  </g>

  <!-- color key -->
  <text x="550" y="418" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = T1 and the free swaps&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red &#10007;</tspan><tspan fill="#3F3F46"> = the conflict you cannot cross</tspan></text>
</svg>
