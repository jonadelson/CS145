<svg viewBox="0 0 1080 360" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="mvccgit-t mvccgit-d"
     style="width:100%; max-width:1080px; display:block; margin:1.5rem auto;"
     font-family="Inter, sans-serif">
  <title id="mvccgit-t">When you pulled decides what you see.</title>
  <desc id="mvccgit-d">A timeline reads left to right as one repository changes over time. Version v1 is the base. Engineer B pulls early and gets v1. Engineer C then commits a change, which adds version v2, equal to v1 plus the diff, drawn in violet. Engineer D pulls afterward and gets v2, while Engineer B, who pulled before the commit, still holds v1 and is unaffected. Color key: violet = C's change and the new v2; grey = the older base v1.</desc>

  <text x="540" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">When you pulled decides what you see</text>
  <text x="540" y="66" text-anchor="middle" font-size="14" fill="#3F3F46">One repository changes over time. Your checkout is frozen at the moment you pulled.</text>
  <text x="540" y="322" text-anchor="middle" font-size="14" fill="#3F3F46">Color key: <tspan fill="#7C3AED" font-weight="700">violet</tspan> = C's change and the new v2 · <tspan fill="#6B7280" font-weight="700">grey</tspan> = the older base v1.</text>

  <g data-step="1">
  <text x="70" y="195" font-size="14" font-weight="700" fill="#7C3AED">Repo</text>
  <line x1="160" y1="190" x2="976" y2="190" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="982,190 974,186 974,194" fill="#6B7280"/>
  <text x="975" y="178" text-anchor="end" font-size="14" font-style="italic" fill="#6B7280">time →</text>
  <rect x="235" y="150" width="110" height="32" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/>
  <text x="290" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">v1 · base</text>
  <line x1="290" y1="182" x2="290" y2="190" stroke="#D4D7DC" stroke-width="1"/>
  </g>

  <g data-step="2">
  <line x1="430" y1="190" x2="430" y2="234" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="430,238 425,230 435,230" fill="#6B7280"/>
  <text x="446" y="216" font-size="14" fill="#6B7280">pull</text>
  <rect x="300" y="239" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/>
  <rect x="300" y="239" width="6" height="50" rx="3" fill="#6B7280"/>
  <text x="320" y="262" font-size="14" font-weight="700" fill="#0E0E10">Engineer B · has v1</text>
  <text x="320" y="281" font-size="14" fill="#6B7280">pulled before the commit, unaffected</text>
  </g>

  <g data-step="3">
  <rect x="478" y="92" width="244" height="46" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/>
  <rect x="478" y="92" width="6" height="46" rx="3" fill="#7C3AED"/>
  <text x="498" y="121" font-size="14" font-weight="700" fill="#0E0E10">Engineer C commits a change</text>
  <line x1="600" y1="138" x2="600" y2="173" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="600,178 595,170 605,170" fill="#6B7280"/>
  <text x="615" y="162" font-size="14" fill="#6B7280">commit</text>
  <rect x="578" y="178" width="44" height="24" rx="5" fill="#7C3AED"/>
  <text x="600" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">diff</text>
  <rect x="645" y="150" width="150" height="32" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="720" y="171" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">v2 = v1 + diff</text>
  <line x1="720" y1="182" x2="720" y2="190" stroke="#7C3AED" stroke-width="1"/>
  </g>

  <g data-step="4">
  <line x1="860" y1="190" x2="860" y2="234" stroke="#6B7280" stroke-width="1.5"/>
  <polygon points="860,238 855,230 865,230" fill="#6B7280"/>
  <text x="876" y="216" font-size="14" fill="#6B7280">pull</text>
  <rect x="720" y="239" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.2"/>
  <rect x="720" y="239" width="6" height="50" rx="3" fill="#7C3AED"/>
  <text x="740" y="262" font-size="14" font-weight="700" fill="#0E0E10">Engineer D · has v2</text>
  <text x="740" y="281" font-size="14" fill="#6B7280">pulled after, sees C's change</text>
  </g>
</svg>
