<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 472" role="img" aria-labelledby="def-t def-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="def-t">Serial, interleaved, and serializable schedules</title>
  <desc id="def-d">Three kinds of schedule for two transactions T1 and T2, each box one action written like T1.R(A). A serial schedule runs T1's actions to completion then T2's. An interleaved schedule mixes them in time. A serializable schedule is an interleaving whose result matches some serial order. Blue boxes are reads, orange boxes are writes, and the T1 or T2 prefix names the transaction. Color key: blue read, orange write.</desc>
  <text x="24" y="34" font-size="24" font-weight="700" fill="#0E0E10">Three kinds of schedule</text>

  <g data-step="1">
    <text x="24" y="100" font-size="18" font-weight="700" fill="#0E0E10">Serial</text>
    <text x="24" y="126" font-size="14" fill="#3F3F46">One transaction runs to completion,</text>
    <text x="24" y="144" font-size="14" fill="#3F3F46">then the next. No overlap.</text>
    <rect x="330" y="86" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="365" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.R(A)</text>
    <rect x="406" y="86" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="441" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.W(A)</text>
    <rect x="482" y="86" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="517" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.R(B)</text>
    <rect x="558" y="86" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="593" y="107" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.W(B)</text>
  </g>

  <g data-step="2">
    <text x="24" y="220" font-size="18" font-weight="700" fill="#0E0E10">Interleaved</text>
    <text x="24" y="246" font-size="14" fill="#3F3F46">Actions from different transactions</text>
    <text x="24" y="264" font-size="14" fill="#3F3F46">mixed in time.</text>
    <rect x="330" y="206" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="365" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.R(A)</text>
    <rect x="406" y="206" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="441" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.R(B)</text>
    <rect x="482" y="206" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="517" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.W(A)</text>
    <rect x="558" y="206" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="593" y="227" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.W(B)</text>
  </g>

  <g data-step="3">
    <text x="24" y="340" font-size="18" font-weight="700" fill="#0E0E10">Serializable</text>
    <text x="24" y="366" font-size="14" fill="#3F3F46">An interleaving whose result</text>
    <text x="24" y="384" font-size="14" fill="#3F3F46">matches <tspan font-weight="700" fill="#0E0E10">SOME</tspan> serial order.</text>
    <rect x="330" y="326" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="365" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.R(A)</text>
    <rect x="406" y="326" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="441" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.R(B)</text>
    <rect x="482" y="326" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="517" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.W(A)</text>
    <rect x="558" y="326" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="593" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.W(B)</text>
    <text x="648" y="348" text-anchor="middle" font-size="24" font-weight="700" fill="#6B7280">&#8801;</text>
    <g opacity="0.45">
      <rect x="672" y="326" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="707" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.R(A)</text>
      <rect x="748" y="326" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="783" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T1.W(A)</text>
      <rect x="824" y="326" width="70" height="32" rx="5" fill="#ECF1FE" stroke="#2563EB" stroke-width="2"/><text x="859" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.R(B)</text>
      <rect x="900" y="326" width="70" height="32" rx="5" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/><text x="935" y="347" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0E0E10">T2.W(B)</text>
    </g>
    <text x="821" y="374" text-anchor="middle" font-size="12" fill="#6B7280">a serial run</text>
  </g>

  <line x1="24" y1="410" x2="956" y2="410" stroke="#D4D7DC" stroke-width="1"/>
  <text x="24" y="434" font-size="13" fill="#3F3F46"><tspan font-weight="700" fill="#2563EB">Blue</tspan> box = read, <tspan font-weight="700" fill="#EA580C">orange</tspan> box = write. The T1 or T2 prefix names the transaction, written R(A) for read row A, W(A) for write row A.</text>
  <text x="24" y="456" font-size="13" fill="#3F3F46">This page tracks only the R/W order, the macro view. Timing, IO, and locks come later, on The Lock Manager page.</text>
</svg>
