  <!-- ===== end: highlight the 49-unit serial baseline ===== -->
  <g data-step="8">
    <line x1="1358" y1="60" x2="1358" y2="450" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="1305" y="225" width="150" height="54" rx="8" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <text x="1380" y="252" text-anchor="middle" font-size="18" font-weight="700" fill="#7C3AED">49 time units</text>
