  <text x="1078" y="470" text-anchor="middle" font-size="13" fill="#6B7280">38</text>
  <text x="1103" y="470" text-anchor="middle" font-size="13" fill="#6B7280">39</text>
  <text x="1129" y="470" text-anchor="middle" font-size="13" fill="#6B7280">40</text>
  <text x="1154" y="470" text-anchor="middle" font-size="13" fill="#6B7280">41</text>
  <text x="1180" y="470" text-anchor="middle" font-size="13" fill="#6B7280">42</text>
  <text x="1205" y="470" text-anchor="middle" font-size="13" fill="#6B7280">43</text>
  <text x="1231" y="470" text-anchor="middle" font-size="13" fill="#6B7280">44</text>
  <text x="1256" y="470" text-anchor="middle" font-size="13" fill="#6B7280">45</text>
  <text x="1282" y="470" text-anchor="middle" font-size="13" fill="#6B7280">46</text>
  <text x="1307" y="470" text-anchor="middle" font-size="13" fill="#6B7280">47</text>
  <text x="1333" y="470" text-anchor="middle" font-size="13" fill="#6B7280">48</text>
  <text x="1358" y="470" text-anchor="middle" font-size="13" fill="#6B7280">49</text>
  <text x="734" y="492" text-anchor="middle" font-size="13" fill="#6B7280">Time Units</text>

  <!-- ===== T2 runs first (times 1-9), revealed step by step ===== -->
  <g data-step="1">
    <line x1="135" y1="273" x2="135" y2="233" stroke="#16A34A" stroke-width="2.5"/>
    <polygon points="135,233 135,247 120,240" fill="#16A34A"/>
    <text x="135" y="223" text-anchor="middle" font-size="14" fill="#0E0E10">Req(A)</text>
    <text x="135" y="295" text-anchor="middle" font-size="13" fill="#6B7280">1</text>
    </g>
  <g data-step="2">
    <line x1="161" y1="273" x2="161" y2="233" stroke="#DC2626" stroke-width="2.5"/>
