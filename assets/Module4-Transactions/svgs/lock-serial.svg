<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1478 514" role="img" aria-labelledby="lk-t lk-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="lk-t">Serial lock schedule T2 → T1 → T3 (completion 49 units)</title>
  <desc id="lk-d">A lock schedule timeline with each transaction on its own row and time on the X-axis (Req and Get as up-arrows, read/write start and end as boxes). It runs T2 first (times 1 to 9), then T1 (10 to 24), then T3 (25 to 48), with no overlap, finishing at 49 time units, the serial baseline the interleaved schedules must beat.</desc>

  <text x="110" y="40" font-size="17" font-weight="700" fill="#0E0E10">Serial lock schedule T2 → T1 → T3 (completion 49 units)</text>
  <text x="88" y="396" text-anchor="end" font-size="15" font-weight="700" fill="#3F3F46">T1</text>
  <text x="88" y="278" text-anchor="end" font-size="15" font-weight="700" fill="#3F3F46">T2</text>
  <text x="88" y="160" text-anchor="end" font-size="15" font-weight="700" fill="#3F3F46">T3</text>
  <line x1="110" y1="450" x2="1358" y2="450" stroke="#D4D7DC"/>
  <text x="110" y="470" text-anchor="middle" font-size="13" fill="#6B7280">0</text>
  <text x="135" y="470" text-anchor="middle" font-size="13" fill="#6B7280">1</text>
  <text x="161" y="470" text-anchor="middle" font-size="13" fill="#6B7280">2</text>
  <text x="186" y="470" text-anchor="middle" font-size="13" fill="#6B7280">3</text>
  <text x="212" y="470" text-anchor="middle" font-size="13" fill="#6B7280">4</text>
  <text x="237" y="470" text-anchor="middle" font-size="13" fill="#6B7280">5</text>
  <text x="263" y="470" text-anchor="middle" font-size="13" fill="#6B7280">6</text>
  <text x="288" y="470" text-anchor="middle" font-size="13" fill="#6B7280">7</text>
  <text x="314" y="470" text-anchor="middle" font-size="13" fill="#6B7280">8</text>
  <text x="339" y="470" text-anchor="middle" font-size="13" fill="#6B7280">9</text>
  <text x="365" y="470" text-anchor="middle" font-size="13" fill="#6B7280">10</text>
  <text x="390" y="470" text-anchor="middle" font-size="13" fill="#6B7280">11</text>
  <text x="416" y="470" text-anchor="middle" font-size="13" fill="#6B7280">12</text>
  <text x="441" y="470" text-anchor="middle" font-size="13" fill="#6B7280">13</text>
  <text x="467" y="470" text-anchor="middle" font-size="13" fill="#6B7280">14</text>
  <text x="492" y="470" text-anchor="middle" font-size="13" fill="#6B7280">15</text>
  <text x="518" y="470" text-anchor="middle" font-size="13" fill="#6B7280">16</text>
  <text x="543" y="470" text-anchor="middle" font-size="13" fill="#6B7280">17</text>
  <text x="568" y="470" text-anchor="middle" font-size="13" fill="#6B7280">18</text>
  <text x="594" y="470" text-anchor="middle" font-size="13" fill="#6B7280">19</text>
  <text x="619" y="470" text-anchor="middle" font-size="13" fill="#6B7280">20</text>
  <text x="645" y="470" text-anchor="middle" font-size="13" fill="#6B7280">21</text>
  <text x="670" y="470" text-anchor="middle" font-size="13" fill="#6B7280">22</text>
  <text x="696" y="470" text-anchor="middle" font-size="13" fill="#6B7280">23</text>
  <text x="721" y="470" text-anchor="middle" font-size="13" fill="#6B7280">24</text>
  <text x="747" y="470" text-anchor="middle" font-size="13" fill="#6B7280">25</text>
  <text x="772" y="470" text-anchor="middle" font-size="13" fill="#6B7280">26</text>
  <text x="798" y="470" text-anchor="middle" font-size="13" fill="#6B7280">27</text>
  <text x="823" y="470" text-anchor="middle" font-size="13" fill="#6B7280">28</text>
  <text x="849" y="470" text-anchor="middle" font-size="13" fill="#6B7280">29</text>
  <text x="874" y="470" text-anchor="middle" font-size="13" fill="#6B7280">30</text>
  <text x="900" y="470" text-anchor="middle" font-size="13" fill="#6B7280">31</text>
  <text x="925" y="470" text-anchor="middle" font-size="13" fill="#6B7280">32</text>
  <text x="950" y="470" text-anchor="middle" font-size="13" fill="#6B7280">33</text>
  <text x="976" y="470" text-anchor="middle" font-size="13" fill="#6B7280">34</text>
  <text x="1001" y="470" text-anchor="middle" font-size="13" fill="#6B7280">35</text>
  <text x="1027" y="470" text-anchor="middle" font-size="13" fill="#6B7280">36</text>
