    <text x="161" y="295" text-anchor="middle" font-size="13" fill="#6B7280">2</text>
    </g>
  <g data-step="3">
    <rect x="173" y="247" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="186" y="187" text-anchor="middle" font-size="14" fill="#0E0E10">Rs(A)</text>
    <text x="186" y="295" text-anchor="middle" font-size="13" fill="#6B7280">3</text>
    </g>
  <g data-step="4">
    <rect x="301" y="247" width="26" height="26" rx="3" fill="#ECF1FE" stroke="#2563EB"/>
    <text x="314" y="223" text-anchor="middle" font-size="14" fill="#0E0E10">Re(A)</text>
    <text x="314" y="295" text-anchor="middle" font-size="13" fill="#6B7280">8</text>
    </g>
  <g data-step="5">
    <line x1="339" y1="273" x2="339" y2="233" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="339,233 339,247 354,240" fill="#7C3AED"/>
    <text x="339" y="205" text-anchor="middle" font-size="14" fill="#0E0E10">Unl(A)</text>
    <text x="339" y="295" text-anchor="middle" font-size="13" fill="#6B7280">9</text>
    </g>

  <!-- ===== then T1 (times 10-24) ===== -->
  <g data-step="6">
    <line x1="365" y1="391" x2="365" y2="351" stroke="#16A34A" stroke-width="2.5"/>
    <polygon points="365,351 365,365 350,358" fill="#16A34A"/>
    <text x="365" y="341" text-anchor="middle" font-size="14" fill="#0E0E10">Req(A)</text>
    <text x="365" y="413" text-anchor="middle" font-size="13" fill="#6B7280">10</text>
    <line x1="390" y1="391" x2="390" y2="351" stroke="#DC2626" stroke-width="2.5"/>
    <polygon points="390,351 390,365 375,358" fill="#DC2626"/>
    <text x="390" y="323" text-anchor="middle" font-size="14" fill="#0E0E10">Get(A)</text>
    <text x="390" y="413" text-anchor="middle" font-size="13" fill="#6B7280">11</text>
    <rect x="403" y="365" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="416" y="305" text-anchor="middle" font-size="14" fill="#0E0E10">Rs(A)</text>
    <text x="416" y="413" text-anchor="middle" font-size="13" fill="#6B7280">12</text>
    <rect x="530" y="365" width="26" height="26" rx="3" fill="#ECF1FE" stroke="#2563EB"/>
    <text x="543" y="341" text-anchor="middle" font-size="14" fill="#0E0E10">Re(A)</text>
    <text x="543" y="413" text-anchor="middle" font-size="13" fill="#6B7280">17</text>
    <rect x="555" y="365" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="568" y="323" text-anchor="middle" font-size="14" fill="#0E0E10">Ws(A)</text>
    <text x="568" y="413" text-anchor="middle" font-size="13" fill="#6B7280">18</text>
    <rect x="683" y="365" width="26" height="26" rx="3" fill="#FDEBE0" stroke="#EA580C"/>
    <text x="696" y="341" text-anchor="middle" font-size="14" fill="#0E0E10">We(A)</text>
    <text x="696" y="413" text-anchor="middle" font-size="13" fill="#6B7280">23</text>
    <line x1="721" y1="391" x2="721" y2="351" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="721,351 721,365 736,358" fill="#7C3AED"/>
    <text x="721" y="323" text-anchor="middle" font-size="14" fill="#0E0E10">Unl(A)</text>
    <text x="721" y="413" text-anchor="middle" font-size="13" fill="#6B7280">24</text>
    </g>

  <!-- ===== then T3 (times 25-48) ===== -->
  <g data-step="7">
    <line x1="747" y1="155" x2="747" y2="115" stroke="#16A34A" stroke-width="2.5"/>
    <polygon points="747,115 747,129 732,122" fill="#16A34A"/>
    <text x="747" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">Req(B)</text>
    <text x="747" y="177" text-anchor="middle" font-size="13" fill="#6B7280">25</text>
    <line x1="772" y1="155" x2="772" y2="115" stroke="#DC2626" stroke-width="2.5"/>
    <polygon points="772,115 772,129 757,122" fill="#DC2626"/>
    <text x="772" y="87" text-anchor="middle" font-size="14" fill="#0E0E10">Get(B)</text>
    <text x="772" y="177" text-anchor="middle" font-size="13" fill="#6B7280">26</text>
    <rect x="785" y="129" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="798" y="69" text-anchor="middle" font-size="14" fill="#0E0E10">Rs(B)</text>
    <text x="798" y="177" text-anchor="middle" font-size="13" fill="#6B7280">27</text>
    <rect x="912" y="129" width="26" height="26" rx="3" fill="#ECF1FE" stroke="#2563EB"/>
    <text x="925" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">Re(B)</text>
    <text x="925" y="177" text-anchor="middle" font-size="13" fill="#6B7280">32</text>
    <rect x="937" y="129" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="950" y="87" text-anchor="middle" font-size="14" fill="#0E0E10">Ws(B)</text>
    <text x="950" y="177" text-anchor="middle" font-size="13" fill="#6B7280">33</text>
    <rect x="1065" y="129" width="26" height="26" rx="3" fill="#FDEBE0" stroke="#EA580C"/>
    <text x="1078" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">We(B)</text>
    <text x="1078" y="177" text-anchor="middle" font-size="13" fill="#6B7280">38</text>
    <line x1="1103" y1="155" x2="1103" y2="115" stroke="#16A34A" stroke-width="2.5"/>
    <polygon points="1103,115 1103,129 1088,122" fill="#16A34A"/>
    <text x="1103" y="87" text-anchor="middle" font-size="14" fill="#0E0E10">Req(A)</text>
    <text x="1103" y="177" text-anchor="middle" font-size="13" fill="#6B7280">39</text>
    <line x1="1129" y1="155" x2="1129" y2="115" stroke="#DC2626" stroke-width="2.5"/>
    <polygon points="1129,115 1129,129 1114,122" fill="#DC2626"/>
    <text x="1129" y="69" text-anchor="middle" font-size="14" fill="#0E0E10">Get(A)</text>
    <text x="1129" y="177" text-anchor="middle" font-size="13" fill="#6B7280">40</text>
    <rect x="1141" y="129" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="1154" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">Ws(A)</text>
    <text x="1154" y="177" text-anchor="middle" font-size="13" fill="#6B7280">41</text>
    <rect x="1269" y="129" width="26" height="26" rx="3" fill="#FDEBE0" stroke="#EA580C"/>
    <text x="1282" y="105" text-anchor="middle" font-size="14" fill="#0E0E10">We(A)</text>
    <text x="1282" y="177" text-anchor="middle" font-size="13" fill="#6B7280">46</text>
    <line x1="1307" y1="155" x2="1307" y2="115" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="1307,115 1307,129 1322,122" fill="#7C3AED"/>
    <text x="1307" y="87" text-anchor="middle" font-size="14" fill="#0E0E10">Unl(B)</text>
    <text x="1307" y="177" text-anchor="middle" font-size="13" fill="#6B7280">47</text>
    <line x1="1333" y1="155" x2="1333" y2="115" stroke="#7C3AED" stroke-width="2.5"/>
    <polygon points="1333,115 1333,129 1348,122" fill="#7C3AED"/>
    <text x="1333" y="69" text-anchor="middle" font-size="14" fill="#0E0E10">Unl(A)</text>
    <text x="1333" y="177" text-anchor="middle" font-size="13" fill="#6B7280">48</text>
