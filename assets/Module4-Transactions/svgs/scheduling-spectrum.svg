<svg viewBox="0 0 1080 470" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="ss-t ss-d">
  <title id="ss-t">The scheduling spectrum: safety on the left, performance on the right, the sweet spot in the middle</title>
  <desc id="ss-d">A horizontal axis runs from Maximum Safety and slow on the left to
  Maximum Performance and broken on the right. Three points sit on it. SERIAL on the
  left, labelled Naive 1, runs one transaction at a time: correct, but no parallelism. NO
  COORDINATION on the right, labelled Naive 2, runs everything at once: maximum speed, but
  races corrupt the data. In the
  middle, violet-highlighted, CONCURRENCY CONTROL interleaves only the safe swaps:
  serial-correct at concurrent speed. Color key: violet is the sweet spot, the chosen
  point; green is the correct end; red is the broken end; grey is the axis.</desc>
  <defs>
    <marker id="ss-ah" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#6B7280"/></marker>
  </defs>

  <text x="540" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">The scheduling spectrum</text>
  <text x="540" y="62" text-anchor="middle" font-size="16" fill="#3F3F46">Run them one at a time and it is correct but slow. Run them with no rules and it is fast but corrupt.</text>

  <!-- the axis -->
  <g data-step="1">
    <line x1="90" y1="150" x2="990" y2="150" stroke="#6B7280" stroke-width="2.5" marker-end="url(#ss-ah)"/>
    <text x="96" y="128" font-size="13" font-weight="700" fill="#059669" letter-spacing="0.5">MAXIMUM SAFETY</text>
    <text x="96" y="186" font-size="13" fill="#6B7280">slow, no parallelism</text>
    <text x="984" y="128" text-anchor="end" font-size="13" font-weight="700" fill="#DC2626" letter-spacing="0.5">MAXIMUM PERFORMANCE</text>
    <text x="984" y="186" text-anchor="end" font-size="13" fill="#6B7280">fast, data corruption</text>
    <circle cx="150" cy="150" r="5" fill="#6B7280"/>
    <circle cx="540" cy="150" r="5" fill="#6B7280"/>
    <circle cx="930" cy="150" r="5" fill="#6B7280"/>
  </g>

  <!-- SERIAL end (left, green/correct) -->
  <g data-step="2">
    <line x1="150" y1="155" x2="150" y2="232" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="50" y="240" width="240" height="118" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="50" y="240" width="240" height="5" rx="2.5" fill="#059669"/>
    <text x="70" y="272" font-size="15" font-weight="700" fill="#059669" letter-spacing="0.5">SERIAL</text>
    <text x="278" y="272" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280" font-family="JetBrains Mono, monospace">Naive 1</text>
    <text x="70" y="296" font-size="14" fill="#3F3F46">One transaction at a time.</text>
    <text x="70" y="318" font-size="14" fill="#3F3F46">Always correct.</text>
    <text x="70" y="340" font-size="14" fill="#6B7280">No parallelism, no throughput.</text>
  </g>

  <!-- NO COORDINATION end (right, red/broken) -->
  <g data-step="3">
    <line x1="930" y1="155" x2="930" y2="232" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="790" y="240" width="240" height="118" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="790" y="240" width="240" height="5" rx="2.5" fill="#DC2626"/>
    <text x="810" y="272" font-size="15" font-weight="700" fill="#DC2626" letter-spacing="0.5">NO COORDINATION</text>
    <text x="1018" y="272" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280" font-family="JetBrains Mono, monospace">Naive 2</text>
    <text x="810" y="296" font-size="14" fill="#3F3F46">Everything runs at once.</text>
    <text x="810" y="318" font-size="14" fill="#3F3F46">Maximum speed.</text>
    <text x="810" y="340" font-size="14" fill="#6B7280">Races corrupt the data.</text>
  </g>

  <!-- CONCURRENCY CONTROL sweet spot (middle, violet) -->
  <g data-step="4">
    <line x1="540" y1="155" x2="540" y2="222" stroke="#7C3AED" stroke-width="2"/>
    <rect x="370" y="230" width="340" height="138" rx="8" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <text x="540" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#7C3AED" letter-spacing="0.5">CONCURRENCY CONTROL</text>
    <text x="540" y="282" text-anchor="middle" font-size="13" fill="#7C3AED">the sweet spot</text>
    <text x="540" y="312" text-anchor="middle" font-size="14" fill="#3F3F46">Interleave only the safe swaps.</text>
    <text x="540" y="334" text-anchor="middle" font-size="14" fill="#3F3F46">Serial-correct at concurrent speed.</text>
    <text x="540" y="356" text-anchor="middle" font-size="13" fill="#6B7280">Rules 1 and 2 decide what may swap.</text>
  </g>

  <!-- color key -->
  <text x="540" y="432" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = the sweet spot&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = the correct end&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = the broken end&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the axis</tspan></text>
</svg>
