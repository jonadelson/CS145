<svg viewBox="0 0 960 486" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="lmh-t lmh-d">
  <title id="lmh-t">The lock manager: one component, two goals, three jobs</title>
  <desc id="lmh-d">Three transactions each send a lock request to one central component, the
  lock manager, which keeps a lock table of who holds each row and who is waiting. Its mission is
  two goals: keep every schedule correct (equal to some serial order) and fast (overlap the idle
  waits). It does three jobs. Job one, shown here in violet, is to grant a free row or queue you
  behind the holder. Jobs two and three are greyed as coming up: schedule many transactions, and
  break deadlocks. Color key: violet is the job this page covers, grey is a job still ahead, green
  marks the correctness goal.</desc>

  <defs><marker id="ah-lmh" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="480" y="30" text-anchor="middle" font-size="23" font-weight="700" fill="#0E0E10">The lock manager: who waits, who runs</text>
  <text x="480" y="52" text-anchor="middle" font-size="13.5" fill="#6B7280">Every transaction asks one component for its locks. Here is what that component owes, and what it does.</text>

  <!-- two-goal banner -->
  <g data-step="1">
    <rect x="234" y="66" width="232" height="34" rx="17" fill="#E1F4EC" stroke="#16A34A" stroke-width="1.5"/>
    <text x="350" y="88" text-anchor="middle" font-size="13.5" fill="#16A34A"><tspan font-weight="700">Correct</tspan>  &#183; equal to some serial order</text>
    <rect x="494" y="66" width="232" height="34" rx="17" fill="#EFE8FB" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="610" y="88" text-anchor="middle" font-size="13.5" fill="#7C3AED"><tspan font-weight="700">Fast</tspan>  &#183; overlap the idle waits</text>
  </g>

  <!-- transactions -->
  <g data-step="2">
    <rect x="150" y="120" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="225" y="143" text-anchor="middle" font-size="13.5" fill="#0E0E10"><tspan font-weight="700">T1</tspan>  wants row A</text>
    <rect x="405" y="120" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="480" y="143" text-anchor="middle" font-size="13.5" fill="#0E0E10"><tspan font-weight="700">T2</tspan>  wants row A</text>
    <rect x="660" y="120" width="150" height="36" rx="6" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="735" y="143" text-anchor="middle" font-size="13.5" fill="#0E0E10"><tspan font-weight="700">T3</tspan>  wants row B</text>
    <line x1="225" y1="158" x2="320" y2="188" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah-lmh)"/>
    <line x1="480" y1="158" x2="480" y2="188" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah-lmh)"/>
    <line x1="735" y1="158" x2="640" y2="188" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ah-lmh)"/>
    <text x="480" y="178" text-anchor="middle" font-size="11.5" fill="#6B7280" font-family="'JetBrains Mono', monospace">lock requests</text>
  </g>

  <!-- lock manager + lock table -->
  <g data-step="3">
    <rect x="150" y="190" width="660" height="92" rx="9" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <text x="174" y="217" font-size="13.5" font-weight="700" fill="#7C3AED" letter-spacing="1">LOCK MANAGER &#183; THE LOCK TABLE</text>
    <rect x="174" y="228" width="612" height="40" rx="5" fill="#FFFFFF" stroke="#D4D7DC"/>
    <text x="188" y="244" font-size="13" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">Row A</tspan>  held by T1  &#183;  waiting: T2</text>
    <text x="188" y="262" font-size="13" fill="#3F3F46"><tspan font-weight="700" fill="#0E0E10">Row B</tspan>  free  &#8594;  granted to T3</text>
  </g>

  <!-- job 1: lit -->
  <g data-step="4">
    <rect x="44" y="304" width="280" height="158" rx="9" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="44" y="304" width="280" height="6" rx="3" fill="#7C3AED"/>
    <circle cx="72" cy="338" r="13" fill="#7C3AED"/><text x="72" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
    <text x="96" y="343" font-size="15" font-weight="700" fill="#0E0E10">Grant or queue</text>
    <text x="68" y="374" font-size="13" fill="#3F3F46">Row free? Hand out the</text>
    <text x="68" y="394" font-size="13" fill="#3F3F46">lock. Row held? Queue you</text>
    <text x="68" y="414" font-size="13" fill="#3F3F46">behind the holder. This</text>
    <text x="68" y="434" font-size="13" fill="#3F3F46">page is this job.</text>
  </g>

  <!-- jobs 2 & 3: greyed, ahead -->
  <g data-step="5">
    <rect x="340" y="304" width="280" height="158" rx="9" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="340" y="304" width="280" height="6" rx="3" fill="#D4D7DC"/>
    <circle cx="368" cy="338" r="13" fill="#D4D7DC"/><text x="368" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
    <text x="392" y="343" font-size="15" font-weight="700" fill="#6B7280">Schedule many txns</text>
    <text x="612" y="324" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280" font-family="'JetBrains Mono', monospace">AHEAD</text>
    <text x="364" y="376" font-size="13" fill="#6B7280">Overlap waits so many</text>
    <text x="364" y="396" font-size="13" fill="#6B7280">transactions finish fast,</text>
    <text x="364" y="416" font-size="13" fill="#6B7280">not one at a time.</text>

    <rect x="636" y="304" width="280" height="158" rx="9" fill="#FFFFFF" stroke="#D4D7DC"/>
    <rect x="636" y="304" width="280" height="6" rx="3" fill="#D4D7DC"/>
    <circle cx="664" cy="338" r="13" fill="#D4D7DC"/><text x="664" y="343" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
    <text x="688" y="343" font-size="15" font-weight="700" fill="#6B7280">Break deadlocks</text>
    <text x="908" y="324" text-anchor="end" font-size="11" font-weight="700" fill="#6B7280" font-family="'JetBrains Mono', monospace">AHEAD</text>
    <text x="660" y="376" font-size="13" fill="#6B7280">Two transactions each</text>
    <text x="660" y="396" font-size="13" fill="#6B7280">waiting on the other,</text>
    <text x="660" y="416" font-size="13" fill="#6B7280">forever? Abort one.</text>
  </g>
</svg>
