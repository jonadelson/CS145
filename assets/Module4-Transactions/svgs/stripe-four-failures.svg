<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="sff-t sff-d">
  <title id="sff-t">Four ways a Stripe payment breaks, and the guarantee that stops each</title>
  <desc id="sff-d">A two-by-two grid of failures. Top left, the charge that
  wasn't: the card is charged but the webhook never queues, which atomicity
  prevents. Top right, the ledger that drifts: the two rows stop summing to zero,
  which consistency prevents. Bottom left, the lost update: two concurrent
  charges on one balance both read and write it, so one update is lost, which
  isolation prevents. Bottom
  right, lost to a crash: a confirmed charge vanishes when the server dies, which
  durability prevents. Color key: the red bar marks the failure, and the coloured
  letter is the ACID guarantee that stops it.</desc>

  <text x="480" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Four ways money goes missing</text>
  <text x="480" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Each failure mode, and the ACID guarantee that stops it. The definitions are on the ACID Properties page.</text>

  <!-- Cell 1: Atomicity (blue A) -->
  <g data-step="1">
    <rect x="60" y="86" width="410" height="158" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="60" y="86" width="410" height="6" rx="3" fill="#DC2626"/>
    <text x="82" y="120" font-size="16" font-weight="700" fill="#0E0E10">The charge that wasn't</text>
    <text x="82" y="148" font-size="14" fill="#3F3F46">Card charged. Webhook never queued.</text>
    <text x="82" y="170" font-size="14" fill="#3F3F46">Money left, no order ships.</text>
    <circle cx="98" cy="211" r="15" fill="#2563EB"/>
    <text x="98" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">A</text>
    <text x="122" y="216" font-size="14" font-weight="700" fill="#2563EB">Atomicity</text>
    <text x="202" y="216" font-size="13" fill="#6B7280">all of it, or none</text>
  </g>

  <!-- Cell 2: Consistency (green C) -->
  <g data-step="2">
    <rect x="490" y="86" width="410" height="158" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="490" y="86" width="410" height="6" rx="3" fill="#DC2626"/>
    <text x="512" y="120" font-size="16" font-weight="700" fill="#0E0E10">The ledger that drifts</text>
    <text x="512" y="148" font-size="14" fill="#3F3F46">$9.99 debited, $9.98 credited.</text>
    <text x="512" y="170" font-size="14" fill="#3F3F46">The two rows stop summing to zero.</text>
    <circle cx="528" cy="211" r="15" fill="#16A34A"/>
    <text x="528" y="216" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">C</text>
    <text x="552" y="216" font-size="14" font-weight="700" fill="#16A34A">Consistency</text>
    <text x="652" y="216" font-size="13" fill="#6B7280">the books always balance</text>
  </g>

  <!-- Cell 3: Isolation (orange I) -->
  <g data-step="3">
    <rect x="60" y="256" width="410" height="158" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="60" y="256" width="410" height="6" rx="3" fill="#DC2626"/>
    <text x="82" y="290" font-size="16" font-weight="700" fill="#0E0E10">The lost update</text>
    <text x="82" y="318" font-size="14" fill="#3F3F46">Two charges hit one balance at once.</text>
    <text x="82" y="340" font-size="14" fill="#3F3F46">Both read it, both write, one is lost.</text>
    <circle cx="98" cy="381" r="15" fill="#EA580C"/>
    <text x="98" y="386" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">I</text>
    <text x="122" y="386" font-size="14" font-weight="700" fill="#EA580C">Isolation</text>
    <text x="194" y="386" font-size="13" fill="#6B7280">serial order, nothing lost</text>
  </g>

  <!-- Cell 4: Durability (violet D) -->
  <g data-step="4">
    <rect x="490" y="256" width="410" height="158" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="490" y="256" width="410" height="6" rx="3" fill="#DC2626"/>
    <text x="512" y="290" font-size="16" font-weight="700" fill="#0E0E10">Lost to a crash</text>
    <text x="512" y="318" font-size="14" fill="#3F3F46">Receipt shown, then the server dies</text>
    <text x="512" y="340" font-size="14" fill="#3F3F46">five milliseconds later.</text>
    <circle cx="528" cy="381" r="15" fill="#7C3AED"/>
    <text x="528" y="386" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">D</text>
    <text x="552" y="386" font-size="14" font-weight="700" fill="#7C3AED">Durability</text>
    <text x="636" y="386" font-size="13" fill="#6B7280">survives the crash</text>
  </g>

  <text x="480" y="448" text-anchor="middle" font-size="14"><tspan fill="#DC2626" font-weight="700">red bar</tspan><tspan fill="#3F3F46"> = the failure&#160;&#160;&#183;&#160;&#160;the </tspan><tspan fill="#0E0E10" font-weight="700">coloured letter</tspan><tspan fill="#3F3F46"> = the ACID guarantee that stops it</tspan></text>
</svg>
