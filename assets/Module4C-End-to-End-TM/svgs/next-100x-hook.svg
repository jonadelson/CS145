<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="n1h-t n1h-d">
  <title id="n1h-t">Where the next 100x comes from: not a faster Strict 2PL, but systems that drop it</title>
  <desc id="n1h-d">A scaling axis runs left to right: about 100 times per decade, about 10,000 times per generation. Two paths fork from where databases run today. The grey path, faster Strict 2PL, is a dead end. The violet path, systems that drop Strict 2PL entirely, is where the next 100 times leap lives. Color key: violet = the path that scales, the systems that drop Strict 2PL; grey = the dead end, a faster Strict 2PL; blue = where production databases run today.</desc>
  <defs>
    <marker id="n1h-ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  </defs>

  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Where does the next 100&#215; come from?</text>
  <text x="550" y="64" text-anchor="middle" font-size="16" fill="#3F3F46">About 100&#215; per decade, about 10,000&#215; per generation. The leap is not a faster Strict 2PL.</text>

  <!-- STEP 1: today's baseline + scaling axis -->
  <g data-step="1">
    <line x1="80" y1="180" x2="1020" y2="180" stroke="#6B7280" stroke-width="2.5" marker-end="url(#n1h-ah)"/>
    <text x="80" y="158" font-size="13" font-weight="700" fill="#6B7280" letter-spacing="0.5">SCALE</text>
    <text x="1014" y="158" text-anchor="end" font-size="13" fill="#6B7280">~100&#215; / decade &#160;&#183;&#160; ~10,000&#215; / generation</text>

    <rect x="120" y="220" width="300" height="118" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <rect x="120" y="220" width="300" height="5" rx="2.5" fill="#2563EB"/>
    <text x="140" y="252" font-size="17" font-weight="700" fill="#2563EB">Where we run today</text>
    <text x="140" y="280" font-size="14" fill="#3F3F46">Strict 2PL: safe, correct concurrency.</text>
    <text x="140" y="302" font-size="14" fill="#3F3F46">It scales to most production databases.</text>
    <text x="140" y="324" font-size="14" fill="#6B7280">The baseline modern systems build beyond.</text>
    <line x1="290" y1="180" x2="270" y2="216" stroke="#D4D7DC" stroke-width="1.5"/>
  </g>

  <!-- STEP 2: the fork, dead end vs the path that scales -->
  <g data-step="2">
    <line x1="420" y1="262" x2="640" y2="320" stroke="#6B7280" stroke-width="2" marker-end="url(#n1h-ah)" stroke-dasharray="5,4" opacity="0.6"/>
    <line x1="420" y1="262" x2="640" y2="200" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#n1h-ah)"/>

    <rect x="660" y="150" width="360" height="118" rx="8" fill="#EFE8FB" stroke="#7C3AED" stroke-width="2"/>
    <text x="680" y="182" font-size="17" font-weight="700" fill="#7C3AED">Drop Strict 2PL entirely</text>
    <text x="680" y="210" font-size="14" fill="#3F3F46">New protocols admit schedules 2PL refuses.</text>
    <text x="680" y="232" font-size="14" fill="#3F3F46">Micro-locking. LSM trees. Timestamp order.</text>
    <text x="680" y="254" font-size="14" fill="#7C3AED" font-weight="600">This is where the next 100&#215; lives.</text>

    <rect x="660" y="296" width="360" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="660" y="296" width="360" height="5" rx="2.5" fill="#D4D7DC"/>
    <text x="680" y="328" font-size="16" font-weight="700" fill="#6B7280">Just make Strict 2PL faster</text>
    <text x="680" y="354" font-size="14" fill="#6B7280">A dead end. The same protocol, same ceiling.</text>
  </g>

  <text x="550" y="438" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#7C3AED" font-weight="700">violet</tspan><tspan fill="#3F3F46"> = the path that scales&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = where databases run today&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the dead end</tspan></text>
</svg>
