<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="f1-t f1-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="f1-t">Fix one: cut lock duration</title>
  <desc id="f1-d">Before, red: the app locks the whole zone and holds it through browsing and payment, five to ten minutes, so only about a hundred users run at once. After, green: the fan previews and pre-fills while waiting with no lock, then locks only for the final write, thirty seconds, so about ten thousand users run at once. Color key: red is the old flow, green is the fixed flow.</desc>

  <text x="40" y="34" font-size="24" font-weight="700" fill="#0E0E10">Fix 2: cut lock duration</text>

  <g data-step="1">
    <rect x="40" y="56" width="400" height="196" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="40" y="56" width="400" height="6" rx="3" fill="#DC2626"/>
    <text x="64" y="90" font-size="17" font-weight="700" fill="#DC2626">Before</text>
    <text x="64" y="120" font-size="14" fill="#3F3F46">Lock the whole zone, then browse</text>
    <text x="64" y="142" font-size="14" fill="#3F3F46">and pay with the lock held.</text>
    <text x="64" y="184" font-size="14" font-weight="700" fill="#0E0E10">Lock held: 5 to 10 minutes</text>
    <text x="64" y="210" font-size="14" font-weight="700" fill="#0E0E10">Concurrent users: ~100</text>
  </g>

  <g data-step="2">
    <rect x="480" y="56" width="400" height="196" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1.5"/>
    <rect x="480" y="56" width="400" height="6" rx="3" fill="#16A34A"/>
    <text x="504" y="90" font-size="17" font-weight="700" fill="#16A34A">After</text>
    <text x="504" y="120" font-size="14" fill="#3F3F46">Pre-fill card and address in the queue.</text>
    <text x="504" y="142" font-size="14" fill="#3F3F46">Lock only for the final write.</text>
    <text x="504" y="184" font-size="14" font-weight="700" fill="#0E0E10">Lock held: 30 seconds</text>
    <text x="504" y="210" font-size="14" font-weight="700" fill="#0E0E10">Concurrent users: ~10,000</text>
  </g>

  <text x="40" y="284" font-size="13" fill="#6B7280"><tspan fill="#DC2626" font-weight="700">red</tspan> = the old flow  &#183;  <tspan fill="#16A34A" font-weight="700">green</tspan> = the fix</text>
</svg>
