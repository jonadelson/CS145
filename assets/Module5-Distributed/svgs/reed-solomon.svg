<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="rs-t rs-d">
  <title id="rs-t">Colossus: Reed-Solomon erasure coding</title>
  <desc id="rs-d">Instead of keeping three full copies, Colossus splits data into six data blocks
  and computes three parity blocks from them, nine blocks in all spread across machines. Any
  three blocks can be lost and the original data is rebuilt from the six that survive. This
  tolerates three failures at 50 percent storage overhead, versus three-way replication, which
  tolerates two failures at 200 percent overhead. Color key: pink is the parity blocks and the
  erasure-coding win, red is a lost block, grey is the data blocks.</desc>

  <defs><marker id="ah-rs" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
    <marker id="ah-rsp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#DB2777"/></marker></defs>

  <text x="450" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Colossus: Reed-Solomon Erasure Coding</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#6B7280">Survive 3 failures at 50% overhead, not the 200% of three copies.</text>

  <!-- 6 data + 3 parity -->
  <g data-step="1">
    <g fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"><rect x="60" y="108" width="76" height="56" rx="6"/><rect x="146" y="108" width="76" height="56" rx="6"/><rect x="232" y="108" width="76" height="56" rx="6"/><rect x="318" y="108" width="76" height="56" rx="6"/><rect x="404" y="108" width="76" height="56" rx="6"/><rect x="490" y="108" width="76" height="56" rx="6"/></g>
    <g fill="#FBE3EE" stroke="#DB2777" stroke-width="2"><rect x="592" y="108" width="76" height="56" rx="6"/><rect x="678" y="108" width="76" height="56" rx="6"/><rect x="764" y="108" width="76" height="56" rx="6"/></g>
    <g font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle"><text x="98" y="142">D1</text><text x="184" y="142">D2</text><text x="270" y="142">D3</text><text x="356" y="142">D4</text><text x="442" y="142">D5</text><text x="528" y="142">D6</text></g>
    <g font-size="15" font-weight="700" fill="#DB2777" text-anchor="middle"><text x="630" y="142">P1</text><text x="716" y="142">P2</text><text x="802" y="142">P3</text></g>
    <text x="313" y="190" text-anchor="middle" font-size="13" fill="#6B7280">6 data blocks</text>
    <text x="716" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#DB2777">3 parity (computed from the data)</text>
    <text x="450" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">6 data + 3 parity = 9 blocks, spread across machines</text>
  </g>

  <!-- lose any 3 -->
  <g data-step="2">
    <rect x="146" y="108" width="76" height="56" rx="6" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="156" y1="118" x2="212" y2="154" stroke="#DC2626" stroke-width="2.5"/><line x1="212" y1="118" x2="156" y2="154" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="404" y="108" width="76" height="56" rx="6" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="414" y1="118" x2="470" y2="154" stroke="#DC2626" stroke-width="2.5"/><line x1="470" y1="118" x2="414" y2="154" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="678" y="108" width="76" height="56" rx="6" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="688" y1="118" x2="744" y2="154" stroke="#DC2626" stroke-width="2.5"/><line x1="744" y1="118" x2="688" y2="154" stroke="#DC2626" stroke-width="2.5"/>
    <text x="450" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#DC2626">Lose any 3 of the 9 blocks</text>
  </g>

  <!-- rebuild + overhead -->
  <g data-step="3">
    <text x="450" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#DB2777">The math rebuilds them from any 6 survivors.</text>
    <rect x="150" y="300" width="600" height="40" rx="8" fill="#FBE3EE" stroke="#DB2777" stroke-width="1.5"/>
    <text x="450" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Reed-Solomon (6, 3): +50% storage · survives 3 failures</text>
    <rect x="150" y="346" width="600" height="34" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="450" y="368" text-anchor="middle" font-size="14" fill="#6B7280">Three copies: +200% storage · survives 2 failures</text>
  </g>

  <text x="450" y="410" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = parity &amp; the erasure-coding win&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = a lost block&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = data blocks</tspan></text>
</svg>
