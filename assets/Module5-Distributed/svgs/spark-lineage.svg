<svg viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="sl-t sl-d">
  <title id="sl-t">Spark recovers a lost partition by replaying its lineage</title>
  <desc id="sl-d">Four RDD stages left to right: RDD0 input, RDD1 = filter(),
  RDD2 = map(), RDD3 = map(), each with three grey partitions P0 to
  P2. These are all narrow transformations, so each output partition
  depends on exactly one input partition. The worker holding RDD3.P1 dies,
  so that partition is marked in pink as lost. Spark reads the lineage and
  re-runs filter then map then map on just the still-alive upstream
  RDD0.P1, the pink replay path, with no replicas stored. Color key: pink is the lost partition and its
  replay path; grey is the intact lineage.</desc>
  <defs><marker id="ah-sl" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker>
  <marker id="ah-sl-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#DB2777"/></marker></defs>

  <text x="450" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Lineage recovery: replay, do not replicate</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Spark stores the operator graph, not copies of the intermediate data.</text>

  <!-- RDD0 input -->
  <g data-step="1">
    <text x="100" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#6B7280">RDD0 (input)</text>
    <rect x="60" y="100" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="100" y="124" text-anchor="middle" font-size="14" fill="#3F3F46">P0</text>
    <rect x="60" y="146" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="100" y="170" text-anchor="middle" font-size="14" fill="#3F3F46">P1</text>
    <rect x="60" y="192" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="100" y="216" text-anchor="middle" font-size="14" fill="#3F3F46">P2</text>
  </g>

  <!-- RDD1 = filter() -->
  <g data-step="2">
    <text x="320" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">RDD1 = filter()</text>
    <line x1="142" y1="119" x2="216" y2="119" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="142" y1="165" x2="216" y2="165" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="142" y1="211" x2="216" y2="211" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <rect x="280" y="100" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="320" y="124" text-anchor="middle" font-size="14" fill="#3F3F46">P0</text>
    <rect x="280" y="146" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="320" y="170" text-anchor="middle" font-size="14" fill="#3F3F46">P1</text>
    <rect x="280" y="192" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="320" y="216" text-anchor="middle" font-size="14" fill="#3F3F46">P2</text>
  </g>

  <!-- RDD2 = map() -->
  <g data-step="3">
    <text x="540" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">RDD2 = map()</text>
    <line x1="362" y1="119" x2="436" y2="119" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="362" y1="165" x2="436" y2="165" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="362" y1="211" x2="436" y2="211" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <rect x="500" y="100" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="540" y="124" text-anchor="middle" font-size="14" fill="#3F3F46">P0</text>
    <rect x="500" y="146" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="540" y="170" text-anchor="middle" font-size="14" fill="#3F3F46">P1</text>
    <rect x="500" y="192" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="540" y="216" text-anchor="middle" font-size="14" fill="#3F3F46">P2</text>
  </g>

  <!-- RDD3 = map(), P1 lost -->
  <g data-step="4">
    <text x="760" y="88" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">RDD3 = map()</text>
    <line x1="582" y1="119" x2="656" y2="119" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="582" y1="165" x2="656" y2="165" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <line x1="582" y1="211" x2="656" y2="211" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-sl)"/>
    <rect x="720" y="100" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="760" y="124" text-anchor="middle" font-size="14" fill="#3F3F46">P0</text>
    <rect x="720" y="146" width="80" height="38" rx="4" fill="#FBE3EE" stroke="#DB2777" stroke-width="2"/>
    <text x="760" y="164" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">P1 ✗</text>
    <text x="760" y="178" text-anchor="middle" font-size="14" fill="#DB2777">node died</text>
    <rect x="720" y="192" width="80" height="38" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="760" y="216" text-anchor="middle" font-size="14" fill="#3F3F46">P2</text>
  </g>

  <!-- replay path (pink) -->
  <g data-step="5">
    <path class="trace" d="M 100 184 Q 100 250, 320 250 Q 540 250, 760 230 L 760 188" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="6,4" fill="none" marker-end="url(#ah-sl-p)"/>
    <text x="450" y="276" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">Replay filter() → map() → map() on RDD0.P1 only</text>
  </g>

  <!-- the lineage equation -->
  <g data-step="6">
    <text x="450" y="306" text-anchor="middle" font-size="14"><tspan font-weight="700" fill="#0E0E10">Recovery&#160;&#160;</tspan><tspan fill="#3F3F46">Spark reads the lineage: </tspan><tspan font-family="JetBrains Mono, monospace" fill="#0E0E10">RDD3.P1 = map(map(filter(RDD0.P1)))</tspan></text>
  </g>

  <text x="450" y="340" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = the lost partition and its replay path&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the intact lineage</tspan></text>
</svg>
