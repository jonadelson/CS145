<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="kl-t kl-d">
  <title id="kl-t">Kafka is a partitioned, replicated commit log</title>
  <desc id="kl-d">The Spotify client produces a play_started event. The
  producer hashes user_id to pick one of the topic's three pink partitions,
  P0 to P2, each an ordered append-only log replicated 3x across brokers.
  Two independent grey consumers read at their own offsets: the
  recommendation pipeline at offset 16 in real time, the royalty pipeline
  at offset 12 nightly. Because events persist until retention expires, a
  consumer can rewind and replay any past offset. Color key: pink is the
  durable partitioned log; grey is the producer and the
  independent consumers.</desc>
  <defs><marker id="ah-kl" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="450" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Kafka: a partitioned, replicated commit log</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Events persist, so independent consumers read and replay the same log.</text>

  <!-- Producer + partitioned log -->
  <g data-step="1">
  <rect x="24" y="120" width="140" height="56" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="94" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Spotify client</text>
  <text x="94" y="163" text-anchor="middle" font-size="14" fill="#6B7280">play_started</text>
  <line x1="164" y1="148" x2="222" y2="148" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-kl)"/>
  <text x="193" y="140" text-anchor="middle" font-size="14" fill="#6B7280">hash(user_id)</text>

  <rect x="226" y="84" width="320" height="184" rx="8" fill="#FBE3EE" stroke="#DB2777" stroke-width="2"/>
  <text x="386" y="106" text-anchor="middle" font-size="16" font-weight="700" fill="#DB2777">Topic: plays · 3 partitions, 3× replicated</text>

  <text x="248" y="142" font-size="14" font-weight="700" fill="#3F3F46">P0</text>
  <rect x="272" y="126" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="288" y="143" text-anchor="middle" font-size="14" fill="#3F3F46">12</text>
  <rect x="308" y="126" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="324" y="143" text-anchor="middle" font-size="14" fill="#3F3F46">13</text>
  <rect x="344" y="126" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="360" y="143" text-anchor="middle" font-size="14" fill="#3F3F46">14</text>
  <rect x="380" y="126" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="396" y="143" text-anchor="middle" font-size="14" fill="#3F3F46">15</text>
  <rect x="416" y="126" width="32" height="24" rx="3" fill="#FBE3EE" stroke="#DB2777" stroke-width="1.5"/>
  <text x="432" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">16</text>
  <text x="466" y="143" font-size="14" fill="#DB2777">new</text>

  <text x="248" y="186" font-size="14" font-weight="700" fill="#3F3F46">P1</text>
  <rect x="272" y="170" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="288" y="187" text-anchor="middle" font-size="14" fill="#3F3F46">7</text>
  <rect x="308" y="170" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="324" y="187" text-anchor="middle" font-size="14" fill="#3F3F46">8</text>
  <rect x="344" y="170" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="360" y="187" text-anchor="middle" font-size="14" fill="#3F3F46">9</text>

  <text x="248" y="230" font-size="14" font-weight="700" fill="#3F3F46">P2</text>
  <rect x="272" y="214" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="288" y="231" text-anchor="middle" font-size="14" fill="#3F3F46">21</text>
  <rect x="308" y="214" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="324" y="231" text-anchor="middle" font-size="14" fill="#3F3F46">22</text>
  <rect x="344" y="214" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="360" y="231" text-anchor="middle" font-size="14" fill="#3F3F46">23</text>
  <rect x="380" y="214" width="32" height="24" rx="3" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="396" y="231" text-anchor="middle" font-size="14" fill="#3F3F46">24</text>
  </g>

  <!-- Independent consumers -->
  <g data-step="2">
  <line x1="546" y1="130" x2="604" y2="130" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-kl)"/>
  <text x="575" y="122" text-anchor="middle" font-size="14" fill="#6B7280">offset 16</text>
  <line x1="546" y1="206" x2="604" y2="206" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-kl)"/>
  <text x="575" y="198" text-anchor="middle" font-size="14" fill="#6B7280">offset 12</text>

  <rect x="608" y="108" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="713" y="129" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Recommendation pipeline</text>
  <text x="713" y="147" text-anchor="middle" font-size="14" fill="#6B7280">streams in real time</text>

  <rect x="608" y="184" width="210" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="713" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Royalty payouts</text>
  <text x="713" y="223" text-anchor="middle" font-size="14" fill="#6B7280">batches nightly</text>
  </g>

  <text x="450" y="296" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = the durable partitioned log&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the producer and the independent consumers</tspan></text>
</svg>
