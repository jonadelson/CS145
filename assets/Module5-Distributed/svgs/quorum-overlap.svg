<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="qo-t qo-d">
  <title id="qo-t">Why a majority works: any two majorities overlap</title>
  <desc id="qo-d">Five nodes in a row. One majority is any three of them, for example nodes
  one, two, and three. Any other majority, for example nodes three, four, and five, must
  share at least one node with the first, here node three. Because each node votes only once
  per term, that shared node cannot back two winners, so at most one candidate ever reaches a
  majority and split-brain is impossible. Color key: pink marks a majority set and the shared
  node, grey marks the nodes.</desc>

  <text x="450" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Why a majority works</text>
  <text x="450" y="56" text-anchor="middle" font-size="14" fill="#6B7280">In a 5-node cluster, any two majorities must overlap.</text>

  <!-- nodes (static) -->
  <circle cx="170" cy="120" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="170" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">N1</text>
  <circle cx="320" cy="120" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="320" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">N2</text>
  <circle cx="470" cy="120" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="470" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">N3</text>
  <circle cx="620" cy="120" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="620" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">N4</text>
  <circle cx="770" cy="120" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/><text x="770" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">N5</text>

  <!-- Majority A: N1 N2 N3 -->
  <g data-step="1">
    <path d="M 140 166 L 140 176 L 500 176 L 500 166" fill="none" stroke="#DB2777" stroke-width="2.5"/>
    <text x="320" y="198" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">Majority A · any 3 of 5</text>
  </g>

  <!-- Majority B: N3 N4 N5, shares N3 -->
  <g data-step="2">
    <path d="M 440 212 L 440 222 L 800 222 L 800 212" fill="none" stroke="#DB2777" stroke-width="2.5"/>
    <text x="620" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">Majority B · any other 3</text>
    <circle cx="470" cy="120" r="30" fill="none" stroke="#DB2777" stroke-width="3"/>
    <text x="450" y="282" text-anchor="middle" font-size="14" fill="#3F3F46">N3 is in both. It votes once per term, so only one side ever reaches a majority. No split-brain.</text>
  </g>
</svg>
