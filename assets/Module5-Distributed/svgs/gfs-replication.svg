<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="gr-t gr-d">
  <title id="gr-t">Replication: self-healing storage</title>
  <desc id="gr-d">Every 64 megabyte chunk is stored as three identical replicas on different
  chunk servers, ideally on separate racks. When one server dies, two replicas still serve,
  and the leader copies the chunk to a fresh healthy server to restore three copies. The
  figure shows the three replicas, a server failing with two surviving, and the leader
  re-replicating to a new server. Color key: pink is the replicated chunk and the recovery
  copy, red is the dead server, grey is the servers and leader.</desc>

  <defs><marker id="ah-grp" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#DB2777"/></marker></defs>

  <text x="450" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Replication: Self-Healing Storage</text>
  <text x="450" y="54" text-anchor="middle" font-size="14" fill="#6B7280">Three copies of every chunk; a dead server triggers a fresh one.</text>

  <!-- three replicas -->
  <g data-step="1">
    <rect x="330" y="78" width="240" height="50" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="450" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">Leader</text>
    <text x="450" y="118" text-anchor="middle" font-size="12.5" fill="#6B7280">tracks each chunk's replica servers</text>

    <text x="450" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">Every chunk is stored as 3 replicas on different racks</text>

    <g fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"><rect x="40" y="196" width="190" height="100" rx="8"/><rect x="260" y="196" width="190" height="100" rx="8"/><rect x="480" y="196" width="190" height="100" rx="8"/></g>
    <g font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle"><text x="135" y="220">Chunk Server 1</text><text x="355" y="220">Chunk Server 2</text><text x="575" y="220">Chunk Server 3</text></g>
    <g font-size="12" fill="#6B7280" text-anchor="middle"><text x="135" y="238">Rack 1</text><text x="355" y="238">Rack 2</text><text x="575" y="238">Rack 3</text></g>
    <g fill="#FFFFFF" stroke="#DB2777" stroke-width="2"><rect x="105" y="250" width="60" height="32" rx="4"/><rect x="325" y="250" width="60" height="32" rx="4"/><rect x="545" y="250" width="60" height="32" rx="4"/></g>
    <g font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle"><text x="135" y="271">C7</text><text x="355" y="271">C7</text><text x="575" y="271">C7</text></g>
  </g>

  <!-- a server dies -->
  <g data-step="2">
    <rect x="260" y="196" width="190" height="100" rx="8" fill="none" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="325" y1="250" x2="385" y2="282" stroke="#DC2626" stroke-width="2.5"/>
    <line x1="385" y1="250" x2="325" y2="282" stroke="#DC2626" stroke-width="2.5"/>
    <text x="355" y="312" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DC2626">server down</text>
    <text x="450" y="336" text-anchor="middle" font-size="14" fill="#3F3F46">A server dies — two replicas still serve.</text>
  </g>

  <!-- self-heal -->
  <g data-step="3">
    <rect x="700" y="196" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <text x="785" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0E0E10">Chunk Server 4</text>
    <text x="785" y="238" text-anchor="middle" font-size="12" fill="#6B7280">healthy, fresh</text>
    <rect x="755" y="250" width="60" height="32" rx="4" fill="#FBE3EE" stroke="#DB2777" stroke-width="2"/>
    <text x="785" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#0E0E10">C7</text>
    <line x1="570" y1="120" x2="752" y2="246" stroke="#DB2777" stroke-width="2.5" marker-end="url(#ah-grp)"/>
    <text x="690" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DB2777">copy C7</text>
    <text x="450" y="360" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">The Leader copies C7 to a healthy server — back to three.</text>
  </g>

  <text x="450" y="414" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = the replicated chunk &amp; the recovery copy&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = the dead server&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = servers &amp; leader</tspan></text>
</svg>
