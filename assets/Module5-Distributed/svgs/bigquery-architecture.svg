<svg viewBox="0 0 900 384" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="bq-t bq-d">
  <title id="bq-t">BigQuery is serverless OLAP: storage and compute scale separately</title>
  <desc id="bq-d">An analyst submits SQL. BigQuery spins up roughly 2,000
  ephemeral compute slots, the pink layer, that scan in parallel and then
  vanish, billed about 6 dollars and 25 cents per tebibyte scanned. They read a 10 TB
  table held as persistent per-column files in Colossus, the grey storage
  layer, billed about 20 dollars per terabyte per month at rest. The two
  layers scale and bill independently. Color key: pink is the ephemeral
  compute in focus, grey is the persistent storage and the query.</desc>
  <defs><marker id="ah-bq" markerWidth="10" markerHeight="7" refX="9" refY="3.5"
    orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="450" y="34" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">BigQuery: serverless OLAP</text>
  <text x="450" y="58" text-anchor="middle" font-size="14" fill="#6B7280">Storage and compute scale and bill independently.</text>

  <!-- Analyst + compute layer (pink) -->
  <g data-step="1">
  <rect x="24" y="92" width="170" height="64" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="109" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#0E0E10">Analyst</text>
  <text x="109" y="140" text-anchor="middle" font-size="14" fill="#6B7280">submits one SQL query</text>
  <line x1="194" y1="124" x2="246" y2="124" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-bq)"/>
  <rect x="250" y="86" width="500" height="92" rx="8" fill="#FBE3EE" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="250" y="86" width="500" height="6" rx="3" fill="#DB2777"/>
  <text x="500" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#DB2777">Compute · ~2,000 ephemeral slots</text>
  <rect x="270" y="124" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="301" y="149" text-anchor="middle" font-size="14" fill="#3F3F46">slot</text>
  <rect x="342" y="124" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="373" y="149" text-anchor="middle" font-size="14" fill="#3F3F46">slot</text>
  <rect x="414" y="124" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="445" y="149" text-anchor="middle" font-size="14" fill="#3F3F46">slot</text>
  <rect x="486" y="124" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="517" y="149" text-anchor="middle" font-size="14" fill="#3F3F46">slot</text>
  <rect x="558" y="124" width="62" height="40" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="589" y="149" text-anchor="middle" font-size="14" fill="#3F3F46">slot</text>
  <text x="660" y="149" text-anchor="middle" font-size="16" fill="#6B7280">…</text>
  <text x="700" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#DB2777">~$6.25/TiB</text>
  </g>

  <!-- Storage layer (grey) -->
  <g data-step="2">
  <line x1="500" y1="178" x2="500" y2="214" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-bq)"/>
  <text x="528" y="200" font-size="14" fill="#6B7280">scan</text>
  <text x="472" y="200" text-anchor="end" font-size="14" fill="#6B7280">return</text>
  <rect x="250" y="226" width="500" height="92" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="500" y="252" text-anchor="middle" font-size="16" font-weight="700" fill="#0E0E10">Storage · Colossus, persistent columnar files</text>
  <rect x="270" y="264" width="78" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="309" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">artist</text>
  <text x="309" y="299" text-anchor="middle" font-size="14" fill="#6B7280">file</text>
  <rect x="358" y="264" width="78" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="397" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">year</text>
  <text x="397" y="299" text-anchor="middle" font-size="14" fill="#6B7280">file</text>
  <rect x="446" y="264" width="78" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="485" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">user_id</text>
  <text x="485" y="299" text-anchor="middle" font-size="14" fill="#6B7280">file</text>
  <rect x="534" y="264" width="78" height="42" rx="4" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="573" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">song_id</text>
  <text x="573" y="299" text-anchor="middle" font-size="14" fill="#6B7280">file</text>
  <text x="640" y="288" text-anchor="middle" font-size="16" fill="#6B7280">…</text>
  <text x="700" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">10 TB total</text>
  <text x="700" y="299" text-anchor="middle" font-size="14" fill="#6B7280">~$20/TB/mo</text>
  </g>

  <text x="450" y="356" text-anchor="middle" font-size="14"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = the ephemeral compute in focus&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the persistent storage and the query</tspan></text>
</svg>
