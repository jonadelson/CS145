<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:auto;" font-family="Inter, sans-serif"
     role="img" aria-labelledby="srf-t srf-d">
  <title id="srf-t">Why you need both: each mechanism alone leaves a gap</title>
  <desc id="srf-d">Two failure modes. Left, sharding without replication: ten shards on ten
  machines, but when one machine dies its shard is offline, locking out one in ten users.
  Right, replication without sharding: every machine holds the whole 10 TB dataset, which does
  not fit on a 1 TB disk. Only running both together avoids both gaps. Color key: red is the
  failure, pink is the data at risk, grey is the machines.</desc>

  <defs><marker id="ah-srf" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="450" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">Why You Need Both</text>
  <text x="450" y="54" text-anchor="middle" font-size="14" fill="#6B7280">Each mechanism alone leaves a gap.</text>

  <line x1="450" y1="92" x2="450" y2="372" stroke="#D4D7DC" stroke-width="1"/>

  <!-- sharding without replication -->
  <g data-step="1">
    <rect x="24" y="80" width="404" height="300" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="24" y="80" width="404" height="6" rx="3" fill="#DC2626"/>
    <text x="226" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0E0E10">Sharding without replication</text>
    <text x="226" y="134" text-anchor="middle" font-size="14" fill="#6B7280">10 shards, one copy each</text>

    <g fill="#FFFFFF" stroke="#6B7280" stroke-width="1">
      <rect x="48" y="158" width="64" height="40" rx="4"/><rect x="120" y="158" width="64" height="40" rx="4"/><rect x="192" y="158" width="64" height="40" rx="4"/><rect x="264" y="158" width="64" height="40" rx="4"/><rect x="336" y="158" width="64" height="40" rx="4"/>
      <rect x="48" y="206" width="64" height="40" rx="4"/><rect x="192" y="206" width="64" height="40" rx="4"/><rect x="264" y="206" width="64" height="40" rx="4"/><rect x="336" y="206" width="64" height="40" rx="4"/>
    </g>
    <g font-size="12.5" fill="#3F3F46" text-anchor="middle"><text x="80" y="182">S1</text><text x="152" y="182">S2</text><text x="224" y="182">S3</text><text x="296" y="182">S4</text><text x="368" y="182">S5</text><text x="80" y="230">S6</text><text x="224" y="230">S8</text><text x="296" y="230">S9</text><text x="368" y="230">S10</text></g>

    <rect x="120" y="206" width="64" height="40" rx="4" fill="#FBE3EE" stroke="#DC2626" stroke-width="2"/>
    <line x1="128" y1="214" x2="176" y2="238" stroke="#DC2626" stroke-width="2"/><line x1="176" y1="214" x2="128" y2="238" stroke="#DC2626" stroke-width="2"/>
    <text x="152" y="266" text-anchor="middle" font-size="12.5" font-weight="700" fill="#DC2626">S7 gone</text>

    <text x="226" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">One machine dies → its shard is offline</text>
    <text x="226" y="342" text-anchor="middle" font-size="14" fill="#3F3F46">1 in 10 users locked out</text>
  </g>

  <!-- replication without sharding -->
  <g data-step="2">
    <rect x="472" y="80" width="404" height="300" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="472" y="80" width="404" height="6" rx="3" fill="#DC2626"/>
    <text x="674" y="112" text-anchor="middle" font-size="16" font-weight="700" fill="#0E0E10">Replication without sharding</text>
    <text x="674" y="134" text-anchor="middle" font-size="14" fill="#6B7280">Every machine holds the whole dataset</text>

    <g fill="#FFFFFF" stroke="#6B7280" stroke-width="1"><rect x="512" y="166" width="100" height="92" rx="8"/><rect x="624" y="166" width="100" height="92" rx="8"/><rect x="736" y="166" width="100" height="92" rx="8"/></g>
    <g font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle"><text x="562" y="190">Node A</text><text x="674" y="190">Node B</text><text x="786" y="190">Node C</text></g>
    <g fill="#FBE3EE" stroke="#DC2626" stroke-width="2"><rect x="524" y="202" width="76" height="40" rx="4"/><rect x="636" y="202" width="76" height="40" rx="4"/><rect x="748" y="202" width="76" height="40" rx="4"/></g>
    <g font-size="12.5" font-weight="700" fill="#DC2626" text-anchor="middle"><text x="562" y="220">10 TB</text><text x="674" y="220">10 TB</text><text x="786" y="220">10 TB</text><text x="562" y="236">on 1 TB</text><text x="674" y="236">on 1 TB</text><text x="786" y="236">on 1 TB</text></g>

    <text x="674" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">10 TB will not fit on a 1 TB disk</text>
    <text x="674" y="342" text-anchor="middle" font-size="14" fill="#3F3F46">Copies do not add capacity</text>
  </g>

  <text x="450" y="406" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = the failure&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DB2777" font-weight="700">pink</tspan><tspan fill="#3F3F46"> = the data at risk&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the machines</tspan></text>
</svg>
