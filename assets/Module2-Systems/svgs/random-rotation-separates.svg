<svg viewBox="0 0 1080 510" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="rr-t rr-d">
  <title id="rr-t">A random spin turns the grid, not the points</title>
  <desc id="rr-d">Two panels with San Francisco and Berkeley at the exact same positions in both, the same distance apart. Left, grey: most variation runs north-south, so the axis-aligned grid resolves north-south but barely splits east-west, and the two points, which differ east-west, fall in one cell. Right, orange: the grid is spun to a random angle while the points stay put; the turned grid now falls between them, so they land in two different cells. The spin turns the axes and changes no distance. Color key: grey is the aligned grid, orange is the spun grid, the dark dot is Stanford at the origin.</desc>
  <defs>
    <marker id="spin" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#EA580C"/></marker>
    <clipPath id="clipB"><rect x="60" y="100" width="380" height="320"/></clipPath>
    <clipPath id="clipA"><rect x="620" y="100" width="380" height="320"/></clipPath>
  </defs>
  <text x="540" y="40" text-anchor="middle" style="font-size:23px;font-weight:700;fill:#0E0E10;">A random spin turns the grid, not the points</text>
  <text x="540" y="66" text-anchor="middle" style="font-size:15px;fill:#3F3F46;">Most variation runs north-south; SF and Berkeley differ east-west. The points never move; only the grid turns.</text>

  <g data-step="1">
  <g clip-path="url(#clipB)"><rect x="205" y="125" width="90" height="90" fill="#E7EAEE" stroke="#6B7280" stroke-width="2"/>
  <line x1="25" y1="10" x2="25" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="35" x2="500" y2="35" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="115" y1="10" x2="115" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="125" x2="500" y2="125" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="205" y1="10" x2="205" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="215" x2="500" y2="215" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="295" y1="10" x2="295" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="305" x2="500" y2="305" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="385" y1="10" x2="385" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="395" x2="500" y2="395" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="475" y1="10" x2="475" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="0" y1="485" x2="500" y2="485" stroke="#D4D7DC" stroke-width="1"/></g>
  <rect x="60" y="100" width="380" height="320" fill="none" stroke="#D4D7DC" stroke-width="1.5"/>
  <circle cx="250" cy="360" r="5" fill="#0E0E10"/>
  <text x="250" y="382" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#6B7280;">Stanford</text>
  <circle cx="222" cy="160" r="6" fill="#6B7280"/><text x="222" y="148" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#6B7280;">SF</text>
  <circle cx="278" cy="160" r="6" fill="#6B7280"/><text x="278" y="182" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#6B7280;">Berkeley</text>
  <text x="250" y="92" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Before: grid aligned</text>
  <text x="250" y="458" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#0E0E10;">SF and Berkeley fall in one cell</text>
  </g>

  <g data-step="2">
  <path d="M 470 250 q 60 -45 110 0" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#spin)"/>
  <text x="525" y="222" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#EA580C;">spin the grid</text>
  <text x="525" y="239" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#EA580C;">a random angle</text>
  </g>

  <g data-step="3">
  <g clip-path="url(#clipA)"><g transform="rotate(35 810 260)">
  <rect x="675" y="125" width="90" height="90" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/>
  <rect x="765" y="125" width="90" height="90" fill="#FDEBE0" stroke="#EA580C" stroke-width="2"/></g>
  <g transform="rotate(35 810 260)"><line x1="585" y1="10" x2="585" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="35" x2="1060" y2="35" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="675" y1="10" x2="675" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="125" x2="1060" y2="125" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="765" y1="10" x2="765" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="215" x2="1060" y2="215" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="855" y1="10" x2="855" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="305" x2="1060" y2="305" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="945" y1="10" x2="945" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="395" x2="1060" y2="395" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="1035" y1="10" x2="1035" y2="510" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="560" y1="485" x2="1060" y2="485" stroke="#D4D7DC" stroke-width="1"/></g></g>
  <rect x="620" y="100" width="380" height="320" fill="none" stroke="#D4D7DC" stroke-width="1.5"/>
  <circle cx="810" cy="360" r="5" fill="#0E0E10"/>
  <text x="810" y="382" text-anchor="middle" style="font-size:12px;font-weight:700;fill:#6B7280;">Stanford</text>
  <circle cx="782" cy="160" r="6" fill="#EA580C"/><text x="782" y="148" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#EA580C;">SF</text>
  <circle cx="838" cy="160" r="6" fill="#EA580C"/><text x="838" y="182" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#EA580C;">Berkeley</text>
  <text x="810" y="92" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">After: grid spun</text>
  <text x="810" y="458" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#0E0E10;">same distance, but now different cells</text>
  </g>

  <text x="540" y="494" text-anchor="middle" font-size="13"><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the aligned grid&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#EA580C" font-weight="700">orange</tspan><tspan fill="#3F3F46"> = the same grid spun to a random angle (points unmoved)</tspan></text>
</svg>