<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="hc-t hc-d">
  <title id="hc-t">Nearby points share a cell, far points do not</title>
  <desc id="hc-d">The three Stanford campus buildings versus SF Mission, computed with H3. At resolution 8 (zoomed out) the three campus buildings get the identical code 8828347417fffff, one shared cell, while SF Mission, 29 miles away, gets a different code. At resolution 12 (zoomed in) the three campus codes split into three cells, differing in the fine digits at the end (orange), and SF stays different. Color key: orange is where the campus codes differ at resolution 12, black is shared.</desc>
  <text x="500" y="38" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#0E0E10;">Nearby points share a cell, far points do not</text>
  <text x="500" y="64" text-anchor="middle" style="font-size:15px;fill:#3F3F46;">Three Stanford buildings vs SF Mission, computed with H3. Campus shares a cell at res 8 and splits at res 12.</text>

  <g data-step="1">
  <text x="60" y="108" font-size="17" font-weight="700" fill="#0E0E10">Resolution 8 &#183; zoomed out</text>
  <text x="235" y="142" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">NVidia</text><text x="253" y="142" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="235" y="172" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">Packard</text><text x="253" y="172" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="235" y="202" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">Gates</text><text x="253" y="202" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <path d="M 525 128 q 7 0 7 8 L 532 162.0 q 0 8 7 8 q -7 0 -7 8 L 532 204 q 0 8 -7 8" fill="none" stroke="#6B7280" stroke-width="2"/>
  <text x="543" y="180" font-size="15" font-weight="700" fill="#0E0E10">campus: one cell, one code</text>
  <text x="235" y="252" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">SF Mission</text><text x="253" y="252" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">0</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">a</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="543" y="252" font-size="15" font-weight="700" fill="#6B7280">29 mi away: a different cell</text>
  </g>

  <g data-step="2">
  <text x="60" y="322" font-size="17" font-weight="700" fill="#0E0E10">Resolution 12 &#183; zoomed in</text>
  <text x="235" y="360" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">NVidia</text><text x="253" y="360" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">c</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">6</tspan><tspan fill="#EA580C" font-weight="700">2</tspan><tspan fill="#EA580C" font-weight="700">5</tspan><tspan fill="#EA580C" font-weight="700">7</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="235" y="390" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">Packard</text><text x="253" y="390" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">c</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">6</tspan><tspan fill="#EA580C" font-weight="700">0</tspan><tspan fill="#EA580C" font-weight="700">2</tspan><tspan fill="#EA580C" font-weight="700">b</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="235" y="420" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">Gates</text><text x="253" y="420" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">c</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">7</tspan><tspan fill="#0E0E10">4</tspan><tspan fill="#0E0E10">1</tspan><tspan fill="#0E0E10">6</tspan><tspan fill="#EA580C" font-weight="700">0</tspan><tspan fill="#EA580C" font-weight="700">2</tspan><tspan fill="#EA580C" font-weight="700">1</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <path d="M 525 346 q 7 0 7 8 L 532 380.0 q 0 8 7 8 q -7 0 -7 8 L 532 422 q 0 8 -7 8" fill="none" stroke="#EA580C" stroke-width="2"/>
  <text x="543" y="398" font-size="15" font-weight="700" fill="#EA580C">campus: three cells now</text>
  <text x="235" y="470" text-anchor="end" font-size="14" font-weight="700" fill="#6B7280">SF Mission</text><text x="253" y="470" font-family="ui-monospace, Menlo, monospace" font-size="20" letter-spacing="0.5"><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">c</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">3</tspan><tspan fill="#0E0E10">0</tspan><tspan fill="#0E0E10">8</tspan><tspan fill="#0E0E10">2</tspan><tspan fill="#0E0E10">a</tspan><tspan fill="#0E0E10">0</tspan><tspan fill="#0E0E10">6</tspan><tspan fill="#0E0E10">b</tspan><tspan fill="#0E0E10">b</tspan><tspan fill="#0E0E10">f</tspan><tspan fill="#0E0E10">f</tspan></text>
  <text x="543" y="470" font-size="15" font-weight="700" fill="#6B7280">still a different cell</text>
  </g>

  <text x="500" y="578" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#EA580C" font-weight="700">orange</tspan><tspan fill="#3F3F46"> = where the campus codes differ at res 12&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#0E0E10" font-weight="700">black</tspan><tspan fill="#3F3F46"> = shared</tspan></text>
</svg>