<svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ann-t ann-d">
  <title id="ann-t">Brute-force scan vs an ANN index</title>
  <desc id="ann-d">Two panels. Left, grey: exact brute force compares the query against all 1 million 1,536-dimensional vectors, about 1.5 billion multiply-adds and ~6 GB scanned per query. Right, orange: an ANN index (IVF clusters, or an HNSW proximity graph) looks at only the few clusters or graph neighbours near the query, a small fraction of the vectors, in well under a millisecond, at the cost of an occasional missed neighbour. Same recall target, roughly 100 to 1000 times less work. Color key: grey is the exact baseline, orange is the ANN index.</desc>
  <defs><marker id="ah-ann" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="600" y="40" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#0E0E10;">One query over a million 1,536-D embeddings</text>
  <text x="600" y="66" text-anchor="middle" style="font-size:16px;fill:#3F3F46;">Same nearest-neighbour answer, ~100 to 1000x less work.</text>

  <!-- STEP 1: brute force (grey baseline) -->
  <g data-step="1">
  <rect x="60" y="100" width="480" height="360" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="60" y="100" width="480" height="6" rx="3" fill="#6B7280"/>
  <text x="300" y="134" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#6B7280;">Exact: IndexFlatL2 (the baseline)</text>
  <rect x="92" y="158" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="300" y="186" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Compare the query to every vector</text>
  <text x="300" y="210" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">1M × 1,536-D L2 distances</text>
  <rect x="92" y="246" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="300" y="274" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">~1.5 billion multiply-adds / query</text>
  <text x="300" y="298" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">~6 GB of vectors scanned</text>
  <rect x="92" y="334" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="300" y="362" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Exact answer, but O(N) per query</text>
  <text x="300" y="386" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">does not scale to billions</text>
  </g>

  <!-- STEP 2: build the index -->
  <g data-step="2">
  <line x1="548" y1="280" x2="650" y2="280" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-ann)"/>
  <text x="599" y="268" text-anchor="middle" style="font-size:14px;font-weight:700;fill:#6B7280;">index</text>
  </g>

  <!-- STEP 3: ANN (orange) -->
  <g data-step="3">
  <rect x="660" y="100" width="480" height="360" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="660" y="100" width="480" height="6" rx="3" fill="#EA580C"/>
  <text x="900" y="134" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#EA580C;">ANN index (IVF or HNSW)</text>
  <rect x="692" y="158" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="900" y="186" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Cluster (IVF): probe a few cells</text>
  <text x="900" y="210" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">look at a small fraction, skip the rest</text>
  <rect x="692" y="246" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="900" y="274" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Or a proximity graph (HNSW)</text>
  <text x="900" y="298" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">greedy-descend to the neighbourhood</text>
  <rect x="692" y="334" width="416" height="70" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="900" y="362" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#0E0E10;">Sub-millisecond, occasional miss</text>
  <text x="900" y="386" text-anchor="middle" style="font-size:14px;fill:#3F3F46;">approximate, but it scales</text>
  </g>

  <text x="600" y="500" text-anchor="middle" style="font-size:14px;"><tspan style="fill:#0E0E10;font-weight:700;">Color key&#160;&#160;</tspan><tspan style="fill:#6B7280;font-weight:700;">grey</tspan><tspan style="fill:#3F3F46;"> = the exact brute-force baseline&#160;&#160;·&#160;&#160;</tspan><tspan style="fill:#EA580C;font-weight:700;">orange</tspan><tspan style="fill:#3F3F46;"> = the ANN index</tspan></text>
</svg>
