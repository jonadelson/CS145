<svg viewBox="0 0 1000 544" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="cache-hierarchy-t cache-hierarchy-d">
  <title id="cache-hierarchy-t">Cache hierarchy: reading 200 pages</title>
  <desc id="cache-hierarchy-d">200 page reads. The RAM check costs 0.128s and serves 180 pages (90% hit, green); 20 miss. 15 misses go to SSD (0.192s, amber) and 5 to HDD (3.25s, red). Total 3.57s. The 5 HDD reads, 2.5% of the requests, are 91% of the time. Color key: green is a RAM hit, amber is SSD, red is the slow HDD tail, grey is structure.</desc>
  <text x="500" y="40" text-anchor="middle" style="font-size: 24px; font-weight: 700; fill: #0E0E10;">Cache hierarchy: reading 200 pages</text>
  <text x="500" y="66" text-anchor="middle" style="font-size: 14px; fill: #6B7280;">90% hit RAM; the few that fall to HDD dominate the wall-clock time</text>
  <defs><marker id="pioA" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#6B7280"/></marker></defs>
  <rect x="360" y="92" width="280" height="52" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="360" y="92" width="280" height="6" rx="3" fill="#6B7280"/>
  <text x="500" y="122" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #0E0E10;">Request: 200 pages</text>
  <text x="500" y="146" text-anchor="middle" style="font-size: 14px; fill: #6B7280;">must check RAM first</text>
  <line x1="500" y1="144" x2="500" y2="176" stroke="#6B7280" stroke-width="2" marker-end="url(#pioA)"/>
  <rect x="330" y="180" width="340" height="104" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="330" y="180" width="340" height="6" rx="3" fill="#059669"/>
  <text x="500" y="210" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #0E0E10;">RAM cache check</text>
  <text x="500" y="234" text-anchor="middle" style="font-size: 14px; fill: #3F3F46;">cost: 200 &#215; 0.00064s = 0.128s</text>
  <text x="500" y="256" text-anchor="middle" style="font-size: 14px; fill: #059669;">&#10003; 180 pages hit (90%)</text>
  <text x="500" y="278" text-anchor="middle" style="font-size: 14px; fill: #DC2626;">&#10007; 20 pages miss (10%)</text>
  <line x1="430" y1="284" x2="330" y2="328" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#pioA)"/>
  <line x1="570" y1="284" x2="670" y2="328" stroke="#6B7280" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#pioA)"/>
  <rect x="150" y="332" width="300" height="84" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="150" y="332" width="300" height="6" rx="3" fill="#D97706"/>
  <text x="300" y="362" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #0E0E10;">SSD fetch</text>
  <text x="300" y="386" text-anchor="middle" style="font-size: 14px; fill: #3F3F46;">15 pages &#215; 0.01281s</text>
  <text x="300" y="408" text-anchor="middle" style="font-size: 14px; fill: #0E0E10;">= 0.192s</text>
  <rect x="550" y="332" width="300" height="84" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="550" y="332" width="300" height="6" rx="3" fill="#DC2626"/>
  <text x="700" y="362" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #0E0E10;">HDD fetch</text>
  <text x="700" y="386" text-anchor="middle" style="font-size: 14px; fill: #3F3F46;">5 pages &#215; 0.65s</text>
  <text x="700" y="408" text-anchor="middle" style="font-size: 14px; fill: #0E0E10;">= 3.25s</text>
  <rect x="330" y="432" width="340" height="56" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="330" y="432" width="340" height="6" rx="3" fill="#6B7280"/>
  <text x="500" y="462" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #0E0E10;">Total time</text>
  <text x="500" y="486" text-anchor="middle" style="font-size: 14px; fill: #0E0E10;">0.128s + 0.192s + 3.25s = 3.57s</text>
  <text x="500" y="518" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = RAM hit&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#D97706" font-weight="700">amber</tspan><tspan fill="#3F3F46"> = SSD&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = slow HDD tail</tspan></text>
</svg>
