<svg viewBox="0 0 1200 412" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="bloom-filter-t bloom-filter-d">
  <title id="bloom-filter-t">Bloom filter: a bit array plus k hash functions</title>
  <desc id="bloom-filter-d">A 16-bit array; bits 9 and 11 are set (orange) from earlier inserts. INSERT "alice" hashes to bits 3, 7, 14 and sets them. LOOKUP "bob" hashes to bits 3, 9, 2; bit 2 is 0, so "bob" is definitely not in the set. Color key: orange is a set bit, grey is an unset bit, green is a guaranteed answer.</desc>
  <text x="600" y="40" text-anchor="middle" style="font-size: 24px; font-weight: 700; fill: #0E0E10;">Bloom filter: a bit array + k hash functions</text>
  <text x="600" y="66" text-anchor="middle" style="font-size: 14px; fill: #6B7280;">16-bit array (real ones use millions of bits)</text>

  <!-- STEP 1: the bit array, base state (bits 9 and 11 set by earlier inserts) -->
  <g data-step="1">
  <circle cx="70" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="70" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="70" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[0]</text>
  <circle cx="141" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="141" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="141" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[1]</text>
  <circle cx="211" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="211" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="211" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[2]</text>
  <circle cx="282" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="282" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="282" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[3]</text>
  <circle cx="353" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="353" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="353" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[4]</text>
  <circle cx="423" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="423" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="423" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[5]</text>
  <circle cx="494" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="494" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="494" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[6]</text>
  <circle cx="565" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="565" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="565" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[7]</text>
  <circle cx="635" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="635" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="635" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[8]</text>
  <circle cx="706" cy="128" r="24" fill="#EA580C" stroke="#EA580C" stroke-width="2"/>
  <text x="706" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #FFFFFF;">1</text>
  <text x="706" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[9]</text>
  <circle cx="777" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="777" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="777" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[10]</text>
  <circle cx="847" cy="128" r="24" fill="#EA580C" stroke="#EA580C" stroke-width="2"/>
  <text x="847" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #FFFFFF;">1</text>
  <text x="847" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[11]</text>
  <circle cx="918" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="918" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="918" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[12]</text>
  <circle cx="989" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="989" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="989" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[13]</text>
  <circle cx="1059" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="1059" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="1059" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[14]</text>
  <circle cx="1130" cy="128" r="24" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="2"/>
  <text x="1130" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #6B7280;">0</text>
  <text x="1130" y="170" text-anchor="middle" style="font-size: 13px; fill: #6B7280;">[15]</text>
  </g>

  <!-- STEP 2: INSERT "alice" sets bits 3, 7, 14 (orange overlays on the base cells) -->
  <g data-step="2">
  <rect x="70" y="208" width="520" height="156" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="70" y="208" width="520" height="6" rx="3" fill="#EA580C"/>
  <text x="90" y="240" style="font-size: 17px; font-weight: 700; fill: #0E0E10;">INSERT "alice"</text>
  <text x="90" y="270" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash1("alice") % 16 = 3  &#8594; bit[3] = 1</text>
  <text x="90" y="294" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash2("alice") % 16 = 7  &#8594; bit[7] = 1</text>
  <text x="90" y="318" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash3("alice") % 16 = 14 &#8594; bit[14] = 1</text>
  <text x="90" y="348" style="font-size: 14px; font-style: italic; fill: #6B7280;">Bits 3, 7, 14 set now; bits 9 and 11 came from prior inserts.</text>
  <circle cx="282" cy="128" r="24" fill="#EA580C" stroke="#EA580C" stroke-width="2"/>
  <text x="282" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #FFFFFF;">1</text>
  <circle cx="565" cy="128" r="24" fill="#EA580C" stroke="#EA580C" stroke-width="2"/>
  <text x="565" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #FFFFFF;">1</text>
  <circle cx="1059" cy="128" r="24" fill="#EA580C" stroke="#EA580C" stroke-width="2"/>
  <text x="1059" y="134" text-anchor="middle" style="font-size: 16px; font-weight: 700; fill: #FFFFFF;">1</text>
  </g>

  <!-- STEP 3: LOOKUP "bob" hashes to bits 3, 9, 2 -->
  <g data-step="3">
  <rect x="620" y="208" width="510" height="156" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1" rx="8"/>
  <rect x="620" y="208" width="510" height="6" rx="3" fill="#EA580C"/>
  <text x="640" y="240" style="font-size: 17px; font-weight: 700; fill: #0E0E10;">LOOKUP "bob"</text>
  <text x="640" y="270" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash1("bob") % 16 = 3  &#8594; bit[3] = 1</text>
  <text x="640" y="294" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash2("bob") % 16 = 9  &#8594; bit[9] = 1</text>
  <text x="640" y="318" font-family="JetBrains Mono, monospace" style="font-size: 15px; fill: #3F3F46;">hash3("bob") % 16 = 2  &#8594; bit[2] = 0</text>
  </g>

  <!-- STEP 4: the 0 bit rejects bob -->
  <g data-step="4">
  <circle cx="211" cy="128" r="28" fill="none" stroke="#059669" stroke-width="3"/>
  <text x="640" y="348" style="font-size: 14px; font-weight: 700; fill: #059669;">bit[2] = 0  &#8658;  definitely NOT in the set</text>
  </g>

  <text x="600" y="388" text-anchor="middle" font-size="13"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#EA580C" font-weight="700">orange</tspan><tspan fill="#3F3F46"> = a set bit&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = an unset bit&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = a guaranteed answer</tspan></text>
</svg>
