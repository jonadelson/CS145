<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif" role="img" aria-labelledby="ct-t ct-d">
  <title id="ct-t">Four columnar compression techniques at a glance</title>
  <desc id="ct-d">Four panels side by side, one per technique. RLE turns a run like Mickey times three, Daffy times four into one value plus a count, 10 to 100 times smaller, very fast, best for sorted repeated values. Dictionary replaces low-cardinality strings with small integer codes, 5 to 20 times, fast, best for low-cardinality strings. Delta stores the difference between sorted numbers, 5 to 10 times, fast, best for sorted numbers and timestamps. Bit packing stores small integers in the minimum bits, 4 to 8 times, very fast, best for small integers and flags. In each panel the raw input is grey and the encoded result is orange. Color key: orange is the encoded result, grey is the raw input.</desc>

  <text x="600" y="40" text-anchor="middle" style="font-size:24px;font-weight:700;fill:#0E0E10;">Four ways to shrink a column</text>
  <text x="600" y="66" text-anchor="middle" style="font-size:16px;fill:#3F3F46;">Same idea: a column repeats, so stop repeating it. Pick by the data.</text>

  <!-- RLE -->
  <g data-step="1">
  <rect x="40" y="96" width="270" height="410" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="40" y="96" width="270" height="6" rx="3" fill="#EA580C"/>
  <text x="175" y="130" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#EA580C;">RLE</text>
  <text x="62" y="166" style="font-size:13px;font-weight:700;fill:#6B7280;">RAW</text>
  <text x="62" y="188" style="font-size:14px;fill:#3F3F46;">Mickey,Mickey,Mickey,</text>
  <text x="62" y="206" style="font-size:14px;fill:#3F3F46;">Daffy,Daffy,Daffy,Daffy</text>
  <text x="62" y="240" style="font-size:13px;font-weight:700;fill:#6B7280;">ENCODED</text>
  <text x="62" y="262" style="font-size:14px;font-weight:700;fill:#EA580C;">(Mickey, 3) (Daffy, 4)</text>
  <text x="62" y="320" style="font-size:15px;fill:#0E0E10;">Ratio  <tspan font-weight="700">10&#8211;100&#215;</tspan></text>
  <text x="62" y="346" style="font-size:14px;fill:#3F3F46;">Speed  very fast</text>
  <text x="62" y="394" style="font-size:13px;font-weight:700;fill:#6B7280;">BEST FOR</text>
  <text x="62" y="416" style="font-size:14px;fill:#3F3F46;">Sorted, repeated</text>
  <text x="62" y="434" style="font-size:14px;fill:#3F3F46;">values</text>
  </g>

  <!-- Dictionary -->
  <g data-step="2">
  <rect x="330" y="96" width="270" height="410" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="330" y="96" width="270" height="6" rx="3" fill="#EA580C"/>
  <text x="465" y="130" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#EA580C;">Dictionary</text>
  <text x="352" y="166" style="font-size:13px;font-weight:700;fill:#6B7280;">RAW</text>
  <text x="352" y="188" style="font-size:14px;fill:#3F3F46;">rock, pop, rock, jazz</text>
  <text x="352" y="240" style="font-size:13px;font-weight:700;fill:#6B7280;">ENCODED</text>
  <text x="352" y="262" style="font-size:14px;font-weight:700;fill:#EA580C;">0, 1, 0, 2</text>
  <text x="352" y="282" style="font-size:14px;fill:#3F3F46;">+ dict {rock:0, pop:1}</text>
  <text x="352" y="320" style="font-size:15px;fill:#0E0E10;">Ratio  <tspan font-weight="700">5&#8211;20&#215;</tspan></text>
  <text x="352" y="346" style="font-size:14px;fill:#3F3F46;">Speed  fast</text>
  <text x="352" y="394" style="font-size:13px;font-weight:700;fill:#6B7280;">BEST FOR</text>
  <text x="352" y="416" style="font-size:14px;fill:#3F3F46;">Low-cardinality</text>
  <text x="352" y="434" style="font-size:14px;fill:#3F3F46;">strings</text>
  </g>

  <!-- Delta -->
  <g data-step="3">
  <rect x="620" y="96" width="270" height="410" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="620" y="96" width="270" height="6" rx="3" fill="#EA580C"/>
  <text x="755" y="130" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#EA580C;">Delta</text>
  <text x="642" y="166" style="font-size:13px;font-weight:700;fill:#6B7280;">RAW</text>
  <text x="642" y="188" style="font-size:14px;fill:#3F3F46;">1700000000, …001,</text>
  <text x="642" y="206" style="font-size:14px;fill:#3F3F46;">…003, …004</text>
  <text x="642" y="240" style="font-size:13px;font-weight:700;fill:#6B7280;">ENCODED</text>
  <text x="642" y="262" style="font-size:14px;font-weight:700;fill:#EA580C;">base, +1, +2, +1</text>
  <text x="642" y="320" style="font-size:15px;fill:#0E0E10;">Ratio  <tspan font-weight="700">5&#8211;10&#215;</tspan></text>
  <text x="642" y="346" style="font-size:14px;fill:#3F3F46;">Speed  fast</text>
  <text x="642" y="394" style="font-size:13px;font-weight:700;fill:#6B7280;">BEST FOR</text>
  <text x="642" y="416" style="font-size:14px;fill:#3F3F46;">Sorted numbers,</text>
  <text x="642" y="434" style="font-size:14px;fill:#3F3F46;">timestamps</text>
  </g>

  <!-- Bit packing -->
  <g data-step="4">
  <rect x="910" y="96" width="270" height="410" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="910" y="96" width="270" height="6" rx="3" fill="#EA580C"/>
  <text x="1045" y="130" text-anchor="middle" style="font-size:17px;font-weight:700;fill:#EA580C;">Bit packing</text>
  <text x="932" y="166" style="font-size:13px;font-weight:700;fill:#6B7280;">RAW</text>
  <text x="932" y="188" style="font-size:14px;fill:#3F3F46;">5 3 4 1  (32-bit ints)</text>
  <text x="932" y="240" style="font-size:13px;font-weight:700;fill:#6B7280;">ENCODED</text>
  <text x="932" y="262" style="font-size:14px;font-weight:700;fill:#EA580C;">101 011 100 001</text>
  <text x="932" y="282" style="font-size:14px;fill:#3F3F46;">3 bits each</text>
  <text x="932" y="320" style="font-size:15px;fill:#0E0E10;">Ratio  <tspan font-weight="700">4&#8211;8&#215;</tspan></text>
  <text x="932" y="346" style="font-size:14px;fill:#3F3F46;">Speed  very fast</text>
  <text x="932" y="394" style="font-size:13px;font-weight:700;fill:#6B7280;">BEST FOR</text>
  <text x="932" y="416" style="font-size:14px;fill:#3F3F46;">Small integers,</text>
  <text x="932" y="434" style="font-size:14px;fill:#3F3F46;">flags</text>
  </g>

  <text x="600" y="540" text-anchor="middle" style="font-size:14px;"><tspan style="fill:#0E0E10;font-weight:700;">Color key&#160;&#160;</tspan><tspan style="fill:#EA580C;font-weight:700;">orange</tspan><tspan style="fill:#3F3F46;"> = the encoded result&#160;&#160;·&#160;&#160;</tspan><tspan style="fill:#6B7280;font-weight:700;">grey</tspan><tspan style="fill:#3F3F46;"> = the raw input</tspan></text>
</svg>
