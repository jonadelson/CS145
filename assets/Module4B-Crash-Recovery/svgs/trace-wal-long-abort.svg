<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 530" role="img" aria-labelledby="ta-t ta-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="ta-t">The log for a long transaction TLong that aborts</title>
  <desc id="ta-d">A log table for TLong, which writes A0 and A1000 then aborts. The two forward writes raise A0 from 19 to 22.8 and A1000 from 27 to 32.4. Undo then walks the log backward, newest change first: it logs a W-abort that restores A1000 from 32.4 to 27, then a W-abort that restores A0 from 22.8 to 19, then a final abort record. The old value column drives each undo. Color key: violet is the log, red marks the undo writes that reverse the transaction, green is the restored data on disk.</desc>

  <text x="40" y="36" font-size="24" font-weight="700" fill="#0E0E10">The log: TLong aborts and unwinds</text>
  <text x="40" y="60" font-size="14" fill="#6B7280">Undo does not erase log rows. It appends W-abort rows, newest write undone first.</text>

  <!-- column headers -->
  <text x="90"  y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Time</text>
  <text x="184" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Txn</text>
  <text x="296" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Action</text>
  <text x="404" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Var</text>
  <text x="504" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">old value</text>
  <text x="600" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">new value</text>
  <text x="816" y="98" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">disk state after</text>
  <line x1="40" y1="108" x2="1080" y2="108" stroke="#D4D7DC"/>

  <!-- band divider -->
  <line x1="666" y1="84" x2="666" y2="392" stroke="#D4D7DC"/>

  <!-- row 1: forward W A0 -->
  <g data-step="1">
    <text x="90"  y="140" text-anchor="middle" font-size="14" fill="#0E0E10">13</text>
    <text x="184" y="140" text-anchor="middle" font-size="14" fill="#0E0E10">TLong</text>
    <text x="296" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">W</text>
    <text x="404" y="140" text-anchor="middle" font-size="14" fill="#0E0E10">A0</text>
    <text x="504" y="140" text-anchor="middle" font-size="14" fill="#0E0E10">19</text>
    <text x="600" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">22.8</text>
    <text x="816" y="140" text-anchor="middle" font-size="14" fill="#6B7280">A0 = 22.8</text>
  </g>

  <!-- row 2: forward W A1000 -->
  <g data-step="2">
    <rect x="40" y="150" width="1040" height="32" fill="#F7F8FA"/>
    <text x="90"  y="172" text-anchor="middle" font-size="14" fill="#0E0E10">92</text>
    <text x="184" y="172" text-anchor="middle" font-size="14" fill="#0E0E10">TLong</text>
    <text x="296" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#EA580C">W</text>
    <text x="404" y="172" text-anchor="middle" font-size="14" fill="#0E0E10">A1000</text>
    <text x="504" y="172" text-anchor="middle" font-size="14" fill="#0E0E10">27</text>
    <text x="600" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">32.4</text>
    <text x="816" y="172" text-anchor="middle" font-size="14" fill="#6B7280">A1000 = 32.4</text>
  </g>

  <!-- row 3: W-abort A1000 (newest first) -->
  <g data-step="3">
    <text x="90"  y="204" text-anchor="middle" font-size="14" fill="#0E0E10">1000</text>
    <text x="184" y="204" text-anchor="middle" font-size="14" fill="#0E0E10">TLong</text>
    <text x="296" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">W-abort</text>
    <text x="404" y="204" text-anchor="middle" font-size="14" fill="#0E0E10">A1000</text>
    <text x="504" y="204" text-anchor="middle" font-size="14" fill="#0E0E10">32.4</text>
    <text x="600" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">27</text>
    <text x="816" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">A1000 = 27</text>
  </g>

  <!-- row 4: W-abort A0 -->
  <g data-step="4">
    <rect x="40" y="214" width="1040" height="32" fill="#F7F8FA"/>
    <text x="90"  y="236" text-anchor="middle" font-size="14" fill="#0E0E10">1000</text>
    <text x="184" y="236" text-anchor="middle" font-size="14" fill="#0E0E10">TLong</text>
    <text x="296" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">W-abort</text>
    <text x="404" y="236" text-anchor="middle" font-size="14" fill="#0E0E10">A0</text>
    <text x="504" y="236" text-anchor="middle" font-size="14" fill="#0E0E10">22.8</text>
    <text x="600" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#0E0E10">19</text>
    <text x="816" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">A0 = 19</text>
  </g>

  <!-- row 5: abort record -->
  <g data-step="5">
    <text x="90"  y="268" text-anchor="middle" font-size="14" fill="#0E0E10">1000</text>
    <text x="184" y="268" text-anchor="middle" font-size="14" fill="#0E0E10">TLong</text>
    <text x="296" y="268" text-anchor="middle" font-size="14" font-weight="700" fill="#DC2626">abort</text>
    <text x="404" y="268" text-anchor="middle" font-size="14" fill="#6B7280">—</text>
    <text x="504" y="268" text-anchor="middle" font-size="14" fill="#6B7280">—</text>
    <text x="600" y="268" text-anchor="middle" font-size="14" fill="#6B7280">—</text>
    <text x="816" y="268" text-anchor="middle" font-size="13" fill="#6B7280">back to start state</text>
  </g>

  <line x1="40" y1="288" x2="1080" y2="288" stroke="#D4D7DC"/>

  <!-- the rule callout -->
  <g data-step="6">
    <rect x="40" y="310" width="1040" height="80" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
    <rect x="40" y="310" width="6" height="80" rx="3" fill="#A78BFA"/>
    <text x="68" y="338" font-size="17" font-weight="700" fill="#7C3AED">Undo is just a write</text>
    <text x="68" y="364" font-size="15" fill="#3F3F46">Each W-abort reuses the old value from the forward row: 32.4 back to 27, then 22.8 back to 19.</text>
    <text x="68" y="384" font-size="15" fill="#3F3F46">Each W-abort is itself logged, so the log records TLong's full rollback.</text>
  </g>

  <!-- color key -->
  <text x="40" y="430" font-size="14" fill="#6B7280">Color key  <tspan fill="#7C3AED" font-weight="700">violet</tspan> = the log  ·  <tspan fill="#DC2626" font-weight="700">red</tspan> = the undo writes that reverse TLong  ·  <tspan fill="#16A34A" font-weight="700">green</tspan> = the restored data on disk</text>
  <text x="40" y="454" font-size="14" fill="#6B7280">Recovery walks backward: A1000 is undone before A0, newest write first.</text>
</svg>
