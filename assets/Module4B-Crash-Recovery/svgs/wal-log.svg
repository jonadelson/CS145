<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 424" role="img" aria-labelledby="wl-t wl-d" style="width:100%; height:auto; font-family:Inter, sans-serif;">
  <title id="wl-t">The WAL log as a table of diffs for T1</title>
  <desc id="wl-d">The log after T1 raises A and B by twenty percent. It is a growing append-only table: each write is one row holding the old value, orange, that undo needs and the new value, green, that redo needs. T1 writes A from 19 to 22.8 and B from 23 to 27.6, then a COMMIT record marks the transaction's end. Ellipsis rows show this is one stretch of a much longer log. Color key: orange is the old value, green is the new value, violet is the log itself.</desc>

  <text x="260" y="32" text-anchor="middle" font-size="24" font-weight="700" fill="#0E0E10">The log: a table of diffs</text>
  <text x="260" y="56" text-anchor="middle" font-size="14" fill="#6B7280">Each write is one row of old and new. A commit record ends the transaction.</text>

  <!-- log frame (violet = the log) -->
  <g data-step="1">
    <rect x="40" y="76" width="440" height="182" rx="8" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
    <rect x="40" y="76" width="440" height="6" rx="3" fill="#A78BFA"/>
    <text x="95"  y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Txn</text>
    <text x="180" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#3F3F46">Var</text>
    <text x="305" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#D97706">old value</text>
    <text x="420" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">new value</text>
    <line x1="52" y1="118" x2="468" y2="118" stroke="#D4D7DC"/>
    <text x="95"  y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">…</text>
    <text x="180" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">…</text>
    <text x="305" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">…</text>
    <text x="420" y="146" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#6B7280">…</text>
    <line x1="52" y1="160" x2="468" y2="160" stroke="#D4D7DC"/>
  </g>

  <!-- T1's two writes -->
  <g data-step="2">
    <text x="95"  y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#0E0E10">T1</text>
    <text x="180" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#0E0E10">A</text>
    <text x="305" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#D97706">19</text>
    <text x="420" y="190" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#16A34A">22.8</text>
    <line x1="52" y1="204" x2="468" y2="204" stroke="#D4D7DC"/>
    <text x="95"  y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#0E0E10">T1</text>
    <text x="180" y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#0E0E10">B</text>
    <text x="305" y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#D97706">23</text>
    <text x="420" y="234" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700" fill="#16A34A">27.6</text>
  </g>

  <!-- COMMIT record -->
  <g data-step="3">
    <rect x="40" y="272" width="440" height="42" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
    <text x="95" y="298" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#0E0E10">T1</text>
    <line x1="140" y1="278" x2="140" y2="308" stroke="#D4D7DC"/>
    <text x="312" y="298" text-anchor="middle" font-size="14" font-weight="700" fill="#16A34A">COMMIT record — T1 ends here</text>
  </g>

  <!-- color key -->
  <text x="40" y="352" font-size="14" fill="#6B7280">Color key  <tspan fill="#D97706" font-weight="700">orange</tspan> = old value (undo)  ·  <tspan fill="#16A34A" font-weight="700">green</tspan> = new value (redo)  ·  <tspan fill="#7C3AED" font-weight="700">violet</tspan> = the log</text>
  <text x="40" y="376" font-size="14" fill="#6B7280">The log only grows: every change appends one row, and the commit record closes the transaction.</text>
  <text x="40" y="400" font-size="14" fill="#6B7280">Each row &#8776; 40 B: header 12 &#183; txn 4 &#183; location 8 &#183; old 8 &#183; new 8.</text>
</svg>
