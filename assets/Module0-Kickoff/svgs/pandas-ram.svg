<svg viewBox="0 0 1100 442" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="cs01-t cs01-d">
  <title id="cs01-t">Pandas: the whole dataset has to fit in RAM</title>
  <desc id="cs01-d">A blue-stripped box is the single machine, RAM about 16 gigabytes, holding a DataFrame that is grouped, sorted, and joined entirely in memory; grey shows the de-emphasized CSV or Parquet on disk that is read in. On the right, the red-stripped box is the failure state: when data exceeds RAM the program crashes or thrashes. A visible color key runs along the bottom. Color key: blue is the one machine in focus, red is the out-of-RAM failure, grey is out of focus.</desc>
  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">Pandas: the whole dataset has to fit in RAM</text>
  <text x="550" y="64" font-size="14" fill="#6B7280" text-anchor="middle">One process, one machine. Everything lives in memory, until it does not fit.</text>

  <g data-step="1">
  <ellipse cx="120" cy="170" rx="50" ry="18" fill="#D4D7DC" stroke="#6B7280" stroke-width="1.5"/>
  <rect x="70" y="170" width="100" height="80" fill="#D4D7DC" stroke="#6B7280" stroke-width="1.5"/>
  <ellipse cx="120" cy="250" rx="50" ry="18" fill="#D4D7DC" stroke="#6B7280" stroke-width="1.5"/>
  <text x="120" y="288" font-size="13" fill="#3F3F46" text-anchor="middle">CSV / Parquet</text>
  <text x="120" y="306" font-size="13" fill="#3F3F46" text-anchor="middle">on disk</text>

  <line x1="175" y1="210" x2="233" y2="210" stroke="#6B7280" stroke-width="2"/>
  <polygon points="229,205 240,210 229,215" fill="#6B7280"/>
  <text x="207" y="197" font-size="13" fill="#6B7280" text-anchor="middle">read</text>

  <rect x="250" y="100" width="560" height="270" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="530" y="130" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">ONE MACHINE &#183; RAM &#8776; 16 GB</text>

  <rect x="280" y="150" width="220" height="190" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="390" y="182" font-size="14" font-weight="600" fill="#3F3F46" text-anchor="middle">DataFrame</text>
  <text x="390" y="210" font-size="13" fill="#3F3F46" text-anchor="middle">every row, one process,</text>
  <text x="390" y="228" font-size="13" fill="#3F3F46" text-anchor="middle">in memory</text>
  <text x="390" y="278" font-size="13" fill="#3F3F46" text-anchor="middle">group / sort / join</text>
  <text x="390" y="296" font-size="13" fill="#3F3F46" text-anchor="middle">all in RAM</text>

  </g>
  <g data-step="2">
  <line x1="500" y1="245" x2="558" y2="245" stroke="#2563EB" stroke-width="2"/>
  <polygon points="554,240 565,245 554,250" fill="#2563EB"/>

  <rect x="570" y="195" width="215" height="100" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="677" y="240" font-size="14" font-weight="600" fill="#3F3F46" text-anchor="middle">result</text>
  <text x="677" y="263" font-size="13" fill="#3F3F46" text-anchor="middle">handed back fast</text>

  </g>
  <g data-step="3">
  <rect x="845" y="100" width="210" height="270" rx="14" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="845" y="100" width="210" height="6" rx="3" fill="#DC2626"/>
  <text x="950" y="200" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">RAM</text>
  <text x="950" y="226" font-size="17" font-weight="700" fill="#DC2626" text-anchor="middle">limit</text>
  <text x="950" y="264" font-size="13" fill="#3F3F46" text-anchor="middle">data &gt; RAM:</text>
  <text x="950" y="284" font-size="13" fill="#3F3F46" text-anchor="middle">crash or thrash</text>
  <line x1="810" y1="235" x2="838" y2="235" stroke="#DC2626" stroke-width="2"/>
  <polygon points="834,230 845,235 834,240" fill="#DC2626"/>
  </g>
  <text x="550" y="424" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = the one machine in focus&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = out of RAM, the failure&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = out of focus</tspan></text>
</svg>