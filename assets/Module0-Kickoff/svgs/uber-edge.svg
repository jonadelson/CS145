<svg viewBox="0 0 1100 372" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="edge-t edge-d">
  <title id="edge-t">The disconnected edge: a database on the phone</title>
  <desc id="edge-d">A blue-outlined phone, the system in focus, runs the driver app over an embedded SQLite database and stays transactional with no signal. On reconnect, a green arrow pushes local changes to a green cloud database, the shared source of truth, and a grey arrow reconciles back. Color key: blue is the phone in focus, green is the cloud source of truth.</desc>

  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">The disconnected edge: a database on the phone</text>
  <text x="550" y="64" font-size="14" fill="#6B7280" text-anchor="middle">Same SQL, offline. The driver app does not stall waiting for the network.</text>

  <g data-step="1">
  <!-- phone: a system/containment boundary -->
  <rect x="120" y="92" width="300" height="240" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="270" y="120" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">DRIVER'S PHONE &#183; offline</text>
  <rect x="150" y="140" width="240" height="46" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="270" y="168" font-size="14" fill="#3F3F46" text-anchor="middle">Driver app</text>
  <line x1="270" y1="190" x2="270" y2="214" stroke="#6B7280" stroke-width="2"/><polygon points="270,214 266,205 274,205" fill="#6B7280"/>
  <ellipse cx="270" cy="232" rx="70" ry="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="200" y="232" width="140" height="46" fill="#FFFFFF"/>
  <line x1="200" y1="232" x2="200" y2="278" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="340" y1="232" x2="340" y2="278" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="270" cy="278" rx="70" ry="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="270" y="260" font-size="13" fill="#3F3F46" text-anchor="middle">SQLite, embedded</text>
  <text x="270" y="312" font-size="13" fill="#6B7280" text-anchor="middle">transactional even if the phone dies</text>

  </g>
  <g data-step="2">
  <!-- sync arrows -->
  <line x1="425" y1="205" x2="675" y2="205" stroke="#059669" stroke-width="2"/><polygon points="675,205 666,210 666,200" fill="#059669"/>
  <text x="550" y="195" font-size="13" fill="#059669" text-anchor="middle">on reconnect: push local changes</text>
  <line x1="675" y1="245" x2="425" y2="245" stroke="#6B7280" stroke-width="2"/><polygon points="425,245 434,240 434,250" fill="#6B7280"/>
  <text x="550" y="265" font-size="13" fill="#6B7280" text-anchor="middle">reconcile against the truth</text>

  </g>
  <g data-step="3">
  <!-- cloud: a region carrying the persistent (green) meaning -->
  <rect x="680" y="150" width="320" height="150" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="680" y="150" width="320" height="6" rx="3" fill="#059669"/>
  <text x="840" y="184" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">Cloud database</text>
  <text x="840" y="208" font-size="14" fill="#3F3F46" text-anchor="middle">the shared source of truth</text>
  <ellipse cx="840" cy="240" rx="40" ry="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="800" y="240" width="80" height="24" fill="#FFFFFF"/>
  <line x1="800" y1="240" x2="800" y2="264" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="880" y1="240" x2="880" y2="264" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="840" cy="264" rx="40" ry="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>

  </g>
  <text x="550" y="352" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = the phone, the system in focus&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = the cloud source of truth</tspan></text>
</svg>