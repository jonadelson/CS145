<svg viewBox="0 0 1100 510" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="cs02-t cs02-d">
  <title id="cs02-t">UberEats: one database, three sides</title>
  <desc id="cs02-d">Three red-stripped client apps, Diner, Driver, and Restaurant, each hold volatile in-memory state and all feed one green-stripped relational database, the persistent shared truth, where placing an order charges the diner, assigns one driver, and decrements inventory atomically. A box with an ink bottom strip and an ink target mark is the takeaway: two drivers can never claim the same order. Color key: red is volatile or ephemeral client state, green is the persistent shared database, ink is the takeaway.</desc>
  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">UberEats: one database, three sides</text>
  <text x="550" y="64" font-size="14" fill="#6B7280" text-anchor="middle">A burrito order has three sides. They all have to agree the moment it is placed.</text>

  <g data-step="1">
  <rect x="70" y="100" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="70" y="100" width="280" height="5" rx="2.5" fill="#DC2626"/>
  <text x="210" y="134" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">Diner app</text>
  <text x="210" y="160" font-size="13" fill="#3F3F46" text-anchor="middle">volatile in-memory state</text>

  <rect x="410" y="100" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="410" y="100" width="280" height="5" rx="2.5" fill="#DC2626"/>
  <text x="550" y="134" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">Driver app</text>
  <text x="550" y="160" font-size="13" fill="#3F3F46" text-anchor="middle">volatile in-memory state</text>

  <rect x="750" y="100" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="750" y="100" width="280" height="5" rx="2.5" fill="#DC2626"/>
  <text x="890" y="134" font-size="15" font-weight="700" fill="#DC2626" text-anchor="middle">Restaurant</text>
  <text x="890" y="160" font-size="13" fill="#3F3F46" text-anchor="middle">volatile in-memory state</text>

  <line x1="210" y1="190" x2="430" y2="248" stroke="#6B7280" stroke-width="2"/>
  <line x1="550" y1="190" x2="550" y2="248" stroke="#6B7280" stroke-width="2"/>
  <line x1="890" y1="190" x2="670" y2="248" stroke="#6B7280" stroke-width="2"/>

  </g>
  <g data-step="2">
  <rect x="230" y="255" width="640" height="170" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="550" y="287" font-size="15" font-weight="700" fill="#059669" text-anchor="middle">Relational database &#183; the persistent shared truth</text>

  <rect x="265" y="305" width="570" height="60" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="550" y="330" font-size="13" fill="#3F3F46" text-anchor="middle">TRANSACTION: place order &#8594; charge diner, assign one driver,</text>
  <text x="550" y="350" font-size="13" fill="#3F3F46" text-anchor="middle">decrement inventory. All of it, or none of it.</text>

  </g>
  <g data-step="3">
  <rect x="300" y="376" width="500" height="42" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="300" y="412" width="500" height="6" rx="3" fill="#0E0E10"/>
  <text x="348" y="402" font-size="16" font-weight="700" fill="#0E0E10" text-anchor="middle">&#8857;</text>
  <text x="562" y="401" font-size="13" font-weight="700" fill="#0E0E10" text-anchor="middle">Two drivers can never claim the same order</text>
  </g>
  <text x="550" y="462" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = volatile client state&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = the persistent shared database&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#0E0E10" font-weight="700">ink bottom strip</tspan><tspan fill="#3F3F46"> = the takeaway</tspan></text>
</svg>