<svg viewBox="0 0 1100 410" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="spine-t spine-d">
  <title id="spine-t">Real facts: store and retrieve, local then global</title>
  <desc id="spine-d">Three panels left to right. Panel one, red: a grey de-emphasized model circle with only a context window; it hallucinates. Panel two, green: the same model plus a local database, SQLite running claude-mem, a file on disk on one machine, queried with SQL; it looks the answer up. Panel three, green: the same model plus the same database scaled out, ChatGPT's user data, Postgres on disk with read replicas, also queried with SQL, one private memory per user across 800 million users. The model talks to each database using SQL. Models keep upgrading and databases keep scaling; the database is the core infrastructure that holds their memory and context, and that is what is in focus. Color key: red is no memory and the ephemeral context window, grey is the model which is a separate topic out of focus, green is persistent memory.</desc>

  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">Real facts: store and retrieve, local then global</text>
  <text x="550" y="64" font-size="14" fill="#6B7280" text-anchor="middle">Models keep upgrading and databases keep scaling. The database holds their memory and context.</text>

  <g data-step="1">
  <!-- Panel 1: model alone (red, the failure) -->
  <rect x="40" y="92" width="320" height="258" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="40" y="92" width="320" height="6" rx="3" fill="#DC2626"/>
  <text x="200" y="126" font-size="16" font-weight="700" fill="#DC2626" text-anchor="middle">1 &#183; Model alone</text>
  <circle cx="130" cy="190" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="130" y="194" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Model</text>
  <line x1="162" y1="190" x2="256" y2="190" stroke="#6B7280" stroke-width="2" stroke-dasharray="4,3"/><polygon points="256,190 247,194 247,186" fill="#6B7280"/>
  <rect x="262" y="170" width="74" height="40" rx="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="299" y="186" font-size="14" fill="#6B7280" text-anchor="middle">context</text>
  <text x="299" y="202" font-size="14" fill="#6B7280" text-anchor="middle">window</text>
  <rect x="64" y="232" width="272" height="46" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="200" y="252" font-size="14" fill="#3F3F46" text-anchor="middle">Short-term working memory.</text>
  <text x="200" y="270" font-size="14" fill="#3F3F46" text-anchor="middle">Wiped when the session ends.</text>
  <rect x="64" y="292" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="200" y="318" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">&#10007; Hallucinates a function</text>

  </g>
  <g data-step="2">
  <line x1="364" y1="200" x2="384" y2="200" stroke="#6B7280" stroke-width="2"/><polygon points="384,200 375,204 375,196" fill="#6B7280"/>

  <!-- Panel 2: + local memory (green, fixed, one machine) -->
  <rect x="390" y="92" width="320" height="258" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="390" y="92" width="320" height="6" rx="3" fill="#059669"/>
  <text x="550" y="126" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">2 &#183; + Local memory</text>
  <circle cx="480" cy="190" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="480" y="194" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Model</text>
  <text x="552" y="180" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">SQL</text>
  <line x1="512" y1="190" x2="592" y2="190" stroke="#6B7280" stroke-width="2"/><polygon points="592,190 583,194 583,186" fill="#6B7280"/>
  <rect x="608" y="172" width="56" height="30" fill="#FFFFFF"/>
  <line x1="608" y1="172" x2="608" y2="202" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="664" y1="172" x2="664" y2="202" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="636" cy="202" rx="28" ry="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="636" cy="172" rx="28" ry="7" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="636" y="226" font-size="14" fill="#3F3F46" text-anchor="middle">SQLite &#183; claude-mem</text>
  <rect x="414" y="232" width="272" height="46" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="550" y="252" font-size="14" fill="#3F3F46" text-anchor="middle">On disk, one machine.</text>
  <text x="550" y="270" font-size="14" fill="#3F3F46" text-anchor="middle">Survives every session.</text>
  <rect x="414" y="292" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="550" y="318" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">&#10003; Looks it up &#183; per laptop</text>

  </g>
  <g data-step="3">
  <line x1="714" y1="200" x2="734" y2="200" stroke="#6B7280" stroke-width="2"/><polygon points="734,200 725,204 725,196" fill="#6B7280"/>

  <!-- Panel 3: + global memory (green, fixed, many machines) -->
  <rect x="740" y="92" width="320" height="258" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="740" y="92" width="320" height="6" rx="3" fill="#059669"/>
  <text x="900" y="126" font-size="16" font-weight="700" fill="#059669" text-anchor="middle">3 &#183; + Global memory</text>
  <circle cx="826" cy="190" r="30" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="826" y="194" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Model</text>
  <text x="898" y="180" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">SQL</text>
  <line x1="858" y1="190" x2="938" y2="190" stroke="#6B7280" stroke-width="2"/><polygon points="938,190 929,194 929,186" fill="#6B7280"/>
  <rect x="970" y="166" width="52" height="28" fill="#FFFFFF"/>
  <line x1="970" y1="166" x2="970" y2="194" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="1022" y1="166" x2="1022" y2="194" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="996" cy="194" rx="26" ry="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="996" cy="166" rx="26" ry="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="958" y="178" width="52" height="28" fill="#FFFFFF"/>
  <line x1="958" y1="178" x2="958" y2="206" stroke="#D4D7DC" stroke-width="1"/>
  <line x1="1010" y1="178" x2="1010" y2="206" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="984" cy="206" rx="26" ry="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <ellipse cx="984" cy="178" rx="26" ry="6" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="984" y="230" font-size="14" fill="#3F3F46" text-anchor="middle">Postgres</text>
  <rect x="764" y="232" width="272" height="46" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="900" y="252" font-size="14" fill="#3F3F46" text-anchor="middle">ChatGPT's user database.</text>
  <text x="900" y="270" font-size="14" fill="#3F3F46" text-anchor="middle">On disk, many machines &#183; &#215; 800M</text>
  <rect x="764" y="292" width="272" height="42" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="900" y="318" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">&#10003; One per user &#183; &#215;800M</text>

  </g>
  <text x="550" y="363" font-size="14" fill="#6B7280" text-anchor="middle">RAM forgets &#183; disk remembers &#183; one machine, then many</text>

  <text x="550" y="392" font-size="14" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = no memory, the ephemeral context window&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the model, a separate topic, out of focus&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = persistent memory</tspan></text>
</svg>