<svg viewBox="0 0 1100 540" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="grow-t grow-d">
  <title id="grow-t">What this course teaches</title>
  <desc id="grow-d">Top: a soft grey container labeled SHORT-TERM ACTIONS holds four small circles labeled function call, model inference, system event, and API request. A single arrow drops from the container down toward the row of module panels below. Below, six module panels left to right. The same database cylinder is in every panel; each module adds one capability the database needs at the next scale. M1 (SQL, blue): a SQL query goes into the cylinder and rows come out. The language is already declarative and parallel. M2 (Storage, orange): the cylinder shows columnar layout inside, with a disk underneath. M3 (Indexing, emerald): a B+Tree perches on top of the cylinder, labeled one billion rows to milliseconds. M4 (Transactions, violet): a lock encloses the cylinder, two concurrent users converge on it. M5 (Distributed, pink): three cylinders side by side with replication arrows between them. M6 (Modern systems, slate): three small cylinders embedded in a phone, an LLM sparkle, and a server stack. Bottom axis: one machine to many machines, single query to planet-scale state. Color key: grey is the transient action layer your other classes teach; each module's accent marks its panel, and the cylinder is the same shape throughout because the primitive does not change, only what surrounds it.</desc>

  <defs>
    <marker id="ah-grow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="ah-blk" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3F3F46"/>
    </marker>
  </defs>

  <text x="550" y="40" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">What this course teaches</text>
  <text x="550" y="64" font-size="14" fill="#6B7280" text-anchor="middle">Other classes teach the actions on top. CS145 builds the database underneath, one capability per module.</text>


  <!-- ════════════════ ACTIONS container on top ════════════════ -->
  <rect x="300" y="82" width="500" height="98" rx="12" fill="#F7F8FA" stroke="#D4D7DC" stroke-width="1"/>
  <text x="550" y="102" font-size="11" font-weight="700" fill="#475569" letter-spacing="0.08em" text-anchor="middle">SHORT-TERM &#183; ACTIONS</text>
  <g fill="#FFFFFF" stroke="#475569" stroke-width="1.4">
    <circle cx="400" cy="135" r="10"/>
    <circle cx="490" cy="135" r="10"/>
    <circle cx="580" cy="135" r="10"/>
    <circle cx="670" cy="135" r="10"/>
  </g>
  <g font-size="10" fill="#475569" text-anchor="middle">
    <text x="400" y="162">function call</text>
    <text x="490" y="162">model inference</text>
    <text x="580" y="162">system event</text>
    <text x="670" y="162">API request</text>
  </g>
  <line x1="550" y1="180" x2="550" y2="210" stroke="#475569" stroke-width="1.4" marker-end="url(#ah-blk)"/>

  <!-- Module panels (each is the database with one capability the module adds) -->
  <g transform="translate(0, 130)">
  <!-- ════════════════ M1 · SQL · #2563EB ════════════════ -->
  <rect x="25" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="25" y="90" width="165" height="4" rx="2" fill="#2563EB"/>
  <text x="107.5" y="114" font-size="13" font-weight="700" fill="#2563EB" text-anchor="middle">M1 &#183; SQL</text>

  <!-- SQL query above -->
  <text x="107.5" y="142" font-family="JetBrains Mono, monospace" font-size="9" fill="#6B7280" text-anchor="middle">SELECT genre, COUNT(*)</text>
  <text x="107.5" y="153" font-family="JetBrains Mono, monospace" font-size="9" fill="#6B7280" text-anchor="middle">FROM listens GROUP BY ...</text>
  <!-- arrow down to db -->
  <line x1="107.5" y1="158" x2="107.5" y2="172" stroke="#3F3F46" stroke-width="1" marker-end="url(#ah-blk)"/>
  <!-- cylinder -->
  <ellipse cx="107.5" cy="178" rx="22" ry="6" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <path d="M 85.5 178 L 85.5 208" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <path d="M 129.5 178 L 129.5 208" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <ellipse cx="107.5" cy="208" rx="22" ry="6" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <!-- arrow down to result -->
  <line x1="107.5" y1="216" x2="107.5" y2="226" stroke="#3F3F46" stroke-width="1" marker-end="url(#ah-blk)"/>
  <!-- result rows hint -->
  <g stroke="#6B7280" stroke-width="1.2">
    <line x1="92" y1="232" x2="123" y2="232"/>
    <line x1="92" y1="237" x2="123" y2="237"/>
    <line x1="92" y1="242" x2="123" y2="242"/>
  </g>

  <text x="107.5" y="263" font-size="11" fill="#3F3F46" text-anchor="middle">Declarative. Parallel.</text>
  <text x="107.5" y="278" font-size="11" fill="#3F3F46" text-anchor="middle">A complete database.</text>
  <text x="107.5" y="296" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">+ M1B: CTEs, windows</text>

  <!-- ════════════════ M2 · Storage · #EA580C ════════════════ -->
  <rect x="205" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="205" y="90" width="165" height="4" rx="2" fill="#EA580C"/>
  <text x="287.5" y="114" font-size="13" font-weight="700" fill="#EA580C" text-anchor="middle">M2 &#183; Storage</text>

  <!-- cylinder with columnar stripes inside -->
  <ellipse cx="287.5" cy="158" rx="32" ry="8" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <path d="M 255.5 158 L 255.5 208" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <path d="M 319.5 158 L 319.5 208" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <!-- columnar stripes inside -->
  <g stroke="#EA580C" stroke-width="3" opacity="0.7">
    <line x1="265" y1="165" x2="265" y2="205"/>
    <line x1="275" y1="165" x2="275" y2="205"/>
    <line x1="285" y1="165" x2="285" y2="205"/>
    <line x1="295" y1="165" x2="295" y2="205"/>
    <line x1="305" y1="165" x2="305" y2="205"/>
  </g>
  <ellipse cx="287.5" cy="208" rx="32" ry="8" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <!-- disk underneath -->
  <ellipse cx="287.5" cy="232" rx="40" ry="6" fill="#F1F2F4" stroke="#6B7280" stroke-width="1"/>
  <text x="287.5" y="248" font-size="10" fill="#6B7280" text-anchor="middle">disk pages</text>

  <text x="287.5" y="270" font-size="11" fill="#3F3F46" text-anchor="middle">How rows live on disk.</text>
  <text x="287.5" y="285" font-size="11" fill="#3F3F46" text-anchor="middle">Pages, columns, bloom filters.</text>

  <!-- ════════════════ M3 · Indexing · #059669 ════════════════ -->
  <rect x="385" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="385" y="90" width="165" height="4" rx="2" fill="#059669"/>
  <text x="467.5" y="114" font-size="13" font-weight="700" fill="#059669" text-anchor="middle">M3 &#183; Indexing</text>

  <!-- B+Tree on top: 1 root, 3 children -->
  <rect x="455" y="138" width="25" height="11" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.4"/>
  <line x1="467.5" y1="149" x2="445" y2="160" stroke="#059669" stroke-width="1"/>
  <line x1="467.5" y1="149" x2="467.5" y2="160" stroke="#059669" stroke-width="1"/>
  <line x1="467.5" y1="149" x2="490" y2="160" stroke="#059669" stroke-width="1"/>
  <rect x="436" y="160" width="18" height="9" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <rect x="458.5" y="160" width="18" height="9" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <rect x="481" y="160" width="18" height="9" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.2"/>
  <!-- arrow down to cylinder -->
  <line x1="467.5" y1="172" x2="467.5" y2="180" stroke="#3F3F46" stroke-width="1" marker-end="url(#ah-blk)"/>
  <!-- cylinder -->
  <ellipse cx="467.5" cy="186" rx="28" ry="7" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <path d="M 439.5 186 L 439.5 222" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <path d="M 495.5 186 L 495.5 222" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <ellipse cx="467.5" cy="222" rx="28" ry="7" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>

  <text x="467.5" y="248" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">1B rows &#8594; ms</text>
  <text x="467.5" y="270" font-size="11" fill="#3F3F46" text-anchor="middle">B+Trees and LSM.</text>
  <text x="467.5" y="285" font-size="11" fill="#3F3F46" text-anchor="middle">Find rows in milliseconds.</text>
  <text x="467.5" y="298" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">+ M3B indexes · M3C optimizer</text>

  <!-- ════════════════ M4 · Transactions · #7C3AED ════════════════ -->
  <rect x="565" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="565" y="90" width="165" height="4" rx="2" fill="#7C3AED"/>
  <text x="647.5" y="114" font-size="13" font-weight="700" fill="#7C3AED" text-anchor="middle">M4 &#183; Transactions</text>

  <!-- two users converging arrows -->
  <circle cx="595" cy="148" r="6" fill="#6B7280"/>
  <circle cx="700" cy="148" r="6" fill="#6B7280"/>
  <line x1="599" y1="153" x2="630" y2="175" stroke="#6B7280" stroke-width="1" marker-end="url(#ah-blk)"/>
  <line x1="696" y1="153" x2="665" y2="175" stroke="#6B7280" stroke-width="1" marker-end="url(#ah-blk)"/>
  <!-- cylinder wrapped in lock-like outline -->
  <ellipse cx="647.5" cy="186" rx="32" ry="8" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <path d="M 615.5 186 L 615.5 222" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <path d="M 679.5 186 L 679.5 222" stroke="#3F3F46" stroke-width="1.4" fill="none"/>
  <ellipse cx="647.5" cy="222" rx="32" ry="8" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1.4"/>
  <!-- lock shackle and body, overlaid -->
  <path d="M 642 200 a 6 6 0 0 1 11 0" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <rect x="640" y="200" width="15" height="11" rx="2" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="647.5" cy="206" r="1.4" fill="#7C3AED"/>

  <text x="647.5" y="248" font-size="11" font-weight="700" fill="#7C3AED" text-anchor="middle">all-or-nothing</text>
  <text x="647.5" y="270" font-size="11" fill="#3F3F46" text-anchor="middle">Concurrent users,</text>
  <text x="647.5" y="285" font-size="11" fill="#3F3F46" text-anchor="middle">never charge twice.</text>
  <text x="647.5" y="298" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">+ M4B recovery · M4C TM</text>

  <!-- ════════════════ M5 · Distributed · #DB2777 ════════════════ -->
  <rect x="745" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="745" y="90" width="165" height="4" rx="2" fill="#DB2777"/>
  <text x="827.5" y="114" font-size="13" font-weight="700" fill="#DB2777" text-anchor="middle">M5 &#183; Distributed</text>

  <!-- three small cylinders, with curved replication arrows -->
  <g stroke="#3F3F46" stroke-width="1.2" fill="#FFFFFF">
    <ellipse cx="775" cy="175" rx="14" ry="4"/>
    <path d="M 761 175 L 761 200" fill="none"/>
    <path d="M 789 175 L 789 200" fill="none"/>
    <ellipse cx="775" cy="200" rx="14" ry="4"/>

    <ellipse cx="827.5" cy="175" rx="14" ry="4"/>
    <path d="M 813.5 175 L 813.5 200" fill="none"/>
    <path d="M 841.5 175 L 841.5 200" fill="none"/>
    <ellipse cx="827.5" cy="200" rx="14" ry="4"/>

    <ellipse cx="880" cy="175" rx="14" ry="4"/>
    <path d="M 866 175 L 866 200" fill="none"/>
    <path d="M 894 175 L 894 200" fill="none"/>
    <ellipse cx="880" cy="200" rx="14" ry="4"/>
  </g>
  <!-- replication arrows between the three -->
  <path d="M 789 188 Q 802 175 813.5 188" stroke="#DB2777" stroke-width="1.4" fill="none" marker-end="url(#ah-blk)"/>
  <path d="M 841.5 188 Q 854 175 866 188" stroke="#DB2777" stroke-width="1.4" fill="none" marker-end="url(#ah-blk)"/>

  <text x="827.5" y="232" font-size="10" fill="#6B7280" text-anchor="middle">shard 1 · shard 2 · shard 3</text>

  <text x="827.5" y="263" font-size="11" fill="#3F3F46" text-anchor="middle">Sharded, replicated.</text>
  <text x="827.5" y="278" font-size="11" fill="#3F3F46" text-anchor="middle">One database, many machines.</text>

  <!-- ════════════════ M6 · Modern · #475569 ════════════════ -->
  <rect x="925" y="90" width="165" height="210" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="925" y="90" width="165" height="4" rx="2" fill="#475569"/>
  <text x="1007.5" y="114" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">M6 &#183; Modern systems</text>

  <!-- phone: rounded rect with mini DB -->
  <rect x="945" y="140" width="26" height="44" rx="4" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <ellipse cx="958" cy="156" rx="8" ry="2.5" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1"/>
  <path d="M 950 156 L 950 168" stroke="#3F3F46" stroke-width="1" fill="none"/>
  <path d="M 966 156 L 966 168" stroke="#3F3F46" stroke-width="1" fill="none"/>
  <ellipse cx="958" cy="168" rx="8" ry="2.5" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1"/>
  <text x="958" y="194" font-size="9" fill="#6B7280" text-anchor="middle">phone</text>

  <!-- sparkle (LLM/agent): a 4-point star with mini DB -->
  <path d="M 1007.5 134 L 1010 153 L 1030 158 L 1010 162 L 1007.5 182 L 1005 162 L 985 158 L 1005 153 Z" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <ellipse cx="1007.5" cy="158" rx="6" ry="2" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1"/>
  <path d="M 1001.5 158 L 1001.5 166" stroke="#3F3F46" stroke-width="1" fill="none"/>
  <path d="M 1013.5 158 L 1013.5 166" stroke="#3F3F46" stroke-width="1" fill="none"/>
  <ellipse cx="1007.5" cy="166" rx="6" ry="2" fill="#FFFFFF" stroke="#3F3F46" stroke-width="1"/>
  <text x="1007.5" y="194" font-size="9" fill="#6B7280" text-anchor="middle">agent</text>

  <!-- server stack: 3 stacked rounded rects with mini DB -->
  <rect x="1048" y="140" width="26" height="11" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <rect x="1048" y="153" width="26" height="11" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <rect x="1048" y="166" width="26" height="11" rx="2" fill="#FFFFFF" stroke="#475569" stroke-width="1.2"/>
  <circle cx="1052" cy="146" r="1" fill="#475569"/>
  <circle cx="1052" cy="159" r="1" fill="#475569"/>
  <circle cx="1052" cy="172" r="1" fill="#475569"/>
  <text x="1061" y="194" font-size="9" fill="#6B7280" text-anchor="middle">server</text>

  <text x="1007.5" y="225" font-size="10" fill="#6B7280" text-anchor="middle">a database in each</text>
  <text x="1007.5" y="263" font-size="11" fill="#3F3F46" text-anchor="middle">Where databases live now:</text>
  <text x="1007.5" y="278" font-size="11" fill="#3F3F46" text-anchor="middle">phone, agent, edge, server.</text>

  </g>

  <!-- Scale axis under all panels -->
  <line x1="80" y1="475" x2="1020" y2="475" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-grow)"/>
  <text x="80" y="494" font-size="13" fill="#6B7280" text-anchor="start">one machine, today</text>
  <text x="1020" y="494" font-size="13" fill="#6B7280" text-anchor="end">many machines, planet-wide</text>

  <text x="550" y="525" font-size="13" text-anchor="middle">
    <tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan>
    <tspan fill="#475569" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = the transient action layer (your other classes)&#160;&#160;&#183;&#160;&#160;each module is colored for consistency</tspan>
  </text>
</svg>
