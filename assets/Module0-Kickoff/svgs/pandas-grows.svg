<svg viewBox="0 0 1100 470" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;" font-family="Inter, sans-serif" role="img" aria-labelledby="ppd-t ppd-d">
  <title id="ppd-t">Pandas, Polars, and a database as the data grows</title>
  <desc id="ppd-d">Three panels left to right as the data grows. Pandas, blue, loads every row into RAM with one core and copies at each step, so it dies when the data passes RAM. Polars, blue, runs a lazy streaming all-cores plan that only materializes what it needs, pushing the limit far out but still on one machine. A database, green, ships the query to the data and plans across many machines and disks, returning just the rows, with no single-machine limit. Color key: blue is one machine, green is many machines, red is the out-of-RAM failure.</desc>

  <text x="550" y="38" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">Same query. The data keeps growing.</text>
  <text x="550" y="64" font-size="15" fill="#3F3F46" text-anchor="middle">What each engine does differently</text>

  <g data-step="1">
  <!-- Pandas -->
  <rect x="40" y="92" width="300" height="300" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="40" y="92" width="300" height="6" rx="3" fill="#2563EB"/>
  <text x="190" y="126" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">Pandas</text>
  <text x="190" y="166" font-size="15" fill="#3F3F46" text-anchor="middle">Loads every row into RAM.</text>
  <text x="190" y="192" font-size="15" fill="#3F3F46" text-anchor="middle">One process, one core.</text>
  <text x="190" y="218" font-size="15" fill="#3F3F46" text-anchor="middle">Each step makes a full copy.</text>
  <text x="190" y="352" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">Data past RAM: it dies.</text>

  </g>
  <g data-step="2">
  <line x1="340" y1="240" x2="380" y2="240" stroke="#6B7280" stroke-width="2"/><polygon points="380,240 371,244 371,236" fill="#6B7280"/>

  <!-- Polars -->
  <rect x="380" y="92" width="300" height="300" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="380" y="92" width="300" height="6" rx="3" fill="#2563EB"/>
  <text x="530" y="126" font-size="18" font-weight="700" fill="#2563EB" text-anchor="middle">Polars</text>
  <text x="530" y="166" font-size="15" fill="#3F3F46" text-anchor="middle">Builds a lazy plan first.</text>
  <text x="530" y="192" font-size="15" fill="#3F3F46" text-anchor="middle">Streams from disk in chunks.</text>
  <text x="530" y="218" font-size="15" fill="#3F3F46" text-anchor="middle">Uses every CPU core.</text>
  <text x="530" y="244" font-size="15" fill="#3F3F46" text-anchor="middle">Drops work it does not need.</text>
  <text x="530" y="352" font-size="14" fill="#6B7280" text-anchor="middle">Limit pushed far out. One machine.</text>

  </g>
  <g data-step="3">
  <line x1="680" y1="240" x2="720" y2="240" stroke="#6B7280" stroke-width="2"/><polygon points="720,240 711,244 711,236" fill="#6B7280"/>

  <!-- Database -->
  <rect x="720" y="92" width="340" height="300" rx="12" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="720" y="92" width="340" height="6" rx="3" fill="#059669"/>
  <text x="890" y="126" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">Database (SQL)</text>
  <text x="890" y="166" font-size="15" fill="#3F3F46" text-anchor="middle">Ship the query to the data.</text>
  <text x="890" y="192" font-size="15" fill="#3F3F46" text-anchor="middle">The engine plans across many</text>
  <text x="890" y="218" font-size="15" fill="#3F3F46" text-anchor="middle">machines and disks.</text>
  <text x="890" y="244" font-size="15" fill="#3F3F46" text-anchor="middle">Returns just your rows.</text>
  <text x="890" y="352" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">No single-machine limit.</text>

  </g>
  <text x="550" y="450" font-size="13" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = one machine&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = many machines&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#DC2626" font-weight="700">red</tspan><tspan fill="#3F3F46"> = out of RAM</tspan></text>
</svg>