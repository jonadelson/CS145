<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="metro-t metro-d" style="width:100%;height:auto;" font-family="Inter, sans-serif">
  <title id="metro-t">CS145 career journey map</title>
  <desc id="metro-d">A left-to-right map. The two blue boxes are CS145 itself, the content in focus: the core curriculum with Project 1, then a Project 2 choice of the Science path or the Systems path, NanoMem. The grey box is what you keep learning beyond the course, out of focus here. The green box is where it leads, the careers the path opens. Color key: blue is CS145 content, green is where it leads, grey is beyond CS145.</desc>
  <defs><marker id="ah-metro" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/></marker></defs>

  <text x="600" y="40" font-size="24" font-weight="700" fill="#0E0E10" text-anchor="middle">CS145: Your Data Journey</text>
  <text x="600" y="66" font-size="16" fill="#3F3F46" text-anchor="middle">Master the core, pick a technical path, build a career.</text>

  <!-- Start actor -->
  <circle cx="58" cy="330" r="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="58" y="326" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">CS</text>
  <text x="58" y="342" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">145</text>
  <line x1="86" y1="330" x2="118" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-metro)"/>

  <!-- A: CS145 course content (blue containment boundary) -->
  <rect x="128" y="96" width="300" height="500" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="278" y="124" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">CS145 core curriculum</text>
  <rect x="150" y="146" width="256" height="86" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="278" y="178" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Core: SQL (+ Pandas, NoSQL)</text>
  <text x="278" y="202" font-size="14" fill="#3F3F46" text-anchor="middle">the query languages for data</text>
  <rect x="150" y="248" width="256" height="86" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="278" y="280" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Project 1: SQL Mastery</text>
  <text x="278" y="304" font-size="14" fill="#3F3F46" text-anchor="middle">BigQuery, tens of GB</text>
  <rect x="150" y="350" width="256" height="86" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="278" y="382" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Core: Systems</text>
  <text x="278" y="406" font-size="14" fill="#3F3F46" text-anchor="middle">Storage, indexes, query opt</text>
  <rect x="150" y="452" width="256" height="120" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="278" y="490" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Core: Transactions</text>
  <text x="278" y="514" font-size="14" fill="#3F3F46" text-anchor="middle">ACID, then distributed:</text>
  <text x="278" y="534" font-size="14" fill="#3F3F46" text-anchor="middle">replication, sharding, CAP</text>

  <line x1="428" y1="330" x2="466" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-metro)"/>

  <!-- B: Project 2 pick one (blue containment boundary) -->
  <rect x="476" y="190" width="276" height="300" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="614" y="218" font-size="17" font-weight="700" fill="#2563EB" text-anchor="middle">Project 2: pick one</text>
  <rect x="498" y="240" width="232" height="100" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="614" y="270" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Science path</text>
  <text x="614" y="293" font-size="14" fill="#3F3F46" text-anchor="middle">Enrich, visualize,</text>
  <text x="614" y="313" font-size="14" fill="#3F3F46" text-anchor="middle">train an ML model</text>
  <rect x="498" y="356" width="232" height="112" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="614" y="386" font-size="15" font-weight="700" fill="#0E0E10" text-anchor="middle">Systems path: NanoMem</text>
  <text x="614" y="409" font-size="14" fill="#3F3F46" text-anchor="middle">Build a search engine</text>
  <text x="614" y="429" font-size="14" fill="#3F3F46" text-anchor="middle">for AI agent memory</text>

  <line x1="752" y1="330" x2="790" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-metro)"/>

  <!-- C: beyond CS145 (grey, out of focus) -->
  <rect x="800" y="210" width="180" height="260" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <rect x="800" y="210" width="180" height="6" rx="3" fill="#D4D7DC"/>
  <text x="890" y="240" font-size="15" font-weight="700" fill="#6B7280" text-anchor="middle">Beyond CS145</text>
  <text x="890" y="262" font-size="14" fill="#6B7280" text-anchor="middle">keep learning</text>
  <rect x="818" y="284" width="144" height="78" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="890" y="312" font-size="14" font-weight="700" fill="#3F3F46" text-anchor="middle">Analyst /</text>
  <text x="890" y="332" font-size="14" font-weight="700" fill="#3F3F46" text-anchor="middle">Scientist skills</text>
  <rect x="818" y="378" width="144" height="74" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="890" y="420" font-size="14" font-weight="700" fill="#3F3F46" text-anchor="middle">Engineer skills</text>

  <line x1="980" y1="330" x2="1018" y2="330" stroke="#6B7280" stroke-width="2" marker-end="url(#ah-metro)"/>

  <!-- D: where it leads (green containment boundary) -->
  <rect x="1028" y="150" width="168" height="420" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="1112" y="178" font-size="17" font-weight="700" fill="#059669" text-anchor="middle">Where it leads</text>
  <rect x="1046" y="200" width="132" height="58" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="1112" y="234" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Data Analyst</text>
  <rect x="1046" y="270" width="132" height="58" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="1112" y="304" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Data Scientist</text>
  <rect x="1046" y="340" width="132" height="58" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="1112" y="374" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Backend Eng</text>
  <rect x="1046" y="410" width="132" height="58" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="1112" y="444" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Platform Eng</text>
  <rect x="1046" y="480" width="132" height="58" rx="8" fill="#FFFFFF" stroke="#D4D7DC" stroke-width="1"/>
  <text x="1112" y="514" font-size="14" font-weight="700" fill="#0E0E10" text-anchor="middle">Founder / CTO</text>

  <text x="600" y="650" font-size="14" text-anchor="middle"><tspan fill="#0E0E10" font-weight="700">Color key&#160;&#160;</tspan><tspan fill="#2563EB" font-weight="700">blue</tspan><tspan fill="#3F3F46"> = CS145 content&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#059669" font-weight="700">green</tspan><tspan fill="#3F3F46"> = where it leads&#160;&#160;&#183;&#160;&#160;</tspan><tspan fill="#6B7280" font-weight="700">grey</tspan><tspan fill="#3F3F46"> = beyond CS145</tspan></text>
</svg>
